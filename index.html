<!DOCTYPE html>
<html lang="en" data-density="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Void Break</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23241708' stroke='%23c9a24a' stroke-width='6'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='%23e6c25c'%3E%E2%9A%94%3C/text%3E%3C/svg%3E">
<style>
:root{
  --c-bg-dark:#241708;
  --c-bg-mid:#3e2a1a;
  --c-brass:#c9a24a;
  --c-brass-bright:#e6c25c;
  --c-parchment:#f0dca8;
  --c-blood:#c9432e;
  --c-ink:#1a1006;
  --c-wood-light:#5a3f24;
  --c-wood-dark:#2c1c0e;

  /* density-scaled tokens (Phone default) */
  --font-base:16px;
  --font-sm:12px;
  --font-lg:20px;
  --font-xl:28px;
  --pad-card:10px;
  --gap:8px;
  --joystick-size:110px;
  --joystick-knob:46px;
  --hud-icon:22px;
  --tab-h:52px;
  --card-radius:10px;
  --btn-h:44px;
}
:root[data-density="tablet"]{
  --font-base:19px;
  --font-sm:15px;
  --font-lg:26px;
  --font-xl:38px;
  --pad-card:16px;
  --gap:14px;
  --joystick-size:150px;
  --joystick-knob:64px;
  --hud-icon:30px;
  --tab-h:64px;
  --card-radius:14px;
  --btn-h:56px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; width:100%; height:100%; overflow:hidden;
  background:var(--c-bg-dark);
  color:var(--c-parchment);
  font-family:Georgia,'Palatino Linotype',Palatino,'Book Antiqua',serif;
  font-size:var(--font-base);
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
#app{position:fixed; inset:0; width:100%; height:100%; overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%, #4a3218 0%, transparent 60%),
    linear-gradient(180deg, var(--c-bg-mid) 0%, var(--c-bg-dark) 100%);
}

::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-track{background:var(--c-bg-dark);}
::-webkit-scrollbar-thumb{background:var(--c-wood-light); border-radius:4px;}

button{font-family:inherit;}

/* ---------- Wooden panel / bevel primitives ---------- */
.panel{
  background:linear-gradient(180deg, var(--c-wood-light) 0%, var(--c-wood-dark) 100%);
  border:3px solid var(--c-ink);
  border-radius:var(--card-radius);
  box-shadow:
    inset 0 2px 0 rgba(230,194,92,0.25),
    inset 0 -3px 6px rgba(0,0,0,0.5),
    0 3px 8px rgba(0,0,0,0.6);
  padding:var(--pad-card);
}
.parchment{
  background:
    linear-gradient(180deg, rgba(240,220,168,0.06), rgba(240,220,168,0.0)),
    var(--c-bg-mid);
  border:2px solid var(--c-wood-dark);
  border-radius:calc(var(--card-radius) - 2px);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:var(--btn-h);
  padding:0 16px;
  background:linear-gradient(180deg, #d8b25a 0%, #a8792e 55%, #8a611f 100%);
  color:var(--c-ink);
  border:2px solid var(--c-ink);
  border-radius:8px;
  font-weight:bold;
  font-size:var(--font-base);
  box-shadow:
    inset 0 1px 0 rgba(255,240,200,0.6),
    inset 0 -3px 4px rgba(80,50,10,0.5),
    0 2px 3px rgba(0,0,0,0.5);
  cursor:pointer;
  letter-spacing:0.02em;
}
.btn:active{
  transform:translateY(2px);
  box-shadow:inset 0 2px 4px rgba(0,0,0,0.5);
}
.btn.secondary{
  background:linear-gradient(180deg, #6a5432 0%, #4a3a20 100%);
  color:var(--c-parchment);
}
.btn.danger{
  background:linear-gradient(180deg, #d3583e 0%, #8f2a1a 100%);
  color:#fff2e0;
}
.btn:disabled{opacity:0.45; cursor:default; filter:grayscale(0.4);}
.btn.small{min-height:calc(var(--btn-h) * 0.72); padding:0 10px; font-size:var(--font-sm);}

h1,h2,h3{font-family:Georgia,'Palatino Linotype',Palatino,serif; margin:0 0 6px 0; color:var(--c-brass-bright); text-shadow:0 2px 2px rgba(0,0,0,0.6);}
.muted{color:#c9b48a; opacity:0.85;}
.gold-text{color:var(--c-brass-bright);}
.blood-text{color:var(--c-blood);}

/* =====================  HUB  ===================== */
#hub{position:absolute; inset:0; display:flex; flex-direction:column;}
#hub-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(var(--gap)) var(--gap);
  padding-right:104px;
  background:linear-gradient(180deg, var(--c-wood-dark), var(--c-bg-dark));
  border-bottom:3px solid var(--c-ink);
}
#hub-header .title{font-size:var(--font-lg); color:var(--c-brass-bright); font-weight:bold; text-shadow:0 2px 2px #000;}
#currency-bar{display:flex; gap:var(--gap);}
.currency-pill{
  display:flex; align-items:center; gap:6px;
  background:var(--c-bg-dark); border:2px solid var(--c-brass);
  border-radius:20px; padding:4px 10px; font-size:var(--font-sm); font-weight:bold;
}
.currency-pill .icon{font-size:var(--hud-icon); line-height:1;}
#hub-body{flex:1; overflow-y:auto; padding:var(--gap); padding-bottom:calc(var(--tab-h) + var(--gap)*2);}
#hub-tabs{
  position:absolute; left:0; right:0; bottom:0;
  display:flex; height:var(--tab-h);
  background:linear-gradient(180deg, var(--c-wood-dark), var(--c-bg-dark));
  border-top:3px solid var(--c-ink);
  overflow-x:auto;
}
.hub-tab{
  flex:1 0 auto; min-width:64px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; color:#a8916a; font-size:var(--font-sm); font-weight:bold;
  border-right:1px solid rgba(0,0,0,0.4);
  cursor:pointer;
}
.hub-tab.active{color:var(--c-brass-bright); background:rgba(201,162,74,0.15); box-shadow:inset 0 3px 0 var(--c-brass-bright);}
.hub-tab .tab-icon{font-size:calc(var(--font-lg));}

.section-title{font-size:var(--font-lg); margin-bottom:var(--gap); color:var(--c-brass-bright);}
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:var(--gap);}
.card{
  background:linear-gradient(180deg, var(--c-wood-light), var(--c-wood-dark));
  border:2px solid var(--c-ink); border-radius:var(--card-radius);
  padding:var(--pad-card); display:flex; flex-direction:column; gap:4px;
  box-shadow:inset 0 1px 0 rgba(230,194,92,0.2), 0 2px 4px rgba(0,0,0,0.5);
}
.card.locked{opacity:0.55; filter:grayscale(0.5);}
.card.selected{border-color:var(--c-brass-bright); box-shadow:0 0 0 2px var(--c-brass-bright), inset 0 1px 0 rgba(230,194,92,0.3);}
.card .name{font-weight:bold; color:var(--c-parchment); font-size:var(--font-base);}
.card .tier{font-size:var(--font-sm); font-weight:bold; padding:1px 6px; border-radius:6px; display:inline-block; align-self:flex-start;}
.tier-Common{background:#5a5a52; color:#eee;}
.tier-Rare{background:#2e5a8a; color:#eaf3ff;}
.tier-Legendary{background:#8a5a1a; color:#fff0d0;}
.tier-Mythic{background:#6a1a5a; color:#ffe0fa;}
.tier-Utility{background:#3a5a2e; color:#eaffe0;}
.card .desc{font-size:var(--font-sm); color:#c9b48a; flex:1;}
.card .stats{font-size:var(--font-sm); color:var(--c-brass);}

.hero-portrait{
  width:100%; aspect-ratio:1; border-radius:8px; border:2px solid var(--c-ink);
  display:flex; align-items:center; justify-content:center; font-size:2em;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25), transparent 60%);
}

/* =====================  RUN / GAMEPLAY  ===================== */
#run{position:absolute; inset:0; display:none;}
#run.active{display:block;}
#gameCanvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none;}
#hud{position:absolute; top:0; left:0; right:0; padding:8px; display:flex; flex-direction:column; gap:4px; pointer-events:none; z-index:10;}
#hud-top-row{display:flex; align-items:center; gap:8px;}
.bar-wrap{position:relative; flex:1; height:16px; border-radius:8px; background:rgba(20,12,4,0.75); border:2px solid var(--c-ink); overflow:hidden;}
.bar-fill{height:100%; transition:width 0.15s linear;}
.bar-fill.hp{background:linear-gradient(180deg,#e0533c,#8f2a1a);}
.bar-fill.xp{background:linear-gradient(180deg,var(--c-brass-bright),#a8792e);}
.bar-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold; color:#fff2e0; text-shadow:0 1px 2px #000;}
#hud-info{
  display:flex; justify-content:space-between; font-size:var(--font-sm); font-weight:bold;
  color:var(--c-parchment); text-shadow:0 1px 3px #000;
  background:rgba(20,12,4,0.55); border-radius:8px; padding:4px 8px;
}
#pause-btn{
  position:absolute; top:8px; right:8px; pointer-events:auto; z-index:11;
  width:38px; height:38px; border-radius:50%;
  background:rgba(20,12,4,0.7); border:2px solid var(--c-brass); color:var(--c-brass-bright);
  display:flex; align-items:center; justify-content:center; font-size:18px;
}

#joystick-zone{position:absolute; inset:0; z-index:5;}
#joystick{
  position:absolute; width:var(--joystick-size); height:var(--joystick-size);
  border-radius:50%; border:3px solid rgba(201,162,74,0.6);
  background:radial-gradient(circle, rgba(60,40,20,0.35), rgba(20,12,4,0.25));
  display:none; pointer-events:none;
}
#joystick-knob{
  position:absolute; width:var(--joystick-knob); height:var(--joystick-knob);
  border-radius:50%; left:50%; top:50%; transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%, #e6c25c, #8a611f);
  border:2px solid var(--c-ink);
}

#levelup-overlay, #pause-overlay, #death-overlay{
  position:absolute; inset:0; background:rgba(10,6,2,0.82);
  display:none; align-items:center; justify-content:center; flex-direction:column; z-index:20; padding:16px;
}
#levelup-overlay.active,#pause-overlay.active,#death-overlay.active{display:flex;}
.upgrade-cards{display:flex; gap:var(--gap); flex-wrap:wrap; justify-content:center; max-width:900px;}
.upgrade-card{
  width:180px; min-height:180px; display:flex; flex-direction:column; gap:8px;
  align-items:center; text-align:center; cursor:pointer;
}
.upgrade-card .name{font-size:var(--font-base); font-weight:bold; color:var(--c-brass-bright);}
.upgrade-card .desc{font-size:var(--font-sm); color:var(--c-parchment);}

#death-overlay .summary-panel{max-width:420px; width:90%;}
.summary-row{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed rgba(201,162,74,0.3); font-size:var(--font-base);}

/* Toast */
#toast{
  position:absolute; left:50%; bottom:12%; transform:translateX(-50%);
  background:rgba(20,12,4,0.9); border:2px solid var(--c-brass); color:var(--c-brass-bright);
  padding:8px 16px; border-radius:8px; font-size:var(--font-base); z-index:50;
  opacity:0; transition:opacity 0.3s; pointer-events:none; text-align:center; max-width:80%;
}
#toast.show{opacity:1;}

/* density toggle button */
#density-toggle{
  position:fixed; top:6px; right:6px; z-index:100;
  font-size:11px; padding:4px 8px; min-height:0; height:26px; opacity:0.85;
}
#run.active ~ #density-toggle{ display:none; }

.row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.wrap-row{display:flex; flex-wrap:wrap; gap:8px;}
.hidden{display:none !important;}
.flex-col{display:flex; flex-direction:column; gap:6px;}

.gacha-odds{font-size:var(--font-sm); color:#c9b48a; margin:6px 0;}
.gacha-odds div{display:flex; justify-content:space-between;}
.pip-bar{height:8px; border-radius:4px; background:rgba(0,0,0,0.4); border:1px solid var(--c-ink); overflow:hidden; margin:4px 0;}
.pip-fill{height:100%; background:linear-gradient(90deg,var(--c-brass),var(--c-brass-bright));}

.meta-card .level-track{display:flex; gap:2px; margin:4px 0;}
.pip{width:8px; height:8px; border-radius:2px; background:rgba(0,0,0,0.4); border:1px solid var(--c-ink);}
.pip.filled{background:var(--c-brass-bright);}

.item-icon{width:28px; height:28px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:16px; border:1px solid var(--c-ink);}

select, input[type=range]{
  font-family:inherit; background:var(--c-bg-dark); color:var(--c-parchment);
  border:2px solid var(--c-brass); border-radius:6px; padding:4px;
}

</style>
</head>
<body>
<div id="app">

  <!-- ============================= HUB ============================= -->
  <div id="hub">
    <div id="hub-header">
      <div class="title">⚜ Void Break ⚜</div>
      <div id="currency-bar">
        <div class="currency-pill"><span class="icon">⛀</span><span id="gold-amt">0</span></div>
        <div class="currency-pill"><span class="icon">♦</span><span id="gem-amt">0</span></div>
        <div class="currency-pill"><span class="icon">✦</span><span id="dust-amt">0</span></div>
      </div>
    </div>
    <div id="hub-body"></div>
    <div id="hub-tabs"></div>
  </div>

  <!-- ============================= RUN ============================= -->
  <div id="run">
    <canvas id="gameCanvas"></canvas>
    <div id="joystick-zone">
      <div id="joystick"><div id="joystick-knob"></div></div>
    </div>
    <div id="hud">
      <div id="hud-top-row">
        <div class="bar-wrap"><div class="bar-fill hp" id="hp-fill" style="width:100%"></div><div class="bar-label" id="hp-label">0/0</div></div>
      </div>
      <div id="hud-top-row">
        <div class="bar-wrap"><div class="bar-fill xp" id="xp-fill" style="width:0%"></div><div class="bar-label" id="xp-label">Lv 1</div></div>
      </div>
      <div id="hud-info">
        <span id="hud-biome">Forest</span>
        <span id="hud-wave">Wave 1</span>
        <span id="hud-timer">0:00</span>
        <span id="hud-kills">0 kills</span>
      </div>
    </div>
    <div id="pause-btn">⏸</div>

    <div id="levelup-overlay">
      <h2 id="levelup-title">Level Up!</h2>
      <div id="levelup-cards" class="upgrade-cards"></div>
    </div>

    <div id="pause-overlay">
      <div class="panel flex-col" style="width:260px;align-items:center;">
        <h2>Run Paused</h2>
        <button class="btn" id="resume-btn" style="width:100%">Resume</button>
        <button class="btn danger" id="abandon-btn" style="width:100%">Abandon Run</button>
      </div>
    </div>

    <div id="death-overlay">
      <div class="panel flex-col summary-panel">
        <h2>The Run Ends</h2>
        <div id="death-summary"></div>
        <button class="btn" id="return-hub-btn" style="width:100%;margin-top:10px;">Return to Hub</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <button class="btn" id="density-toggle">Density: auto</button>
</div>

<script>
/* =========================================================================
   VOID BREAK - game engine
   ========================================================================= */
(function(){
"use strict";

const SAVE_KEY = "voidbreak_save_v1";
const TIERS = ["Common","Rare","Legendary","Mythic"];
const ITEM_TIER_WEIGHT_DEFAULT = {Common:45,Rare:30,Legendary:18,Mythic:7};

// ------------------------------------------------------------------ utils
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmtTime(s){ s=Math.floor(s); const m=Math.floor(s/60); const r=s%60; return m+":"+String(r).padStart(2,"0"); }
function weightedPick(items, weightFn){
  const total = items.reduce((a,i)=>a+weightFn(i),0);
  let r = Math.random()*total;
  for(const it of items){ r -= weightFn(it); if(r<=0) return it; }
  return items[items.length-1];
}
function byId(list,id){ return list.find(x=>x.id===id); }
function byName(list,name){ return list.find(x=>x.name===name); }
function itemByName(name){ return byName(DATA.items,name); }
function heroBudget(h){ return h.hp + h.dmg*8 + h.spd*0.5; }

// ------------------------------------------------------------------ state
let state = null;

function defaultState(){
  return {
    gold: 150, gems: 0, enchantDust: 0,
    ownedHeroes: DATA.heroes.filter(h=>h.free).map(h=>h.id),
    selectedHero: DATA.heroes.find(h=>h.free).id,
    equipped: [null,null,null],
    inventory: [], // {uid,itemId,enchant}
    pets: [], // {uid,petId,level}
    activePets: [null,null],
    guildId: null,
    metaLevels: {},
    gachaPity: {hero:0,item:0,pet:0},
    stats: {totalRuns:0,totalKills:0,bestWave:0,bestTime:0},
    density: "auto",
    firstRunDone: false,
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    // shallow-merge with defaults so new fields survive old saves
    for(const k in d){ if(!(k in s)) s[k]=d[k]; }
    return s;
  }catch(e){ console.warn("save load failed", e); return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("save failed", e); }
}

// ------------------------------------------------------------------ derived helpers
function invAdd(itemId, count){
  count = count||1;
  for(let i=0;i<count;i++) state.inventory.push({uid:uid(), itemId, enchant:0});
}
function invCountOf(itemId){ return state.inventory.filter(x=>x.itemId===itemId && !state.equipped.includes(x.uid)).length; }
function invAllCountOf(itemId){ return state.inventory.filter(x=>x.itemId===itemId).length; }
function invRemoveOneOf(itemId){
  const idx = state.inventory.findIndex(x=>x.itemId===itemId && !state.equipped.includes(x.uid));
  if(idx>=0) state.inventory.splice(idx,1);
}
function invFindInstance(uidv){ return state.inventory.find(x=>x.uid===uidv); }

function petOwned(petId){ return state.pets.find(p=>p.petId===petId); }

function metaLevel(id){ return state.metaLevels[id]||0; }
function metaCost(def, lvl){ return Math.ceil(def.baseCost * (1 + lvl*0.6)); }

// aggregate effective stat bonuses (percent-style keys) from meta+guild+pets (persistent, not run passives)
function persistentBonuses(){
  const b = {};
  function add(key,val){ b[key]=(b[key]||0)+val; }
  // meta
  for(const m of DATA.metaUpgrades){
    const lvl = metaLevel(m.id);
    if(lvl>0) add(m.statKey, m.perLevel*lvl);
  }
  // guild
  if(state.guildId){
    const g = byId(DATA.guilds, state.guildId);
    if(g) add(g.statKey, g.value);
  }
  // active pets
  for(const slot of state.activePets){
    if(!slot) continue;
    const inst = petOwned(slot);
    if(!inst) continue;
    const def = byId(DATA.pets, inst.petId);
    if(!def) continue;
    add(def.statKey, def.base + def.perLevel*(inst.level-1));
  }
  return b;
}

function currentDensity(){
  if(state.density && state.density!=="auto") return state.density;
  return Math.min(window.innerWidth, window.innerHeight) >= 600 ? "tablet" : "phone";
}
function applyDensity(){
  document.documentElement.setAttribute("data-density", currentDensity());
}

// ------------------------------------------------------------------ toast
let toastTimer=null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 1800);
}

/* =========================================================================
   HUB UI
   ========================================================================= */
const TABS = [
  {id:"play", label:"Play", icon:"⚔"},
  {id:"heroes", label:"Heroes", icon:"♚"},
  {id:"pets", label:"Pets", icon:"🐾"},
  {id:"guild", label:"Guild", icon:"☄"},
  {id:"craft", label:"Craft", icon:"⚒"},
  {id:"enchant", label:"Enchant", icon:"✦"},
  {id:"gacha", label:"Gacha", icon:"♦"},
  {id:"meta", label:"Meta", icon:"◈"},
  {id:"bank", label:"Bank", icon:"⛁"},
];
let activeTab = "play";

function renderHubHeader(){
  document.getElementById("gold-amt").textContent = state.gold;
  document.getElementById("gem-amt").textContent = state.gems;
  document.getElementById("dust-amt").textContent = state.enchantDust;
}

function renderTabs(){
  const bar = document.getElementById("hub-tabs");
  bar.innerHTML = "";
  for(const t of TABS){
    const el = document.createElement("div");
    el.className = "hub-tab" + (t.id===activeTab ? " active":"");
    el.innerHTML = `<div class="tab-icon">${t.icon}</div><div>${t.label}</div>`;
    el.onclick = ()=>{ activeTab=t.id; renderHub(); };
    bar.appendChild(el);
  }
}

function renderHub(){
  renderHubHeader();
  renderTabs();
  const body = document.getElementById("hub-body");
  body.innerHTML = "";
  body.scrollTop = 0;
  const renderers = {
    play: renderPlayTab, heroes: renderHeroesTab, pets: renderPetsTab,
    guild: renderGuildTab, craft: renderCraftTab, enchant: renderEnchantTab,
    gacha: renderGachaTab, meta: renderMetaTab, bank: renderBankTab,
  };
  renderers[activeTab](body);
}

function tierClass(tier){ return "tier-"+tier; }

function itemIcon(item){
  const icons = {gear:"⚔", utility:"⚗"};
  return icons[item.type]||"✦";
}

// ---------------- PLAY TAB ----------------
function renderPlayTab(body){
  const hero = byId(DATA.heroes, state.selectedHero);
  const panel = document.createElement("div");
  panel.className = "panel flex-col";
  panel.innerHTML = `
    <h2>Prepare for the Run</h2>
    <div class="row">
      <div class="flex-col">
        <div class="name" style="font-size:var(--font-lg);color:var(--c-brass-bright)">${hero.name}</div>
        <div class="muted">${hero.desc}</div>
      </div>
      <div class="hero-portrait" style="width:64px;background-color:${hero.color}33;border-color:${hero.color}">⚔</div>
    </div>
    <div class="wrap-row muted" style="font-size:var(--font-sm)">
      <span>HP ${hero.hp}</span><span>DMG ${hero.dmg}</span><span>SPD ${hero.spd}</span>
      <span>Fire Rate ${hero.fireRate}/s</span><span>Passive: ${hero.passiveName}</span>
    </div>
    <button class="btn secondary" id="choose-hero-btn">Choose Different Hero</button>
  `;
  body.appendChild(panel);

  const loadout = document.createElement("div");
  loadout.className = "panel flex-col";
  loadout.style.marginTop = "var(--gap)";
  loadout.innerHTML = `<h2>Loadout (3 slots)</h2>`;
  const slotsWrap = document.createElement("div");
  slotsWrap.className = "wrap-row";
  state.equipped.forEach((slotUid, idx)=>{
    const inst = slotUid ? invFindInstance(slotUid) : null;
    const def = inst ? DATA.items.find(i=>i.id===inst.itemId) : null;
    const card = document.createElement("div");
    card.className = "card";
    card.style.width = "150px";
    card.style.cursor = "pointer";
    if(def){

function statLine(stats){
  const parts = [];
  for(const k in stats){
    const label = {hp:"HP",dmg:"DMG",spd:"SPD",fireRate:"Fire Rate",dust:"Dust",gold:"Gold"}[k]||k;
    parts.push(`+${stats[k]} ${label}`);
  }
  return parts.join(", ");
}

function openEquipPicker(slotIdx){

  const sel = document.createElement("div"); sel.className="wrap-row"; sel.style.marginTop="8px";
  const fusionState = {a:null,b:null};
  function fusionCard(which){
    const inst = fusionState[which] ? petOwned(fusionState[which]) : null;
    const def = inst ? byId(DATA.pets, inst.petId) : null;
    const card = document.createElement("div");
    card.className="card"; card.style.width="140px"; card.style.cursor="pointer";
    card.innerHTML = def ? `<span class="tier ${tierClass(def.tier)}">${def.tier}</span><div class="name">${def.name}</div><div class="stats">Lv${inst.level}</div>`
                         : `<div class="name muted">Pick pet ${which==='a'?'1':'2'}</div>`;
    card.onclick = ()=>{
      const other = which==='a' ? fusionState.b : fusionState.a;
      const eligible = state.pets.filter(p=>p.level>=10 && p.petId!==other);
      showModal("Choose Level-10 Pet", eligible.length? eligible.map(inst2=>{
        const def2 = byId(DATA.pets, inst2.petId);
        return {label:`${def2.name} <span class="tier ${tierClass(def2.tier)}" style="margin-left:6px">${def2.tier}</span>`, sub:`Lv${inst2.level}`,
          onClick:()=>{ fusionState[which]=inst2.petId; closeModal(); renderFusionUI(); }};
      }) : [{label:"No Level-10 pets yet", sub:"", onClick:closeModal}]);
    };
    return card;
  }
  function renderFusionUI(){
    sel.innerHTML="";
    sel.appendChild(fusionCard('a'));
    sel.appendChild(fusionCard('b'));
    fusionPanel.querySelector("#fuse-btn")?.remove();
    const btn = document.createElement("button");
    btn.id="fuse-btn"; btn.className="btn"; btn.style.marginTop="8px"; btn.textContent="Fuse Pets";
    const instA = fusionState.a && petOwned(fusionState.a);
    const instB = fusionState.b && petOwned(fusionState.b);
    let valid = instA && instB && instA.petId!==instB.petId && instA.level>=10 && instB.level>=10;
    if(valid){
      const defA = byId(DATA.pets, instA.petId), defB = byId(DATA.pets, instB.petId);
      valid = defA.tier===defB.tier && TIERS.indexOf(defA.tier) < TIERS.length-1;
    }
    btn.disabled = !valid;
    btn.onclick = ()=>{ doFusion(fusionState.a, fusionState.b); fusionState.a=null; fusionState.b=null; renderHub(); };
    fusionPanel.appendChild(btn);
  }
  renderFusionUI();
  fusionPanel.appendChild(sel);
  body.appendChild(fusionPanel);
}
function petLevelCost(lvl){ return Math.ceil(15*(1+lvl*0.5)); }

function doFusion(petIdA, petIdB){
  const instA = petOwned(petIdA), instB = petOwned(petIdB);
  if(!instA || !instB) return;
  const defA = byId(DATA.pets, instA.petId);
  const nextTier = TIERS[TIERS.indexOf(defA.tier)+1];
  if(Math.random() < 0.5){
    // success: consume both, grant next tier pet
    state.pets = state.pets.filter(p=>p!==instA && p!==instB);
    const candidates = DATA.pets.filter(p=>p.tier===nextTier);
    const won = pick(candidates);
    const already = petOwned(won.id);
    if(already){ already.level = Math.min(10, already.level+2); toast(`Fusion success! ${won.name} +2 levels.`); }
    else { state.pets.push({petId:won.id, level:1}); toast(`Fusion success! Gained ${won.name}.`); }
  } else {
    const loser = Math.random()<0.5 ? instA : instB;
    state.pets = state.pets.filter(p=>p!==loser);
    if(state.activePets.includes(loser.petId)){
      state.activePets = state.activePets.map(x=>x===loser.petId?null:x);
    }
    toast(`Fusion failed. ${byId(DATA.pets,loser.petId).name} was lost.`);
  }
  saveState();
}

function doEnchant(instUid){
  if(state.enchantDust < ENCHANT_COST) return;
  state.enchantDust -= ENCHANT_COST;
  const roll = Math.random();
  const inst = invFindInstance(instUid);
  if(roll < 0.70){
    if(inst){ inst.enchant = (inst.enchant||0)+1; toast("Enchant succeeded! +1 gear score."); }
  } else if(roll < 0.90){
    toast("The forge sputters. Nothing happens.");
  } else {
    const destroyable = state.inventory.filter(x=>!state.equipped.includes(x.uid));
    if(destroyable.length){
      const victim = pick(destroyable);
      state.inventory = state.inventory.filter(x=>x!==victim);
      const def = DATA.items.find(i=>i.id===victim.itemId);
      toast(`Backfire! ${def.name} was destroyed.`);
    } else {
      toast("Backfire! But nothing unequipped was at hand.");
    }
  }
  saveState(); renderHub();
}

      btn.onclick = ()=>{
        const n = parseInt(btn.dataset.n,10);

        const results = [];
        for(let i=0;i<n;i++){ if(state.gems<b.cost) break; state.gems-=b.cost; results.push(doGachaPull(key)); }
        saveState();
        toast(`Pulled: ${results.join(", ")}`);
        renderHub();
      };
    });
    body.appendChild(panel);
  }
}

function doGachaPull(bannerKey){
  const b = DATA.banners[bannerKey];
  state.gachaPity[bannerKey]++;
  if(bannerKey==="hero"){
    const locked = DATA.heroes.filter(h=>!state.ownedHeroes.includes(h.id));
    const consolationGold = 60;
    if(!locked.length){
      state.gachaPity.hero = 0;
      state.gold += consolationGold;
      return `${consolationGold} Gold (all heroes owned)`;
    }
    const heroChance = b.odds[0].chance; // % chance per pull to land a new hero
    const forcedPity = state.gachaPity.hero >= b.pity;
    const hit = forcedPity || Math.random()*100 < heroChance;
    if(hit){
      const won = pick(locked);
      state.ownedHeroes.push(won.id);
      state.gachaPity.hero = 0;
      return won.name+" (Hero!)";
    }
    state.gold += consolationGold;
    return `${consolationGold} Gold`;
  }
  if(bannerKey==="item"){
    let tier;
    const forcedPity = state.gachaPity.item >= b.pity;
    if(forcedPity){ tier = Math.random()<0.5 ? "Legendary":"Mythic"; state.gachaPity.item=0; }
    else { tier = weightedPick(b.odds, o=>o.chance).label; if(tier==="Legendary"||tier==="Mythic") state.gachaPity.item=0; }
    const pool = DATA.items.filter(i=>i.tier===tier);
    const won = pick(pool);
    invAdd(won.id,1);
    return won.name;
  }
  if(bannerKey==="pet"){
    let tier;
    const forcedPity = state.gachaPity.pet >= b.pity;
    if(forcedPity){ tier = Math.random()<0.5 ? "Legendary":"Mythic"; state.gachaPity.pet=0; }
    else { tier = weightedPick(b.odds, o=>o.chance).label; if(tier==="Legendary"||tier==="Mythic") state.gachaPity.pet=0; }
    const pool = DATA.pets.filter(p=>p.tier===tier);
    const won = pick(pool);
    const already = petOwned(won.id);
    if(already){ already.level = Math.min(10, already.level+1); return won.name+" (+1 lvl)"; }
    state.pets.push({petId:won.id, level:1});
    return won.name+" (New Pet!)";
  }
}

  const wrap = document.createElement("div"); wrap.className="wrap-row"; wrap.style.marginTop="8px";
  for(const rate of EXCHANGE_RATES){
    const card = document.createElement("div"); card.className="card"; card.style.width="150px";
    card.innerHTML = `<div class="name">${rate.gold} Gold</div><div class="desc">→ ${rate.gems} Gems</div>`;
    const btn = document.createElement("button"); btn.className="btn small"; btn.textContent="Exchange"; btn.disabled = state.gold<rate.gold;
    btn.onclick = ()=>{ if(state.gold>=rate.gold){ state.gold-=rate.gold; state.gems+=rate.gems; saveState(); toast(`+${rate.gems} Gems`); renderHub(); } };
    card.appendChild(btn);
    wrap.appendChild(card);
  }
  panel.appendChild(wrap);
  body.appendChild(panel);

  const statsPanel = document.createElement("div"); statsPanel.className="panel flex-col"; statsPanel.style.marginTop="var(--gap)";
  statsPanel.innerHTML = `<h2>Chronicle</h2>
    <div class="summary-row"><span>Total Runs</span><span>${state.stats.totalRuns}</span></div>
    <div class="summary-row"><span>Total Kills</span><span>${state.stats.totalKills}</span></div>
    <div class="summary-row"><span>Best Wave Reached</span><span>${state.stats.bestWave}</span></div>
    <div class="summary-row"><span>Best Survival Time</span><span>${fmtTime(state.stats.bestTime)}</span></div>`;
  body.appendChild(statsPanel);
}

/* =========================================================================
   RUN / GAMEPLAY
   ========================================================================= */
let canvas, ctx;
let runActive = false, runPaused = false;
let run = null; // run-scoped state

const WAVE_DURATION = 25; // seconds
const MAX_SCALE_WAVE = 40;
const WORLD_SPAWN_RADIUS = 620;

function currentBiomeIndex(wave){ return Math.min(DATA.biomes.length-1, Math.floor((wave-1)/6)); }

function startRun(){
  const hero = byId(DATA.heroes, state.selectedHero);
  const persist = persistentBonuses();
  const gearFlat = {hp:0,dmg:0,spd:0,fireRate:0};
  let gearEnchantBonus = 0;
  for(const slotUid of state.equipped){
    if(!slotUid) continue;
    const inst = invFindInstance(slotUid);
    if(!inst) continue;
    const def = DATA.items.find(i=>i.id===inst.itemId);
    for(const k in def.stats){ if(k in gearFlat) gearFlat[k]+=def.stats[k]; }
    gearEnchantBonus += (inst.enchant||0)*0.02;
  }

  run = {
    hero, persist, gearFlat, gearEnchantBonus,
    passives: {}, // key -> stacked value
    passiveList: [],
    x:0, y:0, vx:0, vy:0,
    hp:0, maxHp:0,
    level:1, xp:0, xpNeed: xpForLevel(1),
    wave:1, waveTimer:0, biomeIdx:0,
    time:0, kills:0,
    enemies:[], projectiles:[], orbs:[], particles:[], pickups:[],
    fireTimer:0, spawnTimer:0, bossSpawnedThisWave:false,
    reviveCharges: 0,
    invuln:0,
    loot: {gold:0, gems:0, dust:0, items:[]},
    lastNow: performance.now(),
    dead:false,
  };
  // meta revive roll
  const reviveChancePct = persist.revive_chance||0;
  if(reviveChancePct>0 && Math.random()*100 < reviveChancePct) run.reviveCharges += 1;

  recalcStats();
  run.hp = run.maxHp;

  document.getElementById("hub").style.display="none";
  document.getElementById("run").classList.add("active");
  runActive = true; runPaused = false;
  setupCanvas();
  bindControls();
  requestAnimationFrame(gameLoop);
}

function xpForLevel(lvl){ return Math.floor(6 + lvl*4 + lvl*lvl*0.5); }

function statTotal(key){
  let v = (run.persist[key]||0) + (run.passives[key]||0);
  return v;
}

function recalcStats(){
  const hero = run.hero;
  const hpFlat = hero.hp + run.gearFlat.hp;
  const dmgFlat = hero.dmg + run.gearFlat.dmg;
  const spdFlat = hero.spd + run.gearFlat.spd;
  const frFlat = hero.fireRate + run.gearFlat.fireRate;

  const hpPct = 1 + statTotal("hp_pct")/100;
  const dmgPct = 1 + statTotal("dmg_pct")/100 + run.gearEnchantBonus;
  const spdPct = 1 + statTotal("spd_pct")/100;
  const frPct = 1 + statTotal("fire_rate_pct")/100;
  const psPct = 1 + statTotal("proj_speed_pct")/100;

  const prevMax = run.maxHp||0;
  run.maxHp = Math.round(hpFlat*hpPct);
  if(prevMax>0 && run.hp!=null){ run.hp = Math.min(run.maxHp, run.hp + (run.maxHp-prevMax>0?0:0)); }
  run.dmg = dmgFlat*dmgPct;
  run.spd = spdFlat*spdPct;
  run.fireRate = frFlat*frPct;
  run.projSpeed = hero.projSpeed*psPct;

  run.critChance = statTotal("crit_chance") + (hero.passive==="crit"?25:0);
  run.critDmg = 100 + statTotal("crit_dmg");
  run.pierce = statTotal("pierce") + (hero.passive==="pierce"?1:0);
  run.multishot = statTotal("multishot") + (hero.passive==="multishot"?2:0);
  run.lifesteal = statTotal("lifesteal") + (hero.passive==="lifesteal"?8:0);
  run.thorns = statTotal("thorns") + (hero.passive==="thorns"?15:0);
  run.armor = statTotal("armor") + (hero.passive==="tanky"?20:0);
  run.dodge = clamp(statTotal("dodge"),0,60);
  run.magnet = 120 + statTotal("magnet");
  run.chain = statTotal("chain") + (hero.passive==="chain"?1:0);
  run.explosivePct = statTotal("explosive");
  run.freezeChance = statTotal("freeze_chance");
  run.burnChance = statTotal("burn_chance");
  run.knockbackPct = statTotal("knockback");
  run.regen = statTotal("regen") + (hero.passive==="regen"?1:0);
  run.slowAuraPct = statTotal("slow_aura");
  run.aoeRadius = (hero.passive==="aoe"?60:0) + (hero.passive==="aoe_big"?110:0) + statTotal("aoe_pct");
  run.xpPct = statTotal("xp_pct");
  run.goldPct = statTotal("gold_pct");
  run.gemChance = statTotal("gem_chance");
}

function setupCanvas(){
  canvas = document.getElementById("gameCanvas");
  ctx = canvas.getContext("2d");
  resizeCanvas();
}
function resizeCanvas(){
  if(!canvas) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = window.innerWidth*dpr;
  canvas.height = window.innerHeight*dpr;
  canvas.style.width = window.innerWidth+"px";
  canvas.style.height = window.innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", ()=>{ applyDensity(); if(runActive) resizeCanvas(); });

// ---- controls: joystick + keyboard ----
const keys = {};
let joyActive=false, joyVec={x:0,y:0}, joyTouchId=null;
function bindControls(){
  const zone = document.getElementById("joystick-zone");
  const stick = document.getElementById("joystick");
  const knob = document.getElementById("joystick-knob");
  const radius = ()=> stick.offsetWidth/2;

  function start(id,cx,cy){
    joyActive=true; joyTouchId=id;
    stick.style.display="block";
    stick.style.left=(cx-stick.offsetWidth/2)+"px";
    stick.style.top=(cy-stick.offsetHeight/2)+"px";
    stick.dataset.cx=cx; stick.dataset.cy=cy;
    knob.style.left="50%"; knob.style.top="50%";
  }
  function move(cx,cy){
    if(!joyActive) return;
    const ccx = parseFloat(stick.dataset.cx), ccy = parseFloat(stick.dataset.cy);
    let dx=cx-ccx, dy=cy-ccy;
    const r = radius();
    const dist = Math.min(Math.hypot(dx,dy), r);
    const ang = Math.atan2(dy,dx);
    const kx = Math.cos(ang)*dist, ky = Math.sin(ang)*dist;
    knob.style.left = (stick.offsetWidth/2+kx)+"px";
    knob.style.top = (stick.offsetHeight/2+ky)+"px";
    joyVec.x = dist>8 ? Math.cos(ang)*(dist/r) : 0;
    joyVec.y = dist>8 ? Math.sin(ang)*(dist/r) : 0;
  }
  function end(){ joyActive=false; joyTouchId=null; stick.style.display="none"; joyVec.x=0; joyVec.y=0; }

  zone.ontouchstart = (e)=>{
    if(!runActive||runPaused) return;
    const t = e.changedTouches[0];
    if(joyTouchId===null){ start(t.identifier, t.clientX, t.clientY); }
    e.preventDefault();
  };
  zone.ontouchmove = (e)=>{
    for(const t of e.changedTouches){ if(t.identifier===joyTouchId){ move(t.clientX,t.clientY); } }
    e.preventDefault();
  };
  zone.ontouchend = (e)=>{
    for(const t of e.changedTouches){ if(t.identifier===joyTouchId){ end(); } }
  };
  zone.ontouchcancel = end;

  window.onkeydown = (e)=>{ keys[e.key.toLowerCase()]=true; };
  window.onkeyup = (e)=>{ keys[e.key.toLowerCase()]=false; };
}
function keyboardVec(){
  let x=0,y=0;
  if(keys["a"]||keys["arrowleft"]) x-=1;
  if(keys["d"]||keys["arrowright"]) x+=1;
  if(keys["w"]||keys["arrowup"]) y-=1;
  if(keys["s"]||keys["arrowdown"]) y+=1;
  const len = Math.hypot(x,y);
  if(len>0){ x/=len; y/=len; }
  return {x,y};
}

// ---- enemy pool per biome ----
function biomeRegulars(idx){
  const name = DATA.biomes[idx];
  return DATA.enemies.filter(e=>e.biome===name && !e.boss);
}
function biomeBoss(idx){
  const name = DATA.biomes[idx];
  return DATA.enemies.find(e=>e.biome===name && e.boss);
}

function waveScale(wave){ return Math.pow(1.10, Math.min(wave, MAX_SCALE_WAVE)-1); }

function spawnEnemy(def, isBoss){
  const ang = Math.random()*Math.PI*2;
  const ex = run.x + Math.cos(ang)*WORLD_SPAWN_RADIUS;
  const ey = run.y + Math.sin(ang)*WORLD_SPAWN_RADIUS;
  const scale = waveScale(run.wave);
  run.enemies.push({
    def, x:ex, y:ey, hp:def.hp*scale*(isBoss?1:1), maxHp:def.hp*scale,
    dmg:def.dmg*scale, spd:def.spd*(isBoss?0.72:1), r: isBoss?34:14,
    isBoss, hitCd:0, slowUntil:0, freezeUntil:0, burnUntil:0, burnTick:0,
  });
}

function updateSpawning(dt){
  run.spawnTimer -= dt;
  if(run.spawnTimer<=0){
    const regs = biomeRegulars(run.biomeIdx);
    const n = 1 + Math.floor(run.wave/8);
    for(let i=0;i<n;i++) spawnEnemy(pick(regs), false);
    run.spawnTimer = clamp(1.1 - run.wave*0.02, 0.35, 1.1);
  }
  if(run.wave % 6 === 0 && !run.bossSpawnedThisWave){
    spawnEnemy(biomeBoss(run.biomeIdx), true);
    run.bossSpawnedThisWave = true;
    toast(biomeBoss(run.biomeIdx).name + " approaches!");
  }
}

function nearestEnemy(){
  let best=null, bestD=Infinity;
  for(const e of run.enemies){
    const d = Math.hypot(e.x-run.x, e.y-run.y);
    if(d<bestD){ bestD=d; best=e; }
  }
  return best;
}

function fireProjectile(target){
  const baseAng = Math.atan2(target.y-run.y, target.x-run.x);
  const shots = 1 + run.multishot;
  const spread = Math.min(0.9, shots*0.08);
  for(let i=0;i<shots;i++){
    const off = shots>1 ? (-spread/2 + spread*i/(shots-1)) : 0;
    const ang = baseAng+off;
    run.projectiles.push({
      x:run.x, y:run.y, vx:Math.cos(ang)*run.projSpeed, vy:Math.sin(ang)*run.projSpeed,
      dmg:run.dmg, pierce:run.pierce, hitEnemies:new Set(), life:1.6, r:6,
      chain:run.chain,
    });
  }
}

function dealDamage(enemy, dmg){
  let d = dmg;
  const isCrit = Math.random()*100 < run.critChance;
  if(isCrit) d *= run.critDmg/100;
  if(run.hero.passive==="rampage"){ d *= 1 + (1-run.hp/run.maxHp)*0.4; }
  enemy.hp -= d;
  if(run.freezeChance>0 && Math.random()*100<run.freezeChance) enemy.freezeUntil = run.time+1.0;
  if(run.burnChance>0 && Math.random()*100<run.burnChance) enemy.burnUntil = run.time+3.0;
  if(run.hero.passive==="slow") enemy.slowUntil = run.time+1.5;
  if(run.lifesteal>0){ run.hp = Math.min(run.maxHp, run.hp + d*run.lifesteal/100); }
  if(enemy.hp<=0) killEnemy(enemy);
  return d;
}

function killEnemy(enemy){
  enemy.dead = true;
  run.kills++;
  const goldGain = Math.round((enemy.isBoss?40:3) * (1+run.goldPct/100));
  run.loot.gold += goldGain;
  spawnXpOrb(enemy.x, enemy.y, enemy.isBoss?30:4);
  if(enemy.isBoss){
    let gems = 3 + Math.floor(Math.random()*4);
    if(Math.random()*100 < run.gemChance) gems += 2;
    run.loot.gems += gems;
    toast(`${enemy.def.name} defeated! +${gems} Gems`);
    if(Math.random()<0.5){
      const pool = weightedPick([{t:"Common",c:40},{t:"Rare",c:32},{t:"Legendary",c:22},{t:"Mythic",c:6}], o=>o.c).t;
      const cand = DATA.items.filter(i=>i.tier===pool);
      run.loot.items.push(pick(cand).name);
    }
  } else if(Math.random()<0.05){
    const cand = DATA.items.filter(i=>i.tier==="Common");
    run.loot.items.push(pick(cand).name);
  }
  if(run.aoeRadius>0){
    for(const other of run.enemies){
      if(other===enemy||other.dead) continue;
      if(Math.hypot(other.x-enemy.x, other.y-enemy.y) <= run.aoeRadius){
        other.hp -= run.dmg*0.35;
        if(other.hp<=0) killEnemy(other);
      }
    }
  }
}

function spawnXpOrb(x,y,val){ run.orbs.push({x,y,val}); }

function gainXp(v){
  run.xp += v*(1+run.xpPct/100);
  while(run.xp >= run.xpNeed){
    run.xp -= run.xpNeed;
    run.level++;
    run.xpNeed = xpForLevel(run.level);
    triggerLevelUp();
  }
}

function triggerLevelUp(){
  runPaused = true;
  const choices = [];
  const pool = DATA.passives.slice();
  while(choices.length<3 && pool.length){
    const idx = Math.floor(Math.random()*pool.length);
    choices.push(pool.splice(idx,1)[0]);
  }
  const overlay = document.getElementById("levelup-overlay");
  overlay.classList.add("active");
  const wrap = document.getElementById("levelup-cards");
  wrap.innerHTML = "";
  document.getElementById("levelup-title").textContent = `Level ${run.level}! Choose an Upgrade`;
  for(const p of choices){
    const card = document.createElement("div");
    card.className="card upgrade-card panel";
    card.innerHTML = `<div class="name">${p.name}</div><div class="desc">${p.descTemplate.replace("{v}", p.value)}</div>`;
    card.onclick = ()=>{
      run.passives[p.key] = (run.passives[p.key]||0) + p.value;
      run.passiveList.push(p.name);
      recalcStats();
      overlay.classList.remove("active");
      runPaused = false;
      run.lastNow = performance.now();
      requestAnimationFrame(gameLoop);
    };
    wrap.appendChild(card);
  }
}

function updateProjectiles(dt){
  for(const p of run.projectiles){
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    for(const e of run.enemies){
      if(e.dead || p.hitEnemies.has(e)) continue;
      if(Math.hypot(e.x-p.x, e.y-p.y) < e.r+p.r){
        p.hitEnemies.add(e);
        dealDamage(e, p.dmg);
        if(run.explosivePct>0){
          for(const other of run.enemies){
            if(other===e||other.dead) continue;
            if(Math.hypot(other.x-e.x, other.y-e.y)<70){ other.hp -= p.dmg*run.explosivePct/100; if(other.hp<=0) killEnemy(other); }
          }
        }
        if(p.chain>0 && p.hitEnemies.size <= p.chain){
          let best=null,bestD=140;
          for(const cand of run.enemies){
            if(cand.dead||p.hitEnemies.has(cand)) continue;
            const d=Math.hypot(cand.x-e.x,cand.y-e.y);
            if(d<bestD){bestD=d;best=cand;}
          }
          if(best){ const ang=Math.atan2(best.y-e.y,best.x-e.x); p.x=e.x; p.y=e.y; p.vx=Math.cos(ang)*run.projSpeed; p.vy=Math.sin(ang)*run.projSpeed; }
        }
        if(p.pierce<=0){ p.life=0; break; }
        p.pierce--;
      }
    }
  }
  run.projectiles = run.projectiles.filter(p=>p.life>0);
  run.enemies = run.enemies.filter(e=>!e.dead);
}

function updateEnemies(dt){
  for(const e of run.enemies){
    let spd = e.spd;
    if(e.slowUntil>run.time) spd *= 0.7;
    if(e.freezeUntil>run.time) spd *= 0.15;
    if(run.slowAuraPct>0 && Math.hypot(e.x-run.x,e.y-run.y)<130) spd *= (1-run.slowAuraPct/100);
    if(e.burnUntil>run.time){
      e.burnTick -= dt;
      if(e.burnTick<=0){ e.hp -= e.maxHp*0.03; e.burnTick=0.5; if(e.hp<=0){ killEnemy(e); continue; } }
    }
    const ang = Math.atan2(run.y-e.y, run.x-e.x);
    e.x += Math.cos(ang)*spd*dt; e.y += Math.sin(ang)*spd*dt;
    e.hitCd -= dt;
    const distToPlayer = Math.hypot(e.x-run.x, e.y-run.y);
    if(distToPlayer < e.r+16 && e.hitCd<=0){
      e.hitCd = 0.85;
      applyDamageToPlayer(e.dmg);
      if(run.thorns>0){ e.hp -= e.dmg*run.thorns/100; if(e.hp<=0) killEnemy(e); }
      if(run.knockbackPct>0){
        const kang = Math.atan2(e.y-run.y, e.x-run.x);
        e.x += Math.cos(kang)*(20+run.knockbackPct); e.y += Math.sin(kang)*(20+run.knockbackPct);
      }
    }
  }
  run.enemies = run.enemies.filter(e=>!e.dead);
}

function applyDamageToPlayer(dmg){
  if(run.invuln>run.time) return;
  if(Math.random()*100 < run.dodge) return;
  const mitigated = dmg*(1-clamp(run.armor,0,80)/100);
  run.hp -= mitigated;
  if(run.hp<=0){
    if(run.reviveCharges>0){
      run.reviveCharges--;
      run.hp = run.maxHp*0.3;
      run.invuln = run.time+2.0;
      toast("Saved by fate! Revived.");
    } else {
      run.hp = 0;
      endRun();
    }
  }
}

function updatePickups(dt){
  for(const o of run.orbs){
    const d = Math.hypot(o.x-run.x, o.y-run.y);
    if(d < run.magnet){
      const ang = Math.atan2(run.y-o.y, run.x-o.x);
      const pull = clamp((run.magnet-d)*4, 40, 500);
      o.x += Math.cos(ang)*pull*dt; o.y += Math.sin(ang)*pull*dt;
    } else {
      // gentle passive drift so orbs from ranged kills are never permanently stranded
      const ang = Math.atan2(run.y-o.y, run.x-o.x);
      o.x += Math.cos(ang)*70*dt; o.y += Math.sin(ang)*70*dt;
    }
    if(d < 20){ gainXp(o.val); o.dead=true; }
  }
  run.orbs = run.orbs.filter(o=>!o.dead);
}

function updateRegen(dt){
  if(run.regen>0) run.hp = Math.min(run.maxHp, run.hp + run.maxHp*(run.regen/100)*dt);
}

function updateWave(dt){
  run.waveTimer += dt;
  if(run.waveTimer >= WAVE_DURATION){
    run.waveTimer = 0;
    run.wave++;
    run.bossSpawnedThisWave = false;
    const newBiome = currentBiomeIndex(Math.min(run.wave,30));
    if(newBiome !== run.biomeIdx){ run.biomeIdx = newBiome; toast("Entering "+DATA.biomes[run.biomeIdx]+"..."); }
  }
}

function gameLoop(now){
  if(!runActive || runPaused) return;
  const dt = Math.min(0.05, (now-run.lastNow)/1000);
  run.lastNow = now;
  run.time += dt;

  const vec = joyActive ? joyVec : keyboardVec();
  run.x += vec.x*run.spd*dt;
  run.y += vec.y*run.spd*dt;

  updateWave(dt);
  updateSpawning(dt);
  updateEnemies(dt);

  run.fireTimer -= dt;
  if(run.fireTimer<=0){
    const target = nearestEnemy();
    if(target && Math.hypot(target.x-run.x,target.y-run.y) < 560){
      fireProjectile(target);
      run.fireTimer = 1/Math.max(0.2,run.fireRate);
    } else {
      run.fireTimer = 0.1;
    }
  }
  updateProjectiles(dt);
  updatePickups(dt);
  updateRegen(dt);

  render();
  updateHud();

  if(runActive && !runPaused) requestAnimationFrame(gameLoop);
}

function render(){
  const w = window.innerWidth, h = window.innerHeight;
  ctx.clearRect(0,0,w,h);
  const biome = DATA.biomes[run.biomeIdx];
  const bgColors = {
    "Forest":"#20260f","Desert":"#2e2612","Ice Cavern":"#15242b","Volcano":"#2b1410","The Void":"#0e0a16"
  };
  ctx.fillStyle = bgColors[biome]||"#1a1006";
  ctx.fillRect(0,0,w,h);

  // grid parallax
  ctx.strokeStyle = "rgba(201,162,74,0.08)";
  ctx.lineWidth=1;
  const grid=60;
  const offx = ((-run.x)%grid+grid)%grid, offy = ((-run.y)%grid+grid)%grid;
  for(let gx=offx; gx<w; gx+=grid){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke(); }
  for(let gy=offy; gy<h; gy+=grid){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }

  const cx = w/2, cy = h/2;
  const toScreen = (x,y)=>[x-run.x+cx, y-run.y+cy];

  // orbs
  for(const o of run.orbs){
    const [sx,sy]=toScreen(o.x,o.y);
    ctx.fillStyle="#e6c25c"; ctx.beginPath(); ctx.arc(sx,sy,5,0,7); ctx.fill();
  }
  // enemies
  for(const e of run.enemies){
    const [sx,sy]=toScreen(e.x,e.y);
    ctx.fillStyle = e.isBoss ? "#c9432e" : "#8a3a20";
    ctx.beginPath(); ctx.arc(sx,sy,e.r,0,7); ctx.fill();
    ctx.strokeStyle="#1a1006"; ctx.lineWidth=2; ctx.stroke();
    // hp bar
    const bw = e.r*2;
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(sx-bw/2, sy-e.r-10, bw, 5);
    ctx.fillStyle= e.isBoss ? "#e6c25c" : "#c9432e";
    ctx.fillRect(sx-bw/2, sy-e.r-10, bw*clamp(e.hp/e.maxHp,0,1), 5);
  }
  // projectiles
  for(const p of run.projectiles){
    const [sx,sy]=toScreen(p.x,p.y);
    ctx.fillStyle="#f0dca8"; ctx.beginPath(); ctx.arc(sx,sy,p.r,0,7); ctx.fill();
  }
  // player
  ctx.fillStyle = run.hero.color;
  ctx.beginPath(); ctx.arc(cx,cy,18,0,7); ctx.fill();
  ctx.strokeStyle="#1a1006"; ctx.lineWidth=3; ctx.stroke();
  if(run.invuln>run.time){ ctx.strokeStyle="#e6c25c"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,24,0,7); ctx.stroke(); }
}

function updateHud(){
  document.getElementById("hp-fill").style.width = clamp(run.hp/run.maxHp*100,0,100)+"%";
  document.getElementById("hp-label").textContent = Math.ceil(run.hp)+"/"+run.maxHp;
  document.getElementById("xp-fill").style.width = clamp(run.xp/run.xpNeed*100,0,100)+"%";
  document.getElementById("xp-label").textContent = "Lv "+run.level;
  document.getElementById("hud-wave").textContent = "Wave "+run.wave;
  document.getElementById("hud-biome").textContent = DATA.biomes[run.biomeIdx];
  document.getElementById("hud-timer").textContent = fmtTime(run.time);
  document.getElementById("hud-kills").textContent = run.kills+" kills";
}

function endRun(){
  runActive = false;
  window.onkeydown = null; window.onkeyup = null;
  state.stats.totalRuns++;
  state.stats.totalKills += run.kills;
  state.stats.bestWave = Math.max(state.stats.bestWave, run.wave);
  state.stats.bestTime = Math.max(state.stats.bestTime, run.time);
  state.gold += run.loot.gold;
  state.gems += run.loot.gems;
  state.enchantDust += run.loot.dust + Math.floor(run.kills/10);
  for(const nm of run.loot.items){ const def=itemByName(nm); if(def) invAdd(def.id,1); }
  state.firstRunDone = true;
  saveState();

  const overlay = document.getElementById("death-overlay");
  overlay.classList.add("active");
  document.getElementById("death-summary").innerHTML = `
    <div class="summary-row"><span>Wave Reached</span><span>${run.wave}</span></div>
    <div class="summary-row"><span>Time Survived</span><span>${fmtTime(run.time)}</span></div>
    <div class="summary-row"><span>Kills</span><span>${run.kills}</span></div>
    <div class="summary-row"><span>Gold Earned</span><span class="gold-text">${run.loot.gold}</span></div>
    <div class="summary-row"><span>Gems Earned</span><span class="gold-text">${run.loot.gems}</span></div>
    <div class="summary-row"><span>Items Looted</span><span>${run.loot.items.length ? run.loot.items.join(", ") : "None"}</span></div>
  `;
}

function returnToHub(){
  document.getElementById("death-overlay").classList.remove("active");
  document.getElementById("pause-overlay").classList.remove("active");
  document.getElementById("levelup-overlay").classList.remove("active");
  document.getElementById("run").classList.remove("active");
  document.getElementById("hub").style.display="flex";
  activeTab="play";
  renderHub();
}

/* =========================================================================
   BOOTSTRAP
   ========================================================================= */
function init(){
  state = loadState();
  applyDensity();

  document.getElementById("density-toggle").onclick = ()=>{
    const order = ["auto","phone","tablet"];
    const idx = order.indexOf(state.density);
    state.density = order[(idx+1)%order.length];
    document.getElementById("density-toggle").textContent = "Density: "+state.density;
    applyDensity(); saveState();
  };
  document.getElementById("density-toggle").textContent = "Density: "+state.density;

  document.getElementById("pause-btn").onclick = ()=>{
    if(!runActive) return;
    runPaused = true;
    document.getElementById("pause-overlay").classList.add("active");
  };
  document.getElementById("resume-btn").onclick = ()=>{
    document.getElementById("pause-overlay").classList.remove("active");
    runPaused = false;
    run.lastNow = performance.now();
    requestAnimationFrame(gameLoop);
  };
  document.getElementById("abandon-btn").onclick = ()=>{
    document.getElementById("pause-overlay").classList.remove("active");
    endRun();
  };
  document.getElementById("return-hub-btn").onclick = returnToHub;

  document.getElementById("app").addEventListener("click", (e)=>{
    if(e.target.id==="modal-overlay") closeModal();
  });

  renderHub();
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init);
else init();

})();

</script>
