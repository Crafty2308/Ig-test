function buildSlots(){
  const host=$('slots');
  host.innerHTML='';
  const defs=[{k:'LMB',n:G.char.attack.name}].concat(
    G.char.abilities.map((a,i)=>({k:KEYBINDS[i],n:a.name})));
  defs.forEach((d,i)=>{
    const el=document.createElement('div');
    el.className='slot';
    el.innerHTML='<div class="sk">'+esc(d.k)+'</div><div class="sn">'+esc(d.n)+'</div><div class="cd"></div>';
    el.dataset.i=String(i);
    host.appendChild(el);
  });
  /* touch button labels */
  $('tb-atk').querySelector('.lb').textContent=G.char.attack.name;
  for(let i=0;i<3;i++){
    const b=$('tb-'+['q','e','r'][i]);
    if(b) b.querySelector('.lb').textContent=G.char.abilities[i].name;
  }
}
function cdFractions(){
  const p=G.player, a=G.char.attack;
  const out=[];
  out.push(clamp(p.atkCd/(a.mechanic.cooldown*p.cdMult||1),0,1));
  for(const ab of G.char.abilities) out.push(clamp(ab.cd/(ab.mechanic.cooldown*p.cdMult||1),0,1));
  return out;
}
function updateHUD(){
  if(!G.player||!G.char) return;
  const p=G.player;
  $('hud-name').textContent=G.char.name;
  $('hud-hp').style.width=(clamp(p.hp/p.maxHp,0,1)*100)+'%';
  $('hud-hpnum').textContent=Math.ceil(p.hp)+' / '+p.maxHp;
  $('hud-xp').style.width=(clamp(p.xp/p.xpNext,0,1)*100)+'%';
  $('hud-level').textContent='Level '+p.level;
  $('hud-theme').textContent=G.themeKey;
  $('hud-depth').textContent='Depth '+G.depth;
  $('hud-kills').textContent=G.kills+' slain';
  const fr=cdFractions();
  const slots=$('slots').children;
  for(let i=0;i<slots.length;i++){
    const el=slots[i];
    el.querySelector('.cd').style.height=(fr[i]*100)+'%';
    el.classList.toggle('ready',fr[i]<=0);
  }
  if(IS_TOUCH){
    const ids=['tb-atk','tb-q','tb-e','tb-r'];
    for(let i=0;i<4;i++){
      const b=$(ids[i]);
      if(!b) continue;
      const deg=(fr[i]*360).toFixed(1);
      b.querySelector('.sweep').style.background=
        'conic-gradient(rgba(0,0,0,.72) 0deg, rgba(0,0,0,.72) '+deg+'deg, rgba(0,0,0,0) '+deg+'deg)';
      b.style.borderColor = fr[i]<=0 ? 'rgba(200,169,110,.5)' : 'rgba(200,169,110,.16)';
    }
  }
}

/* ============================================================
   LOOP
   ============================================================ */
function update(dt){
  G.runTime+=dt;
  updatePlayer(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateShots(dt);
  updatePickups(dt);
}
function visualUpdate(dt){
  updateFx(dt);
  updateParts(dt);
  updateDmgNums(dt);
  updateCamera(dt);
  if(G.flash>0) G.flash=Math.max(0,G.flash-dt*2.1);
}
let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  const now=ts/1000;
  let dt=lastTs? now-lastTs : 0;
  lastTs=now;
  if(dt>0.05) dt=0.05;                        // dt capped at 50ms
  if(dt<0) dt=0;
  G.time+=dt;
  /* if frames stay slow, trade canvas resolution for frame rate */
  if(G.running){
    if(dt>0.026) G.slowT+=dt; else G.slowT=Math.max(0,G.slowT-dt*0.5);
    if(G.slowT>2.5 && G.dprCap>1){
      G.dprCap=Math.max(1,G.dprCap-0.35);
      G.slowT=0;
      resizeCanvas();
    }
  }
  if(G.running && !G.paused){
    if(G.hitStop>0) G.hitStop-=dt;            // update() frozen, render keeps running
    else if(!G.over) update(dt);
    visualUpdate(dt);
  }
  render();
  updateHUD();
}

   ============================================================ */
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='tab'){ if(G.running){ e.preventDefault(); toggleSheet(); } return; }  /* leave Tab alone on the form screens */
  if(k==='escape'){ if(G.running) togglePause(); return; }
  if(G.keys[k]) return;
  G.keys[k]=true;
  if(!G.running||G.paused||G.over) return;
  if(k==='q') useAbility(0,false);
  if(k==='e') useAbility(1,false);
  if(k==='r') useAbility(2,false);
  if(k===' ') e.preventDefault();
});
window.addEventListener('keyup',e=>{ G.keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur',()=>{ G.keys=Object.create(null); G.mouse.left=false; G.mouse.right=false; });

function screenToWorld(sx,sy){
  return {
    x: sx + G.cam.x - G.view.w/2,
    y: sy + G.cam.y - G.view.h/2
  };
}
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  G.mouse.sx=e.clientX-r.left; G.mouse.sy=e.clientY-r.top;
  const w=screenToWorld(G.mouse.sx,G.mouse.sy);
  G.mouse.wx=w.x; G.mouse.wy=w.y;
});
cv.addEventListener('mousedown',e=>{
  const r=cv.getBoundingClientRect();
  G.mouse.sx=e.clientX-r.left; G.mouse.sy=e.clientY-r.top;
  const w=screenToWorld(G.mouse.sx,G.mouse.sy);
  G.mouse.wx=w.x; G.mouse.wy=w.y;
  if(e.button===0){ G.mouse.left=true; doBasicAttack(false); }   /* attack only — never moves */
  if(e.button===2){ e.preventDefault(); G.mouse.right=true; }    /* hold to move */
});
window.addEventListener('mouseup',e=>{
  if(e.button===0) G.mouse.left=false;
  if(e.button===2) G.mouse.right=false;
});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ============================================================
   INPUT — touch (works alongside mouse/keyboard)
   ============================================================ */
function setupTouch(){
  const stick=$('stick'), knob=stick.firstElementChild;
  const MAXR=54;
  function showStick(x,y){
    stick.style.left=x+'px'; stick.style.top=y+'px';
    stick.style.display='block';
  }
  function moveKnob(dx,dy){
    knob.style.transform='translate('+dx+'px,'+dy+'px)';
  }
  cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.clientX < window.innerWidth*0.5 && G.touch.stickId===null){
        G.touch.stickId=t.identifier;
        G.touch.ox=t.clientX; G.touch.oy=t.clientY;
        G.touch.dx=0; G.touch.dy=0; G.touch.active=true;
        showStick(t.clientX,t.clientY);
        moveKnob(0,0);
      }
    }
  },{passive:false});
  cv.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier!==G.touch.stickId) continue;
      let dx=t.clientX-G.touch.ox, dy=t.clientY-G.touch.oy;
      const d=Math.hypot(dx,dy);
      if(d>MAXR*1.9){                          /* thumb drifted: recentre under it */
        G.touch.ox=t.clientX-dx/d*MAXR*1.9;
        G.touch.oy=t.clientY-dy/d*MAXR*1.9;
        showStick(G.touch.ox,G.touch.oy);
        dx=t.clientX-G.touch.ox; dy=t.clientY-G.touch.oy;
      }
      const dd=Math.hypot(dx,dy);
      const cl=Math.min(dd,MAXR);
      const nx=dd>0?dx/dd:0, ny=dd>0?dy/dd:0;
      moveKnob(nx*cl,ny*cl);
      const mag=Math.min(1,dd/MAXR);
      G.touch.dx=nx*mag; G.touch.dy=ny*mag;
    }
  },{passive:false});
  function endTouch(e){
    for(const t of e.changedTouches){
      if(t.identifier===G.touch.stickId){
        G.touch.stickId=null; G.touch.active=false;
        G.touch.dx=0; G.touch.dy=0;
        stick.style.display='none';
      }
    }
  }
  cv.addEventListener('touchend',endTouch,{passive:false});
  cv.addEventListener('touchcancel',endTouch,{passive:false});

  /* four action buttons, bottom-right */
  const btns=[['tb-atk','atk'],['tb-q',0],['tb-e',1],['tb-r',2]];
  for(const [id,act] of btns){
    const el=$(id);
    if(!el) continue;
    const press=e=>{
      e.preventDefault(); e.stopPropagation();
      el.classList.add('down');
      G.touch.btn[act]=true;
      if(act==='atk') doBasicAttack(true); else useAbility(act,true);
    };
    const release=e=>{
      e.preventDefault(); e.stopPropagation();
      el.classList.remove('down');
      G.touch.btn[act]=false;
    };
    el.addEventListener('touchstart',press,{passive:false});
    el.addEventListener('touchend',release,{passive:false});
    el.addEventListener('touchcancel',release,{passive:false});
    /* also usable with a mouse on hybrid devices */
    el.addEventListener('mousedown',press);
    el.addEventListener('mouseup',release);
    el.addEventListener('mouseleave',release);
  }
}

/* ============================================================
   SCREENS & OVERLAYS
   ============================================================ */
function showScreen(name){
  G.screen=name;
  for(const id of ['screen-create','screen-overview','screen-game']){
    $(id).classList.toggle('active', id==='screen-'+name);
  }
}
const OVERLAY_IDS={pause:'ov-pause',sheet:'ov-sheet',level:'ov-level',gear:'ov-gear',boss:'ov-boss',death:'ov-death'};
function openOverlay(kind){
  closeOverlays();
  G.modal=kind;
  $(OVERLAY_IDS[kind]).classList.add('on');
  G.paused=true;
}
function closeOverlays(){
  for(const k in OVERLAY_IDS) $(OVERLAY_IDS[k]).classList.remove('on');
  G.modal=null;
}
function resumeGame(){
  closeOverlays();
  if(!G.over) G.paused=false;
  G.keys=Object.create(null);
  G.mouse.left=false; G.mouse.right=false;
}
function togglePause(){
  if(G.over) return;
  if(G.modal==='pause'){ resumeGame(); return; }
  if(G.modal==='sheet'){ openPause(); return; }
  if(G.modal) return;                          // level-up / gear / boss choices are modal
  openPause();
}
function toggleSheet(){
  if(G.over) return;
  if(G.modal==='sheet'){ resumeGame(); return; }
  if(G.modal && G.modal!=='pause') return;
  openSheet();
}
function mechLine(m){
  const bits=[m.type.replace('_',' ')];
  if(m.damage) bits.push(Math.round(m.damage)+' dmg');
  if(m.cooldown) bits.push(m.cooldown.toFixed(1)+'s cd');
  if(m.range) bits.push(Math.round(m.range)+' range');
  if(m.type==='aoe'||m.type==='melee_swing'||m.type==='nova') bits.push(Math.round(m.radius)+' radius');
  if(m.count>1) bits.push('x'+m.count);
  if(m.type==='buff') bits.push(m.duration.toFixed(1)+'s');
  return bits.join('  ·  ');
}
function gearHtml(){
  let any=false, out='';
  for(const s of GEAR_SLOTS){
    const g=G.gear[s];
    if(!g) continue;
    any=true;
    out+='<div class="gear-line"><b>'+esc(g.name)+'</b> &nbsp;<span class="tag">'+esc(s)+'</span><br>'+
         '<i>'+esc(g.flavour)+'</i> &nbsp;&nbsp;<span style="color:#9fd08a">'+esc(g.mod.type.replace('%',''))+' '+g.mod.value+(g.mod.type.indexOf('%')>=0?'%':'')+'</span></div>';
  }
  if(!any) out='<div class="gear-none">Nothing but what you came down with.</div>';
  return out;
}
function statsHtml(){

function openSheet(){
  const c=G.char, p=G.player;
  let html='<div class="ov-title">'+esc(c.name)+'</div><div class="ov-class">'+esc(c.class)+'</div>';
  html+='<div class="ov-story">'+esc(c.backstory)+'</div>';

    row('Health',Math.ceil(p.hp)+' / '+p.maxHp)+
    row('Level',p.level)+
    row('Crit chance',Math.round(p.crit*100)+'%')+
    row('Move speed',Math.round(p.speed))+
    row('Cooldowns',Math.round(p.cdMult*100)+'%')+
    '</div>';
  html+='<div class="sec-title">Basic Attack</div>';
  html+='<div class="card"><div class="row"><span class="key">LMB</span><span class="nm">'+esc(c.attack.name)+'</span></div>'+
        '<div class="ds">'+esc(c.attack.description)+'</div><div class="mech">'+esc(mechLine(c.attack.mechanic))+'</div></div>';
  html+='<div class="sec-title">Abilities</div>';
  c.abilities.forEach((a,i)=>{
    html+='<div class="card"><div class="row"><span class="key">'+KEYBINDS[i]+'</span><span class="nm">'+esc(a.name)+'</span>'+
          '<span class="tag">'+esc(a.mechanic.type.replace('_',' '))+'</span></div>'+
          '<div class="ds">'+esc(a.description)+'</div><div class="mech">'+esc(mechLine(a.mechanic))+'</div></div>';
  });
  html+='<div class="sec-title">Equipped</div>'+gearHtml();
  html+='<div class="btnrow"><button class="btn small ghost" id="sheet-close">Close</button></div>';
  $('sheet-body').innerHTML=html;
  openOverlay('sheet');
  $('sheet-close').addEventListener('click',resumeGame);
}
function row(k,v){ return '<div class="r"><span>'+esc(k)+'</span><span>'+esc(v)+'</span></div>'; }
function summaryHtml(){
  return '<div class="summary">'+
    row('Time survived',fmtTime(G.runTime))+
    row('Slain',G.kills)+
    row('Depth reached',G.depth)+
    row('Level',G.player?G.player.level:1)+
    '</div>';
}
function openPause(){
  $('pause-body').innerHTML=
    '<div class="ov-title">Paused</div>'+
    '<div class="ov-note">The dark waits politely.</div>'+
    summaryHtml()+
    '<div class="btnrow">'+
      '<button class="btn small" id="p-resume">Resume</button>'+
      '<button class="btn small ghost" id="p-sheet">Character</button>'+
      '<button class="btn small ghost" id="p-abandon">Abandon Run</button>'+
    '</div>';
  openOverlay('pause');
  $('p-resume').addEventListener('click',resumeGame);
  $('p-sheet').addEventListener('click',openSheet);
  $('p-abandon').addEventListener('click',()=>{ G.over=true; openDeath(true); });
}

/* ============================================================
   PROGRESSION
   ============================================================ */
function gainXp(v){
  const p=G.player;
  p.xp+=v;
  if(p.xp>=p.xpNext && !G.modal && !G.over) triggerLevelUp();
}
function triggerLevelUp(){
  const p=G.player;
  p.xp-=p.xpNext;
  p.level++;
  p.xpNext=xpForLevel(p.level);
  recalcStats();
  p.hp=Math.min(p.maxHp,p.hp+Math.round(p.maxHp*0.3));
  burst(p.x,p.y,40,'#e0c070',300,4,0.9,true);
  spawnFx({type:'shock',x:p.x,y:p.y,r:0,max:200,life:0.7,maxLife:0.7,color:'#e0c070'});
  $('level-body').innerHTML=
    '<div class="ov-title">Level '+p.level+'</div>'+
    '<div class="ov-note">Something down here is teaching you<span class="dots"></span></div>';
  openOverlay('level');
  offerNewAbility();
}
async function offerNewAbility(){
  let ab=null;
  try{
    ab=await generateAbility();
  }catch(err){
    G.apiFailed=true;
    ab=fallbackAbility(G.player.level);
    ab=sanitizeAbility(ab,0);
  }
  if(G.over) return;
  const c=G.char;
  let html='<div class="ov-title">Level '+G.player.level+'</div>';
  html+='<div class="ov-note">A new art has surfaced. Something must make room for it.</div>';
  html+='<div class="sec-title">New</div>';
  html+='<div class="card"><div class="row"><span class="nm">'+esc(ab.name)+'</span>'+
        '<span class="tag">'+esc(ab.mechanic.type.replace('_',' '))+'</span></div>'+
        '<div class="ds">'+esc(ab.description)+'</div>'+
        '<div class="mech">'+esc(mechLine(ab.mechanic))+'</div></div>';
  html+='<div class="sec-title">Replace which?</div>';
  c.abilities.forEach((a,i)=>{
    html+='<button class="pick" data-i="'+i+'"><div class="nm">'+KEYBINDS[i]+' — '+esc(a.name)+'</div>'+
          '<div class="ds">'+esc(a.description)+'</div>'+
          '<div class="mech">'+esc(mechLine(a.mechanic))+'</div></button>';
  });
  html+='<div class="btnrow"><button class="btn small ghost" id="lv-keep">Keep what I have</button></div>';
  $('level-body').innerHTML=html;
  const btns=$('level-body').querySelectorAll('.pick');
  btns.forEach(b=>b.addEventListener('click',()=>{
    const i=parseInt(b.dataset.i,10);
    ab.cd=0;
    G.char.abilities[i]=ab;
    buildSlots();
    finishLevelUp();
  }));
  $('lv-keep').addEventListener('click',finishLevelUp);
}
function finishLevelUp(){
  resumeGame();
  const p=G.player;
  if(p.xp>=p.xpNext && !G.over) triggerLevelUp();
}

/* ---------------- boss death, gear, descent ---------------- */
async function onBossDead(){
  G.paused=true;
  $('gear-body').innerHTML=
    '<div class="ov-title">It Left Something</div>'+
    '<div class="ov-note">Picking it out of the wreckage<span class="dots"></span></div>';
  openOverlay('gear');
  let g=null;
  try{ g=await generateGear(); }
  catch(err){ G.apiFailed=true; g=fallbackGear(G.depth); }
  if(G.over) return;
  G.pendingGear=g;
  showGearOverlay(g);
}
function modText(mod){
  const pc=mod.type.indexOf('%')>=0;
  const neg=mod.type.charAt(0)==='-';
  return (neg?'−':'+')+mod.value+(pc?'%':'')+' '+mod.type.replace(/^[+-]/,'').replace('%','');
}
function showGearOverlay(g){
  const cur=G.gear[g.slot];
  let html='<div class="ov-title">'+esc(g.slot)+' Found</div>';
  html+='<div class="ov-note">'+esc(G.theme.boss)+' is finished. This was inside it.</div>';
  html+='<div class="cmp">';
  html+='<div><div class="lbl">Dropped</div><div class="nm">'+esc(g.name)+'</div>'+
        '<div class="fl">'+esc(g.flavour)+'</div><div class="md">'+esc(modText(g.mod))+'</div></div>';
  html+='<div><div class="lbl">Equipped</div>'+
        (cur? '<div class="nm">'+esc(cur.name)+'</div><div class="fl">'+esc(cur.flavour)+'</div>'+
              '<div class="md worse">'+esc(modText(cur.mod))+'</div>'
            : '<div class="nm" style="color:#5f5b53">— empty —</div><div class="fl">This slot has been bare the whole way down.</div>')+
        '</div>';
  html+='</div>';
  html+='<div class="btnrow"><button class="btn small" id="g-equip">Equip</button>'+
        '<button class="btn small ghost" id="g-discard">Leave It</button></div>';
  $('gear-body').innerHTML=html;
  $('g-equip').addEventListener('click',()=>{
    G.gear[g.slot]=g;
    recalcStats();
    G.pendingGear=null;
    openBossOverlay();
  });
  $('g-discard').addEventListener('click',()=>{
    G.pendingGear=null;
    openBossOverlay();
  });
}
function openBossOverlay(){
  $('boss-body').innerHTML=
    '<div class="ov-title">The Way Down Opens</div>'+
    '<div class="ov-note">A seam in the floor, breathing cold. You could still walk out with what you have.</div>'+
    summaryHtml()+
    '<div class="btnrow">'+
      '<button class="btn small" id="b-descend">Descend to Depth '+(G.depth+1)+'</button>'+
      '<button class="btn small ghost" id="b-quit">Leave the Rift</button>'+
    '</div>';
  openOverlay('boss');
  $('b-descend').addEventListener('click',()=>{ closeOverlays(); descend(); });
  $('b-quit').addEventListener('click',()=>{ G.over=true; openDeath(true); });
}
function descend(){
  G.depth++;
  setupDepth();
  resumeGame();
  checkPendingLevel();
}
function checkPendingLevel(){
  const p=G.player;
  if(!G.over && !G.modal && p && p.xp>=p.xpNext) triggerLevelUp();
}
function onDeath(){
  G.over=true;
  const p=G.player;
  burst(p.x,p.y,60,'#c04a3c',340,5,1.1,true);
  shakeCam(20);
  setTimeout(()=>{ if(G.over) openDeath(false); },700);
}
function openDeath(walkedAway){
  G.over=true;
  $('death-body').innerHTML=
    '<div class="ov-title">'+(walkedAway?'You Walked Out':'You Died')+'</div>'+
    '<div class="ov-note">'+(walkedAway
      ? 'The rift did not stop you. It rarely bothers.'
      : 'The '+esc(G.themeKey)+' keeps what falls in it.')+'</div>'+
    summaryHtml()+
    '<div class="btnrow">'+
      '<button class="btn small" id="d-again">Rise Again</button>'+
      '<button class="btn small ghost" id="d-new">New Soul</button>'+
    '</div>';
  openOverlay('death');
  $('d-again').addEventListener('click',()=>{ closeOverlays(); newRun(); });
  $('d-new').addEventListener('click',()=>{
    closeOverlays();
    G.running=false; G.over=false; G.paused=false;
    showScreen('create');
    $('create-loading').textContent='';
    $('create-err').textContent='';
    $('btn-forge').disabled=false;
    $('btn-forge').textContent='Forge Soul';
  });
}

/* ============================================================
   RUN SETUP
   ============================================================ */
function setupDepth(){
  G.themeKey = pick(THEME_KEYS);
  G.theme = THEMES[G.themeKey];
  document.body.style.background=G.theme.bg;
  generateMap();
  G.spawnPos = tileCenter(G.spawnTile.x,G.spawnTile.y);
  bakeSprites(G.theme);
  bakeMinimap();
  initMotes();
  G.enemies=[]; G.shots=[]; G.fx=[]; G.pickups=[]; G.dmgNums=[];
  G.hitStop=0; G.flash=0; G.boss=null;
  initParticles();
  if(!G.player) makePlayer();
  else { G.player.x=G.spawnPos.x; G.player.y=G.spawnPos.y; }
  G.cam.x=G.spawnPos.x; G.cam.y=G.spawnPos.y; G.cam.shake=0;
  spawnEnemies();
  makeBoss();
  for(const a of G.char.abilities) a.cd=0;
  G.player.atkCd=0;
  G.player.iframe=0.6;
}
function newRun(){
  G.depth=1; G.kills=0; G.runTime=0;
  G.gear={Weapon:null,Armor:null,Trinket:null};
  G.pendingGear=null;
  G.player=null;
  G.over=false; G.paused=false; G.modal=null;
  closeOverlays();
  setupDepth();
  buildSlots();
  G.running=true;
  showScreen('game');
  resizeCanvas();
}
function startRun(){
  newRun();
}

/* ============================================================
   BOOT
   ============================================================ */
function bootCreation(){
  $('btn-forge').addEventListener('click',async()=>{
    const w=$('in-weapon').value.trim();
    const m=$('in-magic').value.trim();
    const p=$('in-who').value.trim();
    const btn=$('btn-forge');
    btn.disabled=true;
    btn.textContent='Forging…';
    $('create-err').textContent='';
    $('create-loading').innerHTML='<span>Reading what you wrote</span><span class="dots"></span>';
    let char=null;
    try{
      char=await generateCharacter(w,m,p);
    }catch(err){
      G.apiFailed=true;
      $('create-err').textContent='The forge would not answer. Descending with an older shape.';
      char=sanitizeCharacter(fallbackCharacter(w,m,p),w,m,p);
    }
    G.char=char;
    $('create-loading').textContent='';
    btn.disabled=false;
    btn.textContent='Forge Soul';
    renderOverview();
    showScreen('overview');
  });
  $('in-who').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) $('btn-forge').click();
  });
}
function boot(){
  if(IS_TOUCH) document.body.classList.add('touch');
  resizeCanvas();
  initParticles();
  initMotes();
  bootCreation();
  setupTouch();
  requestAnimationFrame(loop);
}
boot();
</script>
</body>
</html>
