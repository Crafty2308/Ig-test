/* Every HUD write goes through these, so an unchanged value costs nothing.
   updateHUD runs every frame and used to rewrite ~20 properties blind. */
const HUDC={};
function setStyle(id,prop,val){
  const k=id+'.'+prop;
  if(HUDC[k]===val) return;
  HUDC[k]=val;
  const el=$(id);
  if(el) el.style[prop]=val;
}
function setText(id,val){
  const k=id+'#';
  if(HUDC[k]===val) return;
  HUDC[k]=val;
  const el=$(id);
  if(el) el.textContent=val;
}
function resetHudCache(){ for(const k in HUDC) delete HUDC[k]; ELC=new WeakMap(); }
let ELC=new WeakMap();
function elCache(el){
  let c=ELC.get(el);
  if(!c){ c={}; ELC.set(el,c); }
  return c;
}
function setElStyle(el,prop,val){
  if(!el) return;
  const c=elCache(el);
  if(c[prop]===val) return;
  c[prop]=val;
  el.style[prop]=val;
}
function setElClass(el,cls,on){
  if(!el) return;
  const c=elCache(el);
  const k='.'+cls;
  if(c[k]===!!on) return;
  c[k]=!!on;
  el.classList.toggle(cls,!!on);
}
function updateHUD(){
  const ch=G.ch,p=G.player,st=G.st;
  if(!ch||!p||!st) return;
  const pc=v=>(Math.round(v*1000)/10)+'%';
  setStyle('life-fill','height',pc(clamp(p.life/st.maxLife,0,1)));
  setStyle('es-fill','height',pc(st.maxES?clamp(p.es/st.maxES,0,1)*0.22:0));
  setText('life-txt',Math.ceil(p.life)+(st.maxES?' +'+Math.ceil(p.es):''));
  setStyle('mana-fill','height',pc(st.maxMana?clamp(p.mana/st.maxMana,0,1):0));
  setText('mana-txt',st.maxMana?String(Math.ceil(p.mana)):'—');
  const need=xpForLevel(ch.level);
  setStyle('xp-fill','width',pc(clamp(ch.xp/need,0,1)));
  setText('xp-lb','Level '+ch.level+'  ·  '+Math.floor(ch.xp)+' / '+need);
  setText('zone-nm',G.zdef.name);
  setText('zone-lv',G.zdef.town?'sanctuary':('level '+G.zdef.level+'  ·  '+ch.kills+' slain'));
  setText('spirit-lb','SPIRIT '+st.spiritUsed+' / '+st.spiritMax);
  setStyle('spirit-fill','width',pc(st.spiritMax?clamp(st.spiritUsed/st.spiritMax,0,1):0));
  const sks=activeSkills();
  const slots=$('slots').children;
  for(let i=0;i<slots.length;i++){
    const sk=sks[i], el=slots[i];
    const cdEl=el.querySelector('.cd');
    if(!sk){ setElStyle(cdEl,'height','0%'); continue; }
    const max=Math.max(0.12,sk.cd);
    const f=clamp(p.cds[i]/max,0,1);
    setElStyle(cdEl,'height',(Math.round(f*1000)/10)+'%');
    setElClass(el,'ready',f<=0);
    const canPay = st.keys.blood_magic ? p.life>sk.mana : p.mana>=sk.mana;
    setElClass(el,'nomana',!canPay||!sk.usable);
  }
  if(IS_TOUCH){
    for(let i=0;i<5;i++){
      const b=$('tb'+i), sk=sks[i];
      if(!b) continue;
      const max=sk?Math.max(0.12,sk.cd):1;
      const f=sk?clamp(p.cds[i]/max,0,1):0;
      const deg=(f*360).toFixed(1);
      setElStyle(b.querySelector('.sweep'),'background',
        'conic-gradient(rgba(0,0,0,.7) 0deg, rgba(0,0,0,.7) '+deg+'deg, rgba(0,0,0,0) '+deg+'deg)');
      setElStyle(b,'borderColor',(sk&&f<=0)?'rgba(200,169,110,.5)':'rgba(200,169,110,.16)');
    }
  }
  const lf2=$('flask-life').children, mf=$('flask-mana').children;
  const needCharge=90+ch.level*14;
  const setFill=(el,v)=>setElStyle(el.querySelector('i'),'height',(Math.round(v*1000)/10)+'%');
  for(let i=0;i<lf2.length;i++){
    const full=i<p.flask.life;
    setFill(lf2[i],full?1:((i===p.flask.life)?clamp(p.flaskCharge.life/needCharge,0,1):0));
  }
  for(let i=0;i<mf.length;i++){
    const full=i<p.flask.mana;
    setFill(mf[i],full?1:((i===p.flask.mana)?clamp(p.flaskCharge.mana/needCharge,0,1):0));
  }
  updatePlayerAilHud();
  const b=G.boss;
  if(b&&b.awake&&!b.dead){
    setElClass($('bossbar'),'on',true);
    setStyle('boss-fill','width',(Math.round(clamp(b.hp/b.maxHp,0,1)*1000)/10)+'%');
    setText('boss-nm',b.name+'  ·  PHASE '+b.phase);
  } else setElClass($('bossbar'),'on',false);
}

/* ------------------------------------------------------------------ tooltip */
function modLines(it){
  const out=[];
  const b=BASES[it.b];
  if(!it.idf) return ['<div class="hint">Unidentified. Use a Scroll of Wisdom.</div>'];
  if(b.implicit) for(const k in b.implicit) out.push('<div class="imp">'+esc(statLine(k,b.implicit[k]))+'</div>');
  if(it.uq){
    const u=UNIQUES[it.uq];
    for(const k in u.mods) out.push('<div class="mod">'+esc(statLine(k,u.mods[k]))+'</div>');
    out.push('<div class="rune">'+esc(u.special)+'</div>');
  }
  for(const m of it.pre) out.push('<div class="mod">'+esc(statLine(m.stat,m.v))+' <span style="color:#5f5b53">T'+m.t+'</span></div>');
  for(const m of it.suf) out.push('<div class="mod">'+esc(statLine(m.stat,m.v))+' <span style="color:#5f5b53">T'+m.t+'</span></div>');
  it.runes.forEach((r,i)=>{
    if(r) out.push('<div class="rune">'+esc(RUNES[r].name)+': '+esc(RUNES[r].desc)+'</div>');
    else out.push('<div style="color:#5f5b53">Empty rune socket</div>');
  });
  return out;
}
function compareLines(it){
  /* green/red against whatever occupies the same slot right now */
  const b=BASES[it.b];
  const ch=G.ch;
  let cur=null;
  if(b.slot==='weapon') cur=ch.sets[ch.activeSet].weapon;
  else if(b.slot==='offhand') cur=ch.sets[ch.activeSet].offhand;
  else if(b.slot==='ring') cur=ch.equip.ring1;
  else cur=ch.equip[b.slot];
  if(!cur||cur===it||!it.idf) return '';
  const a=itemMods(it), c=itemMods(cur);
  const da=itemDefence(it), dc=itemDefence(cur);
  const keys=new Set(Object.keys(a).concat(Object.keys(c)));
  if(da.armour||dc.armour) keys.add('_armour');
  if(da.evasion||dc.evasion) keys.add('_evasion');
  if(da.es||dc.es) keys.add('_es');
  let html='<div class="cmp"><div style="color:#5f5b53;margin-bottom:3px">vs '+esc(itemName(cur))+'</div>';
  let rows=0;
  for(const k of keys){
    let av,cvv,label;
    if(k==='_armour'){ av=da.armour; cvv=dc.armour; label='base armour'; }
    else if(k==='_evasion'){ av=da.evasion; cvv=dc.evasion; label='base evasion'; }
    else if(k==='_es'){ av=da.es; cvv=dc.es; label='base energy shield'; }
    else { av=a[k]||0; cvv=c[k]||0; label=(STAT_FMT[k]||k).replace('#','').replace(/^\+/,'').trim(); }
    const diff=+(av-cvv).toFixed(1);
    if(!diff) continue;
    html+='<div class="'+(diff>0?'up':'dn')+'">'+(diff>0?'+':'')+diff+' '+esc(label)+'</div>';
    rows++;
  }
  html+= rows?'':'<div style="color:#5f5b53">no numeric difference</div>';
  return html+'</div>';
}
/* the one place a tooltip gets positioned; everything else builds HTML */
function showTipHtml(html,x,y){
  const el=$('tooltip');
  el.innerHTML=html;
  el.classList.add('on');
  const r=el.getBoundingClientRect();
  el.style.left=Math.min(window.innerWidth-r.width-10,Math.max(8,x+14))+'px';
  el.style.top=Math.min(window.innerHeight-r.height-10,Math.max(8,y+14))+'px';
}
function showTip(it,x,y,extra){
  if(isStack(it)){ showStackTip(it,x,y,extra); return; }
  const b=BASES[it.b];
  const lvl=itemLevelReq(it);
  let html='<div class="tnm" style="color:'+RARITY_COLOR[it.r]+'">'+esc(itemName(it))+'</div>';

    ' · item level '+it.il+(it.q?' · '+it.q+'% quality':'')+(it.cor?' · corrupted':'')+'</div>';
  if(b.slot==='weapon'&&it.idf){
    const w=weaponStats(it);
    html+='<div class="imp">'+w.lo+'–'+w.hi+' physical damage · '+w.crit+'% crit · '+w.aspd.toFixed(2)+' attacks/sec</div>';
  }
  const d=itemDefence(it);
  if(d.armour) html+='<div class="imp">'+d.armour+' armour</div>';
  if(d.evasion) html+='<div class="imp">'+d.evasion+' evasion</div>';
  if(d.es) html+='<div class="imp">'+d.es+' energy shield</div>';

  const ch=G.ch;
  let h='<div class="tnm" style="color:'+(n.type==='keystone'?'#e0c070':'#e3d6b8')+'">'+esc(n.name)+'</div>';
  h+='<div class="tb2">'+esc(n.type)+' passive</div>';
  const lines=[];
  for(const k in n.st){ if(k==='keystone') continue; lines.push(statLine(k,n.st[k])); }
  for(const l of lines) h+='<div class="mod">'+esc(l)+'</div>';
  if(n.st.keystone) h+='<div class="rune">'+esc(KEYSTONES[n.st.keystone].text)+'</div>';
  if(!lines.length&&!n.st.keystone) h+='<div class="mod">A class starting point: no stats of its own.</div>';
  if(isAllocated(n.id)){
    const m=ch.passives[n.id];
    h+='<div class="up">Allocated'+(m?' — weapon set '+(m===1?'I':'II')+' only':' for both weapon sets')+'</div>';
  } else if(isStartNode(n.id)) h+='<div class="up">Your starting point</div>';
  else if(canAllocate(n.id)) h+='<div class="up">Can allocate — click to take it</div>';
  else if(charPoints(ch)-pointsSpent(ch)<=0) h+='<div class="dn">No passive points remaining</div>';
  else h+='<div class="dn">Not connected to anything you have taken</div>';
  if(n.desc&&!n.st.keystone) h+='<div class="hint">'+esc(n.desc)+'</div>';
  return h;
}

/* ---------------------------------------------------------------- inventory */
function itemCellSize(){
  const w=Math.min(560,Math.max(240,window.innerWidth-64));
  return Math.floor(Math.min(42,w/INV_W));
}
/* Can the armed tool be used on this item at all? Used both for the hint
   line and for dimming every invalid target while a tool is armed. */
function toolApplies(it){
  if(!G.tool) return true;
  if(G.tool==='salvage') return !isStack(it);
  if(isStack(it)) return false;
  if(isRuneKey(G.tool)) return it.runes.length>0 && !it.cor;
  const c=CRAFT[G.tool];
  return c? !!c.can(it) : false;
}
function toolWhyNot(it){
  if(!G.tool) return '';
  if(G.tool==='salvage') return isStack(it)?'Currency cannot be salvaged.':'';
  if(isStack(it)) return 'Orbs cannot be used on currency.';
  if(isRuneKey(G.tool)){
    if(it.cor) return 'Corrupted items can no longer be modified.';
    if(!it.runes.length) return 'This base has no rune sockets.';
    return '';
  }
  const c=CRAFT[G.tool];
  if(!c) return '';
  if(c.can(it)) return '';
  if(it.cor) return 'Corrupted items can no longer be modified.';
  if(!it.idf) return 'Identify it first.';
  if(G.tool==='transmute'&&it.r!==0) return 'Only a normal item can be transmuted.';
  if(G.tool==='augment'&&it.r!==1) return 'Only a magic item can be augmented.';
  if(G.tool==='augment') return 'That magic item already has two modifiers.';
  if(G.tool==='regal'&&it.r!==1) return 'Only a magic item can be made rare.';
  if(G.tool==='exalted'&&it.r!==2) return 'Only a rare item can be exalted.';
  if(G.tool==='exalted') return 'That rare already has six modifiers.';
  if(G.tool==='chaos'&&it.r!==2) return 'Only a rare item can be chaos-orbed.';
  if(G.tool==='divine') return 'Only a magic or rare item has values to reroll.';
  if(G.tool==='wisdom') return 'It is already identified.';
  return 'It cannot be used on this item.';
}
function gridHint(it){
  if(G.tool){
    const why=toolWhyNot(it);
    if(why) return '<span style="color:#c07a70">'+esc(why)+'</span>';
    if(G.tool==='salvage') return 'Click to salvage: '+salvageValue(it)+' shards, '+salvageEssence(it)+' essence'+
      (it.runes.filter(Boolean).length?', runes recovered':'')+'.';
    if(isRuneKey(G.tool)) return 'Click to socket '+esc(RUNES[G.tool].name)+
      (it.runes.every(r=>r)?' (overwrites the first rune)':'')+'.';
    return 'Click to apply '+esc(curLabel(G.tool))+'.';
  }
  if(isStack(it)){
    if(it.cur==='uncut_skill') return 'Click to carve a skill gem.';
    if(it.cur==='uncut_support') return 'Click to carve a support gem.';
    if(it.cur==='shard'||it.cur==='essence') return 'Spent at the vendor, the mirror and the bench.';
    return 'Click to arm, then click the item to use it on. Right-click to drop.';
  }
  return 'Click to equip. Drag to move, or drag out of the bag to drop it. Right-click to drop.';
}
/* one tooltip entry point for stacks and gear alike */
function tipFor(it,x,y,extra){
  if(isStack(it)) showStackTip(it,x,y,extra);
  else showTip(it,x,y,extra);
}
function showStackTip(it,x,y,extra){
  let html='<div class="tnm" style="color:#c8a96e">'+esc(stackName(it))+'</div>';
  html+='<div class="tb2">currency  \u00b7  '+it.n+' / '+MAX_STACK+' in this stack  \u00b7  '+
    countCurrency(it.cur)+' held</div>';
  html+='<div class="mod">'+esc(curDesc(it.cur))+'</div>';
  if(G.tool===it.cur) html+='<div class="rune">Armed. Click an item to use it.</div>';
  if(extra) html+='<div class="hint">'+extra+'</div>';
  showTipHtml(html,x,y);
}
/* ==========================================================================
   DRAG CONTROLLER
   One controller owns every drag; item elements hold no drag state of their
   own. An item's pointerdown records intent and nothing more, and the move
   and up listeners live on WINDOW for exactly as long as the drag lasts.
   Pointer capture is requested as an optimisation and allowed to fail
   silently: correctness never depends on it. Depending on it is what used
   to strand an item on the cursor, because once the pointer left the item
   element neither of its own handlers fired again.
   ========================================================================== */
const DRAG_SLOP=6;          /* px of travel before a press becomes a drag */
let DRAG=null;              /* the one live drag, or null */

/* Grids register themselves as they render, so the drop resolver can find
   whichever one the pointer is over — including one in a different panel,
   which is what makes bag <-> stash transfers work. */
const GRIDS=[];
function registerGrid(g){
  for(let i=GRIDS.length-1;i>=0;i--)
    if(GRIDS[i].host===g.host||!GRIDS[i].host.isConnected) GRIDS.splice(i,1);
  GRIDS.push(g);
}
function gridFor(host){ for(const g of GRIDS) if(g.host===host) return g; return null; }
function inRect(r,cx,cy){ return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom; }
function gridUnder(cx,cy){
  for(const g of GRIDS){
    if(!g.host.isConnected) continue;
    if(inRect(g.host.getBoundingClientRect(),cx,cy)) return g;
  }
  return null;
}
function slotUnder(cx,cy){
  const els=document.querySelectorAll('[data-eq]');
  for(let i=0;i<els.length;i++){
    const el=els[i];
    if(el.offsetParent&&inRect(el.getBoundingClientRect(),cx,cy)) return el;
  }
  return null;
}
/* Where the item's top-left cell lands in this grid. Measured from the grab
   offset, not the cursor, so the item keeps the grip you picked it up by. */
function dragCell(g,cx,cy){
  const r=g.host.getBoundingClientRect();
  return {x:Math.round((cx-DRAG.ox-r.left)/g.cs), y:Math.round((cy-DRAG.oy-r.top)/g.cs)};
}
function ghostEl(){
  let el=$('dragghost');
  if(!el){ el=document.createElement('div'); el.id='dragghost'; document.body.appendChild(el); }
  return el;
}
function fitBoxEl(){
  let el=$('fitbox');
  if(!el){ el=document.createElement('div'); el.id='fitbox'; document.body.appendChild(el); }
  return el;
}
function hideFitBox(){ const f=$('fitbox'); if(f) f.className=''; }
/* Highlights the cells the footprint would occupy, green if it fits there
   and red if it does not. */
function showFitBox(g,x,y,iw,ih,ok){
  const r=g.host.getBoundingClientRect();
  const f=fitBoxEl();
  f.className='on '+(ok?'ok':'bad');
  f.style.left=(r.left+x*g.cs)+'px';
  f.style.top=(r.top+y*g.cs)+'px';
  f.style.width=(iw*g.cs)+'px';
  f.style.height=(ih*g.cs)+'px';
}
function dropZoneEl(){
  let el=$('dropzone');
  if(!el){
    el=document.createElement('div'); el.id='dropzone';
    el.textContent='Release here to drop on the ground';
    document.body.appendChild(el);
  }
  return el;
}
/* Can this item go in this particular slot? '' means yes. */
function equipWhyNot(it,slotKey){
  if(isStack(it)) return 'Currency cannot be equipped.';
  const ch=G.ch, b=BASES[it.b];
  const want = b.slot==='ring'? ['ring1','ring2'] : [b.slot];
  if(want.indexOf(slotKey)<0) return b.name+' does not go in that slot.';
  if(!it.idf) return 'Identify it first.';
  if(itemLevelReq(it)>ch.level) return 'Requires level '+itemLevelReq(it)+'.';
  if(slotKey==='offhand'&&twoHandEquipped()) return 'Both hands are on your weapon.';
  if(slotKey==='offhand'&&G.st&&G.st.keys&&G.st.keys.iron_grip) return 'Iron Grip leaves no hand for an offhand.';
  return '';
}
function canGroundDrop(list){
  return list===G.ch.inv || list===G.save.stash[G.stashTab||0];
}
function beginDrag(it,list,host,el,ev,onClick){
  const r=el.getBoundingClientRect();
  DRAG={it:it, list:list, host:host, el:el, onClick:onClick,
    ox:ev.clientX-r.left, oy:ev.clientY-r.top,
    sx:ev.clientX, sy:ev.clientY, pid:ev.pointerId,
    live:false, hl:[], slot:null, target:null, zone:false};
  window.addEventListener('pointermove',onDragMove,true);
  window.addEventListener('pointerup',onDragUp,true);
  window.addEventListener('pointercancel',onDragCancel,true);
  window.addEventListener('blur',onDragCancel);
}
function dragGoLive(){
  const d=DRAG;
  d.live=true;
  hideTip(); clearSlotHighlight();
  d.el.classList.add('dragging');
  const g=gridFor(d.host);
  const cs=g?g.cs:itemCellSize();
  const gh=ghostEl();
  gh.className=d.el.className.replace(/\bdragging\b/,'')+' on';
  gh.style.width=(itemW(d.it)*cs-2)+'px';
  gh.style.height=(itemH(d.it)*cs-2)+'px';
  gh.innerHTML=d.el.innerHTML;
  if(canGroundDrop(d.list)) dropZoneEl().classList.add('on');
}
function clearDragHl(){
  hideFitBox();
  ghostEl().classList.remove('fit','unfit');
  const d=DRAG;
  if(!d) return;
  for(const el of d.hl) el.classList.remove('target','nope');
  d.hl.length=0;
}
function onDragMove(ev){
  const d=DRAG;
  if(!d) return;
  if(d.pid!=null&&ev.pointerId!=null&&ev.pointerId!==d.pid) return;
  if(!d.live){
    if(Math.abs(ev.clientX-d.sx)<DRAG_SLOP&&Math.abs(ev.clientY-d.sy)<DRAG_SLOP) return;
    dragGoLive();
  }
  if(ev.cancelable) ev.preventDefault();
  const gh=ghostEl();
  gh.style.left=(ev.clientX-d.ox)+'px';
  gh.style.top=(ev.clientY-d.oy)+'px';
  clearDragHl();
  d.slot=null; d.target=null; d.zone=false;
  const zone=dropZoneEl();
  if(zone.classList.contains('on')&&inRect(zone.getBoundingClientRect(),ev.clientX,ev.clientY)){
    zone.classList.add('hot'); d.zone=true; return;
  }
  zone.classList.remove('hot');
  const slot=slotUnder(ev.clientX,ev.clientY);
  if(slot){
    d.slot=slot.dataset.eq;
    slot.classList.add(equipWhyNot(d.it,d.slot)?'nope':'target');
    d.hl.push(slot);
    return;
  }
  const g=gridUnder(ev.clientX,ev.clientY);
  if(!g) return;
  const c=dragCell(g,ev.clientX,ev.clientY);
  const ok=gridFits(g.list,d.it,c.x,c.y,g.w,g.h,g.list===d.list?d.it:null);
  d.target={g:g,x:c.x,y:c.y,ok:ok};
  const cx=clamp(c.x,0,g.w-itemW(d.it)), cy=clamp(c.y,0,g.h-itemH(d.it));
  showFitBox(g,cx,cy,itemW(d.it),itemH(d.it),ok);
  gh.classList.add(ok?'fit':'unfit');
}
function onDragUp(ev){
  const d=DRAG;
  if(!d) return;
  if(d.pid!=null&&ev.pointerId!=null&&ev.pointerId!==d.pid) return;
  finishDrag();
}
function onDragCancel(){ if(DRAG) endDrag(); }
/* Tears the drag down without resolving it: the item never moved, so there
   is nothing to put back. Safe to call from anywhere, any number of times. */
function endDrag(){
  const d=DRAG;
  DRAG=null;
  window.removeEventListener('pointermove',onDragMove,true);
  window.removeEventListener('pointerup',onDragUp,true);
  window.removeEventListener('pointercancel',onDragCancel,true);
  window.removeEventListener('blur',onDragCancel);
  if(d){
    for(const el of d.hl) el.classList.remove('target','nope');
    d.el.classList.remove('dragging');
    try{ d.el.releasePointerCapture(d.pid); }catch(err){}
  }
  hideFitBox();
  ghostEl().classList.remove('on','fit','unfit');
  const z=dropZoneEl();
  z.classList.remove('on','hot');
}
/* Every drop outcome is decided here and nowhere else. */
function finishDrag(){
  const d=DRAG;
  if(!d) return;
  const live=d.live, it=d.it, src=d.list, onClick=d.onClick;
  const zone=d.zone, slot=d.slot, target=d.target;
  endDrag();
  if(!live){ onClick&&onClick(it); return; }          /* a press, not a drag */
  if(zone){ dropItem(it,src); return; }               /* onto the ground */
  if(slot){                                            /* onto an equip slot */
    if(src!==G.ch.inv){ toast('Move it to your bag first.'); return; }
    const why=equipWhyNot(it,slot);
    if(why){ toast(why); return; }
    equipItem(it,slot);
    return;
  }
  if(!target) return;                                  /* nowhere: snaps back */
  if(!target.ok){ toast('It does not fit there.'); return; }
  if(target.g.list===src){                             /* within one grid */
    it.pos.x=target.x; it.pos.y=target.y;
    markDirty();
    /* one element moves; the cell layer and every other item are untouched */
    const el=target.g.els.get(it);
    if(el){ el.style.left=(it.pos.x*target.g.cs)+'px'; el.style.top=(it.pos.y*target.g.cs)+'px'; }
    else target.g.redraw();
    return;
  }
  transferItem(it,src,target.g,target.x,target.y);     /* bag <-> stash */
}
function transferItem(it,src,g,x,y){
  const i=src.indexOf(it);
  if(i<0) return;
  src.splice(i,1);
  it.pos={x:x,y:y};
  g.list.push(it);
  markDirty(); sfx('ui');
  for(const gg of GRIDS.slice()) if(gg.host.isConnected) gg.redraw();
}
function renderGrid(host,list,w,h,onClick,onDragEnd){
  const cs=itemCellSize();
  host.style.width=(cs*w)+'px';
  host.style.height=(cs*h)+'px';
  /* The empty cells never change unless the grid shape or the cell size does,
     so they live in their own layer that is built once and then left alone;
     only the item elements after it are replaced on a re-render. */
  const sig=w+'x'+h+'@'+cs;
  let cells=host.firstElementChild;
  if(!cells||cells.className!=='cells'||cells.__sig!==sig){
    host.innerHTML='';
    cells=document.createElement('div');
    cells.className='cells';
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const c=document.createElement('div');
      c.className='cell';
      c.style.left=(x*cs)+'px'; c.style.top=(y*cs)+'px';
      c.style.width=cs+'px'; c.style.height=cs+'px';
      cells.appendChild(c);
    }
    cells.__sig=sig;
    host.appendChild(cells);
  } else {
    while(host.lastElementChild&&host.lastElementChild!==cells) host.removeChild(host.lastElementChild);
  }
  const els=new Map();
  for(const it of list){
    const stack=isStack(it);
    const el=document.createElement('div');
    el.className='item '+(stack?'stack':'r'+it.r)+(!stack&&!it.idf?' unid':'')+
      (G.tool&&!toolApplies(it)?' dim':'')+(G.tool&&G.tool===it.cur?' armed':'');
    el.style.left=(it.pos.x*cs)+'px'; el.style.top=(it.pos.y*cs)+'px';
    el.style.width=(itemW(it)*cs-2)+'px'; el.style.height=(itemH(it)*cs-2)+'px';
    if(stack) el.innerHTML='<span class="ab">'+esc(curAbbr(it.cur))+'</span><span class="ct">'+it.n+'</span>';
    else el.textContent=it.idf?itemName(it):('? '+BASES[it.b].name);
    el.addEventListener('pointerenter',ev=>{
      if(DRAG) return;
      tipFor(it,ev.clientX,ev.clientY,gridHint(it));
      if(!stack) highlightSlotFor(it);
    });
    el.addEventListener('pointerleave',()=>{ if(DRAG) return; hideTip(); clearSlotHighlight(); });
    el.addEventListener('contextmenu',ev=>{ ev.preventDefault(); dropItem(it,list); });
    /* This is the whole of the item's involvement in a drag: record intent
       and hand off to the controller. No move or up handler lives here. */
    el.addEventListener('pointerdown',ev=>{
      if(ev.button===2||DRAG) return;
      if(ev.cancelable) ev.preventDefault();
      try{ el.setPointerCapture(ev.pointerId); }catch(err){}
      beginDrag(it,list,host,el,ev,onClick);
    });
    els.set(it,el);
    host.appendChild(el);
  }
  registerGrid({host:host,list:list,w:w,h:h,cs:cs,els:els,
    redraw:()=>renderGrid(host,list,w,h,onClick,onDragEnd)});
}
/* an item can always leave the bag: drag it out, or right-click it */
function dropItem(it,list){
  const ch=G.ch;
  const src=list||ch.inv;
  const i=src.indexOf(it);
  if(i<0) return;
  if(src!==ch.inv&&src!==G.save.stash[G.stashTab||0]){
    toast('Only the bag and the open stash tab can drop to the ground.'); return;
  }
  if(!G.player){ toast('Nowhere to drop it.'); return; }
  src.splice(i,1);
  if(G.player){
    if(isStack(it)) spawnGroundCurrency(it.cur,G.player.x+rnd(-30,30),G.player.y+rnd(-30,30),it.n);
    else spawnGroundItem(it,G.player.x+rnd(-30,30),G.player.y+rnd(-30,30));
  }
  toast('Dropped '+(isStack(it)?stackName(it)+' x'+it.n:itemName(it)));
  markDirty();
  renderInvBodies();
}
/* hovering a bag item lights up the slot it would go into */
function highlightSlotFor(it){
  clearSlotHighlight();
  if(isStack(it)||!it.idf) return;
  const b=BASES[it.b];
  let keys=[];
  if(b.slot==='ring') keys=['ring1','ring2'];
  else keys=[b.slot];
  for(const k of keys){
    const el=document.querySelector('[data-eq="'+k+'"]');
    if(el) el.classList.add('target');
  }
}
function clearSlotHighlight(){
  document.querySelectorAll('.eqslot.target').forEach(e=>e.classList.remove('target'));
}
/* forceSlot names the slot to use — set when the player dropped the item on
   a particular slot. Without it the slot is chosen the way a click does. */
function equipItem(it,forceSlot){
  if(isStack(it)){ toast('Currency cannot be equipped.'); return; }
  const ch=G.ch, b=BASES[it.b];
  if(itemLevelReq(it)>ch.level){ toast('Requires level '+itemLevelReq(it)+'.'); return; }
  if(!it.idf){ toast('Identify it first.'); return; }
  let slot=b.slot, target=null;
  if(forceSlot){
    if(equipWhyNot(it,forceSlot)){ toast(equipWhyNot(it,forceSlot)); return; }
    slot=forceSlot;
    target = (slot==='weapon')? ch.sets[ch.activeSet].weapon
           : (slot==='offhand')? ch.sets[ch.activeSet].offhand
           : ch.equip[slot];
  } else if(slot==='weapon'||slot==='offhand'){
    const s=ch.sets[ch.activeSet];
    if(slot==='weapon'&&s.weapon) target=s.weapon;
    if(slot==='offhand'&&s.offhand) target=s.offhand;
  } else if(slot==='ring'){
    slot = ch.equip.ring1? (ch.equip.ring2? 'ring1':'ring2') : 'ring1';
    target=ch.equip[slot];
  } else target=ch.equip[slot];
  /* two-handers clear the offhand */
  if(slot==='weapon'){
    const w=WEAPON_KINDS[b.kind];
    if(w&&w.hands===2&&ch.sets[ch.activeSet].offhand){
      const off=ch.sets[ch.activeSet].offhand;
      ch.sets[ch.activeSet].offhand=null;
      if(!addToInv(off)){ ch.sets[ch.activeSet].offhand=off; toast('No room to unequip the offhand.'); return; }
    }
  }
  if(slot==='offhand'){
    /* the reverse of the check above: a two-hander leaves no hand free */
    const w=ch.sets[ch.activeSet].weapon;
    const wk=w?WEAPON_KINDS[BASES[w.b].kind]:null;
    if(wk&&wk.hands===2){
      toast('Both hands are on the '+WEAPON_KINDS[BASES[w.b].kind].name.toLowerCase()+'.');
      return;
    }
  }
  const idx=ch.inv.indexOf(it);
  if(idx>=0) ch.inv.splice(idx,1);
  if(slot==='weapon') ch.sets[ch.activeSet].weapon=it;
  else if(slot==='offhand') ch.sets[ch.activeSet].offhand=it;
  else ch.equip[slot]=it;
  if(target){
    const spot=findSpot(ch.inv,target,INV_W,INV_H);
    if(spot){ target.pos={x:spot.x,y:spot.y}; ch.inv.push(target); }
    else { /* no room: put the new item back and abort */
      if(slot==='weapon') ch.sets[ch.activeSet].weapon=target;
      else if(slot==='offhand') ch.sets[ch.activeSet].offhand=target;
      else ch.equip[slot]=target;
      it.pos=it.pos||{x:0,y:0};
      ch.inv.push(it);
      toast('No room to swap that out.');
      recalc(); renderInvBodies();
      return;
    }
  }
  recalc(); buildSlotUI(); markDirty();
  sfx('ui');
  toast(target? 'Equipped '+itemName(it)+', removed '+itemName(target) : 'Equipped '+itemName(it));
  renderInvBodies();
}
function unequipSlot(slotKey){
  const ch=G.ch;
  let it=null;
  if(slotKey==='weapon') it=ch.sets[ch.activeSet].weapon;
  else if(slotKey==='offhand') it=ch.sets[ch.activeSet].offhand;
  else it=ch.equip[slotKey];
  if(!it) return;
  const spot=findSpot(ch.inv,it,INV_W,INV_H);
  if(!spot){ toast('Inventory is full.'); return; }
  it.pos={x:spot.x,y:spot.y};
  ch.inv.push(it);
  if(slotKey==='weapon') ch.sets[ch.activeSet].weapon=null;
  else if(slotKey==='offhand') ch.sets[ch.activeSet].offhand=null;
  else ch.equip[slotKey]=null;
  recalc(); buildSlotUI(); markDirty();
  renderInvBodies();
}
function applyTool(it){
  const ch=G.ch;
  if(G.tool==='salvage'){
    if(isStack(it)){ toast('Currency cannot be salvaged.'); return; }
    const v=salvageValue(it);
    const ess=salvageEssence(it);
    const recovered=it.runes.filter(r=>r);
    const idx=ch.inv.indexOf(it);
    if(idx<0) return;
    ch.inv.splice(idx,1);
    giveCurrency('shard',v);
    giveCurrency('essence',ess);
    for(const r of recovered) giveCurrency(r,1);
    sfx('craft');
    toast('Salvaged: '+v+' shards, '+ess+' essence'+(recovered.length?', '+recovered.length+' rune(s)':'')+'.');
    markDirty(); renderInvBodies();
    return;
  }
  if(RUNES[G.tool]){
    if(!it.runes.length){ toast('That base has no rune sockets.'); return; }
    if(it.cor){ toast('Corrupted items cannot be modified.'); return; }
    let slot=it.runes.indexOf(null);
    if(slot<0) slot=0;   /* overwrite the first rune, destroying it */
    const old=it.runes[slot];
    if(!takeCurrency(G.tool,1)) return;
    it.runes[slot]=G.tool;
    toast(old? RUNES[old].name+' was overwritten.' : RUNES[G.tool].name+' socketed.');
    recalc(); renderInvBodies();
    return;
  }
  const c=CRAFT[G.tool];
  if(!c) return;
  if(!c.can(it)){ toast(CURRENCY[G.tool].name+' cannot be used on that.'); return; }
  if(!takeCurrency(G.tool,1)) { toast('You have none left.'); return; }
  const msg=c.run(it);
  toast(msg);
  if(countCurrency(G.tool)<=0) G.tool=null;
  recalc(); renderInvBodies();
}
function clickInvItem(it){
  if(G.tool){
    if(!toolApplies(it)){ toast(toolWhyNot(it)); return; }
    applyTool(it);
    return;
  }
  if(isStack(it)){
    if(it.cur==='uncut_skill'){ openCarveMenu('skill'); return; }
    if(it.cur==='uncut_support'){ openCarveMenu('support'); return; }
    if(it.cur==='shard'||it.cur==='essence'){ toast(curDesc(it.cur)); return; }
    G.tool=it.cur;
    sfx('ui');
    renderInvBodies();
    return;
  }
  equipItem(it);
}
/* ------------------------------------------------------- paper-doll layout */
const EQ_LAYOUT=[
  ['weapon','Weapon'],['helmet','Helmet'],['amulet','Amulet'],['offhand','Offhand'],
  ['gloves','Gloves'],['body','Body'],['ring1','Ring'],['ring2','Ring'],
  ['belt','Belt'],['boots','Boots']
];
const EQ_LABEL={};
for(const [k,l] of EQ_LAYOUT) EQ_LABEL[k]=l;
function eqItemFor(key){
  const ch=G.ch;
  if(key==='weapon') return ch.sets[ch.activeSet].weapon;
  if(key==='offhand') return ch.sets[ch.activeSet].offhand;
  return ch.equip[key];
}
function twoHandEquipped(){
  const w=G.ch.sets[G.ch.activeSet].weapon;
  if(!w) return false;
  const k=WEAPON_KINDS[BASES[w.b].kind];
  return !!(k&&k.hands===2);
}
function eqSlotHtml(key,label){
  const it=eqItemFor(key);
  const blocked=(key==='offhand'&&twoHandEquipped());
  let cls='eqslot slot-'+key+(it?' filled r'+it.r:'')+(blocked?' blocked':'');

    ? '<div class="it" style="color:'+RARITY_COLOR[it.r]+'">'+esc(it.idf?itemName(it):'? '+BASES[it.b].name)+'</div>'
    : '<span class="lbl">'+esc(label)+'</span>';
  return '<div class="'+cls+'" data-eq="'+key+'">'+inner+(blocked?'<span class="x">two-handed</span>':'')+'</div>';
}
function renderInv(){
  const ch=G.ch;
  let html='<div class="ptitle">Inventory</div>';
  html+='<div class="pnote">Click to equip. Drag to rearrange, onto a slot to equip it there, '+
    'or onto the bar at the bottom of the screen to drop it. Right-click also drops.<br>'+
    '<span style="color:#5f5b53">'+esc(ch.name)+' \u00b7 level '+ch.level+' '+esc(CLASSES[ch.cls].name)+'</span></div>';

  html+='<div class="sect">Equipped</div>';
  html+='<div class="paperdoll">';

        '<button class="tab'+(ch.activeSet===1?' on':'')+'" data-set="1">Set II</button></div>';

  html+='<div class="sect">Bag</div>';

      } else if(it) unequipSlot(key);
    });

    }

  $('salv-btn').addEventListener('click',()=>{

function renderInvBodies(){
  const ch=G.ch;
  if(G.panel!=='inv'&&G.panel!=='npc') return;
  const grid=$('invgrid');
  if(grid) renderGrid(grid,ch.inv,INV_W,INV_H,clickInvItem);
  const salv=$('salv-btn');
  if(salv) salv.classList.toggle('on',G.tool==='salvage');
  const dis=$('disarm-btn');
  if(dis) dis.style.display=G.tool?'inline-block':'none';
  const hint=$('invhint');
  if(hint){
    hint.innerHTML = G.tool
      ? (G.tool==='salvage'
          ? 'Salvage armed. Click gear to break it down for shards, essence and its runes. Dimmed items cannot be salvaged.'
          : '<b style="color:#c8a96e">'+esc(curLabel(G.tool))+'</b> armed. Click a valid item; dimmed items cannot take it. Escape or right-click to disarm.')
      : 'Currency sits in the bag as stacks. Click a stack to arm it, then click the item to use it on.';
  }
  const stats=$('inv-stats');

    stats.innerHTML=
      kv('Life',Math.round(st.maxLife))+kv('Mana',Math.round(st.maxMana))+
      (st.maxES?kv('Energy shield',Math.round(st.maxES)):'')+
      kv('Armour',st.armour)+kv('Evasion',st.evasion)+
      kv('Spirit',st.spiritUsed+' / '+st.spiritMax)+
      kv('Shards',countCurrency('shard'))+kv('Essence',countCurrency('essence'));

/* Rewrites each paper-doll slot in place. Equipping used to leave the doll
   showing the previous item until the whole panel was rebuilt. */
function refreshEqSlots(){
  const eq=$('inv-body');
  if(!eq||G.panel!=='inv') return;
  eq.querySelectorAll('[data-eq]').forEach(el=>{
    const key=el.dataset.eq;
    const it=eqItemFor(key);
    const label=(EQ_LABEL[key]||key);
    const blocked=(key==='offhand'&&twoHandEquipped());
    el.className='eqslot slot-'+key+(it?' filled r'+it.r:'')+(blocked?' blocked':'')+
      (G.tool&&it&&!toolApplies(it)?' dim':'');
    el.innerHTML=(it
      ? '<div class="it" style="color:'+RARITY_COLOR[it.r]+'">'+esc(it.idf?itemName(it):'? '+BASES[it.b].name)+'</div>'
      : '<span class="lbl">'+esc(label)+'</span>')+(blocked?'<span class="x">two-handed</span>':'');
  });
}
function kv(k,v){ return '<div class="kv"><span>'+esc(k)+'</span><span>'+esc(v)+'</span></div>'; }

/* ------------------------------------------------------------ skills panel */
function ownsGem(gemKey){ return G.ch.gems.some(g=>g.gem===gemKey); }
function carveSkill(gemKey){
  const ch=G.ch;
  if(!takeCurrency('uncut_skill',1)) { toast('You have no uncut skill gems.'); return; }
  ch.gems.push({gem:gemKey,level:1,sockets:[null,null,null,null,null],link:null});
  invalidateSkills();
  toast('Carved '+GEMS[gemKey].name+'.');
  markDirty(); renderSkills();
}
function carveSupport(supKey){
  const ch=G.ch;
  if(!takeCurrency('uncut_support',1)){ toast('You have no uncut support gems.'); return; }
  ch.supports.push(supKey);
  toast('Carved '+SUPPORTS[supKey].name+'.');
  markDirty(); renderSkills();
}
function bindSkill(gemIdx,slot){
  const ch=G.ch;
  const lo=ch.loadout[ch.activeSet];
  for(let i=0;i<5;i++) if(lo[i]===gemIdx) lo[i]=null;
  lo[slot]=gemIdx;
  invalidateSkills();
  markDirty(); buildSlotUI(); renderSkills();
}
function unbindSlot(slot){
  G.ch.loadout[G.ch.activeSet][slot]=null;
  invalidateSkills();
  markDirty(); buildSlotUI(); renderSkills();
}
function socketSupport(gemIdx,sockIdx,supKey){
  const ch=G.ch;
  if(supKey){
    const gem=GEMS[ch.gems[gemIdx].gem];
    const allow=SUPPORTS[supKey].allow;
    if(allow!=='any'&&gem.tags.indexOf(allow)<0){
      toast(SUPPORTS[supKey].name+' only supports '+allow+' skills.');
      return;
    }
    const used=supportUsedBy(ch,supKey);
    if(used>=0&&used!==gemIdx){
      /* uniqueness holds, but taking it is one click: pull it out of the other skill */
      const from=ch.gems[used];
      from.sockets[from.sockets.indexOf(supKey)]=null;
      toast(SUPPORTS[supKey].name+' moved from '+GEMS[from.gem].name+'.');
    }
  }
  ch.gems[gemIdx].sockets[sockIdx]=supKey;
  markDirty(); recalc(); buildSlotUI(); renderSkills();
}
function gemLevelCap(def){ return Math.max(1,Math.min(20,G.ch.level-(def.lvlReq-1))); }
function gemUpCost(level){ return 1+Math.floor(level/4); }
function raiseGem(idx){
  const ch=G.ch, g=ch.gems[idx], def=GEMS[g.gem];
  const cap=gemLevelCap(def);
  if(g.level>=cap){ toast(def.name+' is capped at gem level '+cap+' until you level up.'); return; }
  const cost=gemUpCost(g.level);
  if(countCurrency('uncut_skill')<cost){
    toast('Raising '+def.name+' costs '+cost+' uncut skill gems. You have '+countCurrency('uncut_skill')+'.');
    return;
  }
  takeCurrency('uncut_skill',cost);
  g.level++;
  recalc(); buildSlotUI(); markDirty(); sfx('craft');
  toast(def.name+' is now gem level '+g.level+'.');
  renderSkills();
}
/* the carve menus, reachable from the skills panel and from an uncut stack */

function gemIsNew(key){

function markGemsSeen(){

function gemSummary(d){
  const bits=[d.type.replace('_',' ')];
  if(d.mana) bits.push(d.mana+' mana');
  if(d.cd) bits.push(d.cd.toFixed(2)+'s base');
  if(d.dmgMult) bits.push(Math.round(d.dmgMult*100)+'% weapon damage');
  if(d.base) bits.push(d.base+' base '+d.dtype+' damage');
  if(d.spirit) bits.push(d.spirit+' spirit reserved');
  if(d.wep) bits.push('needs '+d.wep.join('/'));
  return bits.join('  ·  ');
}
function skillSummary(sk){
  const bits=[];
  bits.push(Math.round(sk.dmg)+' '+sk.dtype);
  if(sk.addFire>0) bits.push('+'+Math.round(sk.addFire)+' fire');
  if(sk.addCold>0) bits.push('+'+Math.round(sk.addCold)+' cold');
  if(sk.addLight>0) bits.push('+'+Math.round(sk.addLight)+' lightning');
  if(sk.count>1) bits.push('x'+sk.count);
  if(sk.mana) bits.push(sk.mana+' mana');
  if(sk.cd) bits.push(sk.cd.toFixed(2)+'s');
  if(sk.radius) bits.push(Math.round(sk.radius)+' radius');
  if(sk.chains) bits.push(sk.chains+' chains');
  if(sk.pierce) bits.push('pierces '+sk.pierce);
  if(sk.crit>0) bits.push(sk.crit.toFixed(1)+'% crit');
  return bits.join('  ·  ');
}
function openSocketPicker(gemIdx,sockIdx){
  const ch=G.ch;
  const gem=GEMS[ch.gems[gemIdx].gem];
  let html='<div class="ptitle">Support socket</div>';
  html+='<div class="pnote">'+esc(gem.name)+' \u00b7 socket '+(sockIdx+1)+
    '<br>A support gem lives in one skill at a time. Taking one moves it.</div>';
  html+='<button class="pick" data-set-sup=""><div class="nm">Empty the socket</div></button>';
  if(!ch.supports.length) html+='<div class="pnote" style="text-align:left">You own no support gems yet.</div>';
  for(const k of ch.supports){
    const sp=SUPPORTS[k];
    const used=supportUsedBy(ch,k);
    const wrongTag=sp.allow!=='any'&&gem.tags.indexOf(sp.allow)<0;
    const busy=used>=0&&used!==gemIdx;

}

/* ============================================================== passive tree */
const treecv=$('treecv'), treectx=treecv.getContext('2d');
function isAllocated(id){ return G.ch.passives[id]!=null; }
function isStartNode(id){ return id==='start_'+CLASSES[G.ch.cls].start; }
function canAllocate(id){
  const ch=G.ch;
  if(isAllocated(id)) return false;
  if(pointsSpent(ch)>=charPoints(ch)) return false;
  const n=TREE.nodes[id];
  if(!n||n.type==='start') return false;
  for(const a of n.adj){
    if(isAllocated(a)) return true;
    if(isStartNode(a)) return true;
  }
  return false;
}
/* Allocation without the UI side effects: used by the mirror's refund maths
   and by anything that needs to walk a route. */
function allocateSilent(id){
  if(!canAllocate(id)) return false;
  G.ch.passives[id]=G.tree.set;
  return true;
}
function allocate(id){
  const ch=G.ch;
  if(!canAllocate(id)){
    if(pointsSpent(ch)>=charPoints(ch)) toast('No passive points remaining.');
    else toast('That node is not connected to anything you have taken.');
    return;
  }
  ch.passives[id]=G.tree.set;   /* 0 = both sets, 1 = set I, 2 = set II */
  recalc(); buildSlotUI(); markDirty(); updatePointBadge(); treeDirty();
  const n=TREE.nodes[id];
  toast('Allocated '+n.name+(G.tree.set?' ('+(G.tree.set===1?'set I':'set II')+' only)':''));
  renderTreeUI();
}
function respecAll(){
  const ch=G.ch;
  const n=pointsSpent(ch);
  if(!n){ toast('Nothing to refund.'); return; }
  const cost=n*RESPEC_COST;
  if(countCurrency('shard')<cost){ toast('A full respec costs '+cost+' shards. You have '+countCurrency('shard')+'.'); return; }
  takeCurrency('shard',cost);
  ch.passives={};
  recalc(); buildSlotUI(); markDirty(); updatePointBadge(); treeDirty();
  toast('Refunded '+n+' passive points for '+cost+' shards.');
  renderTreeUI();
}
function renderTreeUI(){
  const ch=G.ch;
  const left=charPoints(ch)-pointsSpent(ch);
  $('tree-pts').textContent=left+' / '+charPoints(ch)+' POINTS';
  $('tree-set').textContent=G.tree.set===0?'BOTH SETS':(G.tree.set===1?'SET I ONLY':'SET II ONLY');
  const fb=$('tree-filter');
  if(fb) fb.classList.toggle('on',!!G.tree.filterSet);
  const info=$('treeinfo');
  const sel=G.tree.sel&&TREE.nodes[G.tree.sel];
  if(sel){
    let html='<div class="nm">'+esc(sel.name)+' <span class="tag">'+sel.type+'</span></div>';
    const lines=[];
    for(const k in sel.st){
      if(k==='keystone') continue;
      lines.push(statLine(k,sel.st[k]));
    }
    if(lines.length) html+='<div class="st">'+esc(lines.join('  ·  '))+'</div>';
    if(sel.st.keystone) html+='<div class="st" style="color:#e0c070">'+esc(KEYSTONES[sel.st.keystone].text)+'</div>';
    if(!lines.length&&!sel.st.keystone) html+='<div class="st">Class starting point.</div>';
    if(isAllocated(sel.id)){
      const m=ch.passives[sel.id];
      html+='<div class="st" style="color:#8fd08a">Allocated'+(m?' — weapon set '+(m===1?'I':'II')+' only':' for both weapon sets')+'.</div>';
    } else if(canAllocate(sel.id)) html+='<div class="st" style="color:#8fd08a">Tap again to allocate.</div>';
    else html+='<div class="st" style="color:#b4685f">Not connected to anything you have taken.</div>';
    if(sel.desc&&!sel.st.keystone) html+='<div class="ds">'+esc(sel.desc)+'</div>';
    info.innerHTML=html;
    info.classList.add('on');
  } else info.classList.remove('on');
}
function treeToScreen(n){
  const t=G.tree;
  return {x:G.view.w/2+(n.x+t.x)*t.z, y:G.view.h/2+(n.y+t.y)*t.z};
}
function screenToTree(sx,sy){
  const t=G.tree;
  return {x:(sx-G.view.w/2)/t.z-t.x, y:(sy-G.view.h/2)/t.z-t.y};
}
function nodeAtScreen(sx,sy){
  const p=screenToTree(sx,sy);
  /* the nine buckets around the pointer, not all 606 nodes */
  const cx=Math.floor(p.x/TREE.cell), cy=Math.floor(p.y/TREE.cell);
  let best=null,bd=1e9;
  for(let oy=-1;oy<=1;oy++) for(let ox=-1;ox<=1;ox++){
    const arr=TREE.grid.get((cy+oy)*100000+(cx+ox));
    if(!arr) continue;
    for(const n of arr){
      const d=d2(p.x,p.y,n.x,n.y);
      if(d<bd){bd=d;best=n;}
    }
  }
  const rr=(best&&best.type==='keystone')?30:best&&best.type==='notable'?22:16;
  return bd<=(rr+10)*(rr+10)?best:null;
}
function treeDirty(){ G.tree.dirty=true; }
function renderTree(){
  const dpr=G.view.dpr,w=G.view.w,h=G.view.h,t=G.tree;
  if(!t.dirty) return;      /* only redraw when something actually changed */
  t.dirty=false;
  treectx.setTransform(dpr,0,0,dpr,0,0);
  treectx.fillStyle='#06060a';
  treectx.fillRect(0,0,w,h);
  const ch=G.ch;
  const search=t.search.toLowerCase();
  /* links first */
  treectx.lineWidth=Math.max(1,2*t.z);
  for(const pair of TREE.links){
    const a=treeToScreen(pair[0]), b=treeToScreen(pair[1]);
    if((a.x<-40&&b.x<-40)||(a.y<-40&&b.y<-40)||(a.x>w+40&&b.x>w+40)||(a.y>h+40&&b.y>h+40)) continue;
    const both=(isAllocated(pair[0].id)||isStartNode(pair[0].id))&&
               (isAllocated(pair[1].id)||isStartNode(pair[1].id));
    treectx.strokeStyle=both?'rgba(200,169,110,.55)':'rgba(255,255,255,.07)';
    treectx.beginPath(); treectx.moveTo(a.x,a.y); treectx.lineTo(b.x,b.y); treectx.stroke();
  }
  for(const n of TREE.list){
    const s=treeToScreen(n);
    if(s.x<-60||s.y<-60||s.x>w+60||s.y>h+60) continue;
    const alloc=isAllocated(n.id), start=n.type==='start';
    /* an allocation that belongs to the other weapon set is dimmed, or
       hidden entirely when the filter is on */
    const setTag=alloc?ch.passives[n.id]:0;
    const otherSet=alloc&&setTag&&setTag!==(ch.activeSet+1);
    if(otherSet&&t.filterSet) continue;
    const mine=start&&isStartNode(n.id);
    let r = n.type==='keystone'?15:n.type==='notable'?11:n.type==='travel'?5:7;
    if(start) r=17;
    r*=t.z;
    const match=search&&(n.name.toLowerCase().indexOf(search)>=0||
      Object.keys(n.st).some(k=>(STAT_FMT[k]||k).toLowerCase().indexOf(search)>=0));
    if(match){
      treectx.globalAlpha=.9;
      treectx.drawImage(glowSprite('#8fd08a'),s.x-r*3,s.y-r*3,r*6,r*6);
      treectx.globalAlpha=1;
    }
    if(otherSet) treectx.globalAlpha=0.42;
    if(alloc||mine){
      treectx.globalAlpha=(otherSet?0.35:0.8);
      treectx.drawImage(glowSprite(n.type==='keystone'?'#e0c070':'#c8a96e'),s.x-r*2.6,s.y-r*2.6,r*5.2,r*5.2);
      treectx.globalAlpha=1;
    }
    treectx.beginPath();
    if(n.type==='keystone'){
      treectx.save(); treectx.translate(s.x,s.y); treectx.rotate(Math.PI/4);
      treectx.rect(-r,-r,r*2,r*2); treectx.restore();
    } else treectx.arc(s.x,s.y,r,0,TAU);
    treectx.fillStyle = alloc? (n.type==='keystone'?'#e0c070':'#c8a96e')
      : mine? '#d8c69c'
      : canAllocate(n.id)? 'rgba(200,169,110,.3)' : 'rgba(255,255,255,.13)';
    treectx.fill();
    treectx.strokeStyle = G.tree.sel===n.id? '#ffffff'
      : alloc? (otherSet?'rgba(255,255,255,.22)':'rgba(255,255,255,.5)') : 'rgba(255,255,255,.14)';
    treectx.lineWidth=G.tree.sel===n.id?2.4:1.2;
    treectx.stroke();
    treectx.globalAlpha=1;
    /* set-specific allocations get a marker */
    if(alloc&&ch.passives[n.id]){
      treectx.fillStyle='#06060a';
      treectx.font=Math.max(7,7*t.z)+'px Cinzel, serif';
      treectx.textAlign='center'; treectx.textBaseline='middle';
      treectx.fillText(ch.passives[n.id]===1?'I':'II',s.x,s.y+0.5);
    }
    /* labels are the main source of clutter: keystones and starts always,
       notables once zoomed in, anything else only when searched or selected */
    const label = n.type==='keystone'||n.type==='start'||match||G.tree.sel===n.id
      ||(n.type==='notable'&&t.z>0.85)||(n.type==='minor'&&t.z>1.5);
    if(label){
      treectx.fillStyle=alloc?'rgba(232,223,201,.9)':'rgba(180,175,165,.5)';
      treectx.font=Math.max(8,9*t.z)+'px Cinzel, serif';
      treectx.textAlign='center'; treectx.textBaseline='top';
      treectx.fillText(n.name,s.x,s.y+r+3);
    }
  }
  treectx.textBaseline='alphabetic';
}

/* ------------------------------------------------------------- map overlay */
const mapcv=$('mapcv'), mapctx=mapcv.getContext('2d');
function renderMapOverlay(){
  const dpr=G.view.dpr,w=G.view.w,h=G.view.h;
  mapctx.setTransform(dpr,0,0,dpr,0,0);
  mapctx.fillStyle='rgba(4,4,6,.98)';
  mapctx.fillRect(0,0,w,h);
  const pad=54;
  const s=Math.min((w-pad*2)/(GRID*TILE),(h-pad*2)/(GRID*TILE));
  const ox=(w-GRID*TILE*s)/2, oy=(h-GRID*TILE*s)/2;
  const cell=Math.max(1,TILE*s);
  for(let ty=0;ty<GRID;ty++) for(let tx=0;tx<GRID;tx++){
    const i=NAV(tx,ty);
    if(G.nav[i]!==1) continue;
    const seen=G.explored[i];
    mapctx.fillStyle=seen?rgba(G.theme.rim,.3):rgba(G.theme.rim,.09);
    mapctx.fillRect(ox+tx*TILE*s,oy+ty*TILE*s,cell,cell);
  }
  const dot=(x,y,c,r)=>{
    mapctx.fillStyle=c;
    mapctx.beginPath(); mapctx.arc(ox+x*s,oy+y*s,r,0,TAU); mapctx.fill();
  };
  for(const n of G.npcs) dot(n.x,n.y,'#d8c69c',5);
  for(const pt of G.portals) dot(pt.x,pt.y,pt.locked?'#8a6a5a':'#8fc0e0',6);
  for(const e of G.enemies){ if(!e.dead&&!e.dying&&e.rarity>0) dot(e.x,e.y,e.rarity===2?'#c87838':'#6a8fc8',4); }
  if(G.boss&&!G.boss.dead) dot(G.boss.x,G.boss.y,'#d63c2e',8);
  dot(G.player.x,G.player.y,'#ffffff',5);
  mapctx.fillStyle='rgba(200,169,110,.9)';
  mapctx.font='16px Cinzel, serif';
  mapctx.textAlign='center';
  mapctx.fillText(G.zdef.name.toUpperCase()+(G.zdef.town?'':'  ·  LEVEL '+G.zdef.level),w/2,34);
  mapctx.fillStyle='rgba(138,133,121,.9)';
  mapctx.font='13px Crimson Pro, serif';
  const legend=G.boss&&!G.boss.dead?'red — zone master · blue — gateway · gold — townsfolk':'blue — gateway';
  mapctx.fillText(legend,w/2,h-24);
}

/* ----------------------------------------------------- the crafting bench */
function benchOutcome(key,it){
  const why=(function(){ const t=G.tool; G.tool=key; const w=toolWhyNot(it); G.tool=t; return w; })();
  if(why) return {ok:false,text:why};
  const map={
    wisdom:'Reveals the item\u2019s modifiers.',
    transmute:'Normal to magic, adding one modifier.',
    augment:'Adds a second modifier to this magic item.',
    regal:'Magic to rare, keeping both modifiers and adding a third.',
    exalted:'Adds one more modifier ('+(it.pre.length+it.suf.length)+' of 6 used).',
    chaos:'Removes one modifier at random and adds a different one.',
    divine:'Rerolls the numbers on every modifier, within their existing ranges.',
    vaal:'Corrupts it: the result is unpredictable and it can never be changed again.'
  };
  if(isRuneKey(key)){
    const free=it.runes.indexOf(null);
    return {ok:true,text: free>=0? 'Socket '+RUNES[key].name+' ('+RUNES[key].desc+').'
      : 'Overwrites the rune in the first socket, destroying it.'};
  }

function imprintMod(it,modId){
  if(countCurrency('essence')<IMPRINT_COST){ toast('Not enough essence.'); return; }
  const def=PREFIXES.find(d=>d.id===modId)||SUFFIXES.find(d=>d.id===modId);
  if(!def) return;
  const m=rollTier(def,it.il);
  if(!m){ toast('That modifier cannot roll on this item.'); return; }
  takeCurrency('essence',IMPRINT_COST);
  (PREFIXES.some(d=>d.id===modId)?it.pre:it.suf).push(m);
  recalc(); markDirty(); sfx('craft');
  toast('Imprinted: '+statLine(m.stat,m.v));
}

/* --------------------------------------------------------------- the mirror */
function isLeafNode(id){
  /* refundable only if nothing else you have taken depends on it */
  const ch=G.ch;
  for(const other in ch.passives){
    if(other===id) continue;
    if(TREE.nodes[other].adj.indexOf(id)<0) continue;
    /* does `other` still connect to the start without going through id? */
    if(!connectsWithout(other,id)) return false;
  }
  return true;
}
function connectsWithout(fromId,banId){
  const ch=G.ch;
  const seen={}; const q=[fromId];
  seen[fromId]=1;
  while(q.length){
    const cur=q.pop();
    if(isStartNode(cur)) return true;
    for(const a of TREE.nodes[cur].adj){
      if(a===banId||seen[a]) continue;
      if(isStartNode(a)) return true;
      if(ch.passives[a]==null) continue;
      seen[a]=1; q.push(a);
    }
  }
  return false;
}
function refundNode(id){
  const ch=G.ch;
  if(ch.passives[id]==null) return;
  if(!isLeafNode(id)){ toast('Other passives depend on that one. Refund those first.'); return; }
  if(countCurrency('shard')<RESPEC_COST){ toast('One refund costs '+RESPEC_COST+' shards.'); return; }
  takeCurrency('shard',RESPEC_COST);
  delete ch.passives[id];
  recalc(); buildSlotUI(); markDirty(); updatePointBadge(); treeDirty(); sfx('craft');
  toast('Refunded '+TREE.nodes[id].name+'.');
  renderMirror(G.npcOpen);
}

/* ------------------------------------------------------------- migration
   A save written by an earlier version is brought forward here rather than
   discarded. v1 kept currency as a counter object; v2 keeps it as stacks in
   the bag, adds the hideout, per-zone clears and per-gem levels. */
function migrateCharacter(ch){
  ch.passives=ch.passives||{};
  ch.gems=ch.gems||[]; ch.supports=ch.supports||[];
  ch.auras=ch.auras||{};
  ch.inv=ch.inv||[];
  ch.waypoints=ch.waypoints||['town'];
  ch.flasks=ch.flasks||{life:3,mana:3};
  ch.zonesCleared=ch.zonesCleared||{};
  ch.seenGems=ch.seenGems||[];
  /* The passive tree was rebuilt from six radial spokes into a 600-node web,
     so no saved allocation points at a node that still exists. Refund the lot
     rather than silently dropping the stats: the points come back, and the
     player re-spends them on the new tree. */
  let staleTree=false;
  for(const id in ch.passives){ if(!TREE.nodes[id]){ staleTree=true; break; } }
  if(staleTree){
    ch.passives={};
    ch.treeRefunded=true;
  }
  if(!ch.loadout) ch.loadout=[[null,null,null,null,null],[null,null,null,null,null]];
  if(!ch.sets) ch.sets=[{weapon:null,offhand:null},{weapon:null,offhand:null}];
  if(ch.waypoints.indexOf('hideout')<0) ch.waypoints.unshift('hideout');
  if(!ch.returnZone) ch.returnZone=(ch.zone&&ch.zone!=='hideout')?ch.zone:'town';
  /* gems gained their own level in v2 */
  for(const g of ch.gems){
    if(g.level==null) g.level=Math.max(1,Math.min(20,(ch.level||1)-((GEMS[g.gem]?GEMS[g.gem].lvlReq:1)-1)));
    if(!g.sockets) g.sockets=[null,null,null,null,null];
    if(g.link===undefined) g.link=null;
  }
  /* every item needs a grid position and a uid */
  for(const it of ch.inv){
    if(!it.pos) it.pos={x:0,y:0};
    if(!it.uid) it.uid=newUid();
  }
  /* v1 currency counters become stacks in the bag */
  if(ch.currency&&!ch.currencyMigrated){
    const prev=G.ch; G.ch=ch;
    const counts=ch.currency;
    ch.currency=null;
    for(const k in counts){
      const n=counts[k]|0;
      if(n>0&&(CURRENCY[k]||RUNES[k])) giveCurrency(k,n);
    }
    ch.currencyMigrated=true;
    G.ch=prev;
  }
  return ch;
}
function startCharacter(slot){
  G.slot=slot;
  G.ch=G.save.chars[slot];
  const ch=migrateCharacter(G.ch);
  G.save.v=SAVE_VERSION;
  /* the tree view is per-character: recentre it on this class's own start
     rather than wherever the last character left the camera */
  G.tree.x=0; G.tree.y=0; G.tree.z=0.62; G.tree.drag=false;
  G.tree.sel=null; G.tree.set=0; G.tree.search='';
  G.tree.filterSet=null; G.tree.centred=false; G.tree.dirty=true;
  invalidateSkills();
  G.player=null;
  G.kills=0;
  G.running=true;
  G.benchItem=null;
  showScreen('game');
  resizeCanvas();
  resetPlayerAilHud();
  resetHudCache();
  enterZone(ch.zone&&ZONES[ch.zone]?ch.zone:'town');
  closePanel();
  toast('Welcome back, '+ch.name+'.');
  if(ch.treeRefunded){
    ch.treeRefunded=false;
    markDirty();
    setTimeout(()=>toast('The passive tree has been rebuilt. All your points were refunded.'),2600);
  }
}

window.addEventListener('keydown',e=>{
  sndResume();
  const k=e.key.toLowerCase();
  if(G.screen!=='game'){
    if(k==='enter'&&G.screen==='class'&&!$('btn-create').disabled) $('btn-create').click();
    return;
  }
  if(k==='tab'){ e.preventDefault(); togglePanel('map'); return; }

    if(G.tool&&(G.panel==='inv'||G.panel==='npc')){ G.tool=null; renderInvBodies(); return; }
    if(G.panel&&G.panel!=='death') closePanel();
    else if(!G.panel) openPanel('menu');

  }
  if(G.keys[k]) return;
  G.keys[k]=true;
  if(k==='i'){ togglePanel('inv'); return; }
  if(k==='p'){ togglePanel('tree'); return; }
  if(k==='h'){ goHideout(); return; }
  if(k==='c'){ togglePanel('sheet'); return; }
  if(G.panel) return;
  if(k==='x'){ swapSet(); return; }
  if(k==='f'){ interact(); return; }
  if(k==='1'){ useFlask('life'); return; }
  if(k==='2'){ useFlask('mana'); return; }
  if(k==='q') useSkill(1,false);
  if(k==='e') useSkill(2,false);
  if(k==='r') useSkill(3,false);
  if(k===' '){ e.preventDefault(); useSkill(4,false); }
});
window.addEventListener('keyup',e=>{ G.keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur',()=>{ G.keys=Object.create(null); G.mouse.left=false; G.mouse.right=false; });
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  G.mouse.sx=e.clientX-r.left; G.mouse.sy=e.clientY-r.top;
  const w=screenToWorld(G.mouse.sx,G.mouse.sy);
  G.mouse.wx=w.x; G.mouse.wy=w.y;
});
cv.addEventListener('mousedown',e=>{
  sndResume();
  const r=cv.getBoundingClientRect();
  G.mouse.sx=e.clientX-r.left; G.mouse.sy=e.clientY-r.top;
  const w=screenToWorld(G.mouse.sx,G.mouse.sy);
  G.mouse.wx=w.x; G.mouse.wy=w.y;
  if(e.button===0){ G.mouse.left=true; useSkill(0,false); }      /* attack only */
  if(e.button===2){ e.preventDefault(); G.mouse.right=true; }    /* hold to move */
});
window.addEventListener('mouseup',e=>{
  if(e.button===0) G.mouse.left=false;
  if(e.button===2) G.mouse.right=false;
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
$('prompt').addEventListener('click',()=>interact());

/* ------------------------------------------------------------------- touch */
function setupTouch(){
  const stick=$('stick'), knob=stick.firstElementChild;
  const MAXR=56;
  function show(x,y){ stick.style.left=x+'px'; stick.style.top=y+'px'; stick.style.display='block'; }
  function knobTo(dx,dy){ knob.style.transform='translate('+dx+'px,'+dy+'px)'; }
  cv.addEventListener('touchstart',e=>{
    sndResume();
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.clientX<window.innerWidth*0.5&&G.touch.id===null){
        G.touch.id=t.identifier; G.touch.ox=t.clientX; G.touch.oy=t.clientY;
        G.touch.dx=0; G.touch.dy=0; G.touch.active=true;
        show(t.clientX,t.clientY); knobTo(0,0);
      } else {
        /* a tap on the right half aims and interacts */
        const w=screenToWorld(t.clientX,t.clientY);
        G.mouse.wx=w.x; G.mouse.wy=w.y;
        if(G.prompt) interact();
      }
    }
  },{passive:false});
  cv.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier!==G.touch.id) continue;
      let dx=t.clientX-G.touch.ox, dy=t.clientY-G.touch.oy;
      let d=Math.hypot(dx,dy);
      if(d>MAXR*1.9){
        G.touch.ox=t.clientX-dx/d*MAXR*1.9;
        G.touch.oy=t.clientY-dy/d*MAXR*1.9;
        show(G.touch.ox,G.touch.oy);
        dx=t.clientX-G.touch.ox; dy=t.clientY-G.touch.oy;
      }
      const dd=Math.hypot(dx,dy);
      const nx=dd>0?dx/dd:0, ny=dd>0?dy/dd:0;
      knobTo(nx*Math.min(dd,MAXR),ny*Math.min(dd,MAXR));
      const mag=Math.min(1,dd/MAXR);
      G.touch.dx=nx*mag; G.touch.dy=ny*mag;
    }
  },{passive:false});
  function end(e){
    for(const t of e.changedTouches){
      if(t.identifier===G.touch.id){
        G.touch.id=null; G.touch.active=false; G.touch.dx=0; G.touch.dy=0;
        stick.style.display='none';
      }
    }
  }
  cv.addEventListener('touchend',end,{passive:false});
  cv.addEventListener('touchcancel',end,{passive:false});
  for(let i=0;i<5;i++){
    const el=$('tb'+i);
    if(!el) continue;
    const press=ev=>{ ev.preventDefault(); ev.stopPropagation(); el.classList.add('down');
      G.touch.btn[i]=true; useSkill(i,true); };
    const rel=ev=>{ ev.preventDefault(); ev.stopPropagation(); el.classList.remove('down'); G.touch.btn[i]=false; };
    el.addEventListener('touchstart',press,{passive:false});
    el.addEventListener('touchend',rel,{passive:false});
    el.addEventListener('touchcancel',rel,{passive:false});
    el.addEventListener('mousedown',press);
    el.addEventListener('mouseup',rel);
    el.addEventListener('mouseleave',rel);
  }
  const sw=$('tbswap');
  const doSwap=ev=>{ ev.preventDefault(); ev.stopPropagation(); swapSet(); };
  sw.addEventListener('touchstart',doSwap,{passive:false});
  sw.addEventListener('mousedown',doSwap);
  const hb=$('tb-hide');
  if(hb){
    const go=ev=>{ ev.preventDefault(); ev.stopPropagation(); goHideout(); };
    hb.addEventListener('touchstart',go,{passive:false});
    hb.addEventListener('click',go);
  }
  $('tmenu').querySelectorAll('[data-panel]').forEach(b=>{
    const go=ev=>{ ev.preventDefault(); ev.stopPropagation(); togglePanel(b.dataset.panel); };
    b.addEventListener('touchstart',go,{passive:false});
    b.addEventListener('click',go);
  });
}

/* ------------------------------------------------------- passive tree input */
function setupTreeInput(){
  const el=treecv;
  const pts=new Map();
  let pinchD=0, panned=false;
  el.addEventListener('pointerdown',e=>{
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    panned=false;
    if(pts.size===2){
      const a=[...pts.values()];
      pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    }
  });
  el.addEventListener('pointermove',e=>{
    const prev=pts.get(e.pointerId);
    if(!prev){
      /* not dragging: hover whatever node is under the cursor */
      if(e.pointerType!=='touch'){
        const n=nodeAtScreen(e.clientX,e.clientY);
        if(n) showTipHtml(nodeTipHtml(n),e.clientX,e.clientY); else hideTip();
      }
      return;
    }
    hideTip();
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2){
      const a=[...pts.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinchD>0){
        const t=G.tree;
        t.z=clamp(t.z*(d/pinchD),0.28,2.2); treeDirty();
      }
      pinchD=d;
      panned=true;
      return;
    }
    if(Math.abs(dx)>2||Math.abs(dy)>2) panned=true;
    G.tree.x+=dx/G.tree.z; G.tree.y+=dy/G.tree.z; treeDirty();
  });
  el.addEventListener('pointerup',e=>{
    pts.delete(e.pointerId);
    if(pts.size<2) pinchD=0;
    if(panned) return;
    const n=nodeAtScreen(e.clientX,e.clientY);
    if(!n){ G.tree.sel=null; treeDirty(); renderTreeUI(); return; }
    if(G.tree.sel===n.id&&canAllocate(n.id)) allocate(n.id);
    else { G.tree.sel=n.id; treeDirty(); renderTreeUI(); }
  });
  el.addEventListener('pointercancel',e=>{ pts.delete(e.pointerId); });
  el.addEventListener('pointerleave',hideTip);
  el.addEventListener('wheel',e=>{
    e.preventDefault();
    const t=G.tree;
    t.z=clamp(t.z*(e.deltaY<0?1.12:0.89),0.28,2.2); treeDirty();
  },{passive:false});
  $('tree-set').addEventListener('click',()=>{
    G.tree.set=(G.tree.set+1)%3;
    treeDirty();
    renderTreeUI();
    toast(G.tree.set===0?'New allocations apply to both weapon sets.'
      :'New allocations apply only to weapon set '+(G.tree.set===1?'I':'II')+'.');
  });
  $('tree-filter').addEventListener('click',()=>{
    G.tree.filterSet=!G.tree.filterSet;
    treeDirty(); renderTreeUI();
    toast(G.tree.filterSet?'Showing only allocations active in weapon set '+roman(G.ch.activeSet)
      :'Showing every allocation.');
  });
  $('tree-respec').addEventListener('click',respecAll);
  $('treesearch').addEventListener('input',e=>{ G.tree.search=e.target.value||''; treeDirty(); });
}

/* ==========================================================================
   BOOT
   ========================================================================== */
function boot(){
  if(IS_TOUCH) document.body.classList.add('touch');
  loadSave();
  if(G.save&&G.save.sound===false) SND.on=false;
  initPools();
  G.theme=ZONES.town.theme;
  resizeCanvas();
  renderSelect();
  showScreen('select');
  document.querySelectorAll('.pclose').forEach(b=>b.addEventListener('click',closePanel));
  $('btn-backsel').addEventListener('click',()=>{ showScreen('select'); renderSelect(); });
  $('charname').addEventListener('input',()=>{
    $('btn-create').disabled=!(G.pickedClass&&$('charname').value.trim().length>0);
  });
  $('btn-create').addEventListener('click',()=>{
    const name=$('charname').value.trim().slice(0,18);
    if(!name||!G.pickedClass) return;
    if(G.save.chars.some(c=>c&&c.name.toLowerCase()===name.toLowerCase())){
      $('class-err').textContent='You already have a character with that name.';
      return;
    }
    $('class-err').textContent='';
    const ch=newCharacter(name,G.pickedClass);
    G.save.chars[G.newSlot]=ch;
    writeSave();
    $('charname').value='';
    startCharacter(G.newSlot);
  });
  setupTouch();
  setupTreeInput();
  requestAnimationFrame(loop);
}
boot();
</script>
