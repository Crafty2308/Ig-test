/* ============================================================== passive tree */
const treecv=$('treecv'), treectx=treecv.getContext('2d');
function isAllocated(id){ return G.ch.passives[id]!=null; }
function isStartNode(id){ return id==='start_'+CLASSES[G.ch.cls].start; }
function canAllocate(id){
  const ch=G.ch;
  if(isAllocated(id)) return false;
  if(pointsSpent(ch)>=charPoints(ch)) return false;
  const n=TREE.nodes[id];
  if(!n||n.type==='start') return false;
  for(const a of n.adj){
    if(isAllocated(a)) return true;
    if(isStartNode(a)) return true;
  }
  return false;
}
function allocate(id){
  const ch=G.ch;
  if(!canAllocate(id)){
    if(pointsSpent(ch)>=charPoints(ch)) toast('No passive points remaining.');
    else toast('That node is not connected to anything you have taken.');
    return;
  }
  ch.passives[id]=G.tree.set;   /* 0 = both sets, 1 = set I, 2 = set II */
  recalc(); buildSlotUI(); markDirty();
  const n=TREE.nodes[id];
  toast('Allocated '+n.name+(G.tree.set?' ('+(G.tree.set===1?'set I':'set II')+' only)':''));
  renderTreeUI();
}
function respecAll(){
  const ch=G.ch;
  const n=pointsSpent(ch);
  if(!n){ toast('Nothing to refund.'); return; }
  const cost=n*RESPEC_COST;
  if((ch.currency.shard||0)<cost){ toast('A full respec costs '+cost+' salvage shards. You have '+(ch.currency.shard||0)+'.'); return; }
  takeCurrency('shard',cost);
  ch.passives={};
  recalc(); buildSlotUI(); markDirty();
  toast('Refunded '+n+' passive points for '+cost+' shards.');
  renderTreeUI();
}
function renderTreeUI(){
  const ch=G.ch;
  const left=charPoints(ch)-pointsSpent(ch);
  $('tree-pts').textContent=left+' / '+charPoints(ch)+' POINTS';
  $('tree-set').textContent=G.tree.set===0?'BOTH SETS':(G.tree.set===1?'SET I ONLY':'SET II ONLY');
  const info=$('treeinfo');
  const sel=G.tree.sel&&TREE.nodes[G.tree.sel];
  if(sel){
    let html='<div class="nm">'+esc(sel.name)+' <span class="tag">'+sel.type+'</span></div>';
    const lines=[];
    for(const k in sel.st){
      if(k==='keystone') continue;
      lines.push(statLine(k,sel.st[k]));
    }
    if(sel.st.keystone) lines.push(KEYSTONES[sel.st.keystone].text);
    if(lines.length) html+='<div class="st">'+esc(lines.join(' · '))+'</div>';
    if(sel.desc) html+='<div class="ds">'+esc(sel.desc)+'</div>';
    if(isAllocated(sel.id)){
      const m=ch.passives[sel.id];
      html+='<div class="ds">Allocated'+(m?' — '+(m===1?'weapon set I only':'weapon set II only'):' for both weapon sets')+'.</div>';
    } else if(canAllocate(sel.id)) html+='<div class="ds" style="color:#8fd08a">Tap again to allocate.</div>';
    else html+='<div class="ds" style="color:#b4685f">Not reachable yet.</div>';
    info.innerHTML=html;
    info.classList.add('on');
  } else info.classList.remove('on');
}
function treeToScreen(n){
  const t=G.tree;
  return {x:G.view.w/2+(n.x+t.x)*t.z, y:G.view.h/2+(n.y+t.y)*t.z};
}
function screenToTree(sx,sy){
  const t=G.tree;
  return {x:(sx-G.view.w/2)/t.z-t.x, y:(sy-G.view.h/2)/t.z-t.y};
}
function nodeAtScreen(sx,sy){
  const p=screenToTree(sx,sy);
  let best=null,bd=1e9;
  for(const n of TREE.list){
    const d=d2(p.x,p.y,n.x,n.y);
    if(d<bd){bd=d;best=n;}
  }
  const rr=(best&&best.type==='keystone')?30:best&&best.type==='notable'?22:16;
  return bd<=(rr+10)*(rr+10)?best:null;
}
function renderTree(){
  const dpr=G.view.dpr,w=G.view.w,h=G.view.h,t=G.tree;
  treectx.setTransform(dpr,0,0,dpr,0,0);
  treectx.fillStyle='#06060a';
  treectx.fillRect(0,0,w,h);
  const ch=G.ch;
  const search=t.search.toLowerCase();
  /* links first */
  treectx.lineWidth=Math.max(1,2*t.z);
  const drawn=new Set();
  for(const n of TREE.list){
    const a=treeToScreen(n);
    for(const id of n.adj){
      const key=n.id<id?n.id+'|'+id:id+'|'+n.id;
      if(drawn.has(key)) continue;
      drawn.add(key);
      const o=TREE.nodes[id];
      const b=treeToScreen(o);
      const both=(isAllocated(n.id)||isStartNode(n.id))&&(isAllocated(id)||isStartNode(id));
      treectx.strokeStyle=both?'rgba(200,169,110,.55)':'rgba(255,255,255,.07)';
      treectx.beginPath(); treectx.moveTo(a.x,a.y); treectx.lineTo(b.x,b.y); treectx.stroke();
    }
  }
  for(const n of TREE.list){
    const s=treeToScreen(n);
    if(s.x<-60||s.y<-60||s.x>w+60||s.y>h+60) continue;
    const alloc=isAllocated(n.id), start=n.type==='start';
    const mine=start&&isStartNode(n.id);
    let r = n.type==='keystone'?15:n.type==='notable'?11:7;
    if(start) r=17;
    r*=t.z;
    const match=search&&(n.name.toLowerCase().indexOf(search)>=0||
      Object.keys(n.st).some(k=>(STAT_FMT[k]||k).toLowerCase().indexOf(search)>=0));
    if(match){
      treectx.globalAlpha=.9;
      treectx.drawImage(glowSprite('#8fd08a'),s.x-r*3,s.y-r*3,r*6,r*6);
      treectx.globalAlpha=1;
    }
    if(alloc||mine){
      treectx.globalAlpha=.8;
      treectx.drawImage(glowSprite(n.type==='keystone'?'#e0c070':'#c8a96e'),s.x-r*2.6,s.y-r*2.6,r*5.2,r*5.2);
      treectx.globalAlpha=1;
    }
    treectx.beginPath();
    if(n.type==='keystone'){
      treectx.save(); treectx.translate(s.x,s.y); treectx.rotate(Math.PI/4);
      treectx.rect(-r,-r,r*2,r*2); treectx.restore();
    } else treectx.arc(s.x,s.y,r,0,TAU);
    treectx.fillStyle = alloc? (n.type==='keystone'?'#e0c070':'#c8a96e')
      : mine? '#d8c69c'
      : canAllocate(n.id)? 'rgba(200,169,110,.3)' : 'rgba(255,255,255,.13)';
    treectx.fill();
    treectx.strokeStyle = G.tree.sel===n.id? '#ffffff'
      : alloc? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.14)';
    treectx.lineWidth=G.tree.sel===n.id?2.4:1.2;
    treectx.stroke();
    /* set-specific allocations get a marker */
    if(alloc&&ch.passives[n.id]){
      treectx.fillStyle='#06060a';
      treectx.font=Math.max(7,7*t.z)+'px Cinzel, serif';
      treectx.textAlign='center'; treectx.textBaseline='middle';
      treectx.fillText(ch.passives[n.id]===1?'I':'II',s.x,s.y+0.5);
    }
    /* labels are the main source of clutter: keystones and starts always,
       notables once zoomed in, anything else only when searched or selected */
    const label = n.type==='keystone'||n.type==='start'||match||G.tree.sel===n.id
      ||(n.type==='notable'&&t.z>0.85)||(n.type==='minor'&&t.z>1.5);
    if(label){
      treectx.fillStyle=alloc?'rgba(232,223,201,.9)':'rgba(180,175,165,.5)';
      treectx.font=Math.max(8,9*t.z)+'px Cinzel, serif';
      treectx.textAlign='center'; treectx.textBaseline='top';
      treectx.fillText(n.name,s.x,s.y+r+3);
    }
  }
  treectx.textBaseline='alphabetic';
}

/* ------------------------------------------------------------- map overlay */
const mapcv=$('mapcv'), mapctx=mapcv.getContext('2d');
function renderMapOverlay(){
  const dpr=G.view.dpr,w=G.view.w,h=G.view.h;
  mapctx.setTransform(dpr,0,0,dpr,0,0);
  mapctx.fillStyle='rgba(4,4,6,.98)';
  mapctx.fillRect(0,0,w,h);
  const pad=54;
  const s=Math.min((w-pad*2)/(GRID*TILE),(h-pad*2)/(GRID*TILE));
  const ox=(w-GRID*TILE*s)/2, oy=(h-GRID*TILE*s)/2;
  const cell=Math.max(1,TILE*s);
  for(let ty=0;ty<GRID;ty++) for(let tx=0;tx<GRID;tx++){
    const i=NAV(tx,ty);
    if(G.nav[i]!==1) continue;
    const seen=G.explored[i];
    mapctx.fillStyle=seen?rgba(G.theme.rim,.3):rgba(G.theme.rim,.09);
    mapctx.fillRect(ox+tx*TILE*s,oy+ty*TILE*s,cell,cell);
  }
  const dot=(x,y,c,r)=>{
    mapctx.fillStyle=c;
    mapctx.beginPath(); mapctx.arc(ox+x*s,oy+y*s,r,0,TAU); mapctx.fill();
  };
  for(const n of G.npcs) dot(n.x,n.y,'#d8c69c',5);
  for(const pt of G.portals) dot(pt.x,pt.y,pt.locked?'#8a6a5a':'#8fc0e0',6);
  for(const e of G.enemies){ if(!e.dead&&!e.dying&&e.rarity>0) dot(e.x,e.y,e.rarity===2?'#c87838':'#6a8fc8',4); }
  if(G.boss&&!G.boss.dead) dot(G.boss.x,G.boss.y,'#d63c2e',8);
  dot(G.player.x,G.player.y,'#ffffff',5);
  mapctx.fillStyle='rgba(200,169,110,.9)';
  mapctx.font='16px Cinzel, serif';
  mapctx.textAlign='center';
  mapctx.fillText(G.zdef.name.toUpperCase()+(G.zdef.town?'':'  ·  LEVEL '+G.zdef.level),w/2,34);
  mapctx.fillStyle='rgba(138,133,121,.9)';
  mapctx.font='13px Crimson Pro, serif';
  const legend=G.boss&&!G.boss.dead?'red — zone master · blue — gateway · gold — townsfolk':'blue — gateway';
  mapctx.fillText(legend,w/2,h-24);
}

function renderVendor(npc){

function showScreen(name){
  G.screen=name;

    $(id).classList.toggle('active',id==='screen-'+name);
}
function renderSelect(){
  const list=$('slotlist');
  let html='';
  for(let i=0;i<MAX_SLOTS;i++){
    const c=G.save.chars[i];
    if(c){
      html+='<div class="slot" data-play="'+i+'"><div class="grow">'+
        '<div class="nm">'+esc(c.name)+'</div>'+
        '<div class="meta">level '+c.level+' '+esc(CLASSES[c.cls].name)+' · '+
        esc(ZONES[c.zone]?ZONES[c.zone].name:'unknown')+' · '+fmtTime(c.playtime||0)+'</div></div>'+
        '<button class="del" data-del="'+i+'">DELETE</button></div>';
    } else {
      html+='<div class="slot empty" data-new="'+i+'"><div class="grow">'+
        '<div class="nm">Empty slot</div><div class="meta">New character</div></div></div>';
    }
  }
  list.innerHTML=html;
  list.querySelectorAll('[data-play]').forEach(el=>el.addEventListener('click',ev=>{
    if(ev.target.dataset.del!=null) return;
    startCharacter(+el.dataset.play);
  }));
  list.querySelectorAll('[data-new]').forEach(el=>el.addEventListener('click',()=>{
    G.newSlot=+el.dataset.new;
    G.pickedClass=null;
    showScreen('class');
    renderClassSelect();
  }));
  list.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    const i=+el.dataset.del;
    const c=G.save.chars[i];
    if(G.confirmDel===i){
      G.save.chars[i]=null; G.confirmDel=null;
      writeSave(); renderSelect();
      $('select-err').textContent='';
    } else {
      G.confirmDel=i;
      $('select-err').textContent='Delete '+c.name+' permanently? Press DELETE again to confirm.';
      setTimeout(()=>{ if(G.confirmDel===i){G.confirmDel=null;$('select-err').textContent='';} },4000);
    }
  }));
  $('select-err').textContent=G.saveBroken?'A previous save could not be read and was reset.':'';
}
function renderClassSelect(){
  const host=$('clslist');

  for(const k of CLASS_KEYS){

function startCharacter(slot){
  G.slot=slot;
  G.ch=G.save.chars[slot];
  /* repair anything a schema change might have left missing */
  const ch=G.ch;
  ch.passives=ch.passives||{};
  ch.gems=ch.gems||[]; ch.supports=ch.supports||[];
  ch.auras=ch.auras||{}; ch.currency=ch.currency||{};
  ch.inv=ch.inv||[]; ch.waypoints=ch.waypoints||['town'];
  ch.flasks=ch.flasks||{life:3,mana:3};
  if(!ch.loadout) ch.loadout=[[null,null,null,null,null],[null,null,null,null,null]];
  if(!ch.sets) ch.sets=[{weapon:null,offhand:null},{weapon:null,offhand:null}];
  G.player=null;
  G.kills=0;
  G.running=true;
  showScreen('game');
  resizeCanvas();
  enterZone(ch.zone&&ZONES[ch.zone]?ch.zone:'town');

/* ==========================================================================
   INPUT
   Left click never moves the player. Movement is WASD or right-click-hold
   on desktop, and the thumb joystick on touch. Both work at once.
   ========================================================================== */
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function swapSet(){
  const ch=G.ch;
  ch.activeSet=ch.activeSet?0:1;
  recalc(); buildSlotUI(); markDirty();
  const w=ch.sets[ch.activeSet].weapon;
  toast('Weapon set '+roman(ch.activeSet)+(w?' · '+itemName(w):' · empty'));
  burst(G.player.x,G.player.y,14,'#c8a96e',170,3,.45,true);
}
function screenToWorld(sx,sy){
  return {x:sx+G.cam.x-G.view.w/2, y:sy+G.cam.y-G.view.h/2};
}
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(G.screen!=='game'){
    if(k==='enter'&&G.screen==='class'&&!$('btn-create').disabled) $('btn-create').click();
    return;
  }
  if(k==='tab'){ e.preventDefault(); togglePanel('map'); return; }
  if(k==='escape'){
    if(G.panel&&G.panel!=='death'&&G.panel!=='level') closePanel();
    else if(!G.panel) openPanel('menu');
    return;
  }
  if(G.keys[k]) return;
  G.keys[k]=true;
  if(k==='i'){ togglePanel('inv'); return; }
  if(k==='p'){ togglePanel('tree'); return; }
  if(k==='c'){ togglePanel('sheet'); return; }
  if(G.panel) return;
  if(k==='x'){ swapSet(); return; }
  if(k==='f'){ interact(); return; }
  if(k==='1'){ useFlask('life'); return; }
  if(k==='2'){ useFlask('mana'); return; }
  if(k==='q') useSkill(1,false);
  if(k==='e') useSkill(2,false);
  if(k==='r') useSkill(3,false);
  if(k===' '){ e.preventDefault(); useSkill(4,false); }
});
window.addEventListener('keyup',e=>{ G.keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur',()=>{ G.keys=Object.create(null); G.mouse.left=false; G.mouse.right=false; });
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  G.mouse.sx=e.clientX-r.left; G.mouse.sy=e.clientY-r.top;
  const w=screenToWorld(G.mouse.sx,G.mouse.sy);
  G.mouse.wx=w.x; G.mouse.wy=w.y;
});
cv.addEventListener('mousedown',e=>{
  const r=cv.getBoundingClientRect();
  G.mouse.sx=e.clientX-r.left; G.mouse.sy=e.clientY-r.top;
  const w=screenToWorld(G.mouse.sx,G.mouse.sy);
  G.mouse.wx=w.x; G.mouse.wy=w.y;
  if(e.button===0){ G.mouse.left=true; useSkill(0,false); }      /* attack only */
  if(e.button===2){ e.preventDefault(); G.mouse.right=true; }    /* hold to move */
});
window.addEventListener('mouseup',e=>{
  if(e.button===0) G.mouse.left=false;
  if(e.button===2) G.mouse.right=false;
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
$('prompt').addEventListener('click',()=>interact());

/* ------------------------------------------------------------------- touch */
function setupTouch(){
  const stick=$('stick'), knob=stick.firstElementChild;
  const MAXR=56;
  function show(x,y){ stick.style.left=x+'px'; stick.style.top=y+'px'; stick.style.display='block'; }
  function knobTo(dx,dy){ knob.style.transform='translate('+dx+'px,'+dy+'px)'; }
  cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.clientX<window.innerWidth*0.5&&G.touch.id===null){
        G.touch.id=t.identifier; G.touch.ox=t.clientX; G.touch.oy=t.clientY;
        G.touch.dx=0; G.touch.dy=0; G.touch.active=true;
        show(t.clientX,t.clientY); knobTo(0,0);
      } else {
        /* a tap on the right half aims and interacts */
        const w=screenToWorld(t.clientX,t.clientY);
        G.mouse.wx=w.x; G.mouse.wy=w.y;
        if(G.prompt) interact();
      }
    }
  },{passive:false});
  cv.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier!==G.touch.id) continue;
      let dx=t.clientX-G.touch.ox, dy=t.clientY-G.touch.oy;
      let d=Math.hypot(dx,dy);
      if(d>MAXR*1.9){
        G.touch.ox=t.clientX-dx/d*MAXR*1.9;
        G.touch.oy=t.clientY-dy/d*MAXR*1.9;
        show(G.touch.ox,G.touch.oy);
        dx=t.clientX-G.touch.ox; dy=t.clientY-G.touch.oy;
      }
      const dd=Math.hypot(dx,dy);
      const nx=dd>0?dx/dd:0, ny=dd>0?dy/dd:0;
      knobTo(nx*Math.min(dd,MAXR),ny*Math.min(dd,MAXR));
      const mag=Math.min(1,dd/MAXR);
      G.touch.dx=nx*mag; G.touch.dy=ny*mag;
    }
  },{passive:false});
  function end(e){
    for(const t of e.changedTouches){
      if(t.identifier===G.touch.id){
        G.touch.id=null; G.touch.active=false; G.touch.dx=0; G.touch.dy=0;
        stick.style.display='none';
      }
    }
  }
  cv.addEventListener('touchend',end,{passive:false});
  cv.addEventListener('touchcancel',end,{passive:false});
  for(let i=0;i<5;i++){
    const el=$('tb'+i);
    if(!el) continue;
    const press=ev=>{ ev.preventDefault(); ev.stopPropagation(); el.classList.add('down');
      G.touch.btn[i]=true; useSkill(i,true); };
    const rel=ev=>{ ev.preventDefault(); ev.stopPropagation(); el.classList.remove('down'); G.touch.btn[i]=false; };
    el.addEventListener('touchstart',press,{passive:false});
    el.addEventListener('touchend',rel,{passive:false});
    el.addEventListener('touchcancel',rel,{passive:false});
    el.addEventListener('mousedown',press);
    el.addEventListener('mouseup',rel);
    el.addEventListener('mouseleave',rel);
  }
  const sw=$('tbswap');
  const doSwap=ev=>{ ev.preventDefault(); ev.stopPropagation(); swapSet(); };
  sw.addEventListener('touchstart',doSwap,{passive:false});
  sw.addEventListener('mousedown',doSwap);
  $('tmenu').querySelectorAll('[data-panel]').forEach(b=>{
    const go=ev=>{ ev.preventDefault(); ev.stopPropagation(); togglePanel(b.dataset.panel); };
    b.addEventListener('touchstart',go,{passive:false});
    b.addEventListener('click',go);
  });
}

/* ------------------------------------------------------- passive tree input */
function setupTreeInput(){
  const el=treecv;
  const pts=new Map();
  let pinchD=0, panned=false;
  el.addEventListener('pointerdown',e=>{
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    panned=false;
    if(pts.size===2){
      const a=[...pts.values()];
      pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    }
  });
  el.addEventListener('pointermove',e=>{
    const prev=pts.get(e.pointerId);
    if(!prev) return;
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2){
      const a=[...pts.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinchD>0){
        const t=G.tree;
        t.z=clamp(t.z*(d/pinchD),0.28,2.2);
      }
      pinchD=d;
      panned=true;
      return;
    }
    if(Math.abs(dx)>2||Math.abs(dy)>2) panned=true;
    G.tree.x+=dx/G.tree.z; G.tree.y+=dy/G.tree.z;
  });
  el.addEventListener('pointerup',e=>{
    pts.delete(e.pointerId);
    if(pts.size<2) pinchD=0;
    if(panned) return;
    const n=nodeAtScreen(e.clientX,e.clientY);
    if(!n){ G.tree.sel=null; renderTreeUI(); return; }
    if(G.tree.sel===n.id&&canAllocate(n.id)) allocate(n.id);
    else { G.tree.sel=n.id; renderTreeUI(); }
  });
  el.addEventListener('pointercancel',e=>{ pts.delete(e.pointerId); });
  el.addEventListener('wheel',e=>{
    e.preventDefault();
    const t=G.tree;
    t.z=clamp(t.z*(e.deltaY<0?1.12:0.89),0.28,2.2);
  },{passive:false});
  $('tree-set').addEventListener('click',()=>{
    G.tree.set=(G.tree.set+1)%3;
    renderTreeUI();
    toast(G.tree.set===0?'New allocations apply to both weapon sets.'
      :'New allocations apply only to weapon set '+(G.tree.set===1?'I':'II')+'.');
  });
  $('tree-respec').addEventListener('click',respecAll);
  $('treesearch').addEventListener('input',e=>{ G.tree.search=e.target.value||''; });
}

/* ==========================================================================
   BOOT
   ========================================================================== */
function boot(){
  if(IS_TOUCH) document.body.classList.add('touch');
  loadSave();
  initPools();
  G.theme=ZONES.town.theme;
  resizeCanvas();
  renderSelect();
  showScreen('select');
  document.querySelectorAll('.pclose').forEach(b=>b.addEventListener('click',closePanel));
  $('btn-backsel').addEventListener('click',()=>{ showScreen('select'); renderSelect(); });
  $('charname').addEventListener('input',()=>{
    $('btn-create').disabled=!(G.pickedClass&&$('charname').value.trim().length>0);
  });
  $('btn-create').addEventListener('click',()=>{
    const name=$('charname').value.trim().slice(0,18);
    if(!name||!G.pickedClass) return;
    if(G.save.chars.some(c=>c&&c.name.toLowerCase()===name.toLowerCase())){
      $('class-err').textContent='You already have a character with that name.';
      return;
    }
    $('class-err').textContent='';
    const ch=newCharacter(name,G.pickedClass);
    G.save.chars[G.newSlot]=ch;
    writeSave();
    $('charname').value='';
    startCharacter(G.newSlot);
  });
  setupTouch();
  setupTreeInput();
  requestAnimationFrame(loop);
}
boot();
</script>
