<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dungeon Rift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c8a96e; --gold-dim:#8d7748;
  --ink:#07070a; --ink-2:#0c0c11; --ink-3:#13131a;
  --text:#d7d2c6; --dim:#8a8579; --faint:#5f5b53;
  --life:#a5352f; --mana:#3f5f8a; --spirit:#7a6ab0;
  --r0:#cfcabd; --r1:#6a8fc8; --r2:#d4c060; --r3:#c87838;
  --hud:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--text);
  font-family:'Crimson Pro',Georgia,serif;overflow:hidden;-webkit-text-size-adjust:100%}
h1,h2,h3,.cin{font-family:'Cinzel',Georgia,serif;font-weight:600;letter-spacing:.06em;margin:0}
button{font-family:'Cinzel',Georgia,serif;color:var(--text);background:transparent;border:0;cursor:pointer}
input{font-family:'Crimson Pro',Georgia,serif}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(26px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
          calc(34px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
.wrap{max-width:880px;margin:0 auto}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(200,169,110,.05),rgba(0,0,0,0) 45%,rgba(0,0,0,.75))}
.title{font-size:clamp(28px,6vw,50px);color:var(--gold);text-align:center;letter-spacing:.22em;
  text-shadow:0 0 34px rgba(200,169,110,.2)}
.sub{text-align:center;color:var(--dim);font-style:italic;font-size:clamp(13px,2.2vw,17px);margin:8px 0 28px}
.sect{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gold-dim);margin:26px 0 12px}
.btn{display:block;width:100%;padding:13px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);background:rgba(200,169,110,.06);border:1px solid rgba(200,169,110,.24);
  border-radius:3px;margin-top:14px;transition:background .2s,color .2s}
.btn:hover:not(:disabled){background:rgba(200,169,110,.15);color:#f0e2c4}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.09);color:var(--dim);letter-spacing:.14em}
.btn.ghost:hover{background:rgba(255,255,255,.05);color:var(--text)}
.btn.sm{width:auto;display:inline-block;padding:9px 17px;margin:0;font-size:11px}
.btn.danger{color:#b4685f;border-color:rgba(180,104,95,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.c{justify-content:center}
.err{color:#b4685f;text-align:center;font-style:italic;min-height:18px;font-size:14px;margin-top:8px}

/* ---------- character / class select ---------- */
.slot{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.022);
  border-left:2px solid rgba(200,169,110,.22);padding:13px 15px;margin-bottom:10px;border-radius:0 4px 4px 0;
  cursor:pointer;transition:background .2s}
.slot:hover{background:rgba(200,169,110,.08)}
.slot .nm{font-family:'Cinzel',serif;color:#e3d6b8;font-size:17px}
.slot .meta{color:var(--dim);font-size:14px;margin-top:3px}
.slot .grow{flex:1;min-width:0}
.slot .del{color:var(--faint);font-size:11px;padding:7px 10px;letter-spacing:.1em}
.slot .del:hover{color:#b4685f}
.slot.empty{border-left-color:rgba(255,255,255,.07)}
.slot.empty .nm{color:var(--faint)}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cls{background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.05);border-radius:5px;
  padding:15px;cursor:pointer;transition:background .2s,border-color .2s;text-align:left}
.cls:hover,.cls.on{background:rgba(200,169,110,.1);border-color:rgba(200,169,110,.4)}
.cls .nm{font-family:'Cinzel',serif;color:#e3d6b8;font-size:19px}
.cls .at{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.2em;color:var(--gold);margin-top:5px}
.cls .ds{color:var(--dim);font-style:italic;font-size:14.5px;margin-top:8px;line-height:1.55}
.cls .sk{color:var(--faint);font-size:13px;margin-top:8px}
.nameinput{width:100%;background:rgba(255,255,255,.03);border:0;border-bottom:1px solid rgba(200,169,110,.22);
  color:var(--text);font-size:17px;padding:10px 12px;outline:none;border-radius:3px 3px 0 0}
.nameinput:focus{border-bottom-color:var(--gold);background:rgba(255,255,255,.055)}

/* ---------- game canvas + hud ---------- */
#screen-game{background:#040406}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:absolute;inset:0;pointer-events:none;font-family:'Cinzel',serif}
.orb{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));width:calc(94px * var(--hud));
  height:calc(94px * var(--hud));border-radius:50%;overflow:hidden;background:rgba(6,6,9,.75);
  border:1px solid rgba(255,255,255,.07)}
#orb-life{left:calc(12px + env(safe-area-inset-left))}
#orb-mana{right:calc(12px + env(safe-area-inset-right))}
.orb .fill{position:absolute;left:0;right:0;bottom:0;height:0%;transition:height .15s linear}
#orb-life .fill{background:linear-gradient(180deg,#c0463a,#6d1e1a)}
#orb-mana .fill{background:linear-gradient(180deg,#4a76ad,#1f3556)}
.orb .es{position:absolute;left:0;right:0;bottom:0;height:0%;background:rgba(150,200,230,.32)}
.orb .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(11px * var(--hud));color:rgba(255,255,255,.85);text-shadow:0 1px 3px #000;letter-spacing:.04em}
.flasks{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:5px;pointer-events:auto}
#flask-life{left:calc(112px * var(--hud) + 12px)}
#flask-mana{right:calc(112px * var(--hud) + 12px)}
.flask{width:calc(26px * var(--hud));height:calc(38px * var(--hud));border-radius:3px 3px 7px 7px;
  background:rgba(8,8,12,.8);border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden;
  font-size:calc(8px * var(--hud));color:rgba(255,255,255,.7);text-align:center}
.flask i{position:absolute;left:0;right:0;bottom:0;display:block;height:0%}
#flask-life .flask i{background:linear-gradient(180deg,#c0463a,#7d2420)}
#flask-mana .flask i{background:linear-gradient(180deg,#4a76ad,#26405f)}
.flask span{position:relative;z-index:2;display:block;margin-top:calc(13px * var(--hud))}
#spiritbar{position:absolute;bottom:calc(102px * var(--hud) + 26px);right:calc(12px + env(safe-area-inset-right));
  width:calc(112px * var(--hud));font-size:calc(8.5px * var(--hud));color:var(--dim);letter-spacing:.14em;text-align:right}
body.touch #spiritbar{right:auto;left:calc(12px + env(safe-area-inset-left));text-align:left}
#spiritbar .bar{height:calc(5px * var(--hud));background:rgba(255,255,255,.07);border-radius:2px;margin-top:3px;overflow:hidden}
#spiritbar .bar i{display:block;height:100%;background:linear-gradient(90deg,#5b4d86,#9a86d4)}
#slots{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  display:flex;gap:8px}
.sl{width:calc(54px * var(--hud));height:calc(54px * var(--hud));background:rgba(10,10,14,.66);
  border:1px solid rgba(200,169,110,.14);border-radius:4px;position:relative;overflow:hidden;text-align:center}
.sl .k{font-size:calc(9.5px * var(--hud));color:var(--gold);margin-top:calc(4px * var(--hud))}
.sl .n{font-size:calc(7.5px * var(--hud));color:var(--dim);font-family:'Crimson Pro',serif;line-height:1.1;padding:0 2px;
  max-height:calc(20px * var(--hud));overflow:hidden}
.sl .mc{font-size:calc(7px * var(--hud));color:#6f8fbf;position:absolute;left:0;right:0;bottom:1px}
.sl .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.68);height:0}
.sl.ready{border-color:rgba(200,169,110,.38)}
.sl.nomana .n{color:#7a4a44}
#setind{position:absolute;bottom:calc(78px * var(--hud) + 12px);left:50%;transform:translateX(-50%);
  font-size:calc(9px * var(--hud));letter-spacing:.2em;color:var(--dim)}
#setind b{color:var(--gold);font-weight:400}
#xpbar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  width:min(46vw,420px);text-align:center}
#xpbar .bar{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
#xpbar .bar i{display:block;height:100%;background:linear-gradient(90deg,#6b5b32,var(--gold));width:0}
#xpbar .lb{font-size:calc(9.5px * var(--hud));letter-spacing:.18em;color:var(--dim);margin-top:4px}
#zoneinfo{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
  text-align:right}
#zoneinfo .zn{font-size:calc(13px * var(--hud));color:#a99a7d;letter-spacing:.14em}
#zoneinfo .zl{font-size:calc(9.5px * var(--hud));letter-spacing:.2em;color:var(--dim);margin-top:3px}
#minimap-wrap{position:absolute;top:calc(52px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
  width:118px;height:118px;background:rgba(6,6,9,.5);border:1px solid rgba(200,169,110,.12);border-radius:3px}
#minimap{display:block;width:118px;height:118px}
#bossbar{position:absolute;top:calc(44px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  width:min(62vw,620px);display:none}
#bossbar.on{display:block}
#bossbar .nm{text-align:center;font-size:calc(11px * var(--hud));letter-spacing:.2em;color:#c9a09a;margin-bottom:4px}
#bossbar .bar{height:9px;background:rgba(20,6,6,.8);border:1px solid rgba(180,60,50,.25);border-radius:2px;
  position:relative;overflow:hidden}
#bossbar .bar i{display:block;height:100%;background:linear-gradient(90deg,#7d2420,#c8483a);width:100%}
#bossbar .ph{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.65)}
#toast{position:absolute;top:calc(96px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  font-family:'Crimson Pro',serif;font-size:15px;color:var(--gold);text-align:center;pointer-events:none;
  opacity:0;transition:opacity .3s;text-shadow:0 2px 8px #000;max-width:70vw}
#toast.on{opacity:1}
#prompt{position:absolute;bottom:calc(122px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-family:'Crimson Pro',serif;font-size:15px;color:var(--text);background:rgba(6,6,9,.8);
  padding:7px 15px;border-radius:4px;border:1px solid rgba(200,169,110,.2);display:none;pointer-events:auto}
#prompt.on{display:block}

/* ---------- touch ui ---------- */
#touch{position:absolute;inset:0;display:none;pointer-events:none}
body.touch #touch{display:block}
body.touch #slots{display:none}
#stick{position:absolute;width:136px;height:136px;margin:-68px 0 0 -68px;border-radius:50%;display:none;
  border:1px solid rgba(200,169,110,.2);background:radial-gradient(circle,rgba(200,169,110,.07),rgba(0,0,0,0) 70%)}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:rgba(200,169,110,.18);border:1px solid rgba(200,169,110,.4)}
#tbtns{position:absolute;right:calc(8px + env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom));
  width:200px;height:200px;pointer-events:none}
.tb{position:absolute;width:64px;height:64px;border-radius:50%;pointer-events:auto;
  background:rgba(12,12,17,.62);border:1px solid rgba(200,169,110,.26);display:flex;align-items:center;
  justify-content:center;flex-direction:column;font-family:'Cinzel',serif;font-size:12px;color:var(--gold);
  -webkit-user-select:none;user-select:none;overflow:hidden}
.tb.down{background:rgba(200,169,110,.2)}
.tb .sweep{position:absolute;inset:-1px;border-radius:50%;pointer-events:none;
  background:conic-gradient(rgba(0,0,0,.7) 0deg,rgba(0,0,0,.7) 0deg,rgba(0,0,0,0) 0deg)}
.tb .lb{font-size:7px;color:var(--dim);font-family:'Crimson Pro',serif;line-height:1.05;max-width:58px;
  text-align:center;max-height:16px;overflow:hidden}
#tb0{right:2px;bottom:6px}
#tb1{right:74px;bottom:20px}
#tb2{right:112px;bottom:84px}
#tb3{right:52px;bottom:118px}
#tb4{right:132px;bottom:2px}
#tbswap{position:absolute;right:6px;bottom:78px;width:44px;height:44px;font-size:10px}
#tmenu{position:absolute;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));
  display:none;gap:6px;pointer-events:auto}
body.touch #tmenu{display:flex}
#tmenu button{width:38px;height:38px;border-radius:5px;background:rgba(12,12,17,.6);
  border:1px solid rgba(200,169,110,.2);font-size:12px;color:var(--gold)}

/* ---------- panels ---------- */
.panel{position:absolute;inset:0;display:none;background:rgba(4,4,6,.93);z-index:30;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.panel.on{display:block}
.ptitle{font-family:'Cinzel',serif;font-size:clamp(17px,3.4vw,25px);color:var(--gold);letter-spacing:.18em;
  text-transform:uppercase;text-align:center}
.pnote{text-align:center;color:var(--dim);font-style:italic;font-size:15px;margin-top:8px;line-height:1.55}
.pclose{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
  width:38px;height:38px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:var(--dim);font-size:15px;z-index:5}
.pclose:hover{color:var(--text);background:rgba(255,255,255,.09)}
.card{background:rgba(255,255,255,.022);border-left:2px solid rgba(200,169,110,.24);padding:12px 14px;
  margin-bottom:9px;border-radius:0 4px 4px 0}
.card .nm{font-family:'Cinzel',serif;color:#e3d6b8;font-size:16px}
.card .ds{color:var(--dim);font-style:italic;font-size:14.5px;margin-top:5px;line-height:1.5}
.card .mc{color:var(--faint);font-size:13px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.04)}
.kv span:first-child{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-dim);align-self:center}
.kv span:last-child{color:#d8c69c;font-size:15px;font-family:'Cinzel',serif}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tabs{display:flex;gap:6px;justify-content:center;margin:14px 0}
.tab{padding:7px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  border:1px solid rgba(255,255,255,.07);border-radius:3px;background:transparent}
.tab.on{color:var(--gold);border-color:rgba(200,169,110,.35);background:rgba(200,169,110,.08)}

/* inventory */
.invwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.invwrap{grid-template-columns:1fr}}
.eqgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.eqslot{aspect-ratio:1;background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.055);
  border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;
  font-size:8.5px;letter-spacing:.1em;color:var(--faint);text-align:center;font-family:'Cinzel',serif;
  text-transform:uppercase;cursor:pointer;overflow:hidden;padding:2px}
.eqslot.filled{border-color:rgba(200,169,110,.3)}
.eqslot .it{position:absolute;inset:2px;display:flex;align-items:center;justify-content:center;
  font-family:'Crimson Pro',serif;font-size:10.5px;line-height:1.1;text-align:center;padding:2px;
  text-transform:none;letter-spacing:0}
.grid{position:relative;background:rgba(255,255,255,.016);border:1px solid rgba(255,255,255,.05);
  border-radius:4px;touch-action:none}
.cell{position:absolute;border:1px solid rgba(255,255,255,.035)}
.item{position:absolute;border-radius:3px;background:rgba(16,16,22,.9);border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.1;
  padding:2px;cursor:grab;overflow:hidden;font-family:'Crimson Pro',serif}
.item.drag{opacity:.45;cursor:grabbing}
.item.r0{border-color:rgba(207,202,189,.35);color:var(--r0)}
.item.r1{border-color:rgba(106,143,200,.5);color:var(--r1)}
.item.r2{border-color:rgba(212,192,96,.5);color:var(--r2)}
.item.r3{border-color:rgba(200,120,56,.6);color:var(--r3)}
.item.unid{border-style:dashed}
#tooltip{position:fixed;z-index:60;max-width:290px;background:rgba(6,6,9,.97);
  border:1px solid rgba(200,169,110,.28);border-radius:4px;padding:11px 13px;display:none;
  pointer-events:none;font-size:13.5px;line-height:1.45}
#tooltip.on{display:block}
#tooltip .tnm{font-family:'Cinzel',serif;font-size:14.5px;margin-bottom:2px}
#tooltip .tb2{color:var(--faint);font-size:12px;letter-spacing:.05em;margin-bottom:7px}
#tooltip .imp{color:#8fa8d8}
#tooltip .mod{color:#9db4d4}
#tooltip .rune{color:#c8a96e}
#tooltip .up{color:#8fd08a}
#tooltip .dn{color:#c07a70}
#tooltip .hint{color:var(--faint);font-style:italic;font-size:12px;margin-top:7px}
#tooltip .cmp{margin-top:7px;border-top:1px solid rgba(255,255,255,.07);padding-top:6px;font-size:12.5px}

/* passive tree */
#treecv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#treebar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;z-index:4;
  background:rgba(6,6,9,.8);padding:7px 11px;border-radius:5px;border:1px solid rgba(255,255,255,.06)}
#treebar .pts{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;color:var(--gold)}
#treesearch{background:rgba(255,255,255,.05);border:0;border-bottom:1px solid rgba(200,169,110,.25);
  color:var(--text);padding:5px 8px;font-size:13px;outline:none;width:130px}
#treeinfo{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:rgba(6,6,9,.9);border:1px solid rgba(200,169,110,.2);border-radius:5px;padding:10px 14px;
  max-width:min(92vw,440px);display:none;z-index:4}
#treeinfo.on{display:block}
#treeinfo .nm{font-family:'Cinzel',serif;color:#e3d6b8;font-size:15px}
#treeinfo .st{color:#9db4d4;font-size:13.5px;margin-top:5px;line-height:1.45}
#treeinfo .ds{color:var(--dim);font-style:italic;font-size:13px;margin-top:5px}

/* skills */
.gemcard{background:rgba(255,255,255,.024);border:1px solid rgba(255,255,255,.05);border-radius:5px;
  padding:12px 13px;margin-bottom:10px}
.gemcard.on{border-color:rgba(200,169,110,.35);background:rgba(200,169,110,.07)}
.gemcard .hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.gemcard .nm{font-family:'Cinzel',serif;color:#e3d6b8;font-size:16px}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-family:'Cinzel',serif}
.tag.att{color:#c0895f}.tag.spell{color:#7f9ad0}.tag.combo{color:#8fd08a}
.socks{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.sock{min-width:74px;padding:6px 8px;border:1px dashed rgba(255,255,255,.13);border-radius:3px;
  font-size:11px;color:var(--faint);font-family:'Crimson Pro',serif;text-align:center;background:transparent}
.sock.filled{border-style:solid;border-color:rgba(200,169,110,.3);color:#c8b48a}
.sock.locked{opacity:.35}
.bindrow{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.bind{padding:5px 10px;font-size:10.5px;letter-spacing:.1em;border:1px solid rgba(255,255,255,.08);

.bind.on{color:var(--gold);border-color:rgba(200,169,110,.4);background:rgba(200,169,110,.1)}
.pick{display:block;width:100%;text-align:left;background:rgba(255,255,255,.022);
  border:1px solid rgba(255,255,255,.05);border-left:2px solid rgba(200,169,110,.2);padding:11px 13px;

.pick:disabled{opacity:.4;cursor:default}
.pick .nm{font-family:'Cinzel',serif;color:#e3d6b8;font-size:15px}
.pick .ds{color:var(--dim);font-style:italic;font-size:13.5px;margin-top:4px;font-family:'Crimson Pro',serif}
.pick .mc{color:var(--faint);font-size:12.5px;margin-top:4px;font-family:'Crimson Pro',serif}

/* map overlay */
#mapcv{position:absolute;inset:0;width:100%;height:100%}

@media (max-width:920px),(pointer:coarse){ :root{--hud:1.26} }
@media (max-width:560px){
  :root{--hud:1.1}
  #minimap-wrap,#minimap{width:92px;height:92px}
  /* not enough width for two flask rows side by side: stack each one
     vertically against its own orb instead */
  .flasks{flex-direction:column;bottom:calc(24px + env(safe-area-inset-bottom))}
  #flask-life{left:calc(102px * var(--hud) + 14px)}
  #flask-mana{right:calc(102px * var(--hud) + 14px)}
  /* the stacked flasks are taller, so the button cluster moves up to clear them */
  #tbtns{bottom:calc(196px + env(safe-area-inset-bottom))}
}
@media (max-height:430px){ .scroll{padding-top:calc(12px + env(safe-area-inset-top))} .sect{margin:14px 0 8px} }

/* rim connections, so neighbouring class areas are walkable between */
const TREE_LINKS = [
  /* each class's rim arc runs round to the next class's start, so the whole
     outer edge is walkable in both directions */
  ['st_rim_4','start_strdex'],['sd_rim_4','start_dex'],['dx_rim_4','start_dexint'],
  ['di_rim_4','start_int'],['in_rim_4','start_strint'],['si_rim_4','start_str'],
  ['st_rim2_5','start_strdex'],['sd_rim2_5','start_dex'],['dx_rim2_5','start_dexint'],
  ['di_rim2_5','start_int'],['in_rim2_5','start_strint'],['si_rim2_5','start_str'],
  ['core_n_2','core_e_2'],['core_e_2','core_s_2'],['core_s_2','core_w_2'],['core_w_2','core_n_2']
];

const TREE = {nodes:{}, list:[]};
(function buildTree(){
  function add(id,x,y,type,name,st,desc){
    const n={id:id,x:x,y:y,type:type,name:name,st:st||{},desc:desc||'',adj:[]};
    TREE.nodes[id]=n; TREE.list.push(n);
    return n;
  }
  function link(a,b){
    const A=TREE.nodes[a], B=TREE.nodes[b];
    if(!A||!B) return;
    if(A.adj.indexOf(b)<0) A.adj.push(b);
    if(B.adj.indexOf(a)<0) B.adj.push(a);
  }
  /* class start nodes around the rim */
  for(const k in TREE_STARTS){
    const a=TREE_STARTS[k]*Math.PI/180;
    add('start_'+k, Math.cos(a)*R_START, Math.sin(a)*R_START, 'start',
        START_LABEL[k]+' Start', {}, 'Where this class begins on the tree.');
  }
  for(const br of TREE_BRANCHES){
    let px,py,pid,baseA,baseR;
    if(br.from.start){
      pid='start_'+br.from.start;
      baseA=TREE_STARTS[br.from.start];
      baseR=R_START;
    } else {
      pid=br.from.node;
      const pn=TREE.nodes[pid];
      if(!pn) continue;
      baseA=Math.atan2(pn.y,pn.x)*180/Math.PI;
      baseR=Math.hypot(pn.x,pn.y);
    }
    px=pid;
    br.nodes.forEach((spec,i)=>{
      const step=i+1;
      const ang=(baseA + (br.da||0)*step)*Math.PI/180;
      const rad=baseR + (br.dr||0)*R_STEP*step;
      const id=br.id+'_'+step;
      const type= spec[0]==='k'?'keystone': spec[0]==='n'?'notable':'minor';
      let name=spec[1], st=spec[2]||{}, desc=spec[3]||'';
      if(type==='keystone'){ const ks=KEYSTONES[spec[1]]; name=ks.name; desc=ks.text; }
      add(id, Math.cos(ang)*rad, Math.sin(ang)*rad, type, name, st, desc);
      link(px,id);
      px=id;
    });
  }
  for(const [a,b] of TREE_LINKS) link(a,b);

  /* Relaxation: the authored branches are polar walks, so inward spokes
     crowd near the middle. Push overlapping nodes apart and keep everything
     off the very centre. Class starts stay pinned to the rim. */
  const MIN=46;
  for(let pass=0;pass<90;pass++){
    let moved=0;
    for(let i=0;i<TREE.list.length;i++){
      const a=TREE.list[i];
      for(let j=i+1;j<TREE.list.length;j++){
        const b=TREE.list[j];
        let dx=b.x-a.x, dy=b.y-a.y;
        let d=Math.hypot(dx,dy);
        if(d>=MIN) continue;
        if(d<0.01){ dx=Math.cos(i*2.4); dy=Math.sin(i*2.4); d=1; }
        const push=(MIN-d)/2;
        const ux=dx/d, uy=dy/d;
        if(a.type!=='start'){ a.x-=ux*push; a.y-=uy*push; }
        if(b.type!=='start'){ b.x+=ux*push; b.y+=uy*push; }
        moved++;
      }
    }
    for(const n of TREE.list){
      if(n.type==='start') continue;
      const r=Math.hypot(n.x,n.y);
      if(r<120){ const k=120/(r||1); n.x*=k; n.y*=k; }
      if(r>R_START+40){ const k=(R_START+40)/r; n.x*=k; n.y*=k; }
    }
    if(!moved) break;
  }
})();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rgba(hex,a){
  const h=(hex||'#ffffff').replace('#','');
  const s=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const n=parseInt(s,16);
  if(isNaN(n)) return 'rgba(255,255,255,'+a+')';
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function shadeHex(hex,amt){
  const h=(hex||'#888888').replace('#','');
  const s=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const n=parseInt(s,16);
  if(isNaN(n)) return '#aaaaaa';
  const r=clamp(((n>>16)&255)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function weightedPick(pairs){
  let t=0; for(const p of pairs) t+=p[1];
  let r=Math.random()*t;
  for(const p of pairs){ r-=p[1]; if(r<=0) return p[0]; }
  return pairs[0][0];
}

/* ==========================================================================
   SAVE / LOAD  (localStorage, single key, debounced writes)
   ========================================================================== */
let saveTimer=null, saveDirty=false;
function blankSave(){ return {v:1, chars:new Array(MAX_SLOTS).fill(null), stash:[[],[],[],[]]}; }
function loadSave(){
  let raw=null;
  try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){ raw=null; }
  if(!raw){ G.save=blankSave(); return; }
  try{
    const s=JSON.parse(raw);
    if(!s||typeof s!=='object'||!Array.isArray(s.chars)) throw new Error('shape');
    s.chars.length=MAX_SLOTS;
    for(let i=0;i<MAX_SLOTS;i++) if(s.chars[i]===undefined) s.chars[i]=null;
    if(!Array.isArray(s.stash)) s.stash=[[],[],[],[]];
    while(s.stash.length<4) s.stash.push([]);
    G.save=s;
  }catch(e){
    /* a corrupt save must never brick the game */
    G.save=blankSave();
    G.saveBroken=true;
  }
}
function writeSave(){
  saveDirty=false;
  if(!G.save) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); }
  catch(e){ toast('Could not write to local storage.'); }
}
function markDirty(){
  saveDirty=true;
  if(saveTimer) return;
  saveTimer=setTimeout(()=>{ saveTimer=null; if(saveDirty) writeSave(); }, 900);
}
function flushSave(){ if(saveTimer){clearTimeout(saveTimer);saveTimer=null;} if(saveDirty) writeSave(); }
window.addEventListener('beforeunload',flushSave);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushSave(); });

/* Which passive allocations are active for a given weapon set:
   0 = both sets, 1 = set I only, 2 = set II only. */
function activePassives(ch,set){
  const out=[];
  for(const id in ch.passives){

/* ==========================================================================
   ITEMS
   ========================================================================== */
function slotGroup(base){
  const b=BASES[base];
  return b?b.slot:'';
}
function modAllowed(def,base){
  if(def.slots==='any') return true;
  const g=slotGroup(base);
  return def.slots.split(',').indexOf(g)>=0;
}
function rollTier(def,ilvl){
  const ok=def.tiers.filter(t=>t[0]<=ilvl);
  if(!ok.length) return null;
  /* bias toward the better tiers the item level allows */
  const idx = Math.random()<0.55 ? ok.length-1 : rndi(0,ok.length-1);
  const t=ok[idx];
  const v = t[1]%1 || t[2]%1 ? +rnd(t[1],t[2]).toFixed(1) : rndi(t[1],t[2]);
  return {id:def.id,stat:def.stat,v:v,t:def.tiers.indexOf(t)+1,lo:t[1],hi:t[2]};
}
function rollMod(pool,base,ilvl,exclude){
  const cands=pool.filter(d=>modAllowed(d,base) && exclude.indexOf(d.id)<0 && d.tiers.some(t=>t[0]<=ilvl));
  if(!cands.length) return null;
  return rollTier(pick(cands),ilvl);
}
function rareName(base){
  return pick(RARE_NAMES_A)+' '+pick(RARE_NAMES_B);
}
function makeItem(base,ilvl,rarity,uniqueKey){
  const b=BASES[base];
  if(!b) return null;
  const it={uid:newUid(),b:base,il:Math.max(1,ilvl|0),r:rarity|0,pre:[],suf:[],q:0,
    runes:new Array(runeSocketCount(base)).fill(null),uq:null,idf:true,nm:null,cor:false};
  if(uniqueKey){
    it.uq=uniqueKey; it.r=3; it.idf=false;
    return it;
  }
  if(it.r>=1){
    const nPre = it.r===1 ? (Math.random()<0.5?1:0) : rndi(1,3);
    const nSuf = it.r===1 ? (it.pre.length?1:1) : rndi(1,3);
    const ex=[];
    for(let i=0;i<Math.max(1,nPre);i++){
      const m=rollMod(PREFIXES,base,it.il,ex);
      if(m){ it.pre.push(m); ex.push(m.id); }
    }
    for(let i=0;i<nSuf;i++){
      const m=rollMod(SUFFIXES,base,it.il,ex);
      if(m){ it.suf.push(m); ex.push(m.id); }
    }
    if(it.r===1){ it.pre.length=Math.min(it.pre.length,1); it.suf.length=Math.min(it.suf.length,1); }
  }
  if(it.r>=2){ it.nm=rareName(base); it.idf=false; }
  if(Math.random()<0.35) it.q=rndi(1,12);
  return it;
}
function itemName(it){
  if(!it) return '';
  const b=BASES[it.b];
  if(it.uq) return it.idf? UNIQUES[it.uq].name : 'Unknown '+b.name;
  if(it.r===2) return it.idf? (it.nm+' '+b.name) : 'Unknown '+b.name;
  if(it.r===1 && it.idf){
    const p=it.pre[0], s=it.suf[0];
    let n=b.name;
    if(p) n = MOD_ADJ[p.stat]? MOD_ADJ[p.stat]+' '+n : n;
    if(s) n = n + (MOD_SUF[s.stat]? ' '+MOD_SUF[s.stat] : '');
    return n;
  }
  return b.name;
}
const MOD_ADJ={life:'Healthy',lifePct:'Vigorous',physPct:'Honed',addFire:'Burning',addCold:'Frosted',
  addLight:'Humming',spellPct:'Arcane',armour:'Plated',evasion:'Lithe',es:'Warded',mana:'Deep',
  meleePct:'Brutal',projPct:'Fletched',elePct:'Attuned',spirit:'Devoted',critDmg:'Cruel'};
const MOD_SUF={resFire:'of the Ember',resCold:'of the Frost',resLight:'of the Storm',
  resChaos:'of the Void',resAll:'of Warding',str:'of the Ox',dex:'of the Hawk',int:'of the Scholar',
  aspd:'of Haste',cspd:'of Recital',critChance:'of Precision',moveSpeed:'of the Road',
  lifeRegen:'of Mending',manaRegen:'of Flow',accuracy:'of the Eye',leech:'of Leeching'};

/* every stat an item contributes, implicit + rolled + runes + unique */
function itemMods(it){
  const out={};
  if(!it) return out;
  const b=BASES[it.b];
  const add=(k,v)=>{ if(v) out[k]=(out[k]||0)+v; };
  if(!it.idf){
    /* unidentified items give only their base defences */
    return out;
  }
  if(b.implicit) for(const k in b.implicit) add(k,b.implicit[k]);
  if(it.uq){
    const u=UNIQUES[it.uq];
    for(const k in u.mods) add(k,u.mods[k]);
  }
  for(const m of it.pre) add(m.stat,m.v);
  for(const m of it.suf) add(m.stat,m.v);
  for(const r of it.runes) if(r&&RUNES[r]) for(const k in RUNES[r].mods) add(k,RUNES[r].mods[k]);
  return out;
}
function itemFlags(it){
  return (it && it.uq && it.idf && UNIQUES[it.uq].flags) ? UNIQUES[it.uq].flags : null;
}
/* base defence numbers, lifted by quality */
function itemDefence(it){
  const b=BASES[it.b];
  const q=1+(it.q||0)/100;
  return {armour:Math.round((b.armour||0)*q), evasion:Math.round((b.evasion||0)*q), es:Math.round((b.es||0)*q)};
}
function weaponStats(it){
  if(!it) return {lo:2,hi:4,crit:5,aspd:1.2,kind:'unarmed'};
  const b=BASES[it.b], k=WEAPON_KINDS[b.kind];
  if(!k) return {lo:2,hi:4,crit:5,aspd:1.2,kind:'unarmed'};
  /* a base's damage comes from its item level: this is the main way an
     attack build keeps up with deeper zones */
  const mult=(1+(b.ilvl-1)*0.19)*(1+(it.q||0)/100);
  return {lo:Math.round(k.dmg[0]*mult), hi:Math.round(k.dmg[1]*mult),
    crit:k.crit, aspd:k.aspd, kind:b.kind, hands:k.hands};
}
function itemLevelReq(it){ return Math.max(1, Math.round(BASES[it.b].ilvl*0.9)); }

/* ------------------------------------------------------------------ crafting */
function modCount(it){ return it.pre.length+it.suf.length; }
function maxMods(it){ return it.r===1?2 : it.r===2?6 : 0; }
function addRandomMod(it){
  const ex=it.pre.concat(it.suf).map(m=>m.id);
  const preFull = it.pre.length >= (it.r===1?1:3);
  const sufFull = it.suf.length >= (it.r===1?1:3);
  if(preFull&&sufFull) return false;
  let usePre = !preFull && (sufFull || Math.random()<0.5);
  const m=rollMod(usePre?PREFIXES:SUFFIXES,it.b,it.il,ex);
  if(!m) return false;
  (usePre?it.pre:it.suf).push(m);
  return true;
}
const CRAFT = {
  wisdom:{label:'Identify',can:it=>!it.idf,run:it=>{it.idf=true;return 'Identified.';}},
  transmute:{label:'Transmute',can:it=>it.idf&&it.r===0&&!it.cor,run:it=>{
    it.r=1; addRandomMod(it); return 'Now a magic item.';}},
  augment:{label:'Augment',can:it=>it.idf&&it.r===1&&!it.cor&&modCount(it)<2,run:it=>{
    return addRandomMod(it)?'Added a modifier.':'No modifier could be added.';}},
  regal:{label:'Regal',can:it=>it.idf&&it.r===1&&!it.cor,run:it=>{
    it.r=2; it.nm=rareName(it.b); addRandomMod(it); return 'Now a rare item.';}},
  exalted:{label:'Exalt',can:it=>it.idf&&it.r===2&&!it.cor&&modCount(it)<6,run:it=>{
    return addRandomMod(it)?'Added a modifier.':'No modifier could be added.';}},
  chaos:{label:'Chaos',can:it=>it.idf&&it.r===2&&!it.cor&&modCount(it)>0,run:it=>{
    const all=it.pre.concat(it.suf);
    const victim=pick(all);
    if(it.pre.indexOf(victim)>=0) it.pre.splice(it.pre.indexOf(victim),1);
    else it.suf.splice(it.suf.indexOf(victim),1);
    addRandomMod(it);
    return 'One modifier traded for another.';}},
  divine:{label:'Divine',can:it=>it.idf&&(it.r===1||it.r===2)&&!it.cor&&modCount(it)>0,run:it=>{
    for(const m of it.pre.concat(it.suf)){
      m.v = (m.lo%1||m.hi%1) ? +rnd(m.lo,m.hi).toFixed(1) : rndi(m.lo,m.hi);
    }
    return 'Values rerolled.';}},
  vaal:{label:'Corrupt',can:it=>it.idf&&!it.cor,run:it=>{
    it.cor=true;
    const roll=Math.random();
    if(roll<0.25){ it.q=Math.min(30,(it.q||0)+rndi(6,14)); return 'Corrupted: quality surged.'; }
    if(roll<0.5 && modCount(it)>0){
      const all=it.pre.concat(it.suf);
      for(const m of all) m.v=Math.round(m.v*rnd(1.1,1.35)*10)/10;
      return 'Corrupted: modifiers swelled.';
    }
    if(roll<0.72 && it.r<2){ it.r=2; it.nm=rareName(it.b); addRandomMod(it); addRandomMod(it);
      return 'Corrupted: reforged into a rare.'; }
    if(roll<0.9 && modCount(it)>1){
      const all=it.pre.concat(it.suf); const v=pick(all);
      if(it.pre.indexOf(v)>=0) it.pre.splice(it.pre.indexOf(v),1); else it.suf.splice(it.suf.indexOf(v),1);
      return 'Corrupted: a modifier was eaten.';
    }
    return 'Corrupted: nothing visible changed.';}}
};
function salvageValue(it){
  return 1 + it.r + Math.floor(it.il/6) + (it.q?1:0);
}

/* ==========================================================================
   DERIVED STATS
   Rebuilt from scratch whenever anything that feeds it changes.
   ========================================================================== */
function equippedList(ch,set){
  const out=[];
  const s=ch.sets[set==null?ch.activeSet:set];
  if(s.weapon) out.push(s.weapon);
  if(s.offhand) out.push(s.offhand);
  for(const k in ch.equip) if(ch.equip[k]) out.push(ch.equip[k]);
  return out;
}
function recalc(){
  const ch=G.ch;
  if(!ch) return;
  const set=ch.activeSet;
  const cls=CLASSES[ch.cls];
  const S={};
  const add=(k,v)=>{ if(v) S[k]=(S[k]||0)+v; };

  /* attributes: class base + growth + gear + passives */
  let str=cls.attrs.str, dex=cls.attrs.dex, int=cls.attrs.int;
  const grow=Math.floor((ch.level-1)*0.9);
  if(cls.start==='str') str+=grow*2; else if(cls.start==='dex') dex+=grow*2;
  else if(cls.start==='int') int+=grow*2;
  else if(cls.start==='strdex'){ str+=grow; dex+=grow; }
  else if(cls.start==='strint'){ str+=grow; int+=grow; }
  else { dex+=grow; int+=grow; }

  const keys={};
  /* passive nodes active for this weapon set */
  for(const id of activePassives(ch,set)){
    const n=TREE.nodes[id];
    if(!n) continue;
    for(const k in n.st){
      if(k==='keystone'){ keys[n.st[k]]=1; continue; }
      add(k,n.st[k]);
    }
  }
  /* gear */
  const gear=equippedList(ch,set);
  const flags={};
  for(const it of gear){
    const m=itemMods(it);
    for(const k in m) add(k,m[k]);
    const d=itemDefence(it);
    add('armour',d.armour); add('evasion',d.evasion); add('es',d.es);
    const f=itemFlags(it);
    if(f) for(const k in f) flags[k]=(flags[k]||0)+f[k];
  }
  /* persistent skills (auras and meta gems) reserve spirit */
  let spiritUsed=0;
  const auraMods={};
  ch.gems.forEach((g,i)=>{
    const def=GEMS[g.gem];
    if(!def||!def.spirit) return;
    if(!ch.auras[i]) return;
    spiritUsed+=def.spirit;
    if(def.firePct) auraMods.firePct=(auraMods.firePct||0)+def.firePct;
    if(def.evasionPct) auraMods.evasionPct=(auraMods.evasionPct||0)+def.evasionPct;
    if(def.esPct) auraMods.esPct=(auraMods.esPct||0)+def.esPct;
  });
  for(const k in auraMods) add(k,auraMods[k]);

  str+=(S.str||0)+(S.allAttr||0);
  dex+=(S.dex||0)+(S.allAttr||0);
  int+=(S.int||0)+(S.allAttr||0);

  const st={};
  st.keys=keys; st.flags=flags;
  st.str=str; st.dex=dex; st.int=int;
  st.set=set;

  /* life / mana / energy shield */
  let life = 40 + cls.life + ch.level*9 + str*2 + (S.life||0);
  life *= 1+(S.lifePct||0)/100;
  if(flags.lifePctMult) life *= 1+flags.lifePctMult/100;
  if(keys.hollow_bones) life *= 0.7;
  st.maxLife=Math.max(1,Math.round(life));

  let mana = 20 + cls.mana + ch.level*5 + int*2 + (S.mana||0);
  mana *= 1+(S.manaPct||0)/100;
  if(flags.manaPctMult) mana *= 1+flags.manaPctMult/100;
  if(keys.blood_magic) mana=0;
  st.maxMana=Math.max(0,Math.round(mana));

  let es = (S.es||0) + Math.floor(int*0.5);
  es *= 1+(S.esPct||0)/100;
  if(flags.esZero) es=0;
  st.maxES=Math.max(0,Math.round(es));

  /* defences */
  let armour=(S.armour||0)*(1+(S.armourPct||0)/100);
  let evasion=(35+dex*2+(S.evasion||0))*(1+(S.evasionPct||0)/100);
  if(keys.iron_reflexes){ armour+=evasion; evasion=0; }
  if(keys.unwavering) evasion=0;
  st.armour=Math.round(armour);
  st.evasion=Math.round(evasion);

  /* resistances, capped but over-capped values are kept for penalties */
  const zoneRes = G.zdef && G.zdef.level>=10 ? -(G.zdef.level>=16?30:15) : 0;
  st.res={
    fire:clamp((S.resFire||0)+(S.resAll||0)+zoneRes,-100,RES_CAP),
    cold:clamp((S.resCold||0)+(S.resAll||0)+zoneRes,-100,RES_CAP),
    lightning:clamp((S.resLight||0)+(S.resAll||0)+zoneRes,-100,RES_CAP),
    chaos:clamp((S.resChaos||0)+Math.floor(zoneRes/2),-100,RES_CAP)
  };
  st.resRaw={fire:(S.resFire||0)+(S.resAll||0),cold:(S.resCold||0)+(S.resAll||0),
    lightning:(S.resLight||0)+(S.resAll||0),chaos:(S.resChaos||0)};
  st.zoneRes=zoneRes;

  /* offence */
  const w=weaponStats(ch.sets[set].weapon);
  st.weapon=w;
  st.critChance=w.crit*(1+(S.critChance||0)/100);
  st.critDmg=50+(S.critDmg||0);
  if(keys.resolute){ st.critChance=0; }
  if(keys.ele_overload){ st.critDmg=0; }
  st.accuracy=200+dex*3+(S.accuracy||0);
  st.aspd=w.aspd*(1+(S.aspd||0)/100+dex*0.0015);
  st.cspd=1*(1+(S.cspd||0)/100);
  st.moveSpeed=200*(1+(S.moveSpeed||0)/100);
  st.leech=(S.leech||0)+(flags.leechFlat||0);
  st.lifeRegen=flags.noRegen?0:(1+ch.level*0.12+(S.lifeRegen||0));
  st.manaRegen=(1.4+ch.level*0.16+(S.manaRegen||0));
  st.spiritMax=cls.spirit+30+(S.spirit||0);
  st.spiritUsed=spiritUsed;

  /* damage multipliers by category */
  /* strength scales melee, intelligence scales spells, dexterity scales
     projectiles alongside its attack speed and accuracy */
  st.m={
    phys:1+(S.physPct||0)/100, fire:1+(S.firePct||0)/100, cold:1+(S.coldPct||0)/100,
    lightning:1+(S.lightPct||0)/100, chaos:1+(S.chaosPct||0)/100,
    ele:1+(S.elePct||0)/100+(keys.ele_overload?0.4:0),
    melee:1+(S.meleePct||0)/100+str*0.006, proj:1+(S.projPct||0)/100+dex*0.005,
    spell:1+(S.spellPct||0)/100+int*0.006+(keys.hollow_bones?0.4:0), area:1+(S.areaPct||0)/100,
    dot:1+(S.dotPct||0)/100, all:1+(S.dmgPct||0)/100
  };
  st.added={fire:S.addFire||0,cold:S.addCold||0,lightning:S.addLight||0,physical:S.addPhys||0};
  st.areaSize=1+(S.areaSize||0)/100;
  st.projSpeed=1+(S.projSpeed||0)/100;
  st.build={stun:1+(S.stunBuild||0)/100,freeze:1+(S.freezeBuild||0)/100,
    ignite:1+(S.igniteBuild||0)/100,shock:1+(S.shockBuild||0)/100,
    poison:1+(S.poisonBuild||0)/100+(flags.poisonMore||0)/100,bleed:1+(S.bleedBuild||0)/100};
  st.stunTaken=1-((flags.stunResist||0)/100);
  st.raw=S;
  G.st=st;

  /* clamp the live pools to the new maxima */
  const p=G.player;
  if(p){
    p.life=Math.min(p.life,st.maxLife);
    p.mana=Math.min(p.mana,st.maxMana);
    p.es=Math.min(p.es,st.maxES);
    if(p.life<=0) p.life=1;
  }
}

/* ==========================================================================
   SKILL RESOLUTION
   A gem plus its supports plus the character's stats, resolved to the
   numbers the combat code actually fires with.
   ========================================================================== */
function socketsUnlocked(level){
  let n=0;
  for(const l of SOCK_LADDER) if(level>=l) n++;
  return n;
}
function gemLevelFor(charLevel,def){
  /* gems keep pace with the character, capped by their own requirement */
  return Math.max(1, Math.min(20, charLevel - (def.lvlReq-1)));
}
/* is a support already used anywhere in the build? (uniqueness constraint) */
function supportUsedBy(ch,supId){
  for(let i=0;i<ch.gems.length;i++)
    if(ch.gems[i].sockets.indexOf(supId)>=0) return i;
  return -1;
}
function skillStats(g,idx){
  const def=GEMS[g.gem], st=G.st, ch=G.ch;
  const lvl=gemLevelFor(ch.level,def);
  const mods={}; let manaMult=1;
  const sups=[];
  const nSock=socketsUnlocked(lvl);
  for(let i=0;i<g.sockets.length;i++){
    const s=g.sockets[i];
    if(!s || i>=nSock) continue;
    const sup=SUPPORTS[s];
    if(!sup) continue;
    sups.push(s);
    manaMult*=sup.manaMult;
    for(const k in sup.mods) mods[k]=(mods[k]||0)+sup.mods[k];
  }
  const tags=def.tags;
  const isAttack=tags.indexOf('attack')>=0;
  const isSpell=tags.indexOf('spell')>=0;
  const isArea=tags.indexOf('area')>=0;
  const isProj=tags.indexOf('projectile')>=0;
  const isMelee=tags.indexOf('melee')>=0;

  /* base damage */
  let dmg=0;
  if(isAttack){
    const w=st.weapon;
    dmg=(w.lo+w.hi)/2*(def.dmgMult||1);
    if(def.addBase) dmg+=def.addBase+(def.addPerLvl||0)*(lvl-1);
  } else {
    dmg=((def.base||0)+(def.perLvl||0)*(lvl-1))*(1+(lvl-1)*0.06);
  }
  let dtype=def.dtype||'physical';
  const flags=st.flags||{};
  if(st.keys.avatar_fire) dtype='fire';
  if(flags.allChaos) dtype='chaos';
  if(mods.noEle && dtype!=='physical' && dtype!=='chaos') dtype='physical';

  /* multipliers */
  let mult=st.m.all;
  if(isMelee) mult*=st.m.melee;
  if(isProj) mult*=st.m.proj;
  if(isSpell) mult*=st.m.spell;
  if(isArea) mult*=st.m.area;
  mult*=st.m[dtype==='lightning'?'lightning':dtype]||1;
  if(dtype==='fire'||dtype==='cold'||dtype==='lightning'){
    mult*=st.m.ele;
    if(mods.elePct) mult*=1+mods.elePct/100;
  }
  if(dtype==='physical'&&mods.physPct) mult*=1+mods.physPct/100;
  if(mods.dmgPct) mult*=1+mods.dmgPct/100;
  dmg*=mult;

  /* flat added damage rides along on attacks */
  let addFire=0,addCold=0,addLight=0;
  if(isAttack){
    addFire=st.added.fire; addCold=st.added.cold; addLight=st.added.lightning;
    dmg+=st.added.physical*st.m.phys;
  }
  if(mods.fireAddPct) addFire+=dmg*mods.fireAddPct/100;
  if(mods.noEle){ addFire=0; addCold=0; addLight=0; }
  if(st.keys.avatar_fire){ addFire+=addCold+addLight; addCold=0; addLight=0; }

  const speedStat=isAttack?st.aspd:st.cspd;
  const spdMod=1+((isAttack?(mods.aspd||0):(mods.cspd||0))/100);
  const cd=(def.cd||0)/Math.max(0.25,speedStat*spdMod);

  let mana=Math.round((def.mana||0)*manaMult*(flags.manaCostMult||1));
  const radius=(def.radius||0)*st.areaSize*(1+(mods.radiusPct||0)/100);
  const count=(def.count||1)+(isProj?(mods.projAdd||0):0);

  /* is the weapon right for this skill? */
  let usable=true, reason='';
  if(def.wep){
    const w=ch.sets[ch.activeSet].weapon;
    const kind=w?BASES[w.b].kind:null;
    if(!kind || def.wep.indexOf(kind)<0){
      usable=false;
      reason='Requires '+def.wep.map(k=>WEAPON_KINDS[k].name.toLowerCase()).join(', ');
    }
  }
  const reqAttr=def.attr, need=def.req||0;
  const have = reqAttr==='str'?st.str : reqAttr==='dex'?st.dex : reqAttr==='int'?st.int
    : reqAttr==='strdex'?Math.min(st.str,st.dex) : reqAttr==='strint'?Math.min(st.str,st.int)
    : Math.min(st.dex,st.int);
  let attrPenalty=1;
  if(have<need){
    /* off-attribute gems still work, they just cost more to sustain */
    attrPenalty=1+ (need-have)*0.04;
    mana=Math.round(mana*attrPenalty);
  }
  return {
    def:def, idx:idx, name:def.name, lvl:lvl, type:def.type, dtype:dtype,
    dmg:dmg, addFire:addFire, addCold:addCold, addLight:addLight,
    count:count, radius:radius, range:(def.range||0), speed:(def.speed||0)*st.projSpeed,
    arc:def.arc||0, cd:cd, mana:mana, duration:def.duration||0, interval:def.interval||0,
    chains:(def.chains||0)+(mods.chainAdd||0), pierce:(def.pierce||0)+(mods.pierceAdd||0),
    crit:st.critChance*(1+(mods.critChance||0)/100), critDmg:st.critDmg,
    leech:st.leech+(mods.leechPct||0), noAilment:!!mods.noAilment,
    ailment:def.ailment||null, combo:def.combo||null, spirit:def.spirit||0,
    stunMult:def.stunMult||1, isAttack:isAttack, isSpell:isSpell, isArea:isArea,
    delay:def.delay||0, spread:def.spread||0, erratic:def.erratic||0,
    usable:usable, reason:reason, sups:sups, nSock:socketsUnlocked(lvl),
    bleedMult:def.bleedMult||1, poisonMult:def.poisonMult||1,
    trigger:def.trigger||null, energyMax:def.energyMax||0, energyPer:def.energyPer||0
  };
}
/* the five bound skills for the active weapon set */
function activeSkills(){
  const ch=G.ch;
  const out=[];
  for(let i=0;i<5;i++){
    const gi=ch.loadout[ch.activeSet][i];
    if(gi==null||!ch.gems[gi]){ out.push(null); continue; }
    out.push(skillStats(ch.gems[gi],gi));
  }
  return out;
}

/* ==========================================================================
   SPATIAL HASH — keeps enemy lookups cheap when the room is full
   ========================================================================== */
const BUCKET=128;
function makeBuckets(){ return {cells:new Map(),w:Math.ceil(GRID*TILE/BUCKET)}; }
function bucketKey(x,y){ return ((y/BUCKET)|0)*4096 + ((x/BUCKET)|0); }
function rebuildBuckets(){
  const b=G.bucket;
  b.cells.clear();
  for(const e of G.enemies){
    if(e.dead) continue;
    const k=bucketKey(e.x,e.y);
    let a=b.cells.get(k);
    if(!a){ a=[]; b.cells.set(k,a); }
    a.push(e);
  }
}
function nearbyEnemies(x,y,r){
  const out=[];
  const b=G.bucket;
  const x0=((x-r)/BUCKET)|0, x1=((x+r)/BUCKET)|0;
  const y0=((y-r)/BUCKET)|0, y1=((y+r)/BUCKET)|0;
  for(let cy=y0;cy<=y1;cy++){
    for(let cx=x0;cx<=x1;cx++){
      const a=b.cells.get(cy*4096+cx);
      if(!a) continue;
      for(const e of a) out.push(e);
    }
  }
  if(G.boss && !G.boss.dead && d2(x,y,G.boss.x,G.boss.y)<(r+G.boss.r)*(r+G.boss.r)) out.push(G.boss);
  return out;
}
function allTargets(){
  const out=[];
  for(const e of G.enemies) if(!e.dead&&!e.dying) out.push(e);
  if(G.boss&&!G.boss.dead&&!G.boss.dying) out.push(G.boss);
  return out;
}
function nearestEnemy(x,y,maxR){
  let best=null,bd=(maxR||4000)*(maxR||4000);
  const cands=nearbyEnemies(x,y,maxR||900);
  for(const e of cands){
    if(e.dead||e.dying) continue;
    const d=d2(x,y,e.x,e.y);
    if(d<bd){bd=d;best=e;}
  }
  if(!best){
    for(const e of allTargets()){
      const d=d2(x,y,e.x,e.y);
      if(d<bd){bd=d;best=e;}
    }
  }
  return best;
}

/* ==========================================================================
   MAP GENERATION — organic blobs joined by curved corridors
   ========================================================================== */
const NAV=(tx,ty)=>ty*GRID+tx;
function navAt(tx,ty){
  if(tx<0||ty<0||tx>=GRID||ty>=GRID) return 0;
  return G.nav[NAV(tx,ty)];
}
function walkable(x,y){ return navAt((x/TILE)|0,(y/TILE)|0)===1; }
function makeWobble(){
  const a=rnd(0,TAU),b=rnd(0,TAU),c=rnd(0,TAU),m1=rnd(.12,.26),m2=rnd(.08,.18),m3=rnd(.04,.11);
  return ang=>1+m1*Math.sin(ang*3+a)+m2*Math.sin(ang*5+b)+m3*Math.sin(ang*7+c);
}
function carveBlob(cx,cy,radius){
  const wob=makeWobble();
  const rmax=Math.ceil(radius*1.45)+1;
  for(let ty=cy-rmax;ty<=cy+rmax;ty++){
    if(ty<2||ty>=GRID-2) continue;
    for(let tx=cx-rmax;tx<=cx+rmax;tx++){
      if(tx<2||tx>=GRID-2) continue;
      const dx=tx-cx,dy=ty-cy;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<=radius*wob(Math.atan2(dy,dx))) G.nav[NAV(tx,ty)]=1;
    }
  }
}
function carveDisc(tx,ty,w){
  const r=Math.ceil(w);
  for(let y=ty-r;y<=ty+r;y++){
    if(y<2||y>=GRID-2) continue;
    for(let x=tx-r;x<=tx+r;x++){
      if(x<2||x>=GRID-2) continue;
      if((x-tx)*(x-tx)+(y-ty)*(y-ty)<=w*w) G.nav[NAV(x,y)]=1;
    }
  }
}
function carveCorridor(a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  const len=Math.hypot(dx,dy);
  if(len<1) return;
  const nx=-dy/len,ny=dx/len;
  const amp=rnd(2.5,7.5)*(Math.random()<.5?-1:1);
  const freq=rnd(0.8,2.1), phase=rnd(0,TAU), width=rnd(2,3);
  const steps=Math.ceil(len*1.6);
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const bow=Math.sin(t*Math.PI)*amp+Math.sin(t*Math.PI*freq*2+phase)*amp*0.35;
    carveDisc(Math.round(a.x+dx*t+nx*bow),Math.round(a.y+dy*t+ny*bow),
      width+Math.sin(t*Math.PI*3+phase)*0.4);
  }
}
function scatterBlobs(count){
  const blobs=[];
  let guard=0;
  while(blobs.length<count && guard++<2500){
    const r=rnd(4,12), m=Math.ceil(r*1.5)+4;
    const x=rndi(m,GRID-1-m), y=rndi(m,GRID-1-m);
    let ok=true;
    for(const b of blobs){
      const need=(b.r+r)*0.85;
      if(d2(x,y,b.x,b.y)<need*need){ ok=false; break; }
    }
    if(ok) blobs.push({x:x,y:y,r:r});
  }
  while(blobs.length<Math.min(6,count)){
    const r=rnd(4,9),m=Math.ceil(r*1.5)+4;
    blobs.push({x:rndi(m,GRID-1-m),y:rndi(m,GRID-1-m),r:r});
  }
  return blobs;
}
function connectBlobs(blobs){
  const linked=[0], rest=[];
  for(let i=1;i<blobs.length;i++) rest.push(i);
  while(rest.length){
    let bi=0,bj=0,best=Infinity;
    for(let a=0;a<linked.length;a++) for(let b=0;b<rest.length;b++){
      const d=d2(blobs[linked[a]].x,blobs[linked[a]].y,blobs[rest[b]].x,blobs[rest[b]].y);
      if(d<best){best=d;bi=linked[a];bj=b;}
    }
    const j=rest[bj];
    carveCorridor(blobs[bi],blobs[j]);
    linked.push(j); rest.splice(bj,1);
  }
  const extra=Math.floor(blobs.length*0.28);
  for(let k=0;k<extra;k++){
    const a=rndi(0,blobs.length-1),b=rndi(0,blobs.length-1);
    if(a!==b) carveCorridor(blobs[a],blobs[b]);
  }
}
function floodFrom(tx,ty){
  const seen=new Uint8Array(GRID*GRID);
  if(!navAt(tx,ty)) return seen;
  const q=new Int32Array(GRID*GRID);
  let head=0,tail=0;
  q[tail++]=NAV(tx,ty); seen[NAV(tx,ty)]=1;
  while(head<tail){
    const i=q[head++], x=i%GRID, y=(i-x)/GRID;
    for(let k=0;k<4;k++){
      const nx=x+(k===0?1:k===1?-1:0), ny=y+(k===2?1:k===3?-1:0);
      if(nx<0||ny<0||nx>=GRID||ny>=GRID) continue;
      const ni=NAV(nx,ny);
      if(seen[ni]||G.nav[ni]!==1) continue;
      seen[ni]=1; q[tail++]=ni;
    }
  }
  return seen;
}
function buildEdge(){
  const e=new Uint8Array(GRID*GRID);
  for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++){
    const i=NAV(x,y);
    if(G.nav[i]!==1) continue;
    let m=0;
    if(!navAt(x,y-1)) m|=1;
    if(!navAt(x+1,y)) m|=2;
    if(!navAt(x,y+1)) m|=4;
    if(!navAt(x-1,y)) m|=8;
    e[i]=m;
  }
  G.edge=e;
}
function nearestWalkableTile(tx,ty){
  for(let r=0;r<GRID;r++){
    for(let y=ty-r;y<=ty+r;y++) for(let x=tx-r;x<=tx+r;x++){
      if(Math.max(Math.abs(x-tx),Math.abs(y-ty))!==r) continue;
      if(navAt(x,y)===1) return {x:x,y:y};
    }
  }
  return {x:GRID>>1,y:GRID>>1};
}
function tileCenter(tx,ty){ return {x:tx*TILE+TILE/2,y:ty*TILE+TILE/2}; }

function generateZone(zoneKey){
  const z=ZONES[zoneKey];
  G.zoneKey=zoneKey; G.zdef=z; G.theme=z.theme;
  G.nav=new Uint8Array(GRID*GRID);
  const blobs=scatterBlobs(z.blobs||22);
  for(const b of blobs) carveBlob(b.x,b.y,b.r);
  connectBlobs(blobs);
  buildEdge();
  G.blobs=blobs;
  G.explored=new Uint8Array(GRID*GRID);

  const first=blobs[0];
  const spawn=navAt(first.x,first.y)?{x:first.x,y:first.y}:nearestWalkableTile(first.x,first.y);
  const last=blobs[blobs.length-1];
  let bossT=navAt(last.x,last.y)?{x:last.x,y:last.y}:nearestWalkableTile(last.x,last.y);
  const reach=floodFrom(spawn.x,spawn.y);
  if(!reach[NAV(bossT.x,bossT.y)]){
    /* boss unreachable: put it on the furthest tile we can actually walk to */
    let best=-1,bx=spawn.x,by=spawn.y;
    for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++){
      if(!reach[NAV(x,y)]) continue;
      const d=d2(x,y,spawn.x,spawn.y);
      if(d>best){best=d;bx=x;by=y;}
    }
    bossT={x:bx,y:by};
  }
  G.reach=reach;
  G.spawnTile=spawn;
  G.bossTile=bossT;
  G.exitTile=bossT;
  G.liveBlobs=blobs.filter(b=>{
    const t=navAt(b.x,b.y)?b:nearestWalkableTile(b.x,b.y);
    return reach[NAV(t.x,t.y)]===1;
  });
  if(!G.liveBlobs.length) G.liveBlobs=[blobs[0]];
  bakeSprites(G.theme);
  bakeMinimap();
  initMotes();
}

/* ==========================================================================
   CANVAS + BAKED SPRITES
   Every soft glow is pre-baked. shadowBlur is far too slow to run per
   entity on a tablet, so it is only ever used at bake time.
   ========================================================================== */
const cv=$('cv'), ctx=cv.getContext('2d');
const mmc=$('minimap'), mmx=mmc.getContext('2d');
let mmBase=null;
const VB={x0:0,y0:0,x1:0,y1:0};
function inView(x,y,r){ return x+r>VB.x0&&x-r<VB.x1&&y+r>VB.y0&&y-r<VB.y1; }
function bakeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

const GLOW=new Map();
function glowSprite(color){
  let c=GLOW.get(color);
  if(c) return c;
  if(GLOW.size>64) GLOW.clear();
  const S=64;
  c=bakeCanvas(S,S);
  const x=c.getContext('2d');
  const g=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  g.addColorStop(0,rgba(color,.95)); g.addColorStop(.3,rgba(color,.5));
  g.addColorStop(.65,rgba(color,.15)); g.addColorStop(1,rgba(color,0));
  x.fillStyle=g; x.fillRect(0,0,S,S);
  GLOW.set(color,c);
  return c;
}
const SPR={pad:18,sheet:null,rims:[],bevels:[],edgeTiles:[],haze:null,hazeR:176};
function bakeSprites(theme){
  const P=SPR.pad, S=TILE+P*2;
  SPR.rims=[];
  /* seamless 8x8-tile floor sheet: sampled by world tile position, so the
     floor reads continuous and never shows a tile-shaped edge */
  {
    const SH=TILE*8;
    const c=bakeCanvas(SH,SH), x=c.getContext('2d');
    x.fillStyle=theme.floor; x.fillRect(0,0,SH,SH);
    for(let i=0;i<190;i++){
      const bx=rnd(0,SH),by=rnd(0,SH),br=rnd(9,34);
      const light=Math.random()<0.45;
      const a=light?rnd(.025,.055):rnd(.07,.13);
      for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++){
        const gx=bx+ox*SH, gy=by+oy*SH;
        if(gx<-br||gx>SH+br||gy<-br||gy>SH+br) continue;
        const g=x.createRadialGradient(gx,gy,0,gx,gy,br);
        g.addColorStop(0,(light?'rgba(255,255,255,':'rgba(0,0,0,')+a.toFixed(3)+')');
        g.addColorStop(1,light?'rgba(255,255,255,0)':'rgba(0,0,0,0)');
        x.fillStyle=g; x.beginPath(); x.arc(gx,gy,br,0,TAU); x.fill();
      }
    }
    SPR.sheet=c;
  }
  { /* haze blotches break up any sense of repetition */
    const R=176,c=bakeCanvas(R*2,R*2),x=c.getContext('2d');
    const g=x.createRadialGradient(R,R,0,R,R,R);
    g.addColorStop(0,rgba(theme.rim,.055)); g.addColorStop(.55,rgba(theme.rim,.022));
    g.addColorStop(1,rgba(theme.rim,0));
    x.fillStyle=g; x.beginPath(); x.arc(R,R,R,0,TAU); x.fill();
    SPR.haze=c; SPR.hazeR=R;
  }
  for(let dir=0;dir<4;dir++){
    const c=bakeCanvas(S,S),x=c.getContext('2d');
    x.translate(S/2,S/2); x.rotate(dir*Math.PI/2); x.translate(-S/2,-S/2);
    const g=x.createLinearGradient(0,P-1,0,P+26);
    g.addColorStop(0,rgba(theme.rim,.22)); g.addColorStop(.16,rgba(theme.rim,.13));
    g.addColorStop(.45,rgba(theme.rim,.05)); g.addColorStop(1,rgba(theme.rim,0));
    x.fillStyle=g; x.fillRect(P,P-1,TILE,28);
    SPR.rims.push(c);
  }
  SPR.bevels=[];
  const BR=17;
  for(let dir=0;dir<4;dir++){
    const c=bakeCanvas(TILE,TILE),x=c.getContext('2d');
    x.translate(TILE/2,TILE/2); x.rotate(dir*Math.PI/2); x.translate(-TILE/2,-TILE/2);
    x.fillStyle=theme.bg;
    x.beginPath();
    x.moveTo(TILE-BR,0); x.lineTo(TILE,0); x.lineTo(TILE,BR);
    x.arc(TILE-BR,BR,BR,0,-Math.PI/2,true);
    x.closePath();
    x.shadowColor=rgba(theme.bg,1); x.shadowBlur=3;
    x.fill();
    SPR.bevels.push(c);
  }
  /* one composite per wall-adjacency mask: outward bleed + floor + bevel + rim */
  SPR.edgeTiles=[];
  for(let m=0;m<16;m++) for(let v=0;v<3;v++){
    const c=bakeCanvas(S,S),x=c.getContext('2d');
    x.shadowColor=rgba(theme.floor,.9); x.shadowBlur=P;
    x.fillStyle=theme.floor; x.fillRect(P,P,TILE,TILE);
    x.shadowBlur=P*0.55; x.fillRect(P,P,TILE,TILE);
    x.shadowBlur=0;
    if(!(m&1)) x.clearRect(0,0,S,P);
    if(!(m&2)) x.clearRect(P+TILE,0,P,S);
    if(!(m&4)) x.clearRect(0,P+TILE,S,P);
    if(!(m&8)) x.clearRect(0,0,P,S);
    x.drawImage(SPR.sheet,((v*3)&7)*TILE,((v*5)&7)*TILE,TILE,TILE,P,P,TILE,TILE);
    if((m&1)&&(m&2)) x.drawImage(SPR.bevels[0],P,P);
    if((m&2)&&(m&4)) x.drawImage(SPR.bevels[1],P,P);
    if((m&4)&&(m&8)) x.drawImage(SPR.bevels[2],P,P);
    if((m&8)&&(m&1)) x.drawImage(SPR.bevels[3],P,P);
    if(m&1) x.drawImage(SPR.rims[0],0,0);
    if(m&2) x.drawImage(SPR.rims[1],0,0);
    if(m&4) x.drawImage(SPR.rims[2],0,0);
    if(m&8) x.drawImage(SPR.rims[3],0,0);
    SPR.edgeTiles.push(c);
  }
  GLOW.clear();
}
function bakeMinimap(){
  const S=118;
  mmBase=bakeCanvas(S,S);
  const x=mmBase.getContext('2d');
  const s=S/GRID;
  x.fillStyle=rgba(G.theme.rim,.1);
  for(let ty=0;ty<GRID;ty++) for(let tx=0;tx<GRID;tx++){
    if(G.nav[NAV(tx,ty)]!==1) continue;
    x.fillRect(tx*s,ty*s,Math.ceil(s),Math.ceil(s));
  }
}
const PIXEL_BUDGET=2.6e6;
const VIG={dark:null,red:null};
function resizeCanvas(){
  const w=window.innerWidth,h=window.innerHeight;
  let dpr=Math.min(window.devicePixelRatio||1,G.dprCap);
  const budget=Math.sqrt(PIXEL_BUDGET/Math.max(1,w*h));
  if(dpr>budget) dpr=Math.max(1,budget);
  G.view.w=w; G.view.h=h; G.view.dpr=dpr;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  bakeVignettes();
  const tc=$('treecv'), mc=$('mapcv');
  for(const c of [tc,mc]){
    if(!c) continue;
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    c.style.width=w+'px'; c.style.height=h+'px';
  }
}
function bakeVignettes(){
  const w=Math.max(1,Math.round(G.view.w)),h=Math.max(1,Math.round(G.view.h));
  const mk=(stops,cx,cy,r0,r1)=>{
    const c=bakeCanvas(w,h),x=c.getContext('2d');
    const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);
    for(const s of stops) g.addColorStop(s[0],s[1]);
    x.fillStyle=g; x.fillRect(0,0,w,h);
    return c;
  };
  VIG.dark=mk([[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.6)']],w/2,h*0.46,Math.min(w,h)*0.3,Math.max(w,h)*0.78);
  VIG.red=mk([[0,'rgba(150,20,14,0)'],[1,'rgba(150,20,14,1)']],w/2,h/2,Math.min(w,h)*0.2,Math.max(w,h)*0.72);
}

const PART_MAX=700, DNUM_MAX=90;
let partCursor=0;
function initPools(){
  G.parts=new Array(PART_MAX);
  for(let i=0;i<PART_MAX;i++) G.parts[i]={on:false,x:0,y:0,vx:0,vy:0,life:0,max:1,size:2,color:'#fff',drag:.9,glow:false};
  G.dmgNums=new Array(DNUM_MAX);
  for(let i=0;i<DNUM_MAX;i++) G.dmgNums[i]={on:false,x:0,y:0,vy:0,life:0,max:1,txt:'',color:'#fff',size:14,crit:false};
  partCursor=0;
}
function spawnPart(x,y,vx,vy,life,size,color,drag,glow){
  for(let n=0;n<PART_MAX;n++){
    const i=(partCursor+n)%PART_MAX, p=G.parts[i];
    if(!p.on){
      partCursor=(i+1)%PART_MAX;
      p.on=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;
      p.size=size;p.color=color;p.drag=drag==null?.9:drag;p.glow=!!glow;
      return p;
    }
  }
  return null;
}
function burst(x,y,n,color,spd,size,life,glow){
  for(let i=0;i<n;i++){
    const a=rnd(0,TAU),s=rnd(spd*.35,spd);
    spawnPart(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(life*.6,life),rnd(size*.6,size),color,.9,glow);
  }
}
function dmgNumber(x,y,amount,crit,dtype){
  const color = crit? '#f2d79a' : (DCOLOR[dtype]||'#e8e2d4');
  for(let i=0;i<DNUM_MAX;i++){
    const n=G.dmgNums[i];
    if(n.on) continue;
    n.on=true; n.x=x+rnd(-6,6); n.y=y-8; n.vy=crit?-54:-42;
    n.life=crit?1.05:.8; n.max=n.life;
    n.txt=String(Math.max(1,Math.round(amount)));
    n.color=color; n.size=crit?25:14; n.crit=!!crit;
    return;
  }
}

function monsterScale(level){
  return {hp:1+level*0.30+level*level*0.008, dmg:1+level*0.20};
}
function makeEnemy(defKey,x,y,forceRarity){
  const def=ENEMIES[defKey];
  if(!def) return null;
  const a=ARCH[def.arch];
  const lv=G.zdef.level;
  const sc=monsterScale(lv);
  const e={
    key:defKey,name:def.name,arch:def.arch,x:x,y:y,r:a.r,shape:a.shape,kind:a.kind,
    maxHp:Math.round(a.hp*(def.hp||1)*sc.hp),hp:0,
    dmg:a.dmg*(def.dmg||1)*sc.dmg,speed:a.speed,color:def.color,
    dtype:def.dtype||'physical',ailment:def.ailment||null,
    xp:Math.round(a.xp*(1+lv*0.35)),
    cd:rnd(0,1.4),touchCd:0,hurt:0,dying:0,dead:false,
    rarity:0,mods:[],shield:0,shieldMax:0,pulse:rnd(0,TAU),wob:rnd(0,TAU),
    tele:0,teleMax:0,aim:0,knock:{x:0,y:0},fuse:0,
    ail:{stun:0,freeze:0,ignite:0,shock:0,poison:0,bleed:0},
    ailT:{stun:0,freeze:0,ignite:0,shock:0,poison:0,bleed:0},
    dots:[],threshold:0
  };
  e.hp=e.maxHp;
  e.threshold=Math.max(18,e.maxHp*0.55);   /* ailment meters scale with the monster */
  /* rarity: magic gets 1-2 mods, rare gets 3-4 and a name */
  let rar=forceRarity;
  if(rar==null){
    const roll=Math.random();
    rar = roll<0.06 ? 2 : roll<0.24 ? 1 : 0;
  }
  e.rarity=rar;
  if(rar>0){
    const n = rar===1?rndi(1,2):rndi(3,4);
    const pool=MONSTER_MOD_KEYS.slice();
    for(let i=0;i<n && pool.length;i++){
      const k=pool.splice(rndi(0,pool.length-1),1)[0];
      e.mods.push(k);
    }
    e.maxHp=Math.round(e.maxHp*(rar===1?1.6:2.8));
    e.hp=e.maxHp;
    e.dmg*=rar===1?1.25:1.55;
    e.r=Math.round(e.r*(rar===1?1.14:1.3));
    e.xp=Math.round(e.xp*(rar===1?1.8:3.2));
    e.threshold=Math.max(18,e.maxHp*0.55);
    for(const k of e.mods) MONSTER_MODS[k].apply(e);
    if(rar===2) e.name=pick(RARE_NAMES_A)+' '+pick(RARE_NAMES_B)+', '+def.name;
    else e.name=MONSTER_MODS[e.mods[0]].name+' '+def.name;
  }
  return e;
}
function spawnEnemies(){
  G.enemies=[];
  const z=G.zdef;
  if(!z.pool.length) return;
  for(const b of G.liveBlobs){
    const bt=navAt(b.x,b.y)?b:nearestWalkableTile(b.x,b.y);
    const isSpawn=(bt.x===G.spawnTile.x&&bt.y===G.spawnTile.y);
    const n=rndi(2,4);
    for(let i=0;i<n;i++){
      let placed=false;
      for(let att=0;att<10&&!placed;att++){
        const rad=b.r*rnd(.15,.95), ang=rnd(0,TAU);
        const tx=Math.round(bt.x+Math.cos(ang)*rad), ty=Math.round(bt.y+Math.sin(ang)*rad);
        if(navAt(tx,ty)!==1) continue;
        if(!G.reach[NAV(tx,ty)]) continue;
        const c=tileCenter(tx,ty);
        if(isSpawn && d2(c.x,c.y,G.player.x,G.player.y)<(TILE*5)*(TILE*5)) continue;
        const e=makeEnemy(weightedPick(z.pool),c.x,c.y);
        if(e) G.enemies.push(e);
        placed=true;
      }
      if(!placed && !isSpawn){
        /* every offset missed — fall back to the blob centre rather than skip */
        const c=tileCenter(bt.x,bt.y);
        const e=makeEnemy(weightedPick(z.pool),c.x,c.y);
        if(e) G.enemies.push(e);
      }
    }
  }
}

function placeNpcsAndPortals(){
