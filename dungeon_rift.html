  }
}
/* ==========================================================================
   SOUND — synthesized on the fly, no asset files.
   The context is created on the first real input, because browsers refuse
   to start audio before a gesture.
   ========================================================================== */
const SND={ctx:null,master:null,on:true,vol:0.5};
function sndInit(){
  if(SND.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  try{
    SND.ctx=new AC();
    SND.master=SND.ctx.createGain();
    SND.master.gain.value=SND.on?SND.vol:0;
    SND.master.connect(SND.ctx.destination);
  }catch(e){ SND.ctx=null; }
}
function sndResume(){
  sndInit();
  if(SND.ctx&&SND.ctx.state==='suspended') SND.ctx.resume().catch(()=>{});
}
function tone(o){
  if(!SND.ctx||!SND.on) return;
  const c=SND.ctx, t=c.currentTime;
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.f0,t);
  if(o.f1&&o.f1!==o.f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t+o.dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(o.vol==null?0.3:o.vol,t+Math.min(0.02,o.dur*0.3));
  g.gain.exponentialRampToValueAtTime(0.0008,t+o.dur);
  osc.connect(g); g.connect(SND.master);
  osc.start(t); osc.stop(t+o.dur+0.02);
}
function noise(o){
  if(!SND.ctx||!SND.on) return;
  const c=SND.ctx, t=c.currentTime;
  const len=Math.max(1,Math.floor(c.sampleRate*o.dur));
  const buf=c.createBuffer(1,len,c.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter();
  f.type=o.filter||'bandpass';
  f.frequency.value=o.freq||900;
  f.Q.value=o.q==null?1:o.q;
  const g=c.createGain();
  g.gain.setValueAtTime(o.vol==null?0.25:o.vol,t);
  g.gain.exponentialRampToValueAtTime(0.0008,t+o.dur);
  src.connect(f); f.connect(g); g.connect(SND.master);
  src.start(t);
}
function sfx(name,arg){
  if(!SND.ctx||!SND.on) return;
  switch(name){
    case 'hit':    noise({dur:0.07,freq:560,vol:0.11,q:0.8}); break;
    case 'crit':   noise({dur:0.11,freq:1150,vol:0.2,q:1.4}); tone({type:'triangle',f0:880,f1:420,dur:0.12,vol:0.14}); break;
    case 'cast':   tone({type:'triangle',f0:330,f1:620,dur:0.1,vol:0.09}); break;
    case 'melee':  noise({dur:0.09,freq:330,vol:0.13,filter:'lowpass',q:0.6}); break;
    case 'hurt':   tone({type:'sawtooth',f0:240,f1:90,dur:0.2,vol:0.16}); break;
    case 'kill':   noise({dur:0.14,freq:420,vol:0.1,filter:'lowpass'}); break;
    case 'stun':   tone({type:'square',f0:150,f1:70,dur:0.22,vol:0.13}); break;
    case 'freeze': tone({type:'sine',f0:1400,f1:600,dur:0.26,vol:0.11}); break;
    case 'level':  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone({type:'sine',f0:f,dur:0.3,vol:0.13}),i*90)); break;
    case 'phase':  tone({type:'sawtooth',f0:110,f1:55,dur:0.5,vol:0.18}); noise({dur:0.4,freq:200,vol:0.14,filter:'lowpass'}); break;
    case 'death':  [330,247,196,131].forEach((f,i)=>setTimeout(()=>tone({type:'triangle',f0:f,dur:0.5,vol:0.16}),i*150)); break;
    case 'drop': {
      /* pitched by rarity, so you can hear what fell */
      const r=arg|0;
      const base=[520,700,880,1100][r]||520;
      tone({type:'sine',f0:base,f1:base*1.5,dur:0.12,vol:0.09+r*0.02});
      if(r>=2) setTimeout(()=>tone({type:'sine',f0:base*1.5,dur:0.16,vol:0.1}),90);
      break;
    }
    case 'pickup': tone({type:'sine',f0:760,f1:1020,dur:0.08,vol:0.07}); break;
    case 'craft':  noise({dur:0.16,freq:1500,vol:0.1,q:2}); break;
    case 'portal': tone({type:'sine',f0:180,f1:520,dur:0.4,vol:0.11}); break;
    case 'ui':     tone({type:'sine',f0:440,dur:0.05,vol:0.05}); break;
  }
}
function setSound(on){
  SND.on=!!on;
  if(G.save){ G.save.sound=SND.on; markDirty(); }
  if(SND.master) SND.master.gain.value=SND.on?SND.vol:0;
}

function setHitStop(s){ if(s>G.hitStop) G.hitStop=s; }
function shakeCam(v){ G.cam.shake=Math.min(26,G.cam.shake+v); }
function toast(msg){
  const el=$('toast');
  el.textContent=msg;
  el.classList.add('on');
  G.toastT=2.6;
}

/* ==========================================================================
   ENTITIES
   ========================================================================== */
function makePlayer(){
  const c=tileCenter(G.spawnTile.x,G.spawnTile.y);
  G.player={x:c.x,y:c.y,r:14,face:0,walkT:0,
    life:1,mana:1,es:0,esDelay:0,iframe:0,
    cds:[0,0,0,0,0],energy:{},flask:{life:0,mana:0},
    flaskCharge:{life:0,mana:0},trailT:0,
    ail:{stun:0,freeze:0,ignite:0,shock:0,poison:0,bleed:0},
    ailT:{stun:0,freeze:0,ignite:0,shock:0,poison:0,bleed:0},
    dots:[],shockMag:0,moving:false};
  recalc();
  const p=G.player,st=G.st;
  p.life=st.maxLife; p.mana=st.maxMana; p.es=st.maxES;
  p.flask.life=G.ch.flasks.life; p.flask.mana=G.ch.flasks.mana;
  return p;
}
function monsterScale(level){
  return {hp:1+level*0.30+level*level*0.008, dmg:1+level*0.20};
}
function makeEnemy(defKey,x,y,forceRarity){
  const def=ENEMIES[defKey];
  if(!def) return null;
  const a=ARCH[def.arch];
  const lv=G.zdef.level;
  const sc=monsterScale(lv);
  const e={
    key:defKey,name:def.name,arch:def.arch,x:x,y:y,r:a.r,shape:a.shape,kind:a.kind,
    maxHp:Math.round(a.hp*(def.hp||1)*sc.hp),hp:0,
    dmg:a.dmg*(def.dmg||1)*sc.dmg,speed:a.speed,color:def.color,
    dtype:def.dtype||'physical',ailment:def.ailment||null,
    xp:Math.round(a.xp*(1+lv*0.35)),
    cd:rnd(0,1.4),touchCd:0,hurt:0,dying:0,dead:false,
    rarity:0,mods:[],shield:0,shieldMax:0,pulse:rnd(0,TAU),wob:rnd(0,TAU),
    tele:0,teleMax:0,aim:0,knock:{x:0,y:0},fuse:0,
    ail:{stun:0,freeze:0,ignite:0,shock:0,poison:0,bleed:0},
    ailT:{stun:0,freeze:0,ignite:0,shock:0,poison:0,bleed:0},
    dots:[],threshold:0
  };
  e.hp=e.maxHp;
  /* rarity: magic gets 1-2 mods, rare gets 3-4 and a name */
  let rar=forceRarity;
  if(rar==null){
    const roll=Math.random();
    rar = roll<0.06 ? 2 : roll<0.24 ? 1 : 0;
  }
  e.rarity=rar;
  if(rar>0){
    const n = rar===1?rndi(1,2):rndi(3,4);
    const pool=MONSTER_MOD_KEYS.slice();
    for(let i=0;i<n && pool.length;i++){
      const k=pool.splice(rndi(0,pool.length-1),1)[0];
      e.mods.push(k);
    }
    e.maxHp=Math.round(e.maxHp*(rar===1?1.6:2.8));
    e.hp=e.maxHp;
    e.dmg*=rar===1?1.25:1.55;
    e.r=Math.round(e.r*(rar===1?1.14:1.3));
    e.xp=Math.round(e.xp*(rar===1?1.8:3.2));
    for(const k of e.mods) MONSTER_MODS[k].apply(e);
    if(rar===2) e.name=pick(RARE_NAMES_A)+' '+pick(RARE_NAMES_B)+', '+def.name;
    else e.name=MONSTER_MODS[e.mods[0]].name+' '+def.name;
  }
  /* ailment meters scale with the monster's FINAL life, after rarity and
     modifiers, or Extra Life monsters would freeze faster than normal ones */
  e.threshold=Math.max(18,e.maxHp*0.55);
  return e;
}
function spawnEnemies(){
  G.enemies=[];
  const z=G.zdef;
  if(!z.pool.length) return;
  /* Nothing spawns inside the safe radius around the arrival point, whichever
     blob it happens to sit in. Measured from the spawn tile rather than the
     player so it holds before the player exists. */
  const sp=tileCenter(G.spawnTile.x,G.spawnTile.y);
  const SAFE2=(TILE*5)*(TILE*5);
  for(const b of G.liveBlobs){
    const bt=navAt(b.x,b.y)?b:nearestWalkableTile(b.x,b.y);
    const n=rndi(2,4);
    for(let i=0;i<n;i++){
      let placed=false;
      for(let att=0;att<14&&!placed;att++){
        const rad=b.r*rnd(.15,.95), ang=rnd(0,TAU);
        const tx=Math.round(bt.x+Math.cos(ang)*rad), ty=Math.round(bt.y+Math.sin(ang)*rad);
        if(navAt(tx,ty)!==1) continue;
        if(!G.reach[NAV(tx,ty)]) continue;
        const c=tileCenter(tx,ty);
        if(d2(c.x,c.y,sp.x,sp.y)<SAFE2) continue;
        const e=makeEnemy(weightedPick(z.pool),c.x,c.y);
        if(e) G.enemies.push(e);
        placed=true;
      }
      if(!placed){
        /* every offset missed — fall back to the blob centre, unless that is
           itself inside the safe radius, in which case this one just skips */
        const c=tileCenter(bt.x,bt.y);
        if(d2(c.x,c.y,sp.x,sp.y)<SAFE2) continue;
        const e=makeEnemy(weightedPick(z.pool),c.x,c.y);
        if(e) G.enemies.push(e);
      }
    }
  }
}
function makeBoss(){
  const z=G.zdef;
  if(!z.boss){ G.boss=null; return null; }
  if(G.ch.zonesCleared&&G.ch.zonesCleared[G.zoneKey]){
    /* already killed here: the zone stays clear until deliberately reawakened */
    G.boss=null; return null;
  }
  const def=BOSSES[z.boss];
  const c=tileCenter(G.bossTile.x,G.bossTile.y);
  const b={
    key:z.boss,name:def.name,boss:true,x:c.x,y:c.y,r:def.r,rot:0,
    maxHp:Math.round(def.hp*(1+z.level*0.07)),hp:0,dmg:def.dmg*(1+z.level*0.05),
    color:def.color,rim:z.theme.rim,dtype:'physical',
    patterns:def.patterns,minion:def.minion,
    phase:1,hurt:0,dying:0,dead:false,awake:false,speed:64,touchCd:0,
    cds:{},windup:null,dash:null,rarity:3,mods:[],shield:0,shieldMax:0,
    ail:{stun:0,freeze:0,ignite:0,shock:0,poison:0,bleed:0},
    ailT:{stun:0,freeze:0,ignite:0,shock:0,poison:0,bleed:0},
    dots:[],xp:Math.round(260*(1+z.level*0.5)),
    pulse:0,wob:0,knock:{x:0,y:0},tele:0,teleMax:0
  };
  b.hp=b.maxHp;
  b.threshold=b.maxHp*0.42;

}
function placeNpcsAndPortals(){
  G.npcs=[]; G.portals=[];
  const z=G.zdef;
  if(z.layout){
    /* fixtures stand exactly where the layout puts them, every visit */
    const spots=G.hubSpots||{};
    for(const letter in z.layout.at){
      const key=z.layout.at[letter];
      const t=spots[letter], f=FIXTURES[key];
      if(!t||!f) continue;
      const c=tileCenter(t.x,t.y);
      G.npcs.push({id:key,name:f.name,kind:f.kind,line:f.line,mech:f.mech,x:c.x,y:c.y,r:20});
    }
    const dest=(G.zoneKey==='hideout')?(G.ch.returnZone||'town'):(G.ch.reached||'drowned_shore');
    const pt=spots.P||G.spawnTile;
    const c=tileCenter(pt.x,pt.y);
    G.portals.push({kind:'zone',to:dest,x:c.x,y:c.y,r:26,
      label:(G.zoneKey==='hideout'?'Return to ':'Descend to ')+ZONES[dest].name});
  } else {
    /* every zone has a way back to town at its entrance, and an exit at the far end */
    const s=tileCenter(G.spawnTile.x,G.spawnTile.y);
    const q=snapToWalkable(s.x,s.y-60,26);
    G.portals.push({kind:'zone',to:'town',x:q.x,y:q.y,r:26,label:'Return to '+ZONES.town.name});
    if(z.next){
      const e=tileCenter(G.exitTile.x,G.exitTile.y);
      const sealed = !!z.boss && !(G.ch.zonesCleared&&G.ch.zonesCleared[G.zoneKey]);
      const q=snapToWalkable(e.x,e.y+70,26);
      G.portals.push({kind:'zone',to:z.next,x:q.x,y:q.y,r:26,locked:sealed,
        label:'Continue to '+ZONES[z.next].name});
    }
  }
}
function enterZone(zoneKey){
  const ch=G.ch;
  generateZone(zoneKey);
  ch.zone=zoneKey;
  if(ch.waypoints.indexOf(zoneKey)<0){ ch.waypoints.push(zoneKey); toast('Waypoint unlocked: '+ZONES[zoneKey].name); }
  const order=ZONE_ORDER.indexOf(zoneKey);
  const reachedOrder=ZONE_ORDER.indexOf(ch.reached||'drowned_shore');
  if(order>reachedOrder) ch.reached=zoneKey;
  G.shots=[]; G.fx=[]; G.clouds=[]; G.totems=[]; G.pickups=[]; G.enemies=[]; G.boss=null;
  G.hitStop=0; G.flash=0; G.dead=false;
  if(G.player){
    G.player.dots.length=0;
    for(const k of AILMENTS){ G.player.ail[k]=0; G.player.ailT[k]=0; }
  }
  initPools();
  if(!G.player) makePlayer();
  else {
    const c=tileCenter(G.spawnTile.x,G.spawnTile.y);
    G.player.x=c.x; G.player.y=c.y; G.player.iframe=1;
  }
  G.bucket=makeBuckets();
  recalc();
  spawnEnemies();
  makeBoss();
  placeNpcsAndPortals();
  G.cam.x=G.player.x; G.cam.y=G.player.y; G.cam.shake=0;
  for(let i=0;i<5;i++) G.player.cds[i]=0;
  G.player.energy={};
  $('bossbar').classList.remove('on');
  buildSlotUI();
  updatePointBadge();
  markDirty();
  toast(ZONES[zoneKey].name+(ZONES[zoneKey].town?'':' · level '+ZONES[zoneKey].level));
  if(G.st&&G.st.zoneRes) setTimeout(()=>toast('This depth saps resistances by '+G.st.zoneRes+'%'),2200);
}

/* ==========================================================================
   AILMENTS
   Buildup meters, not instant application. Every meter is drawn above the
   monster so the player can read how close it is.
   ========================================================================== */
function ailmentActive(e,type){ return e.ailT[type]>0; }
function addBuildup(e,type,amount,hitDmg){
  if(!amount||amount<=0) return;
  const st=G.st;
  /* keystones that take an ailment away from you entirely */
  if(type==='stun'&&st.noStun) return;
  if(type==='ignite'&&st.noIgnite) return;
  if(type==='freeze'&&st.noBossFreeze&&e.boss) return;
  e.ail[type]=(e.ail[type]||0)+amount*(st.build[type]||1);
  if(e.ail[type]<e.threshold) return;
  e.ail[type]=0;
  switch(type){
    case 'stun':
      if(e.boss){
        if(e.ailImmune&&e.ailImmune.stun>0) return;
        if(!e.ailImmune) e.ailImmune={};
        e.ailImmune.stun=2.6;
        e.ailT.stun=Math.max(e.ailT.stun,0.55);
      }
      else e.ailT.stun=Math.max(e.ailT.stun,1.3);
      burst(e.x,e.y,10,'#e8d8a0',150,3,.4,true);
      break;
    case 'freeze':
      if(e.boss){
        /* without this, enough cold buildup perma-freezes any boss */
        if(e.ailImmune&&e.ailImmune.freeze>0) return;
        if(!e.ailImmune) e.ailImmune={};
        e.ailImmune.freeze=3.2;
      }
      e.ailT.freeze=Math.max(e.ailT.freeze,e.boss?0.8:1.7);
      burst(e.x,e.y,14,'#8fd0e8',170,3.2,.5,true);
      onFreeze(e);
      break;
    case 'ignite':
      addDot(e,'ignite',hitDmg*0.5*(st.build.ignite||1)*st.m.dot,4,'fire');
      break;
    case 'shock':
      e.ailT.shock=4;
      e.shockMag=clamp(0.15+hitDmg/Math.max(1,e.maxHp)*0.9,0.1,0.5)*
        ((st.flags.shockDouble)?2:1);
      break;
    case 'poison':
      addDot(e,'poison',hitDmg*0.32*st.m.dot,
        (G.st.flags.poisonShort?3:6),'chaos',true);
      break;
    case 'bleed':
      addDot(e,'bleed',hitDmg*0.42*st.m.dot,5,'physical',
        G.st.keys.crimson_dance?true:false,true);
      break;
  }
}
function addDot(e,kind,dps,dur,dtype,stacking,moveScaled){
  if(!(dps>0)) return;
  if(G.st.keys.crimson_dance && kind==='bleed'){
    const cur=e.dots.filter(d=>d.kind==='bleed');
    if(cur.length>=4) e.dots.splice(e.dots.indexOf(cur[0]),1);
    dps*=0.55;
  } else if(!stacking){
    const ex=e.dots.find(d=>d.kind===kind);
    if(ex){ if(dps>ex.dps){ ex.dps=dps; ex.t=dur; } return; }
  }
  e.ailT[kind]=Math.max(e.ailT[kind],dur);
  e.dots.push({kind:kind,dps:dps,t:dur,dtype:dtype,moveScaled:!!moveScaled});
}
function onFreeze(e){
  /* meta gems that trigger on freeze */
  const ch=G.ch;
  ch.gems.forEach((g,i)=>{
    const def=GEMS[g.gem];
    if(def && def.trigger==='freeze' && ch.auras[i]) addEnergy(i,def);
  });
  if(G.st.flags.freezeAura){
    for(const o of nearbyEnemies(e.x,e.y,150)){
      if(o===e||o.dead) continue;
      o.ail.freeze=(o.ail.freeze||0)+o.threshold*0.5;
    }
  }
}
function addEnergy(gemIdx,def){
  const p=G.player;
  p.energy[gemIdx]=(p.energy[gemIdx]||0)+def.energyPer;
  if(p.energy[gemIdx]>=def.energyMax){
    p.energy[gemIdx]=0;
    fireMetaGem(gemIdx);
  }
}

/* --------------------------------------------------- player-side ailments
   Monsters build these on the player exactly the way the player builds them
   on monsters: a meter that fills, then fires. The meters are drawn on the
   HUD beside the life orb. */
function playerThreshold(){ return Math.max(30,G.st.maxLife*0.5); }
function addPlayerBuildup(type,amount,hitDmg){
  const p=G.player,st=G.st;
  if(!p||!amount||amount<=0) return;
  if(type==='stun'){
    if(st.keys.unwavering) return;          /* Unwavering Stance: never stunned */
    amount*=st.stunTaken;                   /* Quarryman's Belt and friends */
  }
  if(type==='freeze'&&st.keys.unwavering) amount*=0.5;
  p.ail[type]=(p.ail[type]||0)+amount;
  if(p.ail[type]<playerThreshold()) return;
  p.ail[type]=0;
  switch(type){
    case 'stun':
      p.ailT.stun=0.55;
      burst(p.x,p.y,12,'#e8d8a0',170,3,.45,true);
      shakeCam(11); sfx('stun');
      break;
    case 'freeze':
      p.ailT.freeze=0.9;
      burst(p.x,p.y,14,'#8fd0e8',170,3.2,.5,true);
      sfx('freeze');
      break;
    case 'ignite':
      addPlayerDot('ignite',hitDmg*0.28,4,'fire');
      break;
    case 'shock':
      p.ailT.shock=4;
      p.shockMag=clamp(0.12+hitDmg/Math.max(1,st.maxLife)*0.8,0.1,0.4);
      break;
    case 'poison':
      addPlayerDot('poison',hitDmg*0.2,6,'chaos',true);
      break;
    case 'bleed':
      addPlayerDot('bleed',hitDmg*0.26,5,'physical',false,true);
      break;
  }
}
function addPlayerDot(kind,dps,dur,dtype,stacking,moveScaled){
  const p=G.player;
  if(!(dps>0)) return;
  if(!stacking){
    const ex=p.dots.find(d=>d.kind===kind);
    if(ex){ if(dps>ex.dps){ ex.dps=dps; ex.t=dur; } return; }
  }
  p.ailT[kind]=Math.max(p.ailT[kind],dur);
  p.dots.push({kind:kind,dps:dps,t:dur,dtype:dtype,moveScaled:!!moveScaled});
}
function tickPlayerAilments(dt){
  const p=G.player,st=G.st;
  if(!p) return;
  for(const k of AILMENTS){
    if(p.ailT[k]>0) p.ailT[k]-=dt;
    if(p.ail[k]>0) p.ail[k]=Math.max(0,p.ail[k]-playerThreshold()*0.16*dt);
  }
  for(let i=p.dots.length-1;i>=0;i--){
    const d=p.dots[i];
    d.t-=dt;
    let dps=d.dps;
    if(d.moveScaled&&p.moving) dps*=2.0;
    /* over-time damage respects resistances but not armour or evasion */
    let amt=dps*dt;
    if(d.dtype!=='physical') amt*=1-(st.res[d.dtype]||0)/100;
    p.life-=amt;
    if(Math.random()<dt*3) spawnPart(p.x+rnd(-10,10),p.y+rnd(-10,10),0,rnd(-22,-6),.4,2,DCOLOR[d.dtype],.9,true);
    if(d.t<=0) p.dots.splice(i,1);
  }
  if(p.life<=0&&!G.dead){ p.life=0; onDeath(); }
}
function playerStunned(){
  const p=G.player;
  return p&&(p.ailT.stun>0||p.ailT.freeze>0);
}

/* ==========================================================================
   DAMAGE
   ========================================================================== */
function monsterTakeDamage(e,base,dtype,crit,sk,kx,ky){
  if(e.dead||e.dying) return 0;
  let dmg=base;
  /* combo payoff: a finisher lands harder on a primed target */
  let comboed=null;
  if(sk&&sk.combo==='finisher'){
    if(ailmentActive(e,'freeze')){ dmg*=1.6; comboed='shatter'; }
    else if(ailmentActive(e,'stun')){ dmg*=1.45; comboed='stun'; }
    else if(ailmentActive(e,'ignite')){ dmg*=1.4; comboed='detonate'; }
  }
  if(G.st.flags.shatterCrit && crit && ailmentActive(e,'freeze')) dmg*=1.4;
  /* Perfect Agony trades hit damage for ailment magnitude on every crit */
  if(crit && G.st.keys.perfect_agony) dmg*=0.65;
  /* Point Blank reads the distance the hit actually travelled */
  if(G.st.keys.point_blank && sk && !sk.isSpell && sk.speed>0){
    const d=dist(G.player.x,G.player.y,e.x,e.y);
    if(d<200) dmg*=1.45; else if(d>500) dmg*=0.65;
  }
  if(e.ailT.shock>0) dmg*=1+(e.shockMag||0.2)*(G.st.shockMult||1);
  if(e.shieldMax>0&&e.shield>0){
    dmg*=0.45;
    e.shield-=dmg;
    if(e.shield<=0){ e.shield=0; burst(e.x,e.y,14,'#cfe0ff',210,3.4,.5,true); }
  }
  e.hp-=dmg;
  e.hurt=0.12;
  if(kx||ky){ e.knock.x+=kx; e.knock.y+=ky; }
  dmgNumber(e.x,e.y-e.r,dmg,crit,dtype);
  burst(e.x,e.y,crit?15:6,crit?'#f2d79a':(DCOLOR[dtype]||e.color),crit?290:170,crit?4:2.8,crit?.5:.32,true);
  setHitStop(e.boss?0.08:(crit?0.08:0.05));
  shakeCam(crit?5:1.6);
  sfx(crit?'crit':'hit');
  if(comboed==='shatter'){
    burst(e.x,e.y,26,'#a8e0f0',300,4,.6,true);
    e.ailT.freeze=0;
    spawnFx({type:'shock',x:e.x,y:e.y,r:0,max:90,life:.35,maxLife:.35,color:'#a8e0f0'});
  } else if(comboed==='detonate'){
    const d=e.dots.find(x=>x.kind==='ignite');
    if(d){
      const boom=d.dps*d.t*0.8;
      e.dots.splice(e.dots.indexOf(d),1);
      spawnFx({type:'shock',x:e.x,y:e.y,r:0,max:130,life:.4,maxLife:.4,color:'#e07a3c'});
      for(const o of nearbyEnemies(e.x,e.y,130)){
        if(o===e||o.dead||o.dying) continue;
        o.hp-=boom; o.hurt=.12;
        dmgNumber(o.x,o.y-o.r,boom,false,'fire');
        if(o.hp<=0) killEnemy(o);
      }
      e.hp-=boom;
      dmgNumber(e.x,e.y-e.r-14,boom,false,'fire');
    }
  } else if(comboed==='stun'){
    shakeCam(6); setHitStop(0.09);
  }
  /* ailment buildup from this hit */
  if(sk && !sk.noAilment){
    const ag=(crit&&G.st.keys.perfect_agony)?1.6:1;
    if(sk.ailment) addBuildup(e,sk.ailment,dmg*ag*(sk.ailment==='bleed'?sk.bleedMult:sk.ailment==='poison'?sk.poisonMult:1),dmg);
    if(dtype==='physical') addBuildup(e,'stun',dmg*0.55*ag*(sk.stunMult||1),dmg);
    else if(dtype==='fire'&&!sk.ailment) addBuildup(e,'ignite',dmg*0.3*ag,dmg);
    else if(dtype==='cold'&&!sk.ailment) addBuildup(e,'freeze',dmg*0.35*ag,dmg);
    else if(dtype==='lightning'&&!sk.ailment) addBuildup(e,'shock',dmg*0.3*ag,dmg);
  }
  /* leech and meta triggers */
  if(sk&&sk.leech>0) healPlayer(dmg*sk.leech/100,true);
  if(crit){
    const ch=G.ch;
    ch.gems.forEach((g,i)=>{
      const def=GEMS[g.gem];
      if(def&&def.trigger==='crit'&&ch.auras[i]) addEnergy(i,def);
    });
  }
  gainFlaskCharge(dmg);
  if(e.hp<=0) killEnemy(e);
  return dmg;
}
function killEnemy(e){
  if(e.dead||e.dying) return;
  e.dying=0.2; e.hp=0;
  sfx('kill');
  burst(e.x,e.y,e.boss?70:(e.rarity===2?26:14),e.color,e.boss?420:240,e.boss?6:3.4,.7,true);
  if(e.boss){ shakeCam(24); setHitStop(0.12); return; }
  G.kills++; G.ch.kills++;
  gainXp(e.xp);
  gainFlaskCharge(60);
  dropLoot(e);
  if(e.mods.indexOf('volatile')>=0){
    spawnFx({type:'shock',x:e.x,y:e.y,r:0,max:130,life:.42,maxLife:.42,color:'#ff9a45'});
    burst(e.x,e.y,30,'#ff9a45',340,4.4,.6,true);
    if(d2(G.player.x,G.player.y,e.x,e.y)<130*130) damagePlayer(e.dmg*1.3,'fire',e);
    for(const o of nearbyEnemies(e.x,e.y,130)){
      if(o===e||o.dead||o.dying) continue;
      o.hp-=e.dmg*0.9; if(o.hp<=0) killEnemy(o);
    }
    shakeCam(10);
  }
  if(e.mods.indexOf('necro')>=0 && G.zdef.pool.length && Math.random()<0.8){
    /* a necromancer raises what it can reach on the way out */
    for(let i=0;i<2;i++){
      const a=rnd(0,TAU),rr=rnd(24,60);
      const x=e.x+Math.cos(a)*rr,y=e.y+Math.sin(a)*rr;
      if(!canStand(x,y,14)) continue;
      const m=makeEnemy(weightedPick(G.zdef.pool),x,y,0);
      if(m){ m.maxHp=Math.round(m.maxHp*0.6); m.hp=m.maxHp; G.enemies.push(m); burst(x,y,10,'#9a7ac0',150,3,.5,true); }
    }
  }
  if(G.st.flags.igniteSpread && ailmentActive(e,'ignite')){
    const d=e.dots.find(x=>x.kind==='ignite');
    if(d) for(const o of nearbyEnemies(e.x,e.y,150)){
      if(o===e||o.dead||o.dying) continue;
      addDot(o,'ignite',d.dps*0.7,d.t,'fire');
    }
  }
}
function evadeRoll(){
  const st=G.st;
  if(st.keys.iron_reflexes||st.keys.unwavering) return false;
  const ev=st.evasion;
  if(ev<=0) return false;
  const acc=340+G.zdef.level*90;
  const chance=clamp(ev/(ev+acc),0,0.75);
  return Math.random()<chance;
}
function damagePlayer(amount,dtype,src){
  const p=G.player,st=G.st;
  if(!p||p.iframe>0||G.dead||G.paused) return;
  if(evadeRoll()){
    dmgNumber(p.x,p.y-p.r-6,0,false,'physical','evaded');
    return;
  }
  let dmg=amount;
  dtype=dtype||'physical';
  if(dtype==='physical'){
    const red=st.armour/(st.armour+10*Math.max(1,dmg));
    dmg*=1-clamp(red,0,0.85);
  } else {
    const r=st.res[dtype]||0;
    dmg*=1-r/100;
  }
  dmg=Math.max(1,dmg);
  if(st.armourAllTypes&&dtype!=='physical'&&dtype!=='chaos'){
    /* Runic Skin: armour applies in full to elemental hits as well */
    const red=st.armour/(st.armour+10*Math.max(1,dmg));
    dmg*=1-clamp(red,0,0.85);
  }
  if(p.ailT.shock>0) dmg*=1+(p.shockMag||0.15);
  dmg*=st.dmgTaken||1;
  /* Mind over Matter takes its share out of mana, and stops when mana runs
     out rather than silently going back to life */
  if(st.mindMatter>0&&p.mana>0){
    const want=dmg*st.mindMatter;
    const paid=Math.min(p.mana,want);
    p.mana-=paid; dmg-=paid;
    if(paid>0) burst(p.x,p.y,6,'#6a9fd8',150,2.4,.3,true);
  }
  /* whatever the attacker is enchanted with builds on the player */
  if(src){
    if(src.ailment) addPlayerBuildup(src.ailment,dmg*1.1,dmg);
    else if(dtype==='physical') addPlayerBuildup('stun',dmg*0.6,dmg);
    else if(dtype==='fire') addPlayerBuildup('ignite',dmg*0.35,dmg);
    else if(dtype==='cold') addPlayerBuildup('freeze',dmg*0.4,dmg);
    else if(dtype==='lightning') addPlayerBuildup('shock',dmg*0.35,dmg);
  } else if(dtype==='physical') addPlayerBuildup('stun',dmg*0.4,dmg);
  /* energy shield takes the hit first, then delays its recharge */
  if(p.es>0){
    const absorb=Math.min(p.es,dmg);
    p.es-=absorb; dmg-=absorb;
    if(!st.wardUninterrupted) p.esDelay=2.4*(st.esDelayMult||1);
    burst(p.x,p.y,8,'#96c8e6',170,2.8,.35,true);
  }
  if(dmg>0){ p.life-=dmg; if(!st.wardUninterrupted) p.esDelay=2.4*(st.esDelayMult||1); }
  p.iframe=0.34;
  G.flash=Math.min(1,0.3+ (amount/Math.max(1,st.maxLife))*2.2);
  dmgNumber(p.x,p.y-p.r-6,amount,false,dtype);
  burst(p.x,p.y,11,'#c0402f',210,3.2,.42,true);
  setHitStop(0.08);
  shakeCam(9+Math.min(14,amount*0.4));
  sfx('hurt');
  if(src&&src.mods&&src.mods.indexOf('vampiric')>=0){
    src.hp=Math.min(src.maxHp,src.hp+amount*1.4);
    burst(src.x,src.y,9,'#e06a8a',150,3,.4,true);
  }
  if(p.life<=0){ p.life=0; onDeath(); }
}
function healPlayer(amount,quiet){
  const p=G.player,st=G.st;
  if(!p||amount<=0) return;
  const before=p.life;
  p.life=Math.min(st.maxLife,p.life+amount);
  const got=p.life-before;
  if(got>0.5&&!quiet){
    dmgNumber(p.x,p.y-p.r-6,got,false,'physical');
    burst(p.x,p.y,10,'#8fd08a',150,2.8,.5,true);
  }
}
function restoreMana(amount){
  const p=G.player,st=G.st;
  p.mana=Math.min(st.maxMana,p.mana+amount);
}

/* ------------------------------------------------------------------- flasks
   Flasks refill by dealing damage and killing, never from inventory. */
function gainFlaskCharge(dmg){
  const p=G.player;
  if(!p) return;
  const gain=dmg*0.35*(1+(G.st.raw.flaskCharge||0)/100);
  p.flaskCharge.life+=gain; p.flaskCharge.mana+=gain;
  const need=90+G.ch.level*14;
  while(p.flaskCharge.life>=need && p.flask.life<G.ch.flasks.life){ p.flaskCharge.life-=need; p.flask.life++; }
  while(p.flaskCharge.mana>=need && p.flask.mana<G.ch.flasks.mana){ p.flaskCharge.mana-=need; p.flask.mana++; }
  if(p.flask.life>=G.ch.flasks.life) p.flaskCharge.life=Math.min(p.flaskCharge.life,need);
  if(p.flask.mana>=G.ch.flasks.mana) p.flaskCharge.mana=Math.min(p.flaskCharge.mana,need);
}
function useFlask(kind){
  const p=G.player;
  if(!p||G.dead) return;
  if(p.flask[kind]<=0){ toast('No '+kind+' flask charges.'); return; }
  p.flask[kind]--;
  if(kind==='life'){ healPlayer(G.st.maxLife*0.38); burst(p.x,p.y,16,'#c0463a',180,3,.6,true); }
  else { restoreMana(G.st.maxMana*0.45); burst(p.x,p.y,16,'#4a76ad',180,3,.6,true); }
}

/* ==========================================================================
   PROGRESSION
   ========================================================================== */
function gainXp(v){
  const ch=G.ch;
  ch.xp+=v;
  let leveled=0;
  while(ch.xp>=xpForLevel(ch.level) && ch.level<MAX_LEVEL){
    ch.xp-=xpForLevel(ch.level);
    ch.level++;
    leveled++;
  }
  if(leveled){
    recalc();
    const p=G.player;
    p.life=G.st.maxLife; p.mana=G.st.maxMana; p.es=G.st.maxES;
    burst(p.x,p.y,40,'#e0c070',300,4,.9,true);
    spawnFx({type:'shock',x:p.x,y:p.y,r:0,max:200,life:.7,maxLife:.7,color:'#e0c070'});
    /* no popup: a toast plus a standing badge on the tree button say it all */
    const left=charPoints(ch)-pointsSpent(ch);
    toast('Level '+ch.level+' — '+left+' passive point'+(left===1?'':'s'));
    sfx('level');
    buildSlotUI();
    updatePointBadge();
  }
  markDirty();
}
function onDeath(){
  const ch=G.ch;
  G.dead=true;
  ch.deaths++;
  /* death costs experience, never gear */
  const lost=Math.round(xpForLevel(ch.level)*0.10);
  const actual=Math.min(ch.xp,lost);
  ch.xp-=actual;
  G.deathXpLost=actual;
  burst(G.player.x,G.player.y,60,'#c04a3c',340,5,1.1,true);
  shakeCam(20);
  sfx('death');
  markDirty();
  setTimeout(()=>{ if(G.dead) openPanel('death'); },700);
}
function respawn(){
  const ch=G.ch;
  const wp = ch.waypoints.indexOf(ch.zone)>=0 ? ch.zone : 'town';
  G.dead=false;
  closePanel();
  enterZone(wp);
  const p=G.player;
  p.life=G.st.maxLife; p.mana=G.st.maxMana; p.es=G.st.maxES;
  p.flask.life=G.ch.flasks.life; p.flask.mana=G.ch.flasks.mana;
}

/* ==========================================================================
   MOVEMENT / COLLISION
   The nav grid is consulted before movement is applied, and X and Y are
   resolved separately so entities slide along walls instead of sticking.
   ========================================================================== */
function canStand(x,y,r){
  const k=r*0.72;
  return walkable(x,y)&&walkable(x-k,y)&&walkable(x+k,y)&&walkable(x,y-k)&&walkable(x,y+k);
}
function moveEnt(e,dx,dy){
  if(dx){ const nx=e.x+dx; if(canStand(nx,e.y,e.r)) e.x=nx; }
  if(dy){ const ny=e.y+dy; if(canStand(e.x,ny,e.r)) e.y=ny; }
}
function distToSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  if(l2===0) return dist(px,py,ax,ay);
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);
  return dist(px,py,ax+dx*t,ay+dy*t);
}
function spawnShot(o){
  const s={x:o.x,y:o.y,vx:o.vx,vy:o.vy,r:o.r||6,dmg:o.dmg,dtype:o.dtype||'physical',
    color:o.color||'#fff',from:o.from,life:o.life||2.2,pierce:o.pierce||0,chains:o.chains||0,
    hitList:[],trail:[],size:o.size||1,crit:!!o.crit,sk:o.sk||null,homing:o.homing||0,
    wallSplit:o.wallSplit||0,erratic:o.erratic||0,ailment:o.ailment||null};
  G.shots.push(s);
  return s;
}
function spawnFx(o){ G.fx.push(o); return o; }

/* ==========================================================================
   SKILL EXECUTION
   ========================================================================== */
function aimFor(sk,fromTouch){
  const p=G.player;
  if(fromTouch){
    const t=nearestEnemy(p.x,p.y,(sk?sk.range:400)+160);
    if(t) return Math.atan2(t.y-p.y,t.x-p.x);
    return p.face;
  }
  return Math.atan2(G.mouse.wy-p.y,G.mouse.wx-p.x);
}
function rollCrit(sk){
  return Math.random()*100 < sk.crit;
}
function critDamage(sk,dmg,crit){
  return crit ? dmg*(1+sk.critDmg/100) : dmg;
}
function elementalRider(sk,target,crit){
  /* flat added elemental damage rides along with the main hit */
  const parts=[['fire',sk.addFire],['cold',sk.addCold],['lightning',sk.addLight]];
  for(const [t,v] of parts){
    if(v>0) monsterTakeDamage(target,critDamage(sk,v,crit),t,false,sk,0,0);
  }
}
function hitTarget(sk,e,ang,knock,mult){
  const crit=rollCrit(sk);
  let dmg=critDamage(sk,sk.dmg*(mult||1),crit);
  if(G.st.flags.doubleHit){
    dmg*=0.55;
    monsterTakeDamage(e,dmg,sk.dtype,crit,sk,Math.cos(ang)*(knock||0),Math.sin(ang)*(knock||0));
    if(e.dead||e.dying) return;
    monsterTakeDamage(e,dmg,sk.dtype,crit,sk,0,0);
  } else {
    monsterTakeDamage(e,dmg,sk.dtype,crit,sk,Math.cos(ang)*(knock||0),Math.sin(ang)*(knock||0));
  }
  elementalRider(sk,e,crit);
}
function coneHit(sk,ang,reach,halfArc,knock){
  let any=false;
  for(const e of nearbyEnemies(G.player.x,G.player.y,reach+60)){
    if(e.dead||e.dying) continue;
    const d=dist(G.player.x,G.player.y,e.x,e.y);
    if(d>reach+e.r) continue;
    let da=Math.atan2(e.y-G.player.y,e.x-G.player.x)-ang;
    while(da>Math.PI) da-=TAU; while(da<-Math.PI) da+=TAU;
    if(Math.abs(da)>halfArc) continue;
    hitTarget(sk,e,ang,knock);
    any=true;
  }
  return any;
}
function areaHit(sk,x,y,radius,knock){
  for(const e of nearbyEnemies(x,y,radius+70)){
    if(e.dead||e.dying) continue;
    if(d2(x,y,e.x,e.y)>(radius+e.r)*(radius+e.r)) continue;
    const a=Math.atan2(e.y-y,e.x-x);
    hitTarget(sk,e,a,knock);
  }
}
function executeSkill(sk,ang,fromTouch){
  const p=G.player,st=G.st;
  const col=DCOLOR[sk.dtype]||'#c8a96e';
  const type=sk.type;
  p.face=ang;
  if(type==='projectile'){
    const n=Math.max(1,sk.count);
    const spread=sk.spread||(n>1?0.3:0);
    for(let i=0;i<n;i++){
      const a2=ang+(n>1? -spread/2+spread*(i/(n-1)) : 0)+(sk.erratic?rnd(-0.25,0.25):0);
      const crit=rollCrit(sk);
      spawnShot({x:p.x+Math.cos(a2)*18,y:p.y+Math.sin(a2)*18,
        vx:Math.cos(a2)*sk.speed,vy:Math.sin(a2)*sk.speed,
        dmg:critDamage(sk,sk.dmg,crit),dtype:sk.dtype,color:col,from:'player',
        r:7,size:1.1,life:sk.range/Math.max(60,sk.speed)+0.25,
        pierce:sk.pierce,chains:sk.chains,crit:crit,sk:sk,
        erratic:sk.erratic,wallSplit:st.flags.wallSplit?1:0});
    }
  } else if(type==='nova'){
    const n=Math.max(6,sk.count);
    for(let i=0;i<n;i++){
      const a2=ang+i*(TAU/n);
      const crit=rollCrit(sk);
      spawnShot({x:p.x+Math.cos(a2)*16,y:p.y+Math.sin(a2)*16,
        vx:Math.cos(a2)*(sk.speed||420),vy:Math.sin(a2)*(sk.speed||420),
        dmg:critDamage(sk,sk.dmg*0.68,crit),dtype:sk.dtype,color:col,from:'player',
        r:7,size:1,life:(sk.range||340)/Math.max(60,sk.speed||420)+0.2,
        pierce:sk.pierce,crit:crit,sk:sk});
    }
    spawnFx({type:'shock',x:p.x,y:p.y,r:0,max:sk.radius||110,life:.32,maxLife:.32,color:col});
    shakeCam(5);
  } else if(type==='melee_arc'){
    const reach=Math.max(70,sk.range);
    spawnFx({type:'arc',x:p.x,y:p.y,ang:ang,arc:sk.arc||1.4,r:reach,life:.2,maxLife:.2,color:col,follow:true});
    const hit=coneHit(sk,ang,reach,(sk.arc||1.4)/2+0.15,120);
    if(!hit) for(let i=0;i<4;i++){
      const sa=ang+rnd(-.6,.6);
      spawnPart(p.x+Math.cos(sa)*reach*.7,p.y+Math.sin(sa)*reach*.7,Math.cos(sa)*60,Math.sin(sa)*60,.22,2,col,.9,true);
    }
  } else if(type==='dash'){
    const ox=p.x,oy=p.y,step=8;
    let travelled=0;
    while(travelled<sk.range){
      const nx=p.x+Math.cos(ang)*step, ny=p.y+Math.sin(ang)*step;
      if(!canStand(nx,ny,p.r)) break;
      p.x=nx; p.y=ny; travelled+=step;
    }
    burst(ox,oy,24,col,260,3.6,.5,true);
    spawnFx({type:'streak',x1:ox,y1:oy,x2:p.x,y2:p.y,life:.3,maxLife:.3,color:col});
    p.iframe=Math.max(p.iframe,0.2);
    for(const e of nearbyEnemies((ox+p.x)/2,(oy+p.y)/2,travelled+120)){
      if(e.dead||e.dying) continue;
      if(distToSeg(e.x,e.y,ox,oy,p.x,p.y)<e.r+(sk.radius||46)) hitTarget(sk,e,ang,90);
    }
    if(sk.radius>90){
      spawnFx({type:'shock',x:p.x,y:p.y,r:0,max:sk.radius,life:.36,maxLife:.36,color:col});
      areaHit(sk,p.x,p.y,sk.radius,140);
      shakeCam(7);
    }
  } else if(type==='beam'){
    let len=0;
    const step=10;
    while(len<sk.range){
      const nx=p.x+Math.cos(ang)*(len+step), ny=p.y+Math.sin(ang)*(len+step);
      if(!walkable(nx,ny)) break;
      len+=step;
    }
    const ex=p.x+Math.cos(ang)*len, ey=p.y+Math.sin(ang)*len;
    spawnFx({type:'beam',x:p.x,y:p.y,x2:ex,y2:ey,life:.34,maxLife:.34,color:col,w:14});
    for(const e of nearbyEnemies((p.x+ex)/2,(p.y+ey)/2,len+120)){
      if(e.dead||e.dying) continue;
      if(distToSeg(e.x,e.y,p.x,p.y,ex,ey)<e.r+18) hitTarget(sk,e,ang,80);
    }
    for(let i=0;i<16;i++){
      const t=Math.random();
      spawnPart(lerp(p.x,ex,t),lerp(p.y,ey,t),rnd(-40,40),rnd(-40,40),rnd(.2,.5),rnd(1.5,3),col,.9,true);
    }
    shakeCam(6);
  } else if(type==='aoe'){
    /* lands at the aim point, clamped to the skill's range */
    const md=Math.min(sk.range||200,dist(p.x,p.y,G.mouse.wx,G.mouse.wy));
    let tx=p.x+Math.cos(ang)*md, ty=p.y+Math.sin(ang)*md;
    if(!walkable(tx,ty)){ tx=p.x+Math.cos(ang)*Math.min(md,60); ty=p.y+Math.sin(ang)*Math.min(md,60); }
    const rad=sk.radius||120;
    if(sk.delay>0){
      spawnFx({type:'telegraph',x:tx,y:ty,r:rad,life:sk.delay,maxLife:sk.delay,color:col,
        onEnd:()=>{
          spawnFx({type:'shock',x:tx,y:ty,r:0,max:rad,life:.42,maxLife:.42,color:col});
          burst(tx,ty,26,col,rad*2,4,.6,true);
          areaHit(sk,tx,ty,rad,120);
          shakeCam(7);
        }});
    } else {
      spawnFx({type:'shock',x:tx,y:ty,r:0,max:rad,life:.42,maxLife:.42,color:col});
      burst(tx,ty,26,col,rad*2,4,.6,true);
      areaHit(sk,tx,ty,rad,120);
      shakeCam(7);
    }
  } else if(type==='chain'){
    /* hops from body to body, never revisiting one */
    let src={x:p.x,y:p.y};
    const hitList=[];
    let hops=Math.max(1,sk.chains);
    for(let h=0;h<hops;h++){
      let best=null,bd=(sk.range||300)*(sk.range||300);
      for(const e of nearbyEnemies(src.x,src.y,sk.range||300)){
        if(e.dead||e.dying||hitList.indexOf(e)>=0) continue;
        const d=d2(src.x,src.y,e.x,e.y);
        if(d<bd){bd=d;best=e;}
      }
      if(!best) break;
      spawnFx({type:'bolt',x1:src.x,y1:src.y,x2:best.x,y2:best.y,life:.22,maxLife:.22,color:col});
      hitTarget(sk,best,Math.atan2(best.y-src.y,best.x-src.x),40,Math.pow(0.85,h));
      hitList.push(best);
      src={x:best.x,y:best.y};
    }
    if(!hitList.length){
      spawnFx({type:'bolt',x1:p.x,y1:p.y,x2:p.x+Math.cos(ang)*140,y2:p.y+Math.sin(ang)*140,
        life:.2,maxLife:.2,color:col});
    }
  } else if(type==='dot_cloud'){
    const md=Math.min(sk.range||200,dist(p.x,p.y,G.mouse.wx,G.mouse.wy));
    let tx=p.x+Math.cos(ang)*md, ty=p.y+Math.sin(ang)*md;
    if(!walkable(tx,ty)){ tx=p.x+Math.cos(ang)*40; ty=p.y+Math.sin(ang)*40; }
    G.clouds.push({x:tx,y:ty,r:sk.radius||80,t:sk.duration||4,max:sk.duration||4,
      dps:sk.dmg,dtype:sk.dtype,color:col,tick:0,sk:sk});
  } else if(type==='totem'){
    const md=Math.min(sk.range||200,dist(p.x,p.y,G.mouse.wx,G.mouse.wy));
    let tx=p.x+Math.cos(ang)*Math.max(40,md*0.6), ty=p.y+Math.sin(ang)*Math.max(40,md*0.6);
    if(!canStand(tx,ty,14)){ tx=p.x; ty=p.y; }
    G.totems.push({x:tx,y:ty,r:14,t:sk.duration||8,max:sk.duration||8,cd:0,sk:sk,
      mult:G.st.totemMult||1,
      color:col,rot:0,spirit:sk.spirit||0});
    recalc();
    burst(tx,ty,14,col,150,3,.5,true);
  } else if(type==='aura'||type==='meta'){
    toggleAura(sk.idx);
  }
}
function toggleAura(gemIdx){
  const ch=G.ch;
  const def=GEMS[ch.gems[gemIdx].gem];
  if(ch.auras[gemIdx]){
    delete ch.auras[gemIdx];
    recalc();
    toast(def.name+' deactivated.');
  } else {
    recalc();
    if(G.st.spiritUsed+def.spirit>G.st.spiritMax){
      toast('Not enough spirit for '+def.name+'.');
      return;
    }
    ch.auras[gemIdx]=1;
    recalc();
    toast(def.name+' active · '+G.st.spiritUsed+'/'+G.st.spiritMax+' spirit reserved.');
  }
  markDirty();
  buildSlotUI();
}
function fireMetaGem(gemIdx){
  const ch=G.ch, g=ch.gems[gemIdx];
  if(g.link==null||!ch.gems[g.link]) return;
  const sk=skillStats(ch.gems[g.link],g.link);
  if(!sk.usable) return;
  const p=G.player;
  const t=nearestEnemy(p.x,p.y,700);
  const ang=t?Math.atan2(t.y-p.y,t.x-p.x):p.face;
  /* triggered casts are free and ignore their own cooldown */
  executeSkill(sk,ang,true);
  spawnFx({type:'shock',x:p.x,y:p.y,r:0,max:70,life:.28,maxLife:.28,color:'#c8a96e'});
}
function useSkill(slot,fromTouch){
  const p=G.player,ch=G.ch,st=G.st;
  if(!p||G.paused||G.dead||G.panel) return;
  if(playerStunned()) return;
  const sk=activeSkills()[slot];
  if(!sk) return;
  if(sk.type==='aura'||sk.type==='meta'){
    if(p.cds[slot]>0) return;
    p.cds[slot]=0.4;
    toggleAura(sk.idx);
    return;
  }
  if(!sk.usable){ toast(sk.reason); return; }
  if(p.cds[slot]>0) return;
  const costLife=!!st.keys.blood_magic;
  if(costLife){
    if(p.life<=sk.mana+1){ toast('Not enough life.'); return; }
  } else if(p.mana<sk.mana){ toast('Not enough mana.'); return; }
  if(sk.type==='totem'&&sk.spirit&&st.spiritUsed+sk.spirit>st.spiritMax){
    toast(sk.name+' needs '+sk.spirit+' spirit, '+(st.spiritMax-st.spiritUsed)+' free.');
    return;
  }
  const ang=aimFor(sk,fromTouch);
  if(costLife) p.life-=sk.mana; else p.mana-=sk.mana;
  p.cds[slot]=Math.max(0.12,sk.cd);
  sfx(sk.isAttack&&sk.type==='melee_arc'?'melee':'cast');
  executeSkill(sk,ang,fromTouch);
}

/* ==========================================================================
   INVENTORY SPACE
   Items occupy a footprint of cells; a drop only enters the bag if it fits.
   ========================================================================== */
function gridFits(list,item,x,y,w,h,ignore){
  const iw=itemW(item), ih=itemH(item);
  if(x<0||y<0||x+iw>w||y+ih>h) return false;
  for(const o of list){
    if(o===ignore) continue;
    if(x < o.pos.x+itemW(o) && x+iw > o.pos.x && y < o.pos.y+itemH(o) && y+ih > o.pos.y) return false;
  }
  return true;
}
function findSpot(list,item,w,h){
  for(let y=0;y<h;y++) for(let x=0;x<w;x++)
    if(gridFits(list,item,x,y,w,h)) return {x:x,y:y};
  return null;
}
function addToInv(item){
  const spot=findSpot(G.ch.inv,item,INV_W,INV_H);
  if(!spot) return false;
  item.pos={x:spot.x,y:spot.y};
  G.ch.inv.push(item);
  markDirty();
  return true;
}
function countCurrency(key){
  let n=0;
  for(const it of G.ch.inv) if(it.cur===key) n+=it.n;
  return n;
}
/* fills partial stacks first, then opens new ones; anything that will not
   fit in the bag goes to the first stash tab with room, and only then to
   the floor */
function giveCurrency(key,n){
  let left=n||1;
  const ch=G.ch;
  for(const it of ch.inv){
    if(it.cur!==key||it.n>=MAX_STACK) continue;
    const room=MAX_STACK-it.n;
    const put=Math.min(room,left);
    it.n+=put; left-=put;
    if(left<=0) break;
  }
  while(left>0){
    const put=Math.min(MAX_STACK,left);
    const st={uid:newUid(),cur:key,n:put,pos:{x:0,y:0}};
    const spot=findSpot(ch.inv,st,INV_W,INV_H);
    if(spot){ st.pos={x:spot.x,y:spot.y}; ch.inv.push(st); left-=put; continue; }
    let stashed=false;
    for(let t=0;t<4&&!stashed;t++){
      const sp=findSpot(G.save.stash[t],st,STASH_W,STASH_H);
      if(sp){ st.pos={x:sp.x,y:sp.y}; G.save.stash[t].push(st); stashed=true; }
    }
    if(stashed){ left-=put; toast(curLabel(key)+' went to the stash.'); continue; }
    if(G.player) spawnGroundCurrency(key,G.player.x,G.player.y,left);
    left=0;
  }
  markDirty();
}
function takeCurrency(key,n){
  const need=n||1;
  if(countCurrency(key)<need) return false;
  let left=need;
  const ch=G.ch;
  for(let i=ch.inv.length-1;i>=0&&left>0;i--){
    const it=ch.inv[i];
    if(it.cur!==key) continue;
    const take=Math.min(it.n,left);
    it.n-=take; left-=take;
    if(it.n<=0) ch.inv.splice(i,1);
  }
  markDirty();
  return true;
}

/* ==========================================================================
   LOOT
   ========================================================================== */
function rollItemLevel(){
  return Math.max(1,G.zdef.level+rndi(-1,2));
}
function baseForDrop(ilvl){
  const cands=BASE_KEYS.filter(k=>BASES[k].ilvl<=ilvl+2);
  if(!cands.length) return 'ragged_vest';
  return pick(cands);
}
function rollDropRarity(bonus){
  const r=Math.random()+ (bonus||0);
  if(r>0.985) return 3;
  if(r>0.86) return 2;
  if(r>0.55) return 1;
  return 0;
}
function makeDropItem(ilvl,rarityBonus,forceRarity){
  const il=ilvl;
  let rar = forceRarity!=null?forceRarity:rollDropRarity(rarityBonus);
  if(rar===3){
    const cands=UNIQUE_KEYS.filter(k=>UNIQUES[k].ilvl<=il+3);
    if(cands.length){
      const uk=pick(cands);
      return makeItem(UNIQUES[uk].base,il,3,uk);
    }
    rar=2;
  }
  return makeItem(baseForDrop(il),il,rar);
}
function spawnGroundItem(item,x,y){
  sfx('drop',item.r);
  const q=snapToWalkable(x,y,10);
  G.pickups.push({kind:'item',item:item,x:q.x,y:q.y,vx:rnd(-40,40),vy:rnd(-40,40),r:11,t:rnd(0,TAU)});
}
function spawnGroundCurrency(key,x,y,n){
  const q=snapToWalkable(x,y,8);
  /* merge into a stack already lying nearby rather than littering */
  for(const k of G.pickups){
    if(k.kind==='cur'&&k.cur===key&&k.n<MAX_STACK&&d2(k.x,k.y,q.x,q.y)<40*40){
      k.n=Math.min(MAX_STACK,k.n+(n||1));
      return;
    }
  }
  G.pickups.push({kind:'cur',cur:key,n:n||1,x:q.x,y:q.y,vx:rnd(-40,40),vy:rnd(-40,40),r:8,t:rnd(0,TAU)});
}
function dropLoot(e){
  const il=rollItemLevel();
  const rareMon = e.rarity===2;
  /* rare monsters always leave something behind */
  if(rareMon){
    spawnGroundItem(makeDropItem(il,0.25),e.x+rnd(-14,14),e.y+rnd(-14,14));
  } else if(Math.random()< (e.rarity===1?0.42:0.2)){
    spawnGroundItem(makeDropItem(il,e.rarity*0.1),e.x,e.y);
  }
  /* currency */
  const cr=Math.random();
  if(cr<0.14) spawnGroundCurrency('wisdom',e.x+rnd(-10,10),e.y+rnd(-10,10));
  else if(cr<0.22) spawnGroundCurrency('transmute',e.x,e.y);
  else if(cr<0.26) spawnGroundCurrency('augment',e.x,e.y);
  else if(cr<0.285) spawnGroundCurrency('regal',e.x,e.y);
  else if(cr<0.30) spawnGroundCurrency('exalted',e.x,e.y);
  else if(cr<0.312) spawnGroundCurrency('chaos',e.x,e.y);
  else if(cr<0.318) spawnGroundCurrency('divine',e.x,e.y);
  else if(cr<0.324) spawnGroundCurrency('vaal',e.x,e.y);
  if(Math.random()<0.06) spawnGroundCurrency('uncut_support',e.x,e.y);
  if(Math.random()<0.035) spawnGroundCurrency('uncut_skill',e.x,e.y);
  if(Math.random()<0.3) spawnGroundCurrency('shard',e.x,e.y,rndi(1,3));
}
function dropBossLoot(b){
  const il=Math.max(1,G.zdef.level+2);
  /* guaranteed rare, with a real chance at a unique */
  spawnGroundItem(makeDropItem(il,0,2),b.x+rnd(-30,30),b.y+rnd(-30,30));
  if(Math.random()<0.35) spawnGroundItem(makeDropItem(il,0,3),b.x+rnd(-30,30),b.y+rnd(-30,30));
  spawnGroundCurrency('uncut_skill',b.x+rnd(-20,20),b.y+rnd(-20,20));
  spawnGroundCurrency('uncut_support',b.x+rnd(-20,20),b.y+rnd(-20,20));
  spawnGroundCurrency('wisdom',b.x,b.y,2);
  spawnGroundCurrency('shard',b.x,b.y,rndi(6,12));
  if(Math.random()<0.5) spawnGroundCurrency('exalted',b.x,b.y);
}
function collectPickup(k){
  if(k.kind==='cur'){
    giveCurrency(k.cur,k.n);
    sfx('pickup');
    toast(curLabel(k.cur)+(k.n>1?' x'+k.n:''));
    burst(k.x,k.y,8,'#d8c69c',120,2.2,.35,true);
    return true;
  }
  if(addToInv(k.item)){
    const nm=itemName(k.item);
    toast(nm+(k.item.idf?'':' (unidentified)'));
    burst(k.x,k.y,8,RARITY_COLOR[k.item.r],130,2.4,.4,true);
    return true;
  }
  toast('Inventory full.');
  k.vx=rnd(-60,60); k.vy=rnd(-60,60);
  k.cool=1.4;
  return false;
}
const RARITY_COLOR=['#cfcabd','#6a8fc8','#d4c060','#c87838'];

/* ==========================================================================
   ENEMY AI
   ========================================================================== */
function enemyShoot(e,ang){
  const a=ARCH[e.arch];
  const n=e.multiproj?3:1;
  for(let i=0;i<n;i++){
    const a2=ang+(n>1?-0.24+0.24*i:0);
    spawnShot({x:e.x+Math.cos(a2)*e.r,y:e.y+Math.sin(a2)*e.r,
      vx:Math.cos(a2)*(a.pspeed||240),vy:Math.sin(a2)*(a.pspeed||240),
      dmg:e.dmg,dtype:e.dtype,color:e.color,from:'enemy',r:6,life:3.2,
      homing:e.arch==='caster'?0.4:0,ailment:e.ailment||null});
  }
  burst(e.x+Math.cos(ang)*e.r,e.y+Math.sin(ang)*e.r,4,e.color,90,2,.25,true);
}
function tickDots(e,dt){
  if(!e.dots.length) return;
  for(let i=e.dots.length-1;i>=0;i--){
    const d=e.dots[i];
    d.t-=dt;
    let dps=d.dps;
    if(d.moveScaled && e.moving) dps*=2.1;   /* bleed is far worse while moving */
    e.hp-=dps*dt;
    if(Math.random()<dt*4) spawnPart(e.x+rnd(-e.r,e.r),e.y+rnd(-e.r,e.r),0,rnd(-20,-6),.4,2,DCOLOR[d.dtype],.9,true);
    if(d.t<=0) e.dots.splice(i,1);
  }
  if(e.hp<=0) killEnemy(e);
}
function tickAilments(e,dt){
  if(e.ailImmune) for(const k in e.ailImmune) if(e.ailImmune[k]>0) e.ailImmune[k]-=dt;
  for(const k of AILMENTS) if(e.ailT[k]>0) e.ailT[k]-=dt;
  /* meters decay if nothing keeps feeding them */
  for(const k of AILMENTS) if(e.ail[k]>0) e.ail[k]=Math.max(0,e.ail[k]-e.threshold*0.14*dt);
}
function enemySeparate(e,dt){
  for(const o of nearbyEnemies(e.x,e.y,e.r+40)){
    if(o===e||o.dead||o.dying||o.boss) continue;
    const dx=e.x-o.x,dy=e.y-o.y;
    const need=e.r+o.r, dd=dx*dx+dy*dy;
    if(dd>0&&dd<need*need){
      const d=Math.sqrt(dd), push=(need-d)*2.2*dt;
      moveEnt(e,(dx/d)*push,(dy/d)*push);
    }
  }
}
function updateEnemies(dt){
  const p=G.player;
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(e.dying>0){
      e.dying-=dt;
      if(e.dying<=0){ e.dead=true; G.enemies.splice(i,1); }
      continue;
    }
    tickAilments(e,dt);
    tickDots(e,dt);
    if(e.dead||e.dying) continue;
    if(e.hurt>0) e.hurt-=dt;
    e.pulse+=dt*4; e.wob+=dt*3;
    if(e.knock.x||e.knock.y){
      moveEnt(e,e.knock.x*dt,e.knock.y*dt);
      const f=Math.pow(0.0016,dt);
      e.knock.x*=f; e.knock.y*=f;
      if(Math.abs(e.knock.x)<2) e.knock.x=0;
      if(Math.abs(e.knock.y)<2) e.knock.y=0;
    }
    e.moving=false;
    if(e.ailT.freeze>0||e.ailT.stun>0) continue;   /* frozen solid or staggered */
    const d=dist(e.x,e.y,p.x,p.y);
    if(d>1400) continue;
    const ang=Math.atan2(p.y-e.y,p.x-e.x);
    const a=ARCH[e.arch];
    if(e.kind==='melee'){
      if(d>e.r+p.r-4){ moveEnt(e,Math.cos(ang)*e.speed*dt,Math.sin(ang)*e.speed*dt); e.moving=true; }
      if(e.touchCd>0) e.touchCd-=dt;
      if(d<e.r+p.r+2&&e.touchCd<=0){ e.touchCd=a.touchCd; damagePlayer(e.dmg,e.dtype,e); }
    } else if(e.kind==='exploder'){
      if(d>e.r+p.r){ moveEnt(e,Math.cos(ang)*e.speed*dt,Math.sin(ang)*e.speed*dt); e.moving=true; }
      if(d<a.radius*0.55||e.fuse>0){
        e.fuse+= e.fuse>0?dt:0.001;
        e.tele=Math.max(0.001,a.fuse-e.fuse); e.teleMax=a.fuse;
        if(e.fuse>=a.fuse){
          spawnFx({type:'shock',x:e.x,y:e.y,r:0,max:a.radius,life:.4,maxLife:.4,color:e.color});
          burst(e.x,e.y,26,e.color,320,4,.6,true);
          if(d2(p.x,p.y,e.x,e.y)<a.radius*a.radius) damagePlayer(e.dmg,e.dtype,e);
          e.hp=0; killEnemy(e);
          shakeCam(9);
          continue;
        }
      }
    } else if(e.kind==='summoner'){
      const keep=a.keep;
      if(d>keep*1.05){ moveEnt(e,Math.cos(ang)*e.speed*dt,Math.sin(ang)*e.speed*dt); e.moving=true; }
      else if(d<keep*0.7){ moveEnt(e,-Math.cos(ang)*e.speed*dt,-Math.sin(ang)*e.speed*dt); e.moving=true; }
      if(e.tele>0){
        e.tele-=dt;
        if(e.tele<=0){
          for(let k=0;k<2;k++){
            const aa=rnd(0,TAU),rr=rnd(30,70);
            const x=e.x+Math.cos(aa)*rr,y=e.y+Math.sin(aa)*rr;
            if(!canStand(x,y,12)) continue;
            const m=makeEnemy(weightedPick(G.zdef.pool),x,y,0);
            if(m){ m.maxHp=Math.round(m.maxHp*0.55); m.hp=m.maxHp; G.enemies.push(m);
              burst(x,y,12,e.color,160,3,.5,true); }
          }
        }
      } else {
        e.cd-=dt;
        if(e.cd<=0&&d<keep*1.6){ e.cd=a.shotCd*rnd(.9,1.2); e.tele=0.6; e.teleMax=0.6; e.aim=ang; }
      }
    } else {
      const keep=a.keep;
      if(d>keep*1.05){ moveEnt(e,Math.cos(ang)*e.speed*dt,Math.sin(ang)*e.speed*dt); e.moving=true; }
      else if(d<keep*0.72){ moveEnt(e,-Math.cos(ang)*e.speed*dt,-Math.sin(ang)*e.speed*dt); e.moving=true; }
      else { moveEnt(e,Math.cos(ang+Math.PI/2)*e.speed*.55*dt,Math.sin(ang+Math.PI/2)*e.speed*.55*dt); e.moving=true; }
      if(e.tele>0){
        e.tele-=dt;
        if(e.tele<=0) enemyShoot(e,e.aim);
      } else {
        e.cd-=dt;
        if(e.cd<=0&&d<keep*1.5){ e.cd=a.shotCd*rnd(.85,1.2); e.tele=0.34; e.teleMax=0.34; e.aim=ang; }
      }
      if(e.touchCd>0) e.touchCd-=dt;
      if(d<e.r+p.r&&e.touchCd<=0){ e.touchCd=1; damagePlayer(e.dmg*0.6,e.dtype,e); }
    }
    enemySeparate(e,dt);
  }
}

/* ==========================================================================
   BOSS AI — three HP phases, each adding a pattern, all telegraphed
   ========================================================================== */
function bossPhase(b){
  const f=b.hp/b.maxHp;
  return f>0.66?1:f>0.33?2:3;
}
function bossFire(b,kind){
  const p=G.player;
  const ang=Math.atan2(p.y-b.y,p.x-b.x);
  if(kind==='nova'){
    const n=14;
    for(let i=0;i<n;i++){
      const a=ang+i*(TAU/n);
      spawnShot({x:b.x+Math.cos(a)*b.r*.7,y:b.y+Math.sin(a)*b.r*.7,
        vx:Math.cos(a)*230,vy:Math.sin(a)*230,dmg:b.dmg*.7,dtype:'physical',
        color:b.rim,from:'enemy',r:9,size:1.2,life:3.4});
    }
    spawnFx({type:'shock',x:b.x,y:b.y,r:0,max:150,life:.4,maxLife:.4,color:b.rim});
    shakeCam(9);
  } else if(kind==='dash'){
    b.dash={vx:Math.cos(ang)*620,vy:Math.sin(ang)*620,t:.55};
    burst(b.x,b.y,20,b.rim,240,3.6,.5,true);
  } else if(kind==='summon'){
    for(let i=0;i<3;i++){
      const a=rnd(0,TAU),rr=b.r+rnd(30,80);
      const x=b.x+Math.cos(a)*rr,y=b.y+Math.sin(a)*rr;
      if(!canStand(x,y,16)) continue;
      const m=makeEnemy(b.minion,x,y,0);
      if(m){ m.maxHp=Math.round(m.maxHp*0.75); m.hp=m.maxHp; G.enemies.push(m);
        burst(x,y,14,b.color,180,3,.5,true); }
    }
    shakeCam(5);
  } else if(kind==='volley'){
    for(let i=-3;i<=3;i++){
      const a=ang+i*0.16;
      spawnShot({x:b.x+Math.cos(a)*b.r*.7,y:b.y+Math.sin(a)*b.r*.7,
        vx:Math.cos(a)*320,vy:Math.sin(a)*320,dmg:b.dmg*.6,dtype:'physical',
        color:b.rim,from:'enemy',r:8,life:3});
    }
  } else if(kind==='slam'){
    /* lands where the telegraph was drawn, not wherever the player ended up */
    const ox=(b.windupAt&&b.windupAt.x!=null)?b.windupAt.x:p.x;
    const oy=(b.windupAt&&b.windupAt.y!=null)?b.windupAt.y:p.y;
    spawnFx({type:'shock',x:ox,y:oy,r:0,max:170,life:.45,maxLife:.45,color:b.rim});
    if(d2(p.x,p.y,ox,oy)<170*170) damagePlayer(b.dmg*1.2,'physical',b);
    shakeCam(14);
  } else if(kind==='beam'){
    const len=760;
    const ex=b.x+Math.cos(ang)*len, ey=b.y+Math.sin(ang)*len;
    spawnFx({type:'beam',x:b.x,y:b.y,x2:ex,y2:ey,life:.4,maxLife:.4,color:b.rim,w:20});
    if(distToSeg(p.x,p.y,b.x,b.y,ex,ey)<p.r+24) damagePlayer(b.dmg*1.1,'lightning',b);
    shakeCam(10);
  } else if(kind==='ring'){
    /* a ring of standing fire, centred where the telegraph was */
    const cx=(b.windupAt&&b.windupAt.x!=null)?b.windupAt.x:p.x;
    const cy=(b.windupAt&&b.windupAt.y!=null)?b.windupAt.y:p.y;
    const n=10;
    for(let i=0;i<n;i++){
      const a=i*(TAU/n);
      const x=cx+Math.cos(a)*190, y=cy+Math.sin(a)*190;
      if(!walkable(x,y)) continue;
      G.clouds.push({x:x,y:y,r:64,t:4,max:4,dps:b.dmg*0.5,dtype:'fire',
        color:'#e07a3c',tick:0,hostile:true});
    }
    shakeCam(6);
  }
}
function updateBoss(dt){
  const b=G.boss,p=G.player;
  if(!b) return;
  if(b.dying>0){
    b.dying-=dt; b.rot+=dt*4;
    if(b.dying<=0&&!b.dead){ b.dead=true; onBossDead(); }
    return;
  }
  if(b.dead) return;
  b.rot+=dt*0.7;
  if(b.hurt>0) b.hurt-=dt;
  tickAilments(b,dt);
  tickDots(b,dt);
  if(b.dead||b.dying) return;
  const d=dist(b.x,b.y,p.x,p.y);
  if(!b.awake){
    if(d<780){ b.awake=true; $('bossbar').classList.add('on'); $('boss-nm').textContent=b.name; }
    else return;
  }
  const ph=bossPhase(b);
  if(ph!==b.phase){
    b.phase=ph;
    spawnFx({type:'shock',x:b.x,y:b.y,r:0,max:260,life:.6,maxLife:.6,color:b.rim});
    burst(b.x,b.y,40,b.rim,340,5,.7,true);
    shakeCam(16); setHitStop(.09); sfx('phase');
    for(const k in b.cds) b.cds[k]=rnd(.6,1.8);
    toast(b.name+' · phase '+ph);
  }
  if(b.ailT.freeze>0||b.ailT.stun>0) return;
  if(b.dash){
    b.dash.t-=dt;
    const bx=b.x,by=b.y;
    moveEnt(b,b.dash.vx*dt,b.dash.vy*dt);
    if(Math.abs(b.x-bx)<0.3&&Math.abs(b.y-by)<0.3){
      b.dash=null; shakeCam(12);
      spawnFx({type:'shock',x:b.x,y:b.y,r:0,max:120,life:.35,maxLife:.35,color:b.rim});
    } else {
      burst(b.x,b.y,3,b.rim,80,3,.3,true);
      if(d<b.r+p.r+8&&b.touchCd<=0){ b.touchCd=.7; damagePlayer(b.dmg*1.1,'physical',b); }
      if(b.dash&&b.dash.t<=0) b.dash=null;
    }
  } else if(b.windup){
    b.windup.t-=dt;
    if(b.windup.t<=0){ const k=b.windup.kind; b.windup=null; bossFire(b,k); }
  } else {
    if(d>110){
      const ang=Math.atan2(p.y-b.y,p.x-b.x);
      moveEnt(b,Math.cos(ang)*b.speed*dt,Math.sin(ang)*b.speed*dt);
    }
    const avail=b.patterns.slice(0,b.phase);
    for(const k of avail) b.cds[k]-=dt;
    const ready=avail.filter(k=>b.cds[k]<=0);
    if(ready.length){
      const kind=pick(ready);
      b.cds[kind]= kind==='nova'?rnd(3.4,5)/(1+(b.phase-1)*.25)
        : kind==='dash'?rnd(5,7)
        : kind==='summon'?rnd(9,12)
        : kind==='beam'?rnd(6,8)
        : kind==='ring'?rnd(10,13)
        : rnd(4.5,6.5);
      b.windup={kind:kind,t:kind==='dash'?.7:.65,total:kind==='dash'?.7:.65};
      /* fix the aim point now so the telegraph is honest */
      b.windupAt={x:p.x,y:p.y};
    }
  }
  if(b.touchCd>0) b.touchCd-=dt;
  if(!b.dash&&d<b.r+p.r&&b.touchCd<=0){ b.touchCd=.9; damagePlayer(b.dmg*.7,'physical',b); }
}
function onBossDead(){
  const b=G.boss;
  const ch=G.ch;
  const firstKill=!(ch.zonesCleared&&ch.zonesCleared[G.zoneKey]);
  if(!ch.zonesCleared) ch.zonesCleared={};
  ch.zonesCleared[G.zoneKey]=true;
  G.kills++; ch.kills++;
  if(firstKill) toast(b.name+' has fallen — '+BOSS_POINTS+' passive points');
  gainXp(b.xp);
  dropBossLoot(b);
  $('bossbar').classList.remove('on');
  toast(b.name+' has fallen.');
  /* the way onward unlocks */
  for(const pt of G.portals) if(pt.locked) pt.locked=false;
  markDirty();
  updatePointBadge();
}

function moveInput(){
  const k=G.keys;
  let mx=0,my=0;
  if(k['w']||k['arrowup']) my-=1;
  if(k['s']||k['arrowdown']) my+=1;
  if(k['a']||k['arrowleft']) mx-=1;
  if(k['d']||k['arrowright']) mx+=1;
  if(!mx&&!my&&G.touch.active){ mx=G.touch.dx; my=G.touch.dy; }
  if(!mx&&!my&&G.mouse.right){
    const p=G.player;
    const dx=G.mouse.wx-p.x,dy=G.mouse.wy-p.y,d=Math.hypot(dx,dy);
    if(d>12){ mx=dx/d; my=dy/d; }
  }
  const len=Math.hypot(mx,my);
  if(len>1){ mx/=len; my/=len; }
  return {x:mx,y:my,len:Math.min(1,len)};
}
function updatePlayer(dt){
  const p=G.player,st=G.st,ch=G.ch;
  tickPlayerAilments(dt);
  const frozen=playerStunned();
  const mv=frozen?{x:0,y:0,len:0}:moveInput();
  p.moving=false;
  if(mv.len>0.05){
    const sp=st.moveSpeed;
    moveEnt(p,mv.x*sp*dt,mv.y*sp*dt);
    p.walkT+=dt*mv.len*9;
    p.moving=true;
    if(!G.mouse.left) p.face=Math.atan2(mv.y,mv.x);
    if(st.flags.fireTrail){
      p.trailT-=dt;
      if(p.trailT<=0){
        p.trailT=0.22;
        G.clouds.push({x:p.x,y:p.y,r:44,t:2.2,max:2.2,dps:st.maxLife*0.05+12,
          dtype:'fire',color:'#e07a3c',tick:0,sk:{dtype:'fire',noAilment:false,ailment:'ignite',
          leech:0,stunMult:1,bleedMult:1,poisonMult:1,crit:0,critDmg:0}});
      }
    }
  }
  for(let i=0;i<5;i++) if(p.cds[i]>0) p.cds[i]-=dt;
  if(p.iframe>0) p.iframe-=dt;
  /* energy shield recharges only after a quiet spell */
  if(p.esDelay>0) p.esDelay-=dt;
  else if(p.es<st.maxES) p.es=Math.min(st.maxES,p.es+st.maxES*0.28*dt);
  if(p.life<st.maxLife&&st.lifeRegen>0) p.life=Math.min(st.maxLife,p.life+st.lifeRegen*dt);
  if(p.mana<st.maxMana) p.mana=Math.min(st.maxMana,p.mana+st.manaRegen*dt);
  if(frozen){ updatePrompt(); return; }
  /* held inputs keep firing at the skill's own rate */
  if(G.mouse.left) useSkill(0,false);
  for(let i=0;i<5;i++) if(G.touch.btn[i]) useSkill(i,true);
  if(G.keys['q']) useSkill(1,false);
  if(G.keys['e']) useSkill(2,false);
  if(G.keys['r']) useSkill(3,false);
  if(G.keys[' ']) useSkill(4,false);
  /* fog-free map still records where you have been, for the map overlay */
  const tx=(p.x/TILE)|0, ty=(p.y/TILE)|0;
  for(let y=ty-4;y<=ty+4;y++) for(let x=tx-4;x<=tx+4;x++){
    if(x<0||y<0||x>=GRID||y>=GRID) continue;
    G.explored[NAV(x,y)]=1;
  }
  updatePrompt();
}
function updatePrompt(){
  const p=G.player;
  let best=null,bd=76*76;
  for(const n of G.npcs){
    const d=d2(p.x,p.y,n.x,n.y);
    if(d<bd){bd=d;best={kind:'npc',ref:n,label:n.name};}
  }
  for(const pt of G.portals){
    const d=d2(p.x,p.y,pt.x,pt.y);
    if(d<bd){bd=d;best={kind:'portal',ref:pt,label:pt.label+(pt.locked?' (sealed — the zone’s master still stands)':'')};}
  }
  G.prompt=best;
  /* this runs every frame, so it must not rewrite the DOM every frame */
  const el=$('prompt');
  setElClass(el,'on',!!best);
  if(best){
    const txt=(IS_TOUCH?'Tap: ':'F: ')+best.label;
    if(el.__txt!==txt){ el.__txt=txt; el.textContent=txt; }
  }
}
/* H from anywhere that is not a live boss fight; the portal inside goes
   back to wherever you left */
function goHideout(){
  if(!G.running||G.dead) return;
  if(G.zoneKey==='hideout'){
    const back=G.ch.returnZone&&ZONES[G.ch.returnZone]?G.ch.returnZone:'town';
    enterZone(back);
    return;
  }
  if(G.boss&&G.boss.awake&&!G.boss.dead){ toast('Not while the zone\u2019s master is awake.'); return; }
  G.ch.returnZone=G.zoneKey;
  markDirty();
  sfx('portal');
  enterZone('hideout');
}
function interact(){
  const t=G.prompt;
  if(!t) return;
  if(t.kind==='npc'){ openNpc(t.ref); return; }
  const pt=t.ref;
  if(pt.locked){ toast('Sealed until the zone’s master falls.'); return; }
  enterZone(pt.to);
}
function updateShots(dt){
  const p=G.player;
  for(let i=G.shots.length-1;i>=0;i--){
    const s=G.shots[i];
    s.life-=dt;
    if(s.life<=0){ G.shots.splice(i,1); continue; }
    if(s.homing){
      const t=s.from==='player'?nearestEnemy(s.x,s.y,600):p;
      if(t){
        const want=Math.atan2(t.y-s.y,t.x-s.x), cur=Math.atan2(s.vy,s.vx);
        let da=want-cur;
        while(da>Math.PI) da-=TAU; while(da<-Math.PI) da+=TAU;
        const sp=Math.hypot(s.vx,s.vy);
        const na=cur+clamp(da,-s.homing*3*dt,s.homing*3*dt);
        s.vx=Math.cos(na)*sp; s.vy=Math.sin(na)*sp;
      }
    }
    if(s.erratic){
      const a=Math.atan2(s.vy,s.vx)+rnd(-2.4,2.4)*dt;
      const sp=Math.hypot(s.vx,s.vy);
      s.vx=Math.cos(a)*sp; s.vy=Math.sin(a)*sp;
    }
    s.trail.push(s.x,s.y);
    if(s.trail.length>12) s.trail.splice(0,2);
    const nx=s.x+s.vx*dt, ny=s.y+s.vy*dt;
    if(!walkable(nx,ny)){
      if(s.wallSplit){
        /* Widowstring: a wall turns one projectile into two */
        s.wallSplit=0;
        const base=Math.atan2(s.vy,s.vx)+Math.PI;
        const sp=Math.hypot(s.vx,s.vy);
        for(const off of [-0.5,0.5]){
          spawnShot({x:s.x,y:s.y,vx:Math.cos(base+off)*sp,vy:Math.sin(base+off)*sp,
            dmg:s.dmg*0.7,dtype:s.dtype,color:s.color,from:s.from,r:s.r,life:1.2,sk:s.sk,crit:s.crit});
        }
      }
      burst(s.x,s.y,5,s.color,110,2.2,.28,true);
      G.shots.splice(i,1);
      continue;
    }
    s.x=nx; s.y=ny;
    if(s.from==='player'){
      let done=false;
      for(const e of nearbyEnemies(s.x,s.y,s.r+40)){
        if(e.dead||e.dying||s.hitList.indexOf(e)>=0) continue;
        if(d2(s.x,s.y,e.x,e.y)>(e.r+s.r)*(e.r+s.r)) continue;
        const a=Math.atan2(s.vy,s.vx);
        monsterTakeDamage(e,s.dmg,s.dtype,s.crit,s.sk,Math.cos(a)*80,Math.sin(a)*80);
        if(s.sk) elementalRider(s.sk,e,s.crit);
        s.hitList.push(e);
        if(s.chains>0){
          /* hop to the next unhit body */
          s.chains--;
          let best=null,bd=320*320;
          for(const o of nearbyEnemies(s.x,s.y,320)){
            if(o.dead||o.dying||s.hitList.indexOf(o)>=0) continue;
            const d=d2(s.x,s.y,o.x,o.y);
            if(d<bd){bd=d;best=o;}
          }
          if(best){
            const na=Math.atan2(best.y-s.y,best.x-s.x);
            const sp=Math.hypot(s.vx,s.vy);
            s.vx=Math.cos(na)*sp; s.vy=Math.sin(na)*sp;
            s.dmg*=0.82;
            break;
          }
        }
        if(s.pierce>0){ s.pierce--; s.dmg*=0.9; break; }
        G.shots.splice(i,1); done=true;
        break;
      }
      if(done) continue;
    } else {
      if(d2(s.x,s.y,p.x,p.y)<(p.r+s.r)*(p.r+s.r)){
        damagePlayer(s.dmg,s.dtype,s.ailment?{ailment:s.ailment}:null);
        burst(s.x,s.y,8,s.color,150,2.6,.3,true);
        G.shots.splice(i,1);
        continue;
      }
    }
    if(Math.random()<0.28) spawnPart(s.x,s.y,rnd(-14,14),rnd(-14,14),.3,s.r*.4,s.color,.9,true);
  }
}
function updateClouds(dt){
  const p=G.player;
  for(let i=G.clouds.length-1;i>=0;i--){
    const c=G.clouds[i];
    c.t-=dt;
    c.tick-=dt;
    if(c.tick<=0){
      c.tick=0.35;
      if(c.hostile){
        if(d2(p.x,p.y,c.x,c.y)<c.r*c.r) damagePlayer(c.dps*0.35,c.dtype,null);
      } else {
        for(const e of nearbyEnemies(c.x,c.y,c.r+40)){
          if(e.dead||e.dying) continue;
          if(d2(e.x,e.y,c.x,c.y)>(c.r+e.r)*(c.r+e.r)) continue;
          monsterTakeDamage(e,c.dps*0.35,c.dtype,false,c.sk,0,0);
        }
      }
    }
    if(Math.random()<dt*22){
      const a=rnd(0,TAU),rr=Math.random()*c.r;
      spawnPart(c.x+Math.cos(a)*rr,c.y+Math.sin(a)*rr,rnd(-8,8),rnd(-26,-8),.6,rnd(1.6,3.4),c.color,.94,true);
    }
    if(c.t<=0) G.clouds.splice(i,1);
  }
}
function updateTotems(dt){
  for(let i=G.totems.length-1;i>=0;i--){
    const t=G.totems[i];
    t.t-=dt; t.rot+=dt*2;
    t.cd-=dt;
    if(t.cd<=0){
      const target=nearestEnemy(t.x,t.y,t.sk.range||340);
      if(target){
        t.cd=t.sk.interval||0.7;
        const a=Math.atan2(target.y-t.y,target.x-t.x);
        const crit=rollCrit(t.sk);
        spawnShot({x:t.x+Math.cos(a)*12,y:t.y+Math.sin(a)*12,
          vx:Math.cos(a)*420,vy:Math.sin(a)*420,
          dmg:critDamage(t.sk,t.sk.dmg*0.6*(t.mult||1),crit),dtype:t.sk.dtype,color:t.color,
          from:'player',r:6,life:1.6,crit:crit,sk:t.sk});
      } else t.cd=0.3;
    }
    if(t.t<=0){
      burst(t.x,t.y,12,t.color,140,3,.5,true);
      G.totems.splice(i,1);
      if(t.spirit) recalc();      /* its reservation is released */
    }
  }
}
function updatePickups(dt){
  const p=G.player;
  for(let i=G.pickups.length-1;i>=0;i--){
    const k=G.pickups[i];
    k.t+=dt*3;
    if(k.cool>0) k.cool-=dt;
    const d=dist(k.x,k.y,p.x,p.y);
    if(d<60&&!(k.cool>0)){
      const a=Math.atan2(p.y-k.y,p.x-k.x);
      const pull=(1-d/60)*260;
      k.vx=lerp(k.vx,Math.cos(a)*pull,.2);
      k.vy=lerp(k.vy,Math.sin(a)*pull,.2);
    } else { k.vx*=Math.pow(.02,dt); k.vy*=Math.pow(.02,dt); }
    k.x+=k.vx*dt; k.y+=k.vy*dt;
    if(d<p.r+k.r+2&&!(k.cool>0)){
      if(collectPickup(k)) G.pickups.splice(i,1);
    }
  }
}
function updateFx(dt){
  for(let i=G.fx.length-1;i>=0;i--){
    const f=G.fx[i];
    f.life-=dt;
    if(f.type==='shock') f.r=f.max*(1-Math.pow(f.life/f.maxLife,2));
    if(f.type==='arc'&&f.follow){ f.x=G.player.x; f.y=G.player.y; }
    if(f.life<=0){
      if(f.onEnd) f.onEnd();
      G.fx.splice(i,1);
    }
  }
}
function updateParts(dt){
  for(let i=0;i<PART_MAX;i++){
    const q=G.parts[i];
    if(!q.on) continue;
    q.life-=dt;
    if(q.life<=0){ q.on=false; continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt;

function updateDmgNums(dt){
  for(let i=0;i<DNUM_MAX;i++){
    const n=G.dmgNums[i];

function updateCamera(dt){

  c.x=lerp(c.x,p.x,t); c.y=lerp(c.y,p.y,t);

function visualUpdate(dt){

let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  const now=ts/1000;
  let dt=lastTs?now-lastTs:0;
  lastTs=now;
  if(dt>0.05) dt=0.05;          /* dt capped at 50ms */
  if(dt<0) dt=0;
  G.time+=dt;
  if(G.running){
    if(dt>0.026) G.slowT+=dt; else G.slowT=Math.max(0,G.slowT-dt*0.5);
    if(G.slowT>2.5&&G.dprCap>1){ G.dprCap=Math.max(1,G.dprCap-0.35); G.slowT=0; resizeCanvas(); }
  }
  if(G.running&&!G.paused&&!G.panel){
    if(G.hitStop>0) G.hitStop-=dt;        /* update frozen, render keeps going */
    else if(!G.dead) update(dt);
    visualUpdate(dt);
  } else if(G.running){
    visualUpdate(Math.min(dt,0.02));
  }
  /* every panel covers the screen, so the world behind it is wasted work */
  if(G.running&&!G.panel){ render(); updateHUD(); }
  else if(G.running&&G.panel==='death') { render(); updateHUD(); }
  if(G.panel==='tree') renderTree();
  if(G.panel==='map') renderMapOverlay();
}

function drawTiles(sx,sy){
  const P=SPR.pad;
  const t0x=Math.max(0,((sx/TILE)|0)-1), t0y=Math.max(0,((sy/TILE)|0)-1);
  const t1x=Math.min(GRID-1,Math.ceil((sx+G.view.w)/TILE)+1);
  const t1y=Math.min(GRID-1,Math.ceil((sy+G.view.h)/TILE)+1);
  const nav=G.nav,edge=G.edge,sheet=SPR.sheet,et=SPR.edgeTiles;
  for(let ty=t0y;ty<=t1y;ty++){
    const sy0=(ty&7)*TILE, wy=ty*TILE;
    for(let tx=t0x;tx<=t1x;tx++){
      const i=NAV(tx,ty);
      if(nav[i]!==1) continue;
      const m=edge[i];
      if(m){
        let h=(tx*374761393)^(ty*668265263);
        h=(h^(h>>>13))*1274126177; h=(h^(h>>>16))>>>0;
        ctx.drawImage(et[m*3+h%3],tx*TILE-P,wy-P);
      } else ctx.drawImage(sheet,(tx&7)*TILE,sy0,TILE,TILE,tx*TILE,wy,TILE,TILE);
    }
  }
  const R=SPR.hazeR,CELL=R*1.15;
  const c0x=((sx/CELL)|0)-1,c0y=((sy/CELL)|0)-1;
  const c1x=Math.ceil((sx+G.view.w)/CELL),c1y=Math.ceil((sy+G.view.h)/CELL);
  for(let cy=c0y;cy<=c1y;cy++) for(let cx=c0x;cx<=c1x;cx++){
    const h=((cx*374761393)^(cy*668265263))>>>0;
    if((h&7)>4) continue;
    const jx=((h>>>4)&255)/255,jy=((h>>>12)&255)/255;
    const px=(cx+jx)*CELL,py=(cy+jy)*CELL;
    if(!walkable(px,py)) continue;
    const sc=0.55+((h>>>20)&255)/255*0.75;
    ctx.drawImage(SPR.haze,px-R*sc,py-R*sc,R*2*sc,R*2*sc);
  }
}
function poly(x,y,r,n,rot){
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const a=rot+i*(TAU/n);
    const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
function bar(x,y,w,h,frac,color,bg){
  ctx.fillStyle=bg||'rgba(0,0,0,.55)';
  ctx.fillRect(x-w/2,y,w,h);
  ctx.fillStyle=color;
  ctx.fillRect(x-w/2,y,w*clamp(frac,0,1),h);
}
function drawAilmentMeters(e){
  /* only the meters that are actually building, stacked above the monster */
  let y=e.y-e.r-15;
  const w=32;
  for(const k of AILMENTS){
    const v=e.ail[k]/e.threshold;
    const act=e.ailT[k]>0;
    if(v<0.04&&!act) continue;
    bar(e.x,y,w,2.5,act?1:v,AIL_COLOR[k],'rgba(0,0,0,.5)');
    y-=4;
  }
}
function drawEnemy(e){
  const a=Math.atan2(G.player.y-e.y,G.player.x-e.x);
  let scale=1,alpha=1;
  if(e.dying>0){ const t=e.dying/0.2; scale=0.3+0.7*t; alpha=t; }
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(e.x,e.y);
  ctx.scale(scale,scale);
  const gr=e.r*(e.rarity?2.4:2);
  ctx.globalAlpha=alpha*(e.rarity?.7:.5);
  ctx.drawImage(glowSprite(e.color),-gr,-gr,gr*2,gr*2);
  ctx.globalAlpha=alpha;
  let col=e.hurt>0?'#ffffff':e.color;
  if(e.ailT.freeze>0) col='#9fd8ee';
  else if(e.ailT.ignite>0) col=shadeHex(e.color,30);
  ctx.fillStyle=col;
  ctx.strokeStyle=rgba(shadeHex(e.color,60),.9);
  ctx.lineWidth=1.4;
  switch(e.shape){
    case 'tri': poly(0,0,e.r,3,a); break;
    case 'pent': poly(0,0,e.r,5,a+Math.sin(e.wob)*.1); break;
    case 'hex': poly(0,0,e.r,6,a*.3); break;
    case 'dart':
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*e.r*1.5,Math.sin(a)*e.r*1.5);
      ctx.lineTo(Math.cos(a+2.5)*e.r,Math.sin(a+2.5)*e.r);
      ctx.lineTo(Math.cos(a-2.5)*e.r,Math.sin(a-2.5)*e.r);
      ctx.closePath();
      break;
    default: ctx.beginPath(); ctx.arc(0,0,e.r,0,TAU); ctx.closePath();
  }
  ctx.fill(); ctx.stroke();
  if(e.rarity>0){
    const pr=e.r+6+Math.sin(e.pulse)*3;
    ctx.strokeStyle=rgba(e.rarity===2?'#c87838':'#6a8fc8',.5+.25*Math.sin(e.pulse));
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,pr,0,TAU); ctx.stroke();
    if(e.shieldMax>0&&e.shield>0){
      ctx.strokeStyle=rgba('#cfe0ff',.3+.2*Math.sin(e.pulse*1.4));
      ctx.beginPath(); ctx.arc(0,0,pr+4,0,TAU*(e.shield/e.shieldMax)); ctx.stroke();
    }
  }
  if(e.ailT.stun>0){
    ctx.strokeStyle='rgba(232,216,160,.8)';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,e.r+9,e.pulse,e.pulse+2); ctx.stroke();
  }
  ctx.restore();
  /* telegraphs */
  if(e.tele>0){
    const t=1-e.tele/e.teleMax;
    ctx.save();
    ctx.globalAlpha=.25+.5*t;
    ctx.strokeStyle=rgba(e.color,.85);
    ctx.lineWidth=1.5;
    if(e.kind==='exploder'){
      ctx.beginPath(); ctx.arc(e.x,e.y,ARCH.exploder.radius*t,0,TAU); ctx.stroke();
    } else {
      ctx.setLineDash([7,7]);
      ctx.beginPath();
      ctx.moveTo(e.x,e.y);
      ctx.lineTo(e.x+Math.cos(e.aim)*(90+120*t),e.y+Math.sin(e.aim)*(90+120*t));
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
  if(e.dying<=0){
    if(e.rarity>0) bar(e.x,e.y-e.r-11,36,3,e.hp/e.maxHp,e.rarity===2?'#c87838':'#6a8fc8');
    drawAilmentMeters(e);
  }
}
function drawBoss(){
  const b=G.boss;
  if(!b||b.dead) return;
  if(!inView(b.x,b.y,b.r+180)) return;
  let scale=1,alpha=1;
  if(b.dying>0){ const t=b.dying/0.2; scale=.4+.6*t; alpha=t; }
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(b.x,b.y);
  ctx.scale(scale,scale);
  const gr=b.r*2.2;
  ctx.globalAlpha=alpha*.6;
  ctx.drawImage(glowSprite(b.rim),-gr,-gr,gr*2,gr*2);
  ctx.globalAlpha=alpha;
  ctx.rotate(b.rot);
  ctx.fillStyle=b.hurt>0?'#ffffff':(b.ailT.freeze>0?'#9fd8ee':b.color);
  poly(0,0,b.r,4,0); ctx.fill();
  ctx.strokeStyle=rgba(b.rim,.85); ctx.lineWidth=2.4;
  poly(0,0,b.r*1.22,4,0); ctx.stroke();
  ctx.rotate(-b.rot*2.4);
  ctx.strokeStyle=rgba(b.rim,.4); ctx.lineWidth=1.6;
  poly(0,0,b.r*.62,4,0); ctx.stroke();
  ctx.restore();
  if(b.windup){
    const t=1-b.windup.t/b.windup.total;
    ctx.save();
    ctx.globalAlpha=.3+.55*t;
    ctx.strokeStyle=rgba(b.rim,.9);
    ctx.lineWidth=2.5;
    const p=G.player;
    if(b.windup.kind==='dash'||b.windup.kind==='beam'){
      const a=Math.atan2(p.y-b.y,p.x-b.x);
      ctx.setLineDash([12,10]);
      ctx.beginPath(); ctx.moveTo(b.x,b.y);
      ctx.lineTo(b.x+Math.cos(a)*(b.windup.kind==='beam'?700:420)*t,
                 b.y+Math.sin(a)*(b.windup.kind==='beam'?700:420)*t);
      ctx.stroke(); ctx.setLineDash([]);
    } else if(b.windup.kind==='slam'){
      const w=b.windupAt||p;
      ctx.beginPath(); ctx.arc(w.x,w.y,170,0,TAU); ctx.stroke();
      ctx.globalAlpha=.2+.5*t;
      ctx.beginPath(); ctx.arc(w.x,w.y,170*t,0,TAU); ctx.stroke();
    } else if(b.windup.kind==='ring'){
      const w=b.windupAt||p;
      ctx.beginPath(); ctx.arc(w.x,w.y,190,0,TAU*t); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*1.3+t*90,0,TAU); ctx.stroke();
    }
    ctx.restore();
  }
  if(b.dying<=0) drawAilmentMeters(b);
}
function drawPlayer(){
  const p=G.player,st=G.st;

  ctx.translate(p.x,p.y+Math.sin(p.walkT)*1.6);

    ctx.globalAlpha=1;
  }
  if(p.es>0){
    ctx.strokeStyle=rgba('#96c8e6',.25+.2*(p.es/Math.max(1,st.maxES)));

function drawShots(){

      ctx.strokeStyle=rgba(s.color,.05+.26*t);

      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
    const rr=s.r*s.size;
    ctx.globalAlpha=.8;
    ctx.drawImage(glowSprite(s.color),s.x-rr*2.4,s.y-rr*2.4,rr*4.8,rr*4.8);
    ctx.globalAlpha=1;
    ctx.fillStyle=s.color;
    ctx.beginPath(); ctx.arc(s.x,s.y,rr,0,TAU); ctx.fill();
    ctx.globalAlpha=.55; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,rr*.42,0,TAU); ctx.fill();
    ctx.globalAlpha=1;

}

function drawFx(){
  for(const f of G.fx){
    if(f.type==='shock'&&!inView(f.x,f.y,f.max+20)) continue;
    const t=clamp(f.life/f.maxLife,0,1);
    ctx.save();
    ctx.shadowColor=rgba(f.color,.9);
    ctx.shadowBlur=18;
    if(f.type==='arc'){
      const spread=f.arc*.5;
      ctx.globalAlpha=t*.85;
      ctx.strokeStyle=f.color;
      ctx.lineWidth=11*t;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(.72+.28*(1-t)),f.ang-spread,f.ang+spread); ctx.stroke();
    } else if(f.type==='shock'){
      ctx.globalAlpha=t*.8;
      ctx.strokeStyle=f.color; ctx.lineWidth=3+7*t;
      ctx.beginPath(); ctx.arc(f.x,f.y,Math.max(1,f.r),0,TAU); ctx.stroke();
    } else if(f.type==='beam'){
      ctx.globalAlpha=t; ctx.strokeStyle=f.color; ctx.lineCap='round'; ctx.lineWidth=f.w*t;
      ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x2,f.y2); ctx.stroke();
      ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(1,f.w*t*.3);
      ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x2,f.y2); ctx.stroke();
    } else if(f.type==='streak'){
      ctx.globalAlpha=t*.8; ctx.strokeStyle=f.color; ctx.lineWidth=13*t; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke();
    } else if(f.type==='bolt'){
      ctx.globalAlpha=t; ctx.strokeStyle=f.color; ctx.lineWidth=3.5*t+1;
      ctx.beginPath();
      const seg=5;
      ctx.moveTo(f.x1,f.y1);
      for(let i=1;i<seg;i++){
        const q=i/seg;
        ctx.lineTo(lerp(f.x1,f.x2,q)+rnd(-9,9),lerp(f.y1,f.y2,q)+rnd(-9,9));
      }
      ctx.lineTo(f.x2,f.y2);
      ctx.stroke();
    } else if(f.type==='telegraph'){
      ctx.globalAlpha=.3+.4*(1-t);
      ctx.strokeStyle=f.color; ctx.lineWidth=2;
      ctx.setLineDash([9,8]);
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
}
function drawParts(){

function drawMotes(){

function drawBossArrow(sx,sy){
  const b=G.boss;
  if(!b||b.dead||b.dying>0||!b.awake) return;
  const w=G.view.w,h=G.view.h;
  const bx=b.x-sx,by=b.y-sy;
  if(bx>-40&&bx<w+40&&by>-40&&by<h+40) return;
  const cx=w/2,cy=h/2;
  const a=Math.atan2(by-cy,bx-cx);
  const rad=Math.min(w,h)*.38;
  ctx.save();
  ctx.translate(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);
  ctx.rotate(a);
  ctx.globalAlpha=.55+.35*Math.abs(Math.sin(G.time*3));
  ctx.fillStyle='#c04a3c';
  ctx.shadowColor='rgba(192,74,60,.9)'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-11,9); ctx.lineTo(-11,-9);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawMinimap(){
  const S=118;
  mmx.clearRect(0,0,S,S);
  if(mmBase) mmx.drawImage(mmBase,0,0);
  const s=S/GRID/TILE;
  for(const k of G.pickups){
    mmx.fillStyle=k.kind==='cur'?'rgba(216,198,156,.9)':RARITY_COLOR[k.item.r];
    mmx.fillRect(k.x*s-1,k.y*s-1,2.5,2.5);
  }
  for(const e of G.enemies){
    if(e.dead||e.dying) continue;
    mmx.fillStyle=e.rarity===2?'rgba(200,120,56,.95)':e.rarity===1?'rgba(106,143,200,.8)':'rgba(180,170,155,.4)';
    const sz=e.rarity?3:2;
    mmx.fillRect(e.x*s-sz/2,e.y*s-sz/2,sz,sz);
  }
  for(const n of G.npcs){ mmx.fillStyle='rgba(216,198,156,.95)'; mmx.fillRect(n.x*s-2,n.y*s-2,4,4); }
  for(const pt of G.portals){
    mmx.fillStyle=pt.locked?'rgba(138,106,90,.9)':'rgba(143,192,224,.95)';
    mmx.fillRect(pt.x*s-2,pt.y*s-2,4,4);
  }
  const b=G.boss;
  if(b&&!b.dead){
    mmx.fillStyle='rgba(214,60,46,.98)';
    mmx.beginPath(); mmx.arc(b.x*s,b.y*s,3.4,0,TAU); mmx.fill();
  }
  const p=G.player;
  mmx.fillStyle='#fff';
  mmx.beginPath(); mmx.arc(p.x*s,p.y*s,2.6,0,TAU); mmx.fill();
}
function render(){
  const dpr=G.view.dpr,w=G.view.w,h=G.view.h;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=G.theme?G.theme.bg:'#07070a';
  ctx.fillRect(0,0,w,h);
  if(!G.player) return;
  const sh=G.cam.shake;
  const ox=sh>0?rnd(-sh,sh)*.5:0, oy=sh>0?rnd(-sh,sh)*.5:0;
  const sx=G.cam.x-w/2+ox, sy=G.cam.y-h/2+oy;
  VB.x0=sx-90; VB.y0=sy-90; VB.x1=sx+w+90; VB.y1=sy+h+90;
  ctx.save();
  ctx.translate(-Math.round(sx),-Math.round(sy));
  drawTiles(sx,sy);
  drawNpcsPortals();
  drawClouds();
  drawPickups();
  drawFx();
  drawParts();
  drawTotems();
  drawShots();
  for(const e of G.enemies) if(inView(e.x,e.y,e.r+40)) drawEnemy(e);
  drawBoss();
  drawPlayer();
  drawDmgNums();
  ctx.restore();
  drawMotes();
  drawVignettes();
  drawBossArrow(sx,sy);
  drawMinimap();
}
