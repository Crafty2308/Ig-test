<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141413">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--bd:#e3e1da;--acc:#2f6fdb;--ok:#2e7d32;--okbg:#e5f3e4;--bad:#c62828;--badbg:#fbe9e9;--in:#f3f2ee;--sp:#1db954}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--tx:#f0efe9;--mut:#9a988f;--bd:#33322f;--acc:#6c9cf0;--ok:#7fd483;--okbg:#1f3a21;--bad:#ef8a8a;--badbg:#3e1f1f;--in:#2a2a27}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
h1{font-size:20px;font-weight:600;margin:4px 0 12px}
h2{font-size:17px;font-weight:600;margin:18px 0 8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.tabs button{padding:9px 4px;font-size:14px}
.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button{font:inherit;font-size:15px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.spb{background:var(--sp);border-color:var(--sp);color:#000;font-weight:600}
button.dng{color:var(--bad);border-color:var(--bad);background:transparent}
button.sm{padding:5px 10px;font-size:14px;white-space:nowrap}
button.ic{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
input,select{font:inherit;color:var(--tx);background:var(--in);border:1px solid transparent;border-radius:8px;padding:8px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input::placeholder{color:var(--mut);opacity:.55}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.exh{display:flex;align-items:center;gap:8px}
.exh input{font-weight:600;background:transparent;padding:4px 0}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--in);flex:none;border:1px solid var(--bd)}
.thumb.bad{visibility:hidden}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:20px}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 44px 36px;gap:6px;align-items:center;padding:4px;border-radius:10px;margin-top:4px}
.row input{text-align:center}
.row.hd{font-size:12px;color:var(--mut);margin:6px 0 0;padding-bottom:0}
.row.hd span{text-align:center}
.row .n{font-size:14px;color:var(--mut);text-align:center}
.row.done{background:var(--okbg)}
.row.done input,.row.done .n{color:var(--ok);background:transparent}
.ck{height:40px;padding:0}
.row.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.x{height:36px;padding:0;color:var(--mut);background:transparent;border-color:transparent;font-size:20px}
.card.all .exh input{color:var(--ok)}
.tpl{display:grid;gap:10px}
.tpl button{text-align:left;padding:14px}
.tpl b{display:block;font-size:17px}
.tpl small{color:var(--mut);font-size:13px}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
.timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.tt{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;min-width:84px}
.tt.zero{color:var(--ok)}
.bar{height:4px;background:var(--bd);border-radius:2px;margin:0 auto 6px;max-width:560px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.music{max-width:560px;margin:0 auto 4px;font-size:12px;color:var(--mut);min-height:16px}
.music.on{color:var(--sp)}
.mut{color:var(--mut);font-size:14px}
.hist .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist .ex{font-size:14px;margin-top:6px}
.hist .ex b{font-weight:600}
.flex{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) 60px 36px;gap:6px;align-items:center;margin-top:6px}
.lrow .thumb{width:40px;height:40px}
.lrow input.s{text-align:center}
.note{font-size:13px;color:var(--mut);margin:8px 0}
.toast{position:fixed;left:14px;right:14px;top:calc(10px + env(safe-area-inset-top));max-width:532px;margin:0 auto;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .body{background:var(--bg);width:100%;max-width:560px;height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet .head{padding:12px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bd)}
.sheet .scroll{overflow-y:auto;padding:10px 14px 30px;flex:1;-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:5px 11px;font-size:13px;border-radius:20px;white-space:nowrap;flex:none}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--mut);font-size:12px}
.li .thumb{width:56px;height:56px}
.anim{position:relative;width:100%;aspect-ratio:4/3;background:var(--in);border-radius:14px;overflow:hidden}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s}
.tag{display:inline-block;background:var(--in);border-radius:20px;padding:3px 10px;font-size:13px;margin:0 6px 6px 0}
ol{padding-left:20px}ol li{margin-bottom:8px}
.set{display:grid;gap:8px}
.set label{font-size:13px;color:var(--mut)}
code{font-family:ui-monospace,monospace;font-size:12px;background:var(--in);padding:2px 5px;border-radius:5px;word-break:break-all}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sw input{width:auto;transform:scale(1.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button data-tab="w" class="on">Workout</button>
    <button data-tab="h">History</button>
    <button data-tab="l">Layouts</button>
    <button data-tab="s">Settings</button>
  </div>
  <div id="view"><p class="mut">Loading…</p></div>
</div>

<div class="timer">
  <div class="music" id="music"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="in">
    <div class="tt" id="tt">1:30</div>
    <button class="ic" id="tMinus" aria-label="15 seconds less">−</button>
    <button class="sm" id="tVal" aria-label="Set rest time" style="min-width:58px">90s</button>
    <input id="tIn" type="number" inputmode="numeric" min="5" max="900" style="display:none;width:70px;text-align:center" aria-label="Rest seconds">
    <button class="ic" id="tPlus" aria-label="15 seconds more">+</button>
    <span class="sp"></span>
    <button class="ic" id="tPlay" aria-label="Start or pause rest">▶</button>
    <button class="ic" id="tReset" aria-label="Reset rest">↺</button>
  </div>
</div>

<div class="sheet" id="picker"><div class="body">
  <div class="head"><input id="pq" placeholder="Search exercises" autocomplete="off"><button class="ic" data-close="picker" aria-label="Close">✕</button></div>
  <div class="chips" id="pEq"></div>
  <div class="chips" id="pMu"></div>
  <div class="scroll" id="pList"></div>
</div></div>

<div class="sheet" id="detail"><div class="body">
  <div class="head"><b id="dName" style="flex:1;font-size:17px"></b><button class="ic" data-close="detail" aria-label="Close">✕</button></div>
  <div class="scroll" id="dBody"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const DB_URL="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json";
const IMG="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
const DEFAULT_TEMPLATES=[
 {name:"Push",ex:[["Lateral Raises (Warm-Up)",3,"Side_Lateral_Raise"],["Supine Press",3,"Smith_Machine_Bench_Press"],["Pec Deck",3,"Butterfly"],["Incline Press (Smith)",3,"Smith_Machine_Incline_Bench_Press"],["Overhead Tricep Extension",3,"Standing_Dumbbell_Triceps_Extension"]]},
 {name:"Pull",ex:[["Lat Pulldown",3,"Wide-Grip_Lat_Pulldown"],["Seated Cable Row",3,"Seated_Cable_Rows"],["Isolateral Pulldown",3,"One_Arm_Lat_Pulldown"],["Reverse Pec Deck",3,"Reverse_Machine_Flyes"],["Hammer Curls",3,"Hammer_Curls"]]},
 {name:"Upper",ex:[["Supine Press",3,"Smith_Machine_Bench_Press"],["Lat Pulldown",3,"Wide-Grip_Lat_Pulldown"],["Shoulder Press (Machine)",3,"Leverage_Shoulder_Press"],["Seated Cable Row",3,"Seated_Cable_Rows"],["Lateral Raises",3,"Side_Lateral_Raise"],["Overhead Tricep Extension",3,"Standing_Dumbbell_Triceps_Extension"],["Hammer Curls",3,"Hammer_Curls"]]}
];
const COMMON=[["Supine Press","Smith_Machine_Bench_Press"],["Bench Press (Machine)","Smith_Machine_Bench_Press"],["Bench Press","Barbell_Bench_Press_-_Medium_Grip"],["Incline Bench Press","Barbell_Incline_Bench_Press_-_Medium_Grip"],["Decline Bench Press","Decline_Barbell_Bench_Press"],["Dumbbell Bench Press","Dumbbell_Bench_Press"],["Incline Dumbbell Press","Incline_Dumbbell_Press"],["Chest Press (Seated Machine)","Leverage_Chest_Press"],["Incline Chest Press (Machine)","Leverage_Incline_Chest_Press"],["Smith Bench Press","Smith_Machine_Bench_Press"],["Incline Press (Smith)","Smith_Machine_Incline_Bench_Press"],["Pec Deck","Butterfly"],["Cable Fly","Cable_Crossover"],["Low Cable Fly","Low_Cable_Crossover"],["Dumbbell Fly","Dumbbell_Flyes"],["Incline Dumbbell Fly","Incline_Dumbbell_Flyes"],["Push-Ups","Pushups"],["Dips (Chest)","Dips_-_Chest_Version"],["Cable Chest Press","Cable_Chest_Press"],["Shoulder Press (Machine)","Leverage_Shoulder_Press"],["Dumbbell Shoulder Press","Dumbbell_Shoulder_Press"],["Overhead Press","Barbell_Shoulder_Press"],["Smith Shoulder Press","Smith_Machine_Overhead_Shoulder_Press"],["Arnold Press","Arnold_Dumbbell_Press"],["Lateral Raises","Side_Lateral_Raise"],["Cable Lateral Raise","Cable_Seated_Lateral_Raise"],["Front Raises","Front_Dumbbell_Raise"],["Reverse Pec Deck","Reverse_Machine_Flyes"],["Rear Delt Fly (Cable)","Cable_Rear_Delt_Fly"],["Rear Delt Fly (Dumbbell)","Seated_Bent-Over_Rear_Delt_Raise"],["Face Pulls","Face_Pull"],["Upright Row","Upright_Barbell_Row"],["Shrugs","Dumbbell_Shrug"],["Lat Pulldown","Wide-Grip_Lat_Pulldown"],["Reverse-Grip Pulldown","Underhand_Cable_Pulldowns"],["Close-Grip Pulldown","Close-Grip_Front_Lat_Pulldown"],["V-Bar Pulldown","V-Bar_Pulldown"],["Isolateral Pulldown","One_Arm_Lat_Pulldown"],["Single-Arm Pulldown","One_Arm_Lat_Pulldown"],["Pull-Ups","Pullups"],["Chin-Ups","Chin-Up"],["Seated Cable Row","Seated_Cable_Rows"],["Single-Arm Cable Row","Seated_One-arm_Cable_Pulley_Rows"],["Machine Row","Leverage_High_Row"],["T-Bar Row","T-Bar_Row_with_Handle"],["Barbell Row","Bent_Over_Barbell_Row"],["Dumbbell Row","One-Arm_Dumbbell_Row"],["Straight-Arm Pulldown","Straight-Arm_Pulldown"],["Back Extension","Hyperextensions_Back_Extensions"],["Deadlift","Barbell_Deadlift"],["Hammer Curls","Hammer_Curls"],["Rope Hammer Curl","Cable_Hammer_Curls_-_Rope_Attachment"],["Dumbbell Curl","Dumbbell_Bicep_Curl"],["Barbell Curl","Barbell_Curl"],["EZ-Bar Curl","EZ-Bar_Curl"],["Cable Curl","Standing_Biceps_Cable_Curl"],["Preacher Curl","Preacher_Curl"],["Preacher Curl (Machine)","Machine_Preacher_Curls"],["Incline Curl","Alternate_Incline_Dumbbell_Curl"],["Concentration Curl","Concentration_Curls"],["Reverse Curl","Reverse_Barbell_Curl"],["Overhead Tricep Extension","Standing_Dumbbell_Triceps_Extension"],["Overhead Cable Extension","Cable_Rope_Overhead_Triceps_Extension"],["Tricep Pushdown (Rope)","Triceps_Pushdown_-_Rope_Attachment"],["Tricep Pushdown (Bar)","Triceps_Pushdown"],["Skull Crushers","EZ-Bar_Skullcrusher"],["Close-Grip Bench Press","Close-Grip_Barbell_Bench_Press"],["Dips (Triceps)","Dips_-_Triceps_Version"],["Bench Dips","Bench_Dips"],["Tricep Kickbacks","Tricep_Dumbbell_Kickback"],["Tricep Machine","Machine_Triceps_Extension"],["Squat","Barbell_Squat"],["Smith Squat","Smith_Machine_Squat"],["Hack Squat","Hack_Squat"],["Leg Press","Leg_Press"],["Leg Extension","Leg_Extensions"],["Lying Leg Curl","Lying_Leg_Curls"],["Seated Leg Curl","Seated_Leg_Curl"],["Romanian Deadlift","Romanian_Deadlift"],["Bulgarian Split Squat","Split_Squat_with_Dumbbells"],["Lunges","Dumbbell_Lunges"],["Goblet Squat","Goblet_Squat"],["Hip Thrust","Barbell_Hip_Thrust"],["Glute Kickback (Cable)","Glute_Kickback"],["Hip Abduction (Machine)","Thigh_Abductor"],["Hip Adduction (Machine)","Thigh_Adductor"],["Standing Calf Raise","Standing_Calf_Raises"],["Seated Calf Raise","Seated_Calf_Raise"],["Calf Press (Leg Press)","Calf_Press_On_The_Leg_Press_Machine"],["Cable Crunch","Cable_Crunch"],["Ab Crunch Machine","Ab_Crunch_Machine"],["Hanging Leg Raise","Hanging_Leg_Raise"],["Captain's Chair Leg Raise","Knee_Hip_Raise_On_Parallel_Bars"],["Plank","Plank"],["Russian Twist","Russian_Twist"],["Ab Wheel","Ab_Roller"],["Crunches","Crunches"],["Decline Sit-Ups","Decline_Crunch"],["Wrist Curls","Palms-Up_Barbell_Wrist_Curl_Over_A_Bench"],["Farmer's Walk","Farmers_Walk"]];
const EQ=[["all","All"],["machine","Machine"],["cable","Cable"],["dumbbell","Dumbbell"],["barbell","Barbell"],["body only","Bodyweight"],["e-z curl bar","EZ bar"],["kettlebells","Kettlebell"],["bands","Bands"],["other","Other"]];
const MU=[["all","All muscles"],["chest","Chest"],["shoulders","Shoulders"],["lats","Lats"],["middle back","Mid back"],["traps","Traps"],["biceps","Biceps"],["triceps","Triceps"],["forearms","Forearms"],["quadriceps","Quads"],["hamstrings","Hamstrings"],["glutes","Glutes"],["calves","Calves"],["abdominals","Abs"],["lower back","Lower back"]];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const LS={get(k,d){try{const v=localStorage.getItem("gt2_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("gt2_"+k,JSON.stringify(v))}catch(e){toast("Storage full or blocked")}}};
let toastT;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),3200)}

const S={tab:"w",templates:LS.get("templates",null)||clone(DEFAULT_TEMPLATES),current:LS.get("current",null),history:LS.get("history",[]),rest:LS.get("rest",90),armed:{},lib:null,libById:{},pick:{eq:"all",mu:"all",q:"",target:null,all:false}};
const saveT=()=>LS.set("templates",S.templates),saveC=()=>LS.set("current",S.current),saveH=()=>LS.set("history",S.history);

async function loadLib(){
 const cached=LS.get("lib",null);if(cached)setLib(cached);
 try{const r=await fetch(DB_URL);if(!r.ok)throw 0;const d=await r.json();
  const slim=d.map(x=>({id:x.id,n:x.name,e:x.equipment||"other",c:x.category,p:x.primaryMuscles||[],s:x.secondaryMuscles||[],i:x.images||[],in:x.instructions||[],lv:x.level}));
  setLib(slim);LS.set("lib",slim)}catch(e){if(!S.lib)toast("Couldn't load the exercise library. Check your connection.")}
}
function setLib(a){S.lib=a;S.libById={};a.forEach(x=>S.libById[x.id]=x);if(S.tab!=="s")render();if($("#picker").classList.contains("open"))renderPick()}
const thumbUrl=ref=>{const x=ref&&S.libById[ref];return x&&x.i[0]?IMG+x.i[0]:null};
const thumbHtml=(ref,name)=>{const u=thumbUrl(ref);return u?'<img class="thumb" loading="lazy" src="'+u+'" alt="" data-act="info" data-ref="'+esc(ref)+'" data-name="'+esc(name||"")+'">':'<div class="thumb ph">◇</div>'};

function lastFor(name,ref){const n=name.trim().toLowerCase();
 for(const w of S.history){const e=(w.ex||[]).find(x=>x.name.trim().toLowerCase()===n)||(ref?(w.ex||[]).find(x=>x.ref===ref):null);
  if(e){const s=e.sets.filter(s=>s.kg!==""||s.reps!=="");if(s.length)return s}}return []}
const fmtSets=sets=>sets.filter(s=>s.kg!==""||s.reps!=="").map(s=>(s.kg===""?"–":s.kg)+"×"+(s.reps===""?"–":s.reps)).join(", ");
const fmtDate=ts=>{const d=new Date(ts);return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})};

function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
 const v=$("#view");
 v.innerHTML=S.tab==="w"?(S.current?rWorkout():rStart()):S.tab==="h"?rHistory():S.tab==="l"?rLayouts():rSettings();
}
function rStart(){
 let h='<h1>Start a workout</h1><div class="tpl">';
 S.templates.forEach((t,i)=>{h+='<button data-act="start" data-i="'+i+'"><b>'+esc(t.name)+'</b><small>'+esc(t.ex.map(e=>e[0]).join(" · ")||"No exercises yet")+'</small></button>'});
 return h+'<button data-act="start" data-i="-1"><b>Empty workout</b><small>Add exercises as you go</small></button></div>';
}
function rWorkout(){
 const w=S.current;
 let h='<input data-f="wname" value="'+esc(w.name)+'" style="font-size:20px;font-weight:600;background:transparent;padding:2px 0;margin-bottom:10px">';
 w.ex.forEach((e,ei)=>{
  const all=e.sets.length&&e.sets.every(s=>s.done),last=lastFor(e.name,e.ref);
  h+='<div class="card'+(all?' all':'')+'"><div class="exh">'+thumbHtml(e.ref,e.name)+'<input data-f="exname" data-e="'+ei+'" value="'+esc(e.name)+'"><button class="sm" data-act="addset" data-e="'+ei+'">+ set</button><button class="sm '+(S.armed["ex"+ei]?'dng':'')+'" data-act="delex" data-e="'+ei+'">'+(S.armed["ex"+ei]?'Sure?':'✕')+'</button></div>';
  h+='<div class="row hd"><span>#</span><span>kg</span><span>reps</span><span></span><span></span></div>';
  e.sets.forEach((s,si)=>{const L=last[si]||last[last.length-1]||{kg:"",reps:""};
   h+='<div class="row'+(s.done?' done':'')+'"><span class="n">'+(si+1)+'</span><input type="number" inputmode="decimal" step="any" data-f="kg" data-e="'+ei+'" data-s="'+si+'" placeholder="'+esc(L.kg)+'" value="'+esc(s.kg)+'"><input type="number" inputmode="numeric" data-f="reps" data-e="'+ei+'" data-s="'+si+'" placeholder="'+esc(L.reps)+'" value="'+esc(s.reps)+'"><button class="ck" data-act="done" data-e="'+ei+'" data-s="'+si+'" aria-label="Set done">✓</button><button class="x" data-act="delset" data-e="'+ei+'" data-s="'+si+'" aria-label="Remove set">×</button></div>'});
  h+='</div>';
 });
 h+='<button data-act="pickex" style="width:100%;margin-bottom:14px">+ Add exercise</button>';
 return h+'<div class="flex"><button class="pri" data-act="finish" style="flex:1">Finish and save</button><button class="'+(S.armed.discard?'dng':'')+'" data-act="discard">'+(S.armed.discard?'Discard? Tap again':'Discard')+'</button></div>';
}
function rHistory(){
 if(!S.history.length)return '<h1>History</h1><p class="mut">Finished workouts show up here.</p>';
 let h='<h1>History</h1>';
 S.history.forEach(w=>{h+='<div class="card hist"><div class="top"><div><b>'+esc(w.name)+'</b><div class="mut">'+fmtDate(w.ts)+'</div></div><button class="sm '+(S.armed["w"+w.id]?'dng':'')+'" data-act="delw" data-id="'+esc(w.id)+'">'+(S.armed["w"+w.id]?'Delete?':'✕')+'</button></div>';
  (w.ex||[]).forEach(e=>{const t=fmtSets(e.sets);if(t)h+='<div class="ex"><b>'+esc(e.name)+'</b>: '+esc(t)+'</div>'});h+='</div>'});
 return h;
}
function rLayouts(){
 let h='<h1>Layouts</h1><p class="note">What each workout starts with. Tap a picture to see how the exercise is done.</p>';
 S.templates.forEach((t,ti)=>{
  h+='<div class="card"><div class="exh"><input data-f="tname" data-t="'+ti+'" value="'+esc(t.name)+'"><button class="sm '+(S.armed["t"+ti]?'dng':'')+'" data-act="deltpl" data-t="'+ti+'">'+(S.armed["t"+ti]?'Sure?':'✕')+'</button></div>';
  h+='<div class="lrow note" style="margin:6px 0 0"><span></span><span>Exercise</span><span style="text-align:center">Sets</span><span></span></div>';
  t.ex.forEach((e,ei)=>{h+='<div class="lrow">'+thumbHtml(e[2],e[0])+'<input data-f="tex" data-t="'+ti+'" data-e="'+ei+'" value="'+esc(e[0])+'"><input class="s" type="number" inputmode="numeric" data-f="tsets" data-t="'+ti+'" data-e="'+ei+'" value="'+e[1]+'"><button class="x" data-act="deltex" data-t="'+ti+'" data-e="'+ei+'" aria-label="Remove exercise">×</button></div>'});
  h+='<button class="sm" data-act="picktex" data-t="'+ti+'" style="margin-top:8px">+ exercise</button></div>';
 });
 return h+'<button data-act="addtpl" style="width:100%">+ New layout</button><button data-act="resettpl" class="'+(S.armed.reset?'dng':'')+'" style="width:100%;margin-top:10px">'+(S.armed.reset?'Replace your layouts? Tap again':'Reset to Push / Pull / Upper')+'</button>';
}
function rSettings(){
 const c=SP.connected();
 let h='<h1>Settings</h1><h2>Spotify</h2><div class="card set">';
 if(c){
  h+='<div class="flex"><span style="color:var(--sp);font-weight:600;flex:1">Connected</span><button class="sm" data-act="spout">Disconnect</button></div>';
  h+='<div class="sw"><span>Switch music with the rest timer</span><input type="checkbox" id="spAuto" '+(SP.s.auto?'checked':'')+'></div>';
  h+='<label>Workout playlist</label><select id="spWork">'+plOpts(SP.s.work)+'</select>';
  h+='<label>Rest playlist</label><select id="spRest">'+plOpts(SP.s.rest)+'</select>';
  h+='<button class="sm" data-act="spload">Reload playlists</button>';
  h+='<p class="note">Start the rest timer and your rest playlist plays. When it hits 0, your workout playlist picks up at the song and spot where it stopped. Spotify has to be open on your phone and have played something once.</p>';
 }else{
  h+='<label>Spotify client ID</label><input id="spCid" value="'+esc(SP.s.cid||"")+'" placeholder="Paste from developer.spotify.com">';
  h+='<button class="spb" data-act="splogin">Connect Spotify</button>';
  h+='<p class="note">In your Spotify developer app, add this exact redirect URI:</p><code>'+esc(SP.redirect())+'</code>';
 }
 h+='</div><h2>Rest timer</h2><div class="card"><p class="note" style="margin:0">Use − and + in the bottom bar to change the rest time by 15 seconds, or tap the seconds to type any time. It works while the timer is running too, and your setting is remembered.</p></div>';
 h+='<h2>Backup</h2><div class="card set"><p class="note" style="margin:0">Your data is saved on this phone only. Export now and then so you don\'t lose it.</p><div class="flex"><button data-act="export" style="flex:1">Export backup</button><button data-act="import" style="flex:1">Import backup</button></div><input type="file" id="impFile" accept="application/json,.json" style="display:none"></div>';
 h+='<p class="note">Exercise pictures from free-exercise-db (public domain).</p>';
 return h;
}
const plOpts=sel=>'<option value="">Choose…</option>'+(SP.playlists||[]).map(p=>'<option value="'+esc(p.uri)+'" '+(sel&&sel.uri===p.uri?'selected':'')+'>'+esc(p.name)+'</option>').join("")+(sel&&!(SP.playlists||[]).some(p=>p.uri===sel.uri)?'<option value="'+esc(sel.uri)+'" selected>'+esc(sel.name)+'</option>':'');

function openPicker(target){S.pick.target=target;S.pick.q="";$("#pq").value="";$("#picker").classList.add("open");renderChips();renderPick();setTimeout(()=>$("#pq").focus(),50)}
function renderChips(){
 $("#pEq").innerHTML=EQ.map(([k,l])=>'<button data-peq="'+k+'" class="'+(S.pick.eq===k?'on':'')+'">'+l+'</button>').join("");
 $("#pMu").innerHTML=MU.map(([k,l])=>'<button data-pmu="'+k+'" class="'+(S.pick.mu===k?'on':'')+'">'+l+'</button>').join("");
}
function renderPick(){
 const L=$("#pList");if(!S.lib){L.innerHTML='<p class="mut">Loading library…</p>';return}
 const q=S.pick.q.trim().toLowerCase(),words=q.split(/\s+/).filter(Boolean);
 let a=S.pick.all?S.lib.map(x=>({name:x.n,x})):COMMON.map(([n,id])=>({name:n,x:S.libById[id]})).filter(o=>o.x);
 a=a.filter(o=>(S.pick.eq==="all"||o.x.e===S.pick.eq)&&(S.pick.mu==="all"||o.x.p.includes(S.pick.mu))&&(S.pick.all&&!q?["strength","powerlifting"].includes(o.x.c):true));
 if(words.length)a=a.filter(o=>{const t=(o.name+" "+o.x.n+" "+o.x.p.join(" ")+" "+o.x.e).toLowerCase();return words.every(w=>t.includes(w))});
 if(S.pick.all||q)a.sort((m,n)=>{if(q){const sx=m.name.toLowerCase().startsWith(q)?0:1,sy=n.name.toLowerCase().startsWith(q)?0:1;if(sx!==sy)return sx-sy}return m.name.localeCompare(n.name)});
 let h='';if(q)h+='<div class="li" data-act="pickcustom"><div class="thumb ph">+</div><div class="t"><b>Add "'+esc(S.pick.q.trim())+'"</b><small>Your own exercise</small></div></div>';
 h+=a.slice(0,150).map(o=>'<div class="li"><img class="thumb" loading="lazy" src="'+(o.x.i[0]?IMG+o.x.i[0]:"")+'" alt="" data-act="info" data-ref="'+esc(o.x.id)+'" data-name="'+esc(o.name)+'"><div class="t" data-act="pickone" data-ref="'+esc(o.x.id)+'" data-name="'+esc(o.name)+'"><b>'+esc(o.name)+'</b><small>'+esc(o.x.p.join(", "))+' · '+esc(o.x.e)+'</small></div><button class="sm" data-act="pickone" data-ref="'+esc(o.x.id)+'" data-name="'+esc(o.name)+'">Add</button></div>').join("");
 if(!a.length)h+='<p class="mut">Nothing matches.</p>';
 if(a.length>150)h+='<p class="note">Showing 150 of '+a.length+'. Search to narrow it down.</p>';
 h+='<button data-act="pickall" style="width:100%;margin-top:12px">'+(S.pick.all?'Show common exercises only':'Show all '+S.lib.length+' exercises')+'</button>';
 L.innerHTML=h;
}
function pickDone(name,ref){
 const t=S.pick.target;$("#picker").classList.remove("open");
 if(t.kind==="w"){S.current.ex.push({name,ref,sets:[0,1,2].map(()=>({kg:"",reps:"",done:false}))});saveC()}
 else{S.templates[t.ti].ex.push([name,3,ref]);saveT()}
 render();
}
let animT;
function openDetail(ref,name){
 const x=S.libById[ref];if(!x)return;
 $("#dName").textContent=name||x.n;
 let h='';if(x.i.length)h+='<div class="anim">'+x.i.slice(0,2).map((p,i)=>'<img src="'+IMG+p+'" alt="'+esc(x.n)+(i?' end':' start')+' position" style="opacity:'+(i?0:1)+'">').join("")+'</div>';
 h+='<div style="margin-top:12px">'+x.p.map(m=>'<span class="tag" style="font-weight:600">'+esc(m)+'</span>').join("")+x.s.map(m=>'<span class="tag">'+esc(m)+'</span>').join("")+'<span class="tag">'+esc(x.e)+'</span></div>';
 if(x.in.length)h+='<h2>How to</h2><ol>'+x.in.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol>';
 $("#dBody").innerHTML=h;$("#detail").classList.add("open");
 clearInterval(animT);const imgs=$("#dBody").querySelectorAll(".anim img");
 if(imgs.length===2){let f=0;animT=setInterval(()=>{f^=1;imgs[0].style.opacity=f?0:1;imgs[1].style.opacity=f?1:0},1100)}
}

function startWorkout(i){
 const t=i>=0?S.templates[i]:{name:"Workout",ex:[]};
 S.current={id:uid(),name:t.name,started:Date.now(),ex:t.ex.map(e=>({name:e[0],ref:e[2]||null,sets:Array.from({length:Math.max(1,+e[1]||1)},()=>({kg:"",reps:"",done:false}))}))};
 saveC();render();wake();
}
function finish(){
 const w=clone(S.current);w.ts=Date.now();
 w.ex=w.ex.map(e=>({name:e.name,ref:e.ref,sets:e.sets.filter(s=>s.kg!==""||s.reps!==""||s.done)})).filter(e=>e.sets.length);
 if(!w.ex.length){toast("Nothing logged yet. Enter some sets first.");return}
 S.history.unshift(w);saveH();S.current=null;saveC();S.tab="h";render();unwake();
}

document.addEventListener("click",async ev=>{
 const cl=ev.target.closest("[data-close]");if(cl){$("#"+cl.dataset.close).classList.remove("open");clearInterval(animT);return}
 if(ev.target.classList.contains("sheet")){ev.target.classList.remove("open");clearInterval(animT);return}
 const tb=ev.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;S.armed={};render();if(S.tab==="s"&&SP.connected()&&!SP.playlists)SP.loadPlaylists();return}
 const pe=ev.target.closest("[data-peq]");if(pe){S.pick.eq=pe.dataset.peq;renderChips();renderPick();return}
 const pm=ev.target.closest("[data-pmu]");if(pm){S.pick.mu=pm.dataset.pmu;renderChips();renderPick();return}
 const b=ev.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,ei=+b.dataset.e,si=+b.dataset.s,ti=+b.dataset.t,w=S.current;
 const arm=k=>{if(S.armed[k]){S.armed={};return true}S.armed={[k]:true};render();return false};
 unlockAudio();
 if(!["delex","discard","delw","deltpl","resettpl"].includes(a))S.armed={};
 if(a==="start")startWorkout(+b.dataset.i);
 else if(a==="info")openDetail(b.dataset.ref,b.dataset.name);
 else if(a==="pickex")openPicker({kind:"w"});
 else if(a==="picktex")openPicker({kind:"t",ti});
 else if(a==="pickone")pickDone(b.dataset.name,b.dataset.ref);
 else if(a==="pickall"){S.pick.all=!S.pick.all;renderPick();$("#pList").scrollTop=0}
 else if(a==="pickcustom")pickDone(S.pick.q.trim().replace(/(^|[\s\-(\/])([a-z])/g,(m,p,c)=>p+c.toUpperCase()),null);
 else if(a==="addset"){const p=w.ex[ei].sets.at(-1);w.ex[ei].sets.push({kg:p?p.kg:"",reps:p?p.reps:"",done:false});saveC();render()}
 else if(a==="delset"){w.ex[ei].sets.splice(si,1);saveC();render()}
 else if(a==="done"){const s=w.ex[ei].sets[si];s.done=!s.done;if(s.done){const L=lastFor(w.ex[ei].name,w.ex[ei].ref),p=L[si]||L[L.length-1];if(p){if(s.kg==="")s.kg=p.kg;if(s.reps==="")s.reps=p.reps}}saveC();render()}
 else if(a==="delex"){if(arm("ex"+ei)){w.ex.splice(ei,1);saveC();render()}}
 else if(a==="finish")finish();
 else if(a==="discard"){if(arm("discard")){S.current=null;saveC();render();unwake()}}
 else if(a==="delw"){const id=b.dataset.id;if(arm("w"+id)){S.history=S.history.filter(x=>x.id!==id);saveH();render()}}
 else if(a==="deltex"){S.templates[ti].ex.splice(ei,1);saveT();render()}
 else if(a==="deltpl"){if(arm("t"+ti)){S.templates.splice(ti,1);saveT();render()}}
 else if(a==="resettpl"){if(arm("reset")){S.templates=clone(DEFAULT_TEMPLATES);saveT();render();toast("Layouts reset")}}
 else if(a==="addtpl"){S.templates.push({name:"New layout",ex:[]});saveT();render()}
 else if(a==="splogin")SP.login();
 else if(a==="spout"){SP.logout();render()}
 else if(a==="spload")SP.loadPlaylists();
 else if(a==="export")exportData();
 else if(a==="import")$("#impFile").click();
});
document.addEventListener("input",ev=>{
 const el=ev.target;
 if(el.id==="pq"){S.pick.q=el.value;renderPick();return}
 const f=el.dataset.f;if(!f)return;
 const ei=+el.dataset.e,si=+el.dataset.s,ti=+el.dataset.t,w=S.current;
 if(f==="wname"){w.name=el.value;saveC()}
 else if(f==="exname"){w.ex[ei].name=el.value;saveC()}
 else if(f==="kg"||f==="reps"){w.ex[ei].sets[si][f]=el.value;saveC()}
 else if(f==="tname"){S.templates[ti].name=el.value;saveT()}
 else if(f==="tex"){S.templates[ti].ex[ei][0]=el.value;saveT()}
 else if(f==="tsets"){S.templates[ti].ex[ei][1]=Math.max(1,Math.min(10,parseInt(el.value)||1));saveT()}
});
document.addEventListener("change",ev=>{
 const el=ev.target;
 if(el.id==="spAuto"){SP.s.auto=el.checked;SP.save()}
 else if(el.id==="spWork"||el.id==="spRest"){const p=(SP.playlists||[]).find(x=>x.uri===el.value);SP.s[el.id==="spWork"?"work":"rest"]=p?{uri:p.uri,name:p.name}:null;SP.save()}
 else if(el.id==="spCid"){SP.s.cid=el.value.trim();SP.save()}
 else if(el.id==="impFile"&&el.files[0])importData(el.files[0]);
 else if(el.dataset.f==="exname"&&S.tab==="w")render();
});

function exportData(){
 const blob=new Blob([JSON.stringify({v:1,templates:S.templates,history:S.history,current:S.current},null,1)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gym-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function importData(file){
 const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.history)||!Array.isArray(d.templates))throw 0;
  S.templates=d.templates;S.history=d.history;S.current=d.current||null;saveT();saveH();saveC();toast("Backup imported");render()}catch(e){toast("That file isn't a valid backup")}};r.readAsText(file);
}

/* Spotify */
const SP={s:LS.get("sp",{cid:"",auto:true,work:null,rest:null,pos:{}}),playlists:null,
 save(){LS.set("sp",this.s)},
 redirect(){return location.origin+location.pathname},
 connected(){return !!(this.s.refresh&&this.s.cid)},
 async login(){
  const cidEl=$("#spCid");if(cidEl)this.s.cid=cidEl.value.trim();
  if(!this.s.cid){toast("Paste your Spotify client ID first");return}
  if(location.protocol==="file:"){toast("Spotify login only works on your hosted page, not a local file");return}
  this.save();
  const v=b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch=b64url(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v))));
  LS.set("pkce",v);
  const p=new URLSearchParams({response_type:"code",client_id:this.s.cid,scope:"user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative",code_challenge_method:"S256",code_challenge:ch,redirect_uri:this.redirect()});
  location.href="https://accounts.spotify.com/authorize?"+p;
 },
 logout(){Object.assign(this.s,{token:null,refresh:null,exp:0});this.playlists=null;this.save();setMusic("")},
 async token_req(body){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||"Token error");
  this.s.token=j.access_token;if(j.refresh_token)this.s.refresh=j.refresh_token;this.s.exp=Date.now()+(j.expires_in-60)*1000;this.save();
 },
 async handleRedirect(){
  const q=new URLSearchParams(location.search);if(!q.has("code")&&!q.has("error"))return;
  history.replaceState(null,"",this.redirect());
  if(q.has("error")){toast("Spotify login cancelled");return}
  try{await this.token_req({grant_type:"authorization_code",code:q.get("code"),redirect_uri:this.redirect(),client_id:this.s.cid,code_verifier:LS.get("pkce","")});
   toast("Spotify connected");S.tab="s";render();this.loadPlaylists()}catch(e){toast("Spotify login failed: "+e.message)}
 },
 async api(path,opt={},retry=true){
  if(!this.connected())throw new Error("not connected");
  if(!this.s.token||Date.now()>this.s.exp)await this.token_req({grant_type:"refresh_token",refresh_token:this.s.refresh,client_id:this.s.cid});
  const r=await fetch("https://api.spotify.com/v1"+path,{method:opt.method||"GET",headers:{Authorization:"Bearer "+this.s.token,"Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401&&retry){this.s.exp=0;return this.api(path,opt,false)}
  return r;
 },
 async loadPlaylists(){
  try{let out=[],url="/me/playlists?limit=50";
   for(let i=0;i<6&&url;i++){const r=await this.api(url);if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();out=out.concat(j.items.filter(Boolean).map(p=>({uri:p.uri,name:p.name})));url=j.next?j.next.replace("https://api.spotify.com/v1",""):null}
   this.playlists=out;if(S.tab==="s")render();
  }catch(e){toast("Couldn't load playlists")}
 },
 async savePos(){
  try{const r=await this.api("/me/player");if(r.status!==200)return;const j=await r.json();
   if(j.context&&j.context.uri&&j.item){this.s.pos[j.context.uri]={track:j.item.uri,ms:j.progress_ms||0};this.save()}}catch(e){}
 },
 async play(pl,dev){
  const p=this.s.pos[pl.uri],body={context_uri:pl.uri};if(p){body.offset={uri:p.track};body.position_ms=p.ms}
  const q=dev?"?device_id="+encodeURIComponent(dev):"";
  let r=await this.api("/me/player/play"+q,{method:"PUT",body});
  if(r.status===404&&!dev){const d=await this.api("/me/player/devices");const j=d.ok?await d.json():{devices:[]};
   const pick=(j.devices||[]).find(x=>x.type==="Smartphone")||(j.devices||[])[0];
   if(!pick)throw new Error("Open Spotify on your phone first");return this.play(pl,pick.id)}
  if((r.status===400||r.status===500)&&p){delete this.s.pos[pl.uri];this.save();r=await this.api("/me/player/play"+q,{method:"PUT",body:{context_uri:pl.uri}})}
  if(!r.ok&&r.status!==204&&r.status!==202)throw new Error("Spotify said "+r.status);
 },
 busy:false,
 async switchTo(kind){
  if(!this.connected()||!this.s.auto)return;
  const pl=this.s[kind];if(!pl)return;
  if(this.busy)return;this.busy=true;
  try{await this.savePos();await this.play(pl);setMusic("♪ "+(kind==="rest"?"Rest":"Workout")+": "+pl.name,true)}
  catch(e){toast("Spotify: "+e.message)}
  this.busy=false;
 }
};
function b64url(bytes){let s="";bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function setMusic(t,on){const m=$("#music");m.textContent=t;m.classList.toggle("on",!!on)}

/* Rest timer */
let endAt=null,left=S.rest,tick=null,actx=null,resting=false;
const tt=$("#tt"),bar=$("#bar"),tPlay=$("#tPlay");
function unlockAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==="suspended")actx.resume()}catch(e){}}
function beep(){try{if(actx)[0,.25,.5].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.15)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function showT(){const s=Math.max(0,Math.ceil(left));tt.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");tt.classList.toggle("zero",s===0);bar.style.width=Math.min(100,100*(1-left/S.rest))+"%";
 $("#tVal").textContent=S.rest+"s"}
function check(){if(!endAt)return;left=(endAt-Date.now())/1000;if(left<=0){left=0;pauseT();endRest()}showT()}
function startT(){if(left<=0)left=S.rest;endAt=Date.now()+left*1000;clearInterval(tick);tick=setInterval(check,250);tPlay.textContent="❚❚";showT();
 if(!resting){resting=true;SP.switchTo("rest")}}
function pauseT(){clearInterval(tick);tick=null;endAt=null;tPlay.textContent="▶"}
function endRest(){if(!resting)return;resting=false;beep();SP.switchTo("work")}
tPlay.onclick=()=>{unlockAudio();tick?pauseT():startT()};
$("#tReset").onclick=()=>{pauseT();left=S.rest;showT();if(resting){resting=false;SP.switchTo("work")}};
function setRest(v,delta){const old=S.rest;S.rest=Math.max(5,Math.min(900,Math.round(v)));LS.set("rest",S.rest);
 if(tick){left=Math.max(1,left+(delta!=null?delta:S.rest-old));endAt=Date.now()+left*1000}else if(!resting)left=S.rest;else left=Math.max(0,left+(delta||0));showT()}
$("#tMinus").onclick=()=>setRest(S.rest-15,-15);
$("#tPlus").onclick=()=>setRest(S.rest+15,15);
const tVal=$("#tVal"),tIn=$("#tIn");
tVal.onclick=()=>{tIn.value=S.rest;tVal.style.display="none";tIn.style.display="";tIn.focus();tIn.select()};
const tDone=()=>{const v=parseInt(tIn.value);if(v>0)setRest(v);tIn.style.display="none";tVal.style.display=""};
tIn.addEventListener("blur",tDone);tIn.addEventListener("keydown",e=>{if(e.key==="Enter")tIn.blur()});
document.addEventListener("error",e=>{const t=e.target;if(t.tagName==="IMG")t.classList.add("bad")},true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){check();if(S.current)wake()}});

let lock=null;
async function wake(){try{if("wakeLock" in navigator&&!lock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>lock=null)}}catch(e){}}
function unwake(){try{lock&&lock.release()}catch(e){}lock=null}

if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
showT();render();loadLib();SP.handleRedirect();if(S.current)wake();
if(SP.connected()&&SP.s.auto&&SP.s.work)setMusic("♪ Spotify ready");
</script>
