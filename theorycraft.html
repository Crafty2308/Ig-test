        '<div class="sv num">'+fmt(per)+'<small>per cast</small></div></button>';
    }
    const starve = run.starvedTime/Math.max(0.1,run.totalTime);
    h += '<div class="note">Mana: <b>'+fmt(CTX.maxMana)+'</b> pool, <b>'+CTX.manaRegen.toFixed(1)+'/s</b> regen. '+
      (starve>0.03? 'The rotation falls back to basic attacks <b class="neg">'+Math.round(starve*100)+'%</b> of the time because it cannot pay for a spell.'
                  : 'The rotation never runs dry.')+
      '<br><br>Of the rotations tested, the one that does most damage with this build is <b>'+
      esc(POLICY_NAME[CTX.policy||"debt"])+'</b>. Change the build and this can change with it.</div>';
  }
  h += '</div>';

  /* ---- major IDs ---- */
  const majors = Object.keys(CTX.flags);
  h += '<div class="sect"><div class="sect-h">Major IDs<span class="rt">'+majors.length+' active</span></div>';
  if(!majors.length) h += '<div class="empty">None. Major IDs change a rule rather than a number.</div>';
  for(const m of majors){
    if(!MAJORS[m]) continue;
    const src = (CTX.agg.src["major."+m]||[]).map(x=>x.name).join(", ");
    h += '<div class="major"><div class="mt">Major ID</div><div class="mn">'+esc(MAJORS[m].name)+'</div>'+
         '<div class="md">'+esc(MAJORS[m].text)+'</div><div class="md" style="opacity:.7">from '+esc(src)+'</div></div>';
  }
  h += '</div>';

  /* ---- stash ---- */
  h += '<div class="sect"><div class="sect-h">Stash<span class="rt">'+S.inv.length+' items</span></div>'+
       '<button class="btn sm gho" id="btnStash" style="width:100%;border-left:none;border-right:none">Browse everything you own</button></div>';
  h += '<div style="height:24px"></div>';
  scr.innerHTML = h;

  scr.querySelectorAll("[data-ep]").forEach(b=>bindRepeat(b, ()=>{
    const e = b.dataset.e, d = +b.dataset.ep;
    const cur = S.alloc[e]||0;
    if(d>0 && elemBudget(S.level)-elemSpent(S) <= 0) return false;
    if(d<0 && cur <= 0) return false;
    S.alloc[e] = cur + d;
    recompute(true);
    return true;
  }));
  scr.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>openSlot(b.dataset.slot));
  scr.querySelectorAll("[data-spell]").forEach(b=>b.onclick=()=>openPipeline(b.dataset.spell));
  const st = $("#btnStash"); if(st) st.onclick = openStash;
}
function ownedFor(slotId){
  const type = slotId.startsWith("ring") ? "ring" : slotId;
  return S.inv.filter(i=>{
    const d = ITEMS[i.def];
    if(d.slot !== type) return false;
    if(d.cls && d.cls !== S.cls) return false;
    return true;
  });
}
/* press-and-hold repeat, accelerating — 108 points is too many to tap one at a time */
function bindRepeat(btn, fn){
  let t1=null, t2=null, n=0;
  const stop = ()=>{ clearTimeout(t1); clearInterval(t2); t1=t2=null; n=0; };
  const start = (ev)=>{
    ev.preventDefault();
    if(fn()===false) return;
    t1 = setTimeout(()=>{
      t2 = setInterval(()=>{ n++; const step = n>24?5:(n>10?2:1);
        for(let i=0;i<step;i++) if(fn()===false){ stop(); return; } }, 70);
    }, 380);
  };
  btn.addEventListener("touchstart", start, {passive:false});
  btn.addEventListener("mousedown", start);
  for(const e of ["touchend","touchcancel","mouseup","mouseleave"]) btn.addEventListener(e, stop);
}

/* ---------------- item detail ---------------- */
function itemHead(def, inst){
  const q = inst ? itemQuality(inst) : null;
  let pips = "";
  for(const e of ELEMS) if(def.req && def.req[e]){
    const own = inst ? (rolledValues(inst)["elem."+e]||0) : 0;
    const has = (CTX.pool[e]||0) - own;
    pips += pipHtml(e, def.req[e], has < def.req[e] ? "unmet" : "");
  }
  return '<div class="sh-title '+RARITY[def.rarity].cls+'">'+esc(def.name)+
    (q!=null?'<span class="rollchip num '+(q>=0.75?"hi":(q<=0.35?"lo":""))+'">'+Math.round(q*100)+'%</span>':'')+'</div>'+
    '<div class="sh-sub">'+RARITY[def.rarity].name+' · '+(SLOTS.find(s=>s.id===def.slot)||{name:def.slot==="ring"?"Ring":def.slot}).name+
    ' · tier '+def.lvl+(def.cls?' · '+CLASSES[def.cls].name+' only':'')+'</div>'+
    (pips?'<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">'+pips+'</div>':'');
}
function itemStatsHtml(def, inst){
  let h = "";
  if(def.dmgBase){
    const v = inst ? rolledValues(inst).dmgBase : null;
    h += '<div class="sgrp">Weapon damage · '+def.speed.toFixed(2)+'s per basic attack</div><div class="idstats">';
    for(const b in def.dmgBase){
      const r = def.dmgBase[b], val = v? v[b] : null;
      const q = val!=null ? statQuality("x", r, val) : null;
      h += '<div class="idrow"><div class="k e-'+b+'">'+EL[b].name+'</div>'+
        '<div class="v e-'+b+'">'+(val!=null? val : r[0]+"–"+r[1])+'</div>'+
        '<div class="rl">'+(q!=null?'<span>'+Math.round(q*100)+'%</span><span class="rb"><i class="bg-'+b+'" style="width:'+(q*100).toFixed(0)+'%"></i></span>'
          :'<span>'+r[0]+"–"+r[1]+'</span>')+'</div></div>';
    }
    h += '</div>';
  }
  const keys = Object.keys(def.stats||{});
  if(keys.length){
    h += '<div class="sgrp">Identifications</div><div class="idstats">';
    const vals = inst ? rolledValues(inst) : null;
    for(const k of keys){
      const r = def.stats[k], meta = statMeta(k);
      const isRange = Array.isArray(r);
      const val = vals ? vals[k] : (isRange? null : r);
      const q = (isRange && val!=null) ? statQuality(k, r, val) : null;
      const good = val!=null ? (meta.good>0 ? val>0 : val<0) : true;
      h += '<div class="idrow"><div class="k">'+esc(meta.label)+'</div>'+
        '<div class="v '+(meta.el?("e-"+meta.el):(good?"pos":"neg"))+'">'+
          (val!=null? statValue(k,val) : statValue(k,r[0])+" – "+statValue(k,r[1]))+'</div>'+
        '<div class="rl">'+(q!=null
          ? '<span>'+Math.round(q*100)+'%</span><span class="rb"><i style="width:'+(q*100).toFixed(0)+'%;background:'+(q>=0.6?"#54d391":(q>=0.35?"#e8bd63":"#ff6257"))+'"></i></span>'
          : (isRange? '<span>'+statValue(k,r[0])+'…'+statValue(k,r[1])+'</span>' : '<span>fixed</span>'))+
        '</div></div>';
    }
    h += '</div>';
  }
  if(def.major) h += '<div class="major"><div class="mt">Major ID</div><div class="mn">'+esc(MAJORS[def.major].name)+
    '</div><div class="md">'+esc(MAJORS[def.major].text)+'</div></div>';
  if(def.lore) h += '<div class="lore">'+esc(def.lore)+'</div>';
  return h;
}
function openItem(inst, slotId){
  const def = ITEMS[inst.def];
  const targetSlot = slotId || (def.slot==="ring" ? (S.equipped.ring1 && S.equipped.ring1.uid===inst.uid ? "ring1" : (S.equipped.ring2 && S.equipped.ring2.uid===inst.uid ? "ring2" : "ring1")) : def.slot);
  const equippedHere = S.equipped[targetSlot] && S.equipped[targetSlot].uid === inst.uid;
  let body = "";
  if(!equippedHere){
    const s2 = cloneState(S); s2.equipped = Object.assign({}, S.equipped); s2.equipped[targetSlot] = inst;
    const d = diffOf(S, s2);
    body += diffHeadHtml(d);
    if(d.reqBroke.length) body += '<div class="note"><b class="neg">Equipping this makes '+d.reqBroke.length+
      ' item(s) inactive</b> — '+d.reqBroke.map(x=>esc(ITEMS[s2.equipped[x].def].name)).join(", ")+'. Spend element points or change something else.</div>';
    body += '<div class="sgrp">What moves if you equip this</div>' + diffRowsHtml(d);
  } else {
    const s2 = cloneState(S); s2.equipped = Object.assign({}, S.equipped); delete s2.equipped[targetSlot];
    const d = diffOf(S, s2);
    body += '<div class="note">Equipped. The numbers below are what you would <b>lose</b> by taking it off.</div>';
    body += diffHeadHtml(d);
  }
  body += itemStatsHtml(def, inst);
  const buttons = [{label:"Back", cls:"gho", action:popSheet}];
  if(!equippedHere){
    const slots = def.slot==="ring" ? ["ring1","ring2"] : [def.slot];
    for(const sl of slots) buttons.push({label:"Equip"+(slots.length>1?" "+SLOTS.find(x=>x.id===sl).name:""), cls:"pri", action:()=>{
      S.equipped[sl] = inst; closeSheet(true); recompute(true);
    }});
  } else {
    buttons.push({label:"Unequip", cls:"dan", action:()=>{ delete S.equipped[targetSlot]; closeSheet(true); recompute(true); }});
  }
  openSheet({head:itemHead(def,inst), body, buttons});
}
function openSlot(slotId){
  const slot = SLOTS.find(s=>s.id===slotId);
  const owned = ownedFor(slotId);
  const cur = S.equipped[slotId];
  const otherRing = slotId==="ring1"?"ring2":(slotId==="ring2"?"ring1":null);
  let body = "";
  if(!owned.length) body = '<div class="empty">You own nothing for this slot yet.</div>';
  else {
    const rows = [];
    for(const inst of owned){
      const def = ITEMS[inst.def];
      const isCur = cur && cur.uid===inst.uid;
      const inOther = otherRing && S.equipped[otherRing] && S.equipped[otherRing].uid===inst.uid;
      const s2 = cloneState(S); s2.equipped = Object.assign({}, S.equipped); s2.equipped[slotId] = inst;
      if(inOther) delete s2.equipped[otherRing];
      const cb = buildContext(s2), hb = headline(cb);
      rows.push({inst, def, isCur, inOther, dps:hb.dps-HL.dps, ehp:hb.ehp-HL.ehp,
                 broken:Object.values(cb.meets).filter(m=>!m.ok).length});
    }
    rows.sort((a,b)=> (b.isCur?1e9:0)-(a.isCur?1e9:0) || b.dps-a.dps);
    body = '<div class="stab">';
    for(const r of rows){

          (r.isCur?' <span class="tag">equipped</span>':'')+(r.inOther?' <span class="tag">in '+SLOTS.find(x=>x.id===otherRing).name+'</span>':'')+'</div>'+
        '<div class="line2"><span class="rollchip '+(q>=0.75?"hi":(q<=0.35?"lo":""))+'">'+Math.round(q*100)+'%</span>'+
        Object.keys(r.def.req||{}).map(e=>pipHtml(e, r.def.req[e], (CTX.pool[e]||0)-(rolledValues(r.inst)["elem."+e]||0) < r.def.req[e] ? "unmet":"")).join("")+
        (r.def.major?'<span class="tag ab">'+esc(MAJORS[r.def.major].name)+'</span>':'')+
        (r.broken?'<span class="tag" style="border-color:#6d2a23;color:#ff8d82">breaks '+r.broken+'</span>':'')+'</div></span>'+
        '<span style="padding:0 8px;text-align:right">'+
          '<div class="num '+pcls(r.isCur?0:r.dps)+'" style="font-size:13px;font-weight:700">'+(r.isCur?"—":sign(r.dps))+'</div>'+
          '<div class="num" style="font-size:9px;color:var(--tx3)">DPS</div></span>'+
        '<span style="padding:0 10px 0 4px;text-align:right">'+
          '<div class="num '+pcls(r.isCur?0:r.ehp)+'" style="font-size:13px;font-weight:700">'+(r.isCur?"—":sign(r.ehp))+'</div>'+
          '<div class="num" style="font-size:9px;color:var(--tx3)">EHP</div></span>'+
      '</button>';
    }
    body += '</div>';
  }
  const buttons = [{label:"Close", cls:"gho", action:()=>closeSheet(true)}];
  if(cur) buttons.push({label:"Unequip", cls:"dan", action:()=>{ delete S.equipped[slotId]; closeSheet(true); recompute(true); }});
  openSheet({
    head:'<div class="sh-title">'+slot.name+'</div><div class="sh-sub">'+owned.length+' owned · sorted by damage change</div>',
    body, buttons,
    onDraw:(root)=>{ root.querySelectorAll("[data-uid]").forEach(b=>b.onclick=()=>{
      const inst = S.inv.find(i=>i.uid===b.dataset.uid); if(inst) openItem(inst, slotId);
    }); }
  });

function openStash(){
  const groups = {};
  for(const i of S.inv){

    for(const i of groups[g]){
      const d = ITEMS[i.def], q = itemQuality(i);

      body += '<button class="srow" data-uid="'+i.uid+'" style="width:100%;text-align:left">'+

  }
  openSheet({head:'<div class="sh-title">Stash</div><div class="sh-sub">'+S.inv.length+' items held</div>',

    buttons:[{label:"Close", cls:"gho", action:()=>closeSheet(true)}],

}
const KIND_COL = {item:"#57b2ff", node:"#c88bff", elem:"#e8bd63", class:"#6b7486", major:"#ff7a5c"};
function openStat(which){
  if(which==="dps") return openDpsAttribution();

  body += '<div class="sgrp">Sources · '+fmt(HL.dps)+' DPS total</div>';

  openSheet({

/* ================================================================
   TREE SCREEN
   Pans, pinch-zooms, and never asks for a precise tap: hit testing
   is done in screen space against the nearest node.
   ================================================================ */
const U = 64;                       // grid unit in px at scale 1
const VIEW = {tx:0, ty:0, k:0.55};
let treeBuiltFor = null, selectedNode = null;
const nodeEls = {}, edgeEls = [];

function nodeElement(nd){
  const s = document.createElementNS("http://www.w3.org/2000/svg","g");
  s.setAttribute("class","tnode");
  let shape;
  if(nd.type==="key"){
    shape = document.createElementNS("http://www.w3.org/2000/svg","rect");
    shape.setAttribute("x",-15); shape.setAttribute("y",-15);
    shape.setAttribute("width",30); shape.setAttribute("height",30);
    shape.setAttribute("transform","rotate(45)");
  } else if(nd.type==="mod"){
    shape = document.createElementNS("http://www.w3.org/2000/svg","rect");
    shape.setAttribute("x",-11); shape.setAttribute("y",-11);
    shape.setAttribute("width",22); shape.setAttribute("height",22);
  } else if(nd.type==="ability"){
    shape = document.createElementNS("http://www.w3.org/2000/svg","circle");
    shape.setAttribute("r",15);
  } else {
    shape = document.createElementNS("http://www.w3.org/2000/svg","circle");
    shape.setAttribute("r",10);
  }
  shape.setAttribute("class","tn");
  s.appendChild(shape);
  if(nd.type==="ability"){
    const inner = document.createElementNS("http://www.w3.org/2000/svg","circle");
    inner.setAttribute("r",6); inner.setAttribute("class","tn-inner");
    inner.setAttribute("fill","none"); inner.setAttribute("stroke-width",2);
    s.appendChild(inner);
  }
  const lab = document.createElementNS("http://www.w3.org/2000/svg","text");
  lab.setAttribute("class","tnlabel");
  lab.setAttribute("y", nd.type==="key"?32:(nd.type==="ability"?28:23));
  lab.textContent = nd.name;
  s.appendChild(lab);
  s.setAttribute("transform","translate("+(nd.x*U)+","+(nd.y*U)+")");
  return {g:s, shape, lab, inner:s.querySelector(".tn-inner")};
}
/* a node's colour is its dominant element — the same coding as everywhere else */
function nodeElem(nd){
  const tally = {};
  for(const k in nd.stats){
    const m = statMeta(k);
    if(m.el) tally[m.el] = (tally[m.el]||0) + Math.abs(nd.stats[k]);
  }
  let best=null, bv=0;
  for(const e in tally) if(tally[e]>bv){bv=tally[e]; best=e;}
  return best;
}
function buildTree(){
  const t = TREES[S.cls];
  const g = $("#treeG");
  g.innerHTML = ""; edgeEls.length = 0;
  for(const k in nodeEls) delete nodeEls[k];
  const eg = document.createElementNS("http://www.w3.org/2000/svg","g");
  g.appendChild(eg);
  for(const [a,b] of t.edges){
    const na = t.byId[a], nb = t.byId[b];
    const line = document.createElementNS("http://www.w3.org/2000/svg","path");
    const x1=na.x*U, y1=na.y*U, x2=nb.x*U, y2=nb.y*U;
    const my = (y1+y2)/2;
    line.setAttribute("d", "M"+x1+","+y1+" C"+x1+","+my+" "+x2+","+my+" "+x2+","+y2);
    line.setAttribute("class","tl");
    eg.appendChild(line);
    edgeEls.push({a, b, el:line});
  }
  for(const nd of t.list){
    const o = nodeElement(nd);
    g.appendChild(o.g);
    nodeEls[nd.id] = o;
  }
  treeBuiltFor = S.cls;
  fitTree();
}
function updateTree(){
  const t = TREES[S.cls];
  for(const nd of t.list){
    const o = nodeEls[nd.id]; if(!o) continue;
    const on = isAlloc(S, nd.id);
    const reach = !on && reachable(S, nd) && !exclBlocked(S, nd);
    const dead = !on && permaLocked(S, nd);
    const e = nodeElem(nd);
    const col = e ? EL[e].col : (nd.type==="key" ? "#e8bd63" : "#8894a8");
    o.shape.setAttribute("class","tn"+(on?"":(dead?" locked":(reach?" reachable":" unreach"))));
    o.shape.setAttribute("stroke", col);
    o.shape.setAttribute("fill", on ? col : (reach ? "#141a24" : "#0c1016"));
    o.shape.setAttribute("fill-opacity", on ? 0.9 : 1);
    if(o.inner){ o.inner.setAttribute("stroke", on ? "#07090d" : col); }
    o.lab.setAttribute("class","tnlabel"+(on?" on":""));
    const showLabel = VIEW.k > 0.78 || nd.type==="key" || nd.type==="ability" || on;
    o.lab.setAttribute("opacity", showLabel ? (dead?0.25:1) : 0);
    o.g.setAttribute("opacity", dead ? 0.3 : 1);
    if(selectedNode===nd.id) o.shape.setAttribute("stroke-width", 5);
    else o.shape.setAttribute("stroke-width", nd.type==="key"?3:2.5);
  }
  for(const e of edgeEls){
    const both = isAlloc(S,e.a) && isAlloc(S,e.b);
    const half = isAlloc(S,e.a);
    const dead = permaLocked(S, t.byId[e.b]) && !isAlloc(S,e.b);
    e.el.setAttribute("class","tl"+(both?" on":(half?" reach":(dead?" dead":""))));
    if(both){
      const el2 = nodeElem(t.byId[e.b]) || nodeElem(t.byId[e.a]);
      e.el.setAttribute("stroke", el2 ? EL[el2].col : "#8b98ad");
      e.el.setAttribute("stroke-opacity", 0.85);
    } else { e.el.removeAttribute("stroke"); e.el.removeAttribute("stroke-opacity"); }
  }
  $("#thPts").textContent = treeLeft(S)+" / "+treeBudget(S.level);
  $("#thNodes").textContent = S.tree.length+" / "+t.list.length;
  $("#thKey").textContent = S.tree.filter(id=>t.byId[id] && t.byId[id].type==="key").length+" / "+t.keystones;
  applyView();
}
function applyView(){ $("#treeG").setAttribute("transform","translate("+VIEW.tx+","+VIEW.ty+") scale("+VIEW.k+")"); }
function fitTree(){
  const t = TREES[S.cls], w = $("#treeWrap").clientWidth, h = $("#treeWrap").clientHeight;
  const bw = (t.bounds.maxX-t.bounds.minX)*U + 120, bh = (t.bounds.maxY-t.bounds.minY)*U + 140;
  VIEW.k = Math.max(0.2, Math.min(1.3, Math.min(w/bw, h/bh)));
  VIEW.tx = w/2 - ((t.bounds.minX+t.bounds.maxX)/2)*U*VIEW.k;
  VIEW.ty = 44 - (t.bounds.minY*U)*VIEW.k + 10;
  applyView();
}
/* ---- gestures ---- */
(function(){
  const wrap = $("#treeWrap");
  let pts = new Map(), start = null, moved = 0, t0 = 0;
  function mid(){ const a=[...pts.values()]; return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2}; }
  function dist(){ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
  wrap.addEventListener("pointerdown", e=>{
    wrap.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size===1){ start={x:e.clientX, y:e.clientY, tx:VIEW.tx, ty:VIEW.ty}; moved=0; t0=Date.now(); }
    else if(pts.size===2){ start={d:dist(), k:VIEW.k, m:mid(), tx:VIEW.tx, ty:VIEW.ty}; }
  });
  wrap.addEventListener("pointermove", e=>{
    if(!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size===1 && start){
      const dx = e.clientX-start.x, dy = e.clientY-start.y;
      moved = Math.max(moved, Math.hypot(dx,dy));
      VIEW.tx = start.tx+dx; VIEW.ty = start.ty+dy;
      applyView();
    } else if(pts.size===2 && start && start.d){
      const d = dist(), m = mid();
      const k = Math.max(0.2, Math.min(2.4, start.k * d/start.d));
      // keep the pinch midpoint anchored
      VIEW.tx = m.x - (start.m.x - start.tx) * (k/start.k) + (m.x-start.m.x)*0;
      VIEW.ty = m.y - (start.m.y - start.ty) * (k/start.k);
      VIEW.tx = m.x - ((start.m.x - start.tx)/start.k)*k;
      VIEW.ty = m.y - ((start.m.y - start.ty)/start.k)*k;
      const wasLabels = VIEW.k>0.78; VIEW.k = k;
      applyView();
      if(wasLabels !== (k>0.78)) updateTree();
      moved = 99;
    }
  });
  function up(e){
    if(!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId);
    pts.delete(e.pointerId);
    if(pts.size===0 && start && moved < 10 && Date.now()-t0 < 600) tapAt(p.x, p.y);
    if(pts.size<2) start = pts.size===1 ? {x:[...pts.values()][0].x, y:[...pts.values()][0].y, tx:VIEW.tx, ty:VIEW.ty} : null;
  }
  wrap.addEventListener("pointerup", up);
  wrap.addEventListener("pointercancel", up);
  wrap.addEventListener("wheel", e=>{
    e.preventDefault();
    const r = wrap.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
    const k = Math.max(0.2, Math.min(2.4, VIEW.k * (e.deltaY<0?1.12:0.89)));
    VIEW.tx = mx - ((mx-VIEW.tx)/VIEW.k)*k; VIEW.ty = my - ((my-VIEW.ty)/VIEW.k)*k;
    VIEW.k = k; updateTree();
  }, {passive:false});
})();
function tapAt(cx, cy){
  const r = $("#treeWrap").getBoundingClientRect();
  const x = cx - r.left, y = cy - r.top;
  const t = TREES[S.cls];
  let best = null, bd = 34;                 // generous: never a precision tap
  for(const nd of t.list){
    const sx = nd.x*U*VIEW.k + VIEW.tx, sy = nd.y*U*VIEW.k + VIEW.ty;
    const d = Math.hypot(sx-x, sy-y);
    if(d < bd){ bd = d; best = nd; }
  }
  if(!best){ selectedNode=null; updateTree(); closeSheet(false); return; }
  if(selectedNode === best.id && sheetStack.length){
    // second tap on an already-open node commits it
    const can = canAllocate(S, best);
    if(can.ok){ doAllocate(best); return; }
    const dec = canDeallocate(S, best);
    if(dec.ok){ doDeallocate(best); return; }
  }
  selectedNode = best.id;
  updateTree();
  openNode(best);
}
function doAllocate(nd){
  S.tree.push(nd.id);
  const o = nodeEls[nd.id];
  if(o){ o.shape.classList.remove("popping"); void o.shape.offsetWidth; o.shape.classList.add("popping"); }
  closeSheet(true);
  recompute(true);
  updateTree();
}
function doDeallocate(nd){
  S.tree = S.tree.filter(x=>x!==nd.id);
  closeSheet(true);
  recompute(true);
  updateTree();
}

function openNode(nd){

    '</div><div class="md">'+esc(MAJORS[nd.major].text)+'</div></div>';

  if(nd.excl){
    const siblings = t.list.filter(x=>x.excl===nd.excl && x.id!==nd.id);
    const taken = siblings.find(x=>isAlloc(S,x.id));
    body += '<div class="note" style="background:#1a1008;border-top:1px solid #4a3a12">'+
      '<b class="'+(taken?"neg":"")+'">Exclusive.</b> Taking this permanently locks out '+
      siblings.map(x=>esc(x.name)).join(", ")+' for this run'+(taken? ' — and '+esc(taken.name)+' is already taken.':'.')+'</div>';
  }
  if(!on && !can.ok) body += '<div class="note"><b class="neg">Cannot allocate.</b> '+esc(can.why)+'</div>';
  if(!on && can.ok===false && path && path.cost<=treeLeft(S) && path.set.length>1)
    body += '<div class="note">Reaching it from here costs <b>'+path.cost+'</b> points through '+
      path.set.map(id=>esc(t.byId[id].name)).join(" → ")+'.</div>';
  if(on && !dec.ok) body += '<div class="note"><b class="neg">Cannot remove.</b> '+esc(dec.why)+'</div>';

  const buttons = [{label:"Close", cls:"gho", action:()=>{ selectedNode=null; closeSheet(true); updateTree(); }}];
  if(!on && can.ok) buttons.push({label:"Allocate · "+nd.cost, cls:"pri", action:()=>doAllocate(nd)});
  else if(!on && path && path.cost<=treeLeft(S) && path.set.length>1)
    buttons.push({label:"Take path · "+path.cost, cls:"pri", action:()=>{
      for(const id of path.set) if(!isAlloc(S,id)) S.tree.push(id);
      closeSheet(true); recompute(true); updateTree();
    }});
  if(on && dec.ok) buttons.push({label:"Refund", cls:"dan", action:()=>doDeallocate(nd)});

  openSheet({head:'<div class="sh-title">'+esc(nd.name)+'</div><div class="sh-sub">'+TREES[S.cls].title+' · '+nd.type+'</div>',
             body, buttons});
}
function cheapestPath(node){
  const t = TREES[S.cls], memo = new Map();
  function walk(id, stack){
    if(memo.has(id)) return memo.get(id);
    if(isAlloc(S,id)) return {cost:0, set:[]};
    const nd = t.byId[id];
    if(exclBlocked(S,nd) || stack.has(id)) return null;
    stack.add(id);
    let best = null;
    if(nd.req.length===0) best = {cost:nd.cost, set:[id]};
    else for(const p of nd.req){
      const r = walk(p, stack); if(!r) continue;
      const c = {cost:r.cost+nd.cost, set:r.set.concat([id])};
      if(!best || c.cost<best.cost) best = c;
    }
    stack.delete(id); memo.set(id, best); return best;
  }
  return walk(node.id, new Set());
}

function drawTimeline(cv, r, animate){
  if(!cv) return;
  const dpr = window.devicePixelRatio||1;
  const w = cv.parentElement.clientWidth, h = 44;
  cv.width = w*dpr; cv.height = h*dpr; cv.style.width=w+"px"; cv.style.height=h+"px";
  const c = cv.getContext("2d"); c.scale(dpr,dpr);
  const n = Math.max(1, r.curve.length);
  const mx = Math.max(1, ...r.curve);
  let frame = 0;
  const totalFrames = animate ? 22 : 1;
  function paint(){
    const upto = Math.ceil(n * Math.min(1, (frame+1)/totalFrames));
    c.clearRect(0,0,w,h);
    c.fillStyle = "#0a0d13"; c.fillRect(0,0,w,h);
    const bw = w/n;
    for(let i=0;i<upto;i++){
      const bh = (r.curve[i]/mx)*(h-8);
      c.fillStyle = "rgba(232,189,99,.85)";
      c.fillRect(i*bw+0.5, h-bh, Math.max(1,bw-1), bh);
    }
    c.strokeStyle="#ff6257"; c.lineWidth=1.5; c.beginPath();
    for(let i=0;i<upto && i<r.hpSeries.length;i++){
      const y = h - 3 - r.hpSeries[i]*(h-8);
      i?c.lineTo(i*bw+bw/2,y):c.moveTo(i*bw+bw/2,y);
    }
    c.stroke();
    c.strokeStyle="#4fb9ff"; c.lineWidth=1.2; c.beginPath();
    for(let i=0;i<upto && i<r.manaCurve.length;i++){
      const y = h - 3 - r.manaCurve[i]*(h-8);
      i?c.lineTo(i*bw+bw/2,y):c.moveTo(i*bw+bw/2,y);
    }
    c.stroke();
    if(frame < totalFrames-1){ frame++; requestAnimationFrame(paint); }
  }
  paint();
}

    body += '<button class="slot" data-cls="'+c+'" style="width:100%;text-align:left;grid-template-columns:1fr auto">'+
      '<span class="body" style="padding:10px 12px"><div class="iname" style="font-size:16px;color:var(--gold)">'+cl.name+'</div>'+
      '<div class="ts" style="font-size:11px;color:var(--tx3);margin-top:2px">'+cl.tagline+' · '+t.subtitle+'</div>'+
      '<div style="font-size:12px;color:var(--tx2);margin-top:6px;line-height:1.45">'+esc(cl.blurb)+'</div>'+
      '<div class="line2" style="margin-top:7px">'+cl.spells.map(s=>'<span class="tag">'+esc(s.name)+'</span>').join("")+'</div></span>'+
      '<span class="chev">›</span></button>';
  }
  openSheet({head:'<div class="sh-title">SOLVER</div><div class="sh-sub">a game about assembling a build, not about pressing buttons</div>',
    body, locked:true, buttons:[],
    onDraw:(root)=>{ root.querySelectorAll("[data-cls]").forEach(b=>b.onclick=()=>{
      RNG = mulberry32((Date.now()^0x9e3779b9)>>>0);
      S = newState(b.dataset.cls);
      closeSheet(true);
      treeBuiltFor = null; LAST = null;
      recompute(false);
      showTab("Gear");
    }); }});
}
function measureChrome(){
  const r = document.documentElement.style;
  r.setProperty("--chrome-top", $("#hud").offsetHeight+"px");
  r.setProperty("--chrome-bot", $("#tabs").offsetHeight+"px");
}
function boot(){
  measureChrome();
  if(window.ResizeObserver){
    const ro = new ResizeObserver(()=>{ measureChrome(); if(curScreen==="Tree"){ fitTree(); updateTree(); } });
    ro.observe($("#hud")); ro.observe($("#tabs"));
  }
  S = load();
  if(S){ recompute(false); showTab("Gear"); }
  else { S = newState("warden"); recompute(false); showTab("Gear"); chooseClass(); }
}
/* long-press the class name in the HUD to start over */
bindHold($("#hudClass"), ()=>{
  openSheet({head:'<div class="sh-title">New run?</div><div class="sh-sub">this discards the current one</div>',
    body:'<div class="note">Level '+S.level+', '+S.inv.length+' items, '+S.tree.length+' nodes allocated, '+
      Object.keys(S.cleared).length+' trials cleared. All of it goes.</div>',
    buttons:[{label:"Keep playing", cls:"gho", action:()=>closeSheet(true)},
             {label:"New run", cls:"dan", action:()=>{ localStorage.removeItem(SAVE_KEY); closeSheet(true); chooseClass(); }}]});
});
function bindHold(node, fn){
  let t=null;
  const dn=()=>{ t=setTimeout(fn, 550); };
  const up=()=>{ clearTimeout(t); };
  node.addEventListener("touchstart", dn, {passive:true});
  node.addEventListener("mousedown", dn);
  for(const e of ["touchend","touchcancel","mouseup","mouseleave"]) node.addEventListener(e, up);
}
boot();
</script>
