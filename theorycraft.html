<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>SOLVER — a theorycrafting game</title>
<style>
/* ============================================================
   SOLVER — visual system
   Dark, dense, numeric. Element colour is load-bearing: the same
   five hues mean the same five things in item text, damage
   numbers, requirement pips, tree branches and breakdown bars.
   ============================================================ */
:root{
  --bg:#07090d; --bg2:#0b0e14;
  --panel:#0e1117; --panel2:#131822; --panel3:#171d29;
  --line:#1c2230; --line2:#2a3446; --line3:#3d4a61;
  --tx:#d9dfea; --tx2:#98a2b5; --tx3:#6b7486;
  --gold:#e8bd63; --good:#54d391; --bad:#ff6257; --warn:#ffa23c;
  --cinder:#ff6a3c; --frost:#4fb9ff; --gale:#b98cff; --stone:#74cf4a; --volt:#ffd23c;
  --neutral:#c8d1e0;
  --cinder-d:#3a1a12; --frost-d:#0e2c44; --gale-d:#2a1f43; --stone-d:#18330f; --volt-d:#3a3010;
  --fui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fnum:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --hud-h:86px; --tab-h:58px;
  --chrome-top:86px; --chrome-bot:58px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--tx);
  font-family:var(--fui); font-size:14px; line-height:1.35;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;
  width:auto;text-align:inherit;font-family:inherit}
.slot,.trial,.spellrow,.srow,.erow,.kv{width:100%;text-align:left}
button.slot,button.trial,button.spellrow,button.srow{display:grid;align-items:center}
.num{font-family:var(--fnum);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- element colour utilities ---------- */
.e-cinder{color:var(--cinder)} .e-frost{color:var(--frost)} .e-gale{color:var(--gale)}
.e-stone{color:var(--stone)} .e-volt{color:var(--volt)} .e-neutral{color:var(--neutral)}
.bg-cinder{background:var(--cinder)} .bg-frost{background:var(--frost)} .bg-gale{background:var(--gale)}
.bg-stone{background:var(--stone)} .bg-volt{background:var(--volt)} .bg-neutral{background:var(--neutral)}

/* ---------- rarity ---------- */
.r-common{color:#9aa4b4} .r-uncommon{color:#6fd3a6} .r-rare{color:#57b2ff}
.r-legendary{color:#c88bff} .r-fabled{color:#ff7a5c} .r-mythic{color:#ffd24a}
.rb-common{border-color:#3a4252} .rb-uncommon{border-color:#2f6b52} .rb-rare{border-color:#27547f}
.rb-legendary{border-color:#5b3a86} .rb-fabled{border-color:#7f3626} .rb-mythic{border-color:#7d641a}

/* ============================================================ HUD */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding-top:var(--sat);
  background:linear-gradient(180deg,#0d1119 0%,#0a0d13 100%);
  border-bottom:1px solid var(--line2);
  box-shadow:0 1px 0 #000, 0 6px 18px rgba(0,0,0,.55);
}
#hudTop{display:flex;align-items:baseline;gap:7px;padding:7px 10px 5px;white-space:nowrap;overflow:hidden}
#hudClass{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:700;flex:0 0 auto}
#hudLvl{font-size:10.5px;color:var(--tx3);letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
#hudSpacer{display:none}
.hudpill{
  font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;flex:0 0 auto;
  border:1px solid var(--line2);padding:3px 5px;color:var(--tx2);background:#0c1016;
}
.hudpill.alert{border-color:#7a2a22;color:var(--bad);background:#1a0c0a}
#hudStats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.hs{background:#0b0e14;padding:5px 8px 7px;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.hs .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:1px}
.hs .v{font-size:17px;font-weight:600;letter-spacing:-.02em}
.hs .d{font-size:10px;color:var(--tx3)}
.hs.up .v{color:var(--good)} .hs.down .v{color:var(--bad)}
@keyframes flashup{0%{background:#0e2418}100%{background:#0b0e14}}
@keyframes flashdn{0%{background:#25100e}100%{background:#0b0e14}}
.hs.fu{animation:flashup .7s ease-out} .hs.fd{animation:flashdn .7s ease-out}

/* ============================================================ MAIN */
#view{
  position:fixed;top:0;left:0;right:0;bottom:0;
  padding-top:var(--chrome-top);
  padding-bottom:var(--chrome-bot);
  overflow:hidden;
}
.screen{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none}
.screen.on{display:block}
#scrTree{overflow:hidden}

/* ---------- section chrome ---------- */
.sect{border-bottom:1px solid var(--line)}
.sect-h{
  display:flex;align-items:center;gap:8px;padding:9px 12px 8px;
  background:#0a0d13;border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);font-weight:700;
}
.sect-h .rt{margin-left:auto;letter-spacing:.06em;color:var(--tx2);text-transform:none;font-weight:400}
.sect-h .rt b{color:var(--gold);font-weight:700}

/* ============================================================ ELEMENT ALLOCATOR */
#elemRows{background:var(--panel)}
.erow{display:grid;grid-template-columns:34px 1fr 46px 46px;align-items:center;
  gap:0;border-bottom:1px solid var(--line);min-height:52px}
.erow:last-child{border-bottom:none}
.erow .pip{justify-self:center}
.erow .mid{padding:4px 2px 4px 4px;min-width:0}
.erow .nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);display:flex;gap:6px;align-items:baseline}
.erow .nm b{font-size:15px;letter-spacing:-.01em;font-family:var(--fnum)}
.erow .nm .bon{font-size:10px;color:var(--tx3)}
.erow .fx{font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .fx em{font-style:normal;color:var(--tx)}
.ebtn{height:52px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:300;color:var(--tx2);background:#0c1016;user-select:none}
.ebtn:active{background:#1a2130;color:#fff}
.ebtn.off{color:#333b49;background:#090c11}
.ebar{height:3px;background:#161b25;margin-top:4px;position:relative;overflow:hidden}
.ebar i{display:block;height:100%}
.ebar u{position:absolute;top:0;bottom:0;width:1px;background:#5b6577}

/* ============================================================ GEAR SLOTS */
.slot{
  display:grid;grid-template-columns:52px 1fr auto;align-items:center;
  border-bottom:1px solid var(--line);background:var(--panel);min-height:60px;
}
.slot:active{background:var(--panel2)}
.slot.bad{background:linear-gradient(90deg,#180b0a,var(--panel) 42%)}
.slot .sn{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  text-align:center;border-right:1px solid var(--line);align-self:stretch;
  display:flex;align-items:center;justify-content:center;padding:0 2px}
.slot .body{padding:7px 8px;min-width:0}
.slot .iname{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .iname.empty{color:#4a5262;font-weight:400;font-style:italic}
.slot .line2{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.slot .chev{padding:0 12px;color:#3f4757;font-size:18px}
.rollchip{font-family:var(--fnum);font-size:10px;padding:1px 4px;border:1px solid var(--line2);color:var(--tx2)}
.rollchip.hi{border-color:#3f6b45;color:#7ad49a} .rollchip.lo{border-color:#5e3a36;color:#d98b82}

/* ---------- requirement pips ---------- */
.pip{
  display:inline-flex;align-items:center;justify-content:center;gap:2px;
  font-family:var(--fnum);font-size:10.5px;font-weight:700;
  border:1px solid currentColor;padding:1px 4px 1px 3px;line-height:1.25;
}
.pip .g{font-size:9px;opacity:.85;font-weight:700}
.pip.unmet{background:#22090a;box-shadow:inset 0 0 0 1px #48100f}
.pip.unmet::after{content:"!";margin-left:2px;color:var(--bad)}
.pip.grant{border-style:dashed;opacity:.9}

/* ============================================================ TABS */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  padding-bottom:var(--sab);
  display:grid;grid-template-columns:repeat(3,1fr);
  background:#080b10;border-top:1px solid var(--line2);
}
.tab{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
  border-right:1px solid var(--line);position:relative}
.tab:last-child{border-right:none}
.tab .ic{font-size:15px;line-height:1;font-family:var(--fnum);letter-spacing:0}
.tab.on{color:var(--gold);background:#0e1219}
.tab.on::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold)}
.tab .badge{position:absolute;top:6px;right:calc(50% - 26px);min-width:15px;height:15px;
  background:var(--gold);color:#000;font-size:9px;font-weight:800;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--fnum)}

/* ============================================================ SHEETS */
#scrim{position:fixed;inset:0;background:rgba(2,4,7,.72);z-index:50;opacity:0;pointer-events:none;transition:opacity .16s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-height:86vh;display:flex;flex-direction:column;
  background:var(--panel);border-top:1px solid var(--line3);
  box-shadow:0 -12px 40px rgba(0,0,0,.7);
  transform:translateY(102%);transition:transform .2s cubic-bezier(.2,.8,.3,1);
  padding-bottom:var(--sab);
}
#sheet.on{transform:translateY(0)}
#sheetGrab{height:26px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:#0a0d13;
  border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
#sheetGrab i{width:38px;height:4px;background:#4a5464;display:block}
#sheetGrab:active i{background:#6a7688}
#sheetHead{flex:0 0 auto;padding:9px 12px 10px;border-bottom:1px solid var(--line2);background:#0a0d13}
#sheetBody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheetFoot{flex:0 0 auto;border-top:1px solid var(--line2);background:#0a0d13;display:flex;gap:1px}
.sh-title{font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.sh-sub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-top:3px}

/* ---------- buttons ---------- */
.btn{
  flex:1;min-height:50px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  background:#141a25;border:1px solid var(--line2);color:var(--tx);
}
.btn:active{background:#1e2735}
.btn.pri{background:#3a2f12;border-color:#7b6224;color:var(--gold)}
.btn.pri:active{background:#4d3f18}
.btn.dan{background:#1e0e0c;border-color:#6d2a23;color:#ff8d82}
.btn.off{color:#454d5d;background:#0b0e14;border-color:var(--line)}
.btn.gho{background:#0b0e14}
.btn.sm{min-height:44px;font-size:11px;letter-spacing:.1em}

/* ============================================================ STAT TABLE */
.stab{background:var(--panel)}
.srow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:44px}
.srow:active{background:var(--panel2)}
.srow .k{flex:1 1 auto;font-size:12.5px;color:var(--tx2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.srow .v{font-family:var(--fnum);font-size:13.5px;font-weight:600;text-align:right;white-space:nowrap;flex:0 0 auto}
.srow .dlt{font-family:var(--fnum);font-size:11px;flex:0 1 auto;min-width:0;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}
.srow .trace{font-size:14px;color:#39414f;width:14px;text-align:center}
.pos{color:var(--good)} .neg{color:var(--bad)} .zero{color:var(--tx3)}
.sgrp{padding:7px 12px 5px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
  background:#0a0d13;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}

/* ---------- attribution bars ---------- */
.abar{padding:7px 12px;border-bottom:1px solid var(--line)}
.abar .top{display:flex;align-items:baseline;gap:8px;font-size:12px}
.abar .top .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abar .top .p{font-family:var(--fnum);font-size:12px;color:var(--tx2)}
.abar .top .a{font-family:var(--fnum);font-size:12px;font-weight:700;width:68px;text-align:right}
.abar .bar{height:6px;background:#141922;margin-top:4px}
.abar .bar i{display:block;height:100%}
.abar .src{font-size:10px;color:var(--tx3);margin-top:3px;letter-spacing:.04em}

/* ============================================================ ITEM DETAIL */
.idstats{background:var(--panel)}
.idrow{display:grid;grid-template-columns:1fr auto 54px;align-items:center;gap:8px;
  padding:6px 12px;border-bottom:1px solid var(--line);min-height:38px}
.idrow .k{font-size:12.5px;color:var(--tx2);min-width:0}
.idrow .v{font-family:var(--fnum);font-size:13.5px;font-weight:700;white-space:nowrap}
.idrow .rl{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.idrow .rl span{font-family:var(--fnum);font-size:9.5px;color:var(--tx3)}
.idrow .rl .rb{width:50px;height:3px;background:#1a2028}
.idrow .rl .rb i{display:block;height:100%}
.combatbox{padding:9px 12px;background:#0a1a16;border-top:1px solid #1f5c4d;border-bottom:1px solid #1f5c4d}
.combatbox .mt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#54d391;font-weight:800}
.combatbox .cb{font-size:13px;color:#cfe6dc;margin-top:3px;line-height:1.45}
.major{padding:9px 12px;background:#1a1408;border-bottom:1px solid #3e3112;border-top:1px solid #3e3112}
.major .mt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.major .mn{font-size:14px;font-weight:700;margin-top:2px}
.major .md{font-size:12px;color:#c9bb95;margin-top:3px;line-height:1.4}
.lore{padding:9px 12px;font-size:11.5px;color:var(--tx3);font-style:italic;line-height:1.45;border-bottom:1px solid var(--line)}

/* ---------- diff block ---------- */
.diffhead{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line2)}
.diffhead.d4{grid-template-columns:repeat(4,1fr)}
.diffhead.d4 .dh{padding:8px 3px}
.diffhead.d4 .dh .k{font-size:8.5px;letter-spacing:.06em}
.diffhead.d4 .dh .v{font-size:14px}
.dh{background:#0a0d13;padding:8px 6px;text-align:center}
.dh .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.dh .v{font-family:var(--fnum);font-size:16px;font-weight:700;margin-top:2px}
.dh .s{font-family:var(--fnum);font-size:10px;color:var(--tx3)}

/* ============================================================ TREE */
#treeWrap{position:relative;width:100%;height:100%;overflow:hidden;background:
  radial-gradient(circle at 50% 22%, #10141d 0%, #07090d 72%);touch-action:none}
#treeSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tl{stroke:#232c3b;stroke-width:3;fill:none}
.tl.on{stroke:#6d7d97;stroke-width:4}
.tl.reach{stroke:#39465c}
.tl.dead{stroke:#14181f}
.tn-hit{fill:transparent}
.tn{stroke-width:2.5}
.tn.locked{opacity:.16}
.tn.unreach{opacity:.34;stroke-width:1.5}
.tn.reachable{filter:drop-shadow(0 0 5px currentColor)}
.tnlabel{font-family:var(--fui);font-size:9px;fill:#7d8798;text-anchor:middle;pointer-events:none;letter-spacing:.02em}
.tnlabel.on{fill:#dfe6f2}
.tncost{font-family:var(--fnum);font-size:10px;font-weight:700;text-anchor:middle;pointer-events:none}
@keyframes nodepop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.popping{animation:nodepop .34s ease-out;transform-origin:center;transform-box:fill-box}
#treeHud{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;gap:1px;background:var(--line);
  border-bottom:1px solid var(--line2);pointer-events:none}
.th{background:rgba(9,12,18,.94);padding:6px 9px;flex:1}
.th .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.th .v{font-family:var(--fnum);font-size:14px;font-weight:700}
#treeCtl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.tcbtn{width:46px;height:46px;background:rgba(14,18,26,.94);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--tx2)}
.tcbtn:active{background:#1c2432}
.tcbtn.sm{font-size:10px;letter-spacing:.08em}

/* ============================================================ TRIALS */
.trial{display:grid;grid-template-columns:40px 1fr auto;align-items:center;
  border-bottom:1px solid var(--line);background:var(--panel);min-height:62px}
.trial:active{background:var(--panel2)}
.trial .ix{font-family:var(--fnum);font-size:13px;font-weight:700;color:var(--tx3);text-align:center;
  align-self:stretch;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
.trial.done .ix{color:var(--good);background:#0c1a13}
.trial.cur{background:linear-gradient(90deg,#171203,var(--panel) 55%)}
.trial.cur .ix{color:var(--gold);background:#1c1605}
.trial.lock{opacity:.4}
.trial .body{padding:8px}
.trial .tn2{font-size:14px;font-weight:600;letter-spacing:-.01em}
.trial .ts{font-size:10.5px;color:var(--tx3);margin-top:2px}
.trial .rt{padding:0 12px;text-align:right;font-family:var(--fnum);font-size:11px;color:var(--tx3)}
.verdict{padding:12px;border-bottom:1px solid var(--line2)}
.verdict.win{background:linear-gradient(180deg,#0c2318,#0a1611);border-color:#1f5c3d}
.verdict.loss{background:linear-gradient(180deg,#25100e,#170b0a);border-color:#6b2a23}
.verdict .vt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
.verdict.win .vt{color:var(--good)} .verdict.loss .vt{color:var(--bad)}
.verdict .vs{font-size:15px;line-height:1.45;margin-top:6px;font-weight:500;letter-spacing:-.01em}
.timeline{height:44px;background:#0a0d13;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.timeline canvas{display:block;width:100%;height:100%}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 12px;
  border-bottom:1px solid var(--line);min-height:40px}
.kv .k{font-size:12px;color:var(--tx2);flex:0 0 auto;max-width:44%}
.kv .v{font-family:var(--fnum);font-size:12.5px;font-weight:600;text-align:right;flex:1 1 auto;min-width:0}
.mixbar{display:flex;height:20px;background:#0f141c;border:1px solid var(--line);margin:8px 12px}
.mixbar i{height:100%;position:relative}
.mixleg{display:flex;flex-wrap:wrap;gap:4px 10px;padding:0 12px 9px;font-size:10px;font-family:var(--fnum);color:var(--tx3)}
.mixleg span b{font-weight:700}

/* ---------- misc ---------- */
.note{padding:10px 12px;font-size:11.5px;color:var(--tx3);line-height:1.5;background:#0a0d13;border-bottom:1px solid var(--line)}
.note b{color:var(--tx2);font-weight:600}
.empty{padding:26px 16px;text-align:center;color:#4a5262;font-size:12.5px}
.spellrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:46px;align-items:center}
.spellrow:active{background:var(--panel2)}
.spellrow .sn2{font-size:13.5px;font-weight:600}
.spellrow .sd{font-size:10.5px;color:var(--tx3);margin-top:1px}
.spellrow .sv{font-family:var(--fnum);font-size:14px;font-weight:700;text-align:right}
.spellrow .sv small{display:block;font-size:9.5px;color:var(--tx3);font-weight:400}

<script>
"use strict";
/* ================================================================
   ==ENGINE-START==
   Pure model layer. No DOM below this line until ==ENGINE-END==.
   ================================================================ */

const ELEMS = ["cinder","frost","gale","stone","volt"];
const ALLBUCKETS = ["neutral","cinder","frost","gale","stone","volt"];
const EL = {
  cinder:{name:"Cinder", letter:"C", col:"#ff6a3c", school:"burn"},
  frost:{name:"Frost", letter:"F", col:"#4fb9ff", school:"chill"},
  gale :{name:"Gale",  letter:"G", col:"#b98cff", school:"cut"},
  stone:{name:"Stone", letter:"S", col:"#74cf4a", school:"crush"},
  volt :{name:"Volt",  letter:"V", col:"#ffd23c", school:"shock"},
  neutral:{name:"Neutral", letter:"N", col:"#c8d1e0", school:"plain"}
};
const RARITY = {
  common   :{name:"Common",    rank:0, cls:"r-common",    spread:1.00},
  uncommon :{name:"Uncommon",  rank:1, cls:"r-uncommon",  spread:1.00},
  rare     :{name:"Rare",      rank:2, cls:"r-rare",      spread:1.00},
  legendary:{name:"Legendary", rank:3, cls:"r-legendary", spread:1.00},
  fabled   :{name:"Fabled",    rank:4, cls:"r-fabled",    spread:1.00},
  mythic   :{name:"Mythic",    rank:5, cls:"r-mythic",    spread:1.00}
};
const SLOTS = [
  {id:"weapon", name:"Weapon"}, {id:"helm", name:"Helm"}, {id:"chest", name:"Chest"},
  {id:"legs", name:"Legs"}, {id:"boots", name:"Boots"},
  {id:"ring1", name:"Ring I", type:"ring"}, {id:"ring2", name:"Ring II", type:"ring"},
  {id:"amulet", name:"Amulet"}
];

/* ---------------- element-point conversion tables ----------------
   Deliberately a visible step function, not a hidden curve. The UI
   prints these rates verbatim so a player can do the arithmetic. */
function tiered(pts, rates){
  let left = Math.max(0, pts), out = 0;
  for (const [span, rate] of rates){ const take = Math.min(left, span); out += take*rate; left -= take; if(left<=0) break; }
  return out;
}
const T_DMG    = [[20,1.20],[20,0.80],[30,0.50],[Infinity,0.25]];
const T_STRIKE = [[20,0.70],[20,0.45],[30,0.30],[Infinity,0.15]];
const T_CRIT   = [[20,0.22],[20,0.15],[30,0.10],[Infinity,0.05]];
const T_COST   = [[20,0.35],[20,0.22],[30,0.12],[Infinity,0.05]];
const T_HP     = [[20,9.00],[20,7.00],[30,4.00],[Infinity,2.00]];
const T_DODGE  = [[20,0.35],[20,0.22],[30,0.12],[Infinity,0.05]];

const ELEM_EFFECT = {
  cinder:{key:"hp",    label:"max health",        fmt:p=>"+"+Math.round(tiered(p,T_HP))+" HP",         table:T_HP},
  frost:{key:"cost",  label:"spell cost",        fmt:p=>"−"+tiered(p,T_COST).toFixed(1)+"% cost",     table:T_COST},
  gale :{key:"dodge", label:"dodge chance",      fmt:p=>"+"+tiered(p,T_DODGE).toFixed(1)+"% dodge",   table:T_DODGE},
  stone:{key:"strike",label:"strike damage",     fmt:p=>"+"+tiered(p,T_STRIKE).toFixed(1)+"% strike", table:T_STRIKE},
  volt :{key:"crit",  label:"critical chance",   fmt:p=>"+"+tiered(p,T_CRIT).toFixed(1)+"% crit",     table:T_CRIT}
};

/* ================================================================
   STAT AGGREGATION
   Every number in the game arrives here as (source, key, value).
   Nothing is ever added anonymously — that is what makes the
   attribution view possible at all.
   ================================================================ */
function newAgg(){ return {total:Object.create(null), src:Object.create(null)}; }
function add(agg, key, val, srcName, srcKind, srcId){
  if(!val) return;
  agg.total[key] = (agg.total[key]||0) + val;
  (agg.src[key] || (agg.src[key]=[])).push({name:srcName, kind:srcKind, id:srcId, val:val});
}
function addAll(agg, stats, srcName, srcKind, srcId){
  if(!stats) return;
  for(const k in stats) add(agg, k, stats[k], srcName, srcKind, srcId);
}
const g = (agg,k)=> agg.total[k]||0;

/* ================================================================
   BUILD CONTEXT — resolves gear + allocation + tree into one object
   ================================================================ */
function buildContext(state){
  const cls = CLASSES[state.cls];
  const agg = newAgg();

  addAll(agg, cls.base, cls.name+" (base)", "class", "class");

  const equipped = [];
  for(const s of SLOTS){
    const inst = state.equipped[s.id];
    if(!inst) continue;
    const def = ITEMS[inst.def];
    if(!def) continue;
    equipped.push({slot:s.id, inst, def, vals:rolledValues(inst)});
  }

  /* item-granted element points count toward OTHER items' requirements,
     never toward the granting item's own. */
  const grants = {}; for(const e of ELEMS) grants[e]=0;
  for(const it of equipped) for(const e of ELEMS){
    const v = it.vals["elem."+e]; if(v) grants[e]+=v;
  }
  const alloc = state.alloc, pool = {}, meets = {};
  for(const e of ELEMS) pool[e] = (alloc[e]||0) + grants[e];

  for(const it of equipped){
    let ok = true, missing = {};
    for(const e of ELEMS){
      const need = (it.def.req && it.def.req[e]) || 0; if(!need) continue;
      const own = it.vals["elem."+e] || 0;
      const have = pool[e] - own;
      if(have < need){ ok = false; missing[e] = need - have; }
    }
    meets[it.slot] = {ok, missing};
    it.active = ok;
  }

  for(const it of equipped){
    if(!it.active) continue;
    const src = it.def.name;
    for(const k in it.vals){ if(k==="dmgBase") continue; add(agg, k, it.vals[k], src, "item", it.slot); }
    if(it.def.major) add(agg, "major."+it.def.major, 1, src, "item", it.slot);
  }

  /* element allocation bonuses */
  for(const e of ELEMS){
    const p = pool[e]; if(!p) continue;
    const label = EL[e].name+" ×"+p;
    add(agg, "dmg."+e, tiered(p, T_DMG), label, "elem", e);
    const fx = ELEM_EFFECT[e];
    if(fx.key==="hp")     add(agg, "hp",     tiered(p,T_HP),     label, "elem", e);
    if(fx.key==="cost")   add(agg, "cost.all", -tiered(p,T_COST), label, "elem", e);
    if(fx.key==="dodge")  add(agg, "dodge",  tiered(p,T_DODGE),  label, "elem", e);
    if(fx.key==="strike") add(agg, "dmg.strike", tiered(p,T_STRIKE), label, "elem", e);
    if(fx.key==="crit")   add(agg, "crit",   tiered(p,T_CRIT),   label, "elem", e);
  }

  /* tree */
  const tree = TREES[state.cls];
  const nodes = [];
  for(const id of state.tree){
    const n = tree.byId[id]; if(!n) continue;
    nodes.push(n);
    addAll(agg, n.stats, n.name, "node", n.id);
    if(n.major) add(agg, "major."+n.major, 1, n.name, "node", n.id);
    if(n.rule)  add(agg, "major."+n.rule,  1, n.name, "node", n.id);
  }

  /* major IDs: static rule-changes fold into the aggregate here so
     they are traceable like anything else. Timing-based ones become
     flags for the simulator. */
  const flags = {};
  for(const k in agg.total) if(k.startsWith("major.") && agg.total[k]>0) flags[k.slice(6)] = true;
  if(g(agg,"noHeal") > 0) flags.noHeal = true;
  if(flags.sever){        add(agg,"critMult", 80, "Sever", "major","sever");  add(agg,"critHalve",1,"Sever","major","sever"); }
  if(flags.graveresolve){ for(const e of ELEMS) add(agg,"res."+e, 30, "Grave Resolve","major","graveresolve"); add(agg,"noDodge",1,"Grave Resolve","major","graveresolve"); }
  if(flags.anchor){       add(agg,"mult.all", 35, "Anchor","major","anchor"); add(agg,"dmgTaken", 20, "Anchor","major","anchor"); }
  if(flags.cauterize){    add(agg,"dmgTaken", -25, "Cauterize","major","cauterize"); add(agg,"noHeal",1,"Cauterize","major","cauterize"); }
  if(flags.overflow){     add(agg,"manaPct", -50, "Overflow","major","overflow"); add(agg,"manaRegenPct", 100, "Overflow","major","overflow"); }

  /* weapon base damage */
  const wp = equipped.find(i=>i.slot==="weapon");
  const wdef = wp && wp.active ? wp.def : null;
  const base = {};
  for(const b of ALLBUCKETS) base[b] = 0;
  if(wdef){ const bd = wp.vals.dmgBase || {}; for(const b in bd) base[b] = bd[b]; }
  const speedBase = wdef ? wdef.speed : 1.0;

  /* derived pools */
  const maxHp   = Math.max(1, Math.round((cls.hp + g(agg,"hp")) * (1 + g(agg,"hpPct")/100)));
  const maxMana = Math.max(1, Math.round((cls.mana + g(agg,"mana")) * (1 + g(agg,"manaPct")/100)));
  const manaRegen = Math.max(0, (cls.manaRegen + g(agg,"manaRegen")) * (1 + g(agg,"manaRegenPct")/100));
  const hpRegen = g(agg,"hpRegen") + (flags.cauterize?0:0);
  let critChance = cls.crit + g(agg,"crit");
  if(g(agg,"critHalve")>0) critChance *= 0.5;
  critChance = clamp(critChance, 0, 100);
  const critMult = (cls.critMult*100 + g(agg,"critMult"))/100;
  let dodge = g(agg,"noDodge")>0 ? 0 : clamp(g(agg,"dodge"), 0, 70);

  /* spell list: tree ability nodes add or replace */
  const clone = o=>JSON.parse(JSON.stringify(o||{}));
  let spells = cls.spells.map(s=>Object.assign({}, s, {fx:clone(s.fx)}));
  /* 1. ability nodes swap out the spell sitting on a button */
  for(const n of nodes){
    if(n.addSpell) spells.push(Object.assign({}, n.addSpell, {fx:clone(n.addSpell.fx), fromNode:n.name}));
    if(n.replaceSpell){
      const [target, repl] = n.replaceSpell;
      const ix = spells.findIndex(s=>s.id===target);
      if(ix>=0){
        const base = spells[ix];
        spells[ix] = Object.assign({}, base, repl, {id:target, slot:base.slot, replacedBy:n.name,
          fx: mergeFx(repl.fxReset ? {} : base.fx, clone(repl.fx))});
      }
    }
    if(n.removeSpell) spells = spells.filter(s=>s.id!==n.removeSpell);
  }
  /* 2. modifier nodes rewrite behaviour on whatever now occupies that button.
        Every fxMod runs before every fxAdd, so an amplifier never depends on
        the order the player happened to allocate in. */
  const spellById = {}; for(const sp of spells) spellById[sp.id] = sp;
  for(const n of nodes) if(n.fxMod) for(const sid in n.fxMod){ if(spellById[sid]) mergeFx(spellById[sid].fx, clone(n.fxMod[sid])); }
  for(const n of nodes) if(n.fxAdd) for(const sid in n.fxAdd){ if(spellById[sid]) addFx(spellById[sid].fx, n.fxAdd[sid]); }
  /* 3. a replacement marked fxReset deliberately discards the branch's own
        modifiers — it has to be re-asserted after them, or the branch would
        quietly undo the keystone the player committed to. */
  for(const n of nodes){
    if(!n.replaceSpell || !n.replaceSpell[1].fxReset) continue;
    const sp = spellById[n.replaceSpell[0]];
    if(sp) sp.fx = mergeFx({}, clone(n.replaceSpell[1].fx));
  }
  for(const n of nodes) if(n.utilAdd) for(const sid in n.utilAdd){
    const sp = spellById[sid]; if(!sp || !sp.util) continue;
    sp.util = Object.assign({}, sp.util);
    for(const k in n.utilAdd[sid]) sp.util[k] = Math.max(k==="cd"?0.5:0, (sp.util[k]||0) + n.utilAdd[sid][k]);
  }

  return {
    state, cls, agg, equipped, meets, pool, grants, alloc, nodes, spells, flags,
    base, speedBase, weapon:wdef,
    maxHp, maxMana, manaRegen, hpRegen, critChance, critMult, dodge,
    allReqMet: Object.values(meets).every(m=>m.ok)
  };
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ================================================================
   THE DAMAGE PIPELINE
   base -> flat added -> additive increases -> multiplicative
   multipliers -> conversion -> crit.
   Every stage returns its bucket snapshot so the UI can show that
   the ORDER is what produced the number.
   ================================================================ */
function computeAttack(ctx, atk, opt){
  opt = opt || {};
  const A = ctx.agg, kind = atk.kind || "spell";
  const sk = "dmg.s:"+atk.id, mk = "mult.s:"+atk.id;
  const steps = [];

  // 1. BASE ----------------------------------------------------
  const mult = atk.mult != null ? atk.mult : 1;
  let b = {};
  for(const k of ALLBUCKETS) b[k] = (ctx.base[k]||0) * mult;
  steps.push({name:"Base", note:"weapon damage × "+Math.round(mult*100)+"% spell multiplier", buckets:Object.assign({},b)});

  // 2. FLAT ADDED ----------------------------------------------
  const fs = atk.flatScale != null ? atk.flatScale : 1;
  let anyFlat = false;
  for(const k of ALLBUCKETS){ const f = g(A,"flat."+k)*fs; if(f){ b[k]+=f; anyFlat=true; } }
  steps.push({name:"Flat added", note:"flat damage × "+fs.toFixed(2)+" attack scaling", buckets:Object.assign({},b), skip:!anyFlat});

  // 3. ADDITIVE INCREASES --------------------------------------
  const addPct = {};
  const common = g(A,"dmg.all") + g(A,"dmg."+kind) + g(A,sk) + (atk.aoe? g(A,"dmg.aoe"):0);
  for(const k of ALLBUCKETS){
    addPct[k] = common + g(A,"dmg."+k);
    b[k] *= (1 + addPct[k]/100);
  }
  steps.push({name:"Additive %", note:"all sources of +% summed, then applied once", buckets:Object.assign({},b), pct:addPct});

  // 4. MULTIPLICATIVE ------------------------------------------
  const multList = [];
  const pushM = (key,label)=>{ const v=g(A,key); if(v) multList.push({label, v}); };
  pushM("mult.all","global"); pushM("mult."+kind, kind); pushM(mk, atk.name);
  let multCommon = 1; for(const m of multList) multCommon *= (1 + m.v/100);
  const perEl = {};
  for(const k of ALLBUCKETS){
    const ev = g(A,"mult."+k);
    perEl[k] = multCommon * (1 + ev/100);
    b[k] *= perEl[k];
  }
  if(opt.bonusMult) for(const k of ALLBUCKETS) b[k] *= opt.bonusMult;
  steps.push({name:"Multiplicative ×", note:"each multiplier applied separately, never summed",
              buckets:Object.assign({},b), skip:multList.length===0 && !opt.bonusMult, mults:multList});

  // 5. CONVERSION ----------------------------------------------
  const snapshot = Object.assign({}, b);
  let converted = false, convLines = [];
  const outPct = {};
  for(const k in A.total){
    if(!k.startsWith("conv.")) continue;
    const [,from,to] = k.split(".");
    outPct[from] = (outPct[from]||0) + A.total[k];
  }
  for(const k in A.total){
    if(!k.startsWith("conv.")) continue;
    const [,from,to] = k.split(".");
    let pct = A.total[k];
    if(outPct[from] > 100) pct = pct * 100/outPct[from];   // never convert more than exists
    const amt = (snapshot[from]||0) * pct/100;
    if(amt<=0) continue;
    b[from] -= amt; b[to] = (b[to]||0) + amt; converted = true;
    convLines.push({from,to,pct,amt});
  }
  if(ctx.flags.entropy){
    let top = ELEMS[0], best=-1;
    for(const e of ELEMS) if(ctx.pool[e]>best){best=ctx.pool[e];top=e;}
    let moved = 0;
    for(const k of ALLBUCKETS) if(k!==top){ moved += b[k]; b[k]=0; }
    if(moved>0){ b[top]+=moved; converted=true; convLines.push({from:"everything", to:top, pct:100, amt:moved}); }
  }
  steps.push({name:"Conversion", note:"moved after scaling — converted damage keeps the SOURCE element's scaling",
              buckets:Object.assign({},b), skip:!converted, conv:convLines});

  // 6. CRIT ----------------------------------------------------
  let cc = ctx.critChance, cm = ctx.critMult;
  if(ctx.flags.nocrit) cc = 0;
  if(ctx.flags.fissure){ if(kind==="strike") cc = 0; else cc = 100; }
  if(opt.critOverride != null) cc = opt.critOverride;
  let hit = 0; for(const k of ALLBUCKETS) hit += b[k];
  const eff = hit * (1 + (cc/100)*(cm-1));
  steps.push({name:"Critical", note:cc.toFixed(1)+"% chance × "+cm.toFixed(2)+"× damage → ×"+(1+(cc/100)*(cm-1)).toFixed(3)+" average",
              buckets:scaleB(b, 1+(cc/100)*(cm-1))});

  const effB = scaleB(b, 1 + (cc/100)*(cm-1));
  return {atk, buckets:effB, rawBuckets:b, hit, effective:eff, crit:{chance:cc, mult:cm}, steps, addPct, kind};
}
function scaleB(b,f){ const o={}; for(const k in b) o[k]=b[k]*f; return o; }
function sumB(b){ let s=0; for(const k in b) s+=b[k]; return s; }

/* damage that actually lands on a given defender */
function applyResist(buckets, res){
  let out = {}, total = 0;
  for(const k in buckets){
    const r = (res[k]||0) + (res.all||0);
    const m = clamp(1 - r/100, 0.05, 3);
    out[k] = buckets[k]*m; total += out[k];
  }
  return {buckets:out, total};
}
function playerIncoming(ctx, buckets){
  const A = ctx.agg;
  const taken = 1 + g(A,"dmgTaken")/100;
  const armor = clamp(g(A,"armor"), -100, 80);
  const dodgeM = 1 - ctx.dodge/100;
  let out = {}, total = 0;
  for(const k in buckets){
    const r = clamp(g(A,"res."+k) + g(A,"res.all"), -200, 85);
    let v = buckets[k] * (1 - r/100) * (1 - armor/100) * taken * dodgeM;
    if(v<0) v=0;
    out[k]=v; total+=v;
  }
  return {buckets:out, total};
}
function effectiveHp(ctx, profile){
  const inc = playerIncoming(ctx, profile);
  const raw = sumB(profile);
  if(inc.total<=0) return ctx.maxHp*20;
  return ctx.maxHp * (raw/inc.total);
}
const REF_PROFILE = {neutral:20, cinder:20, frost:20, gale:20, stone:20, volt:20};

/* ================================================================
   ROTATION + SIMULATION
   Deterministic, expected-value. A theorycrafting game must never
   make you re-run a fight to find out what your build does.
   ================================================================ */
function spellCost(ctx, sp){
  const A = ctx.agg;
  const pct = g(A,"cost.all") + g(A,"cost.s:"+sp.id);
  return Math.max(0, sp.cost * (1 + pct/100));
}
function castTime(ctx, sp){
  const s = 1 + g(ctx.agg,"cast")/100;
  return Math.max(0.12, sp.time / Math.max(0.25, s));
}
function strikeDef(ctx){
  const w = ctx.weapon;
  const iv = (w? w.speed : 1.0) / Math.max(0.25, 1 + g(ctx.agg,"speed")/100);
  return {id:"strike", name:(w?w.strikeName:"Strike"), kind:"strike", mult:1, cost:0,
          time:Math.max(0.15, iv), flatScale:(w?w.speed:1.0)/0.8};
}
/* ----------------------------------------------------------------
   SPELL BEHAVIOUR (fx)
   A spell is not just a damage number. Everything in this block is
   something you can watch happen in a fight, which is exactly the
   bar a modifier node has to clear to be called a modifier.
   ---------------------------------------------------------------- */
const FX_KINDS = ["direct","bleed","zone","minion","blast","counter","shatter","execute"];
const ADD_VALUE_DEFAULT = 0.35;
function emptyFx(){ return {}; }
function mergeFx(fx, patch){
  for(const k in patch){
    const v = patch[k];
    if(v && typeof v === "object" && !Array.isArray(v)) fx[k] = Object.assign({}, fx[k]||{}, v);
    else fx[k] = v;
  }
  return fx;
}
const FX_DEFAULT = {hits:1, pierce:0, chain:0, addValue:ADD_VALUE_DEFAULT};
function addFx(fx, patch){
  for(const path in patch){
    const bits = path.split(".");
    if(bits.length === 1){
      const base = fx[bits[0]] != null ? fx[bits[0]] : FX_DEFAULT[bits[0]];
      if(base != null) fx[bits[0]] = base + patch[path];
      continue;
    }
    const o = fx[bits[0]];
    if(o && o[bits[1]] != null) o[bits[1]] += patch[path];
  }
  return fx;
}
/* how many things a cast actually touches */
function targetsFor(sp, enemy){
  const adds = enemy.adds || 0, fx = sp.fx || {};
  let n = 1 + (fx.pierce||0) + (fx.chain||0);
  if(fx.aoe || fx.pull || sp.aoe) n = 1 + adds;
  return Math.max(1, Math.min(1 + adds, n));
}
const ADD_VALUE = ADD_VALUE_DEFAULT;   // an extra target is worth a third of the primary

function attackTable(ctx){
  const out = [];
  const st = strikeDef(ctx);
  out.push({sp:st, res:computeAttack(ctx, st), cost:0, time:st.time, util:null});
  for(const sp of ctx.spells){
    const a = Object.assign({}, sp, {kind:"spell"});
    out.push({sp:a, res:computeAttack(ctx, a), cost:spellCost(ctx,sp), time:castTime(ctx,sp), util:sp.util||null});
  }
  return out;
}

/* Core loop shared by the dummy readout and the real trials. */
function simulate(ctx, enemy, opts){
  opts = opts || {};
  const A = ctx.agg;
  const T = enemy.timeLimit, dt = 0.05;
  const table = attackTable(ctx);
  const utils   = table.filter(a=>a.util);
  const strike  = table[0];
  const manaSteal = g(A,"manaSteal"), lifesteal = g(A,"lifesteal"), spellLeech = g(A,"spellLeech");
  const thorns = g(A,"thorns");
  const noDirect = ctx.flags.nodirect;

  /* resisted damage each action lands on the primary target */
  function landedDirect(a){ return applyResist(a.res.buckets, enemy.res).total; }
  for(const a of table){
    a.fx = a.sp.fx || {};
    a.targets = targetsFor(a.sp, enemy);
    a.tmul = 1 + (a.targets - 1) * (a.fx.addValue != null ? a.fx.addValue : ADD_VALUE);
    /* rawDirect is what the swing is worth; it still sets the size of every
       behaviour hanging off it even when the swing itself is switched off */
    a.rawDirect = landedDirect(a) * (a.fx.hits || 1) * a.tmul;
    a.direct = noDirect ? 0 : a.rawDirect;
  }
  const directPct = 1 + g(A,"directPct")/100;
  const strikeDps = strike.time > 0 ? strike.rawDirect / strike.time : 0;
  /* a Totem or a Summon deals nothing on cast, but its behaviour still needs
     a magnitude; use what a basic attack would have done in the same time */
  for(const a of table) a.basis = a.rawDirect > 0 ? a.rawDirect : Math.max(1, strikeDps * Math.max(0.5, a.time) * 1.25);
  /* the rotation must value a spell by what it eventually does, not by
     the number that appears the instant it is cast */
  const shatterBest = Math.max(0, ...table.map(x=>x.fx.shatter ? x.direct*(x.fx.shatter.pct||0)/100 : 0));
  for(const a of table){
    const fx = a.fx; let extra = 0;
    if(fx.freeze && shatterBest > 0) extra += shatterBest;   // a setup cast is worth what it sets up
    if(fx.dot)    extra += a.basis * fx.dot.pct/100 * (fx.dot.dur||3) * (fx.dot.stacks?Math.min(2,fx.dot.stacks):1);
    if(fx.zone)   extra += a.basis * fx.zone.pct/100 * (fx.zone.dur||3);
    if(fx.summon) extra += strikeDps * fx.summon.pct/100 * (fx.summon.count||1) * Math.min(10, fx.summon.dur||8);
    if(fx.guard)  extra += (fx.guard.counter||0)/100 * a.direct * 2;
    if(fx.mark)   extra += a.direct * (fx.mark.pct/100) * 0.6;
    a.value = a.direct + extra;
  }
  const dmgActs = table.filter(a=>(a.value > 0 || a.fx.summon || a.fx.mark) && !a.util);

  let hp = ctx.maxHp, mana = ctx.maxMana, t = 0;
  let enemyHp = enemy.hp, ward = 0, wardEndsAt = -1, wardDeadline = -1;
  let shield = g(A,"shield");
  const regenBase = ctx.manaRegen;

  let acting = null, actEnds = 0, castCount = 0;
  let dealt = 0, dealtBy = {}, byKind = {}, takenBy = {}, curve = [], manaCurve = [], hpSeries = [];
  let starvedTime = 0, strikeTime = 0, totalTime = 0, lastHitAt = -99;
  let wardBreaks = 0, wardFails = 0, wardDealt = 0, wardNeeded = 0, bestWardPush = 0, wardAbsorbed = 0, failPush = 0;
  let healedBack = 0, drained = 0, deathAt = -1, killAt = -1, secBucket = 0, secT = 0;
  const cds = {};

  /* live behaviour state — this is what makes nodes visible in a fight */
  const dots = [], zones = [], minions = [];
  let mark = 0, markT = 0, weaken = 0, weakenT = 0, frozenT = 0, rootPct = 0, rootT = 0;
  let blockPct = 0, blockT = 0, counterPct = 0, counterAll = false, counterDot = null;
  let maxStacks = 0, minionPeak = 0, freezes = 0, shatters = 0, blasts = 0, counters = 0;
  const log = [], logged = {};
  function say(kind, text, once){
    if(once){ if(logged[once]) return; logged[once] = 1; }
    if(log.length < 60) log.push({t:+t.toFixed(1), kind, text});
  }
  function hurt(amount, kind, label){
    if(amount <= 0) return;
    let v = amount * (1 + mark/100);
    if(ward > 0){
      const w = Math.min(ward, v); ward -= w; wardDealt += w; wardAbsorbed += w; v -= w;
      if(ward <= 0){ wardBreaks++; wardEndsAt = t; bestWardPush = Math.max(bestWardPush, enemy.ward.hp);
                     say("ward","Ward broken"); }
    }
    enemyHp -= v;
    dealt += amount;
    byKind[kind] = (byKind[kind]||0) + amount;
    dealtBy[label] = (dealtBy[label]||0) + amount;
    secBucket += amount;
  }
  function takeHit(buckets, why){
    const inc = playerIncoming(ctx, buckets);
    let d = inc.total;
    if(blockT > 0){
      d *= (1 - blockPct/100);
      if(counterPct > 0){
        let c = strike.direct * counterPct/100;
        if(counterAll) c *= 1 + (enemy.adds||0)*ADD_VALUE;
        hurt(c, "counter", "Counter"); counters++;
        if(counterDot) applyDot(counterDot, c);
        say("counter","Counter-attack for "+fmt(c), counters>2?"ctr":null);
      }
    }
    for(const k in inc.buckets) takenBy[k] = (takenBy[k]||0) + inc.buckets[k]*(blockT>0?(1-blockPct/100):1);
    if(shield > 0){ const s = Math.min(shield, d); shield -= s; d -= s; }
    if(d > 0){ hp -= d; lastHitAt = t; }
  }

  const policy = opts.policy || ctx.policy || "debt";
  function pick(){
    for(const u of utils){
      const cd = cds[u.sp.id] || 0;
      if(t < cd || mana < u.cost) continue;
      const healOnly = u.util.heal && !u.util.shield && !u.util.dodge && !u.fx.guard;
      if(healOnly && hp > ctx.maxHp*0.85) continue;
      if(ctx.flags.noHeal && healOnly) continue;
      return u;
    }
    if(policy === "strike") return strike;
    /* "set up, then spend" is a plausible plan and no single-score heuristic
       can express it: a freeze is worth nothing until something shatters it. */
    if(policy === "combo"){
      for(const a of dmgActs){
        if(a.cost > mana) continue;
        if(a.fx.freeze && frozenT <= 0 && shatterBest > 0) return a;
        if(a.fx.mark && a.fx.mark.pct > 0 && markT <= 0.3) return a;
        if(a.fx.weaken && a.fx.weaken.pct >= 20 && weakenT <= 0.3 && a.direct > 0) return a;
      }
    }
    let best = null, bestScore = -1;
    const wardUp = ward > 0;
    for(const a of dmgActs){
      if(a.cost > mana) continue;
      if(a.fx.summon && minions.length >= (a.fx.summon.cap || 99)) continue;
      if(a.fx.mark && markT > 1.5 && !a.direct) continue;
      let v = a.value;
      if(wardUp) v = a.direct;                       // a ward only cares about what lands now
      let score;
      if(wardUp || policy === "burst" || policy === "combo") score = v / a.time;
      else if(policy === "permana") score = a.cost>0 ? v / a.cost : v / a.time * 1e-4 + 1e-6;
      else {
        const debt = regenBase > 0 ? Math.max(0, a.cost - regenBase*a.time)/regenBase : (a.cost>0?99:0);
        score = v / (a.time + debt);
      }
      if(score > bestScore){ bestScore = score; best = a; }
    }
    return best || strike;
  }

  function applyDot(d, basis, spread){
    const key = d.name || "Bleed";
    let e = dots.find(x=>x.key===key);
    const perStack = basis*d.pct/100 * (spread && enemy.adds ? 1 + enemy.adds*ADD_VALUE : 1);
    if(!e){ e = {key, name:key, elem:d.elem||"neutral", per:perStack, stacks:0, remaining:0, max:d.stacks||1};
            dots.push(e); }
    e.per = perStack; e.max = d.stacks||1;
    e.stacks = Math.min(e.max, e.stacks+1);
    e.remaining = d.dur || 4;
    maxStacks = Math.max(maxStacks, e.stacks);
    say("dot", key+" applied"+(e.max>1? " ("+e.stacks+"/"+e.max+" stacks)":""), e.stacks<e.max?("dot"+key+e.stacks):null);
    if(spread && enemy.adds) say("dot", key+" spread to "+enemy.adds+" other targets","spread"+key);
  }
  function resolve(a){
    const fx = a.fx;
    let direct = a.direct * directPct;
    if(ctx.flags.focusfire) direct *= (markT > 0 ? 1.6 : 0.6);
    if(ctx.flags.bloodrite && hp < ctx.maxHp*0.5) direct *= 1.4;
    if(ctx.flags.tempo && a.sp.kind==="spell" && (castCount % 4)===3) direct *= 2;
    if(fx.execute && enemyHp < enemy.hp*0.35) direct *= 1 + (fx.execute.pct + g(A,"execute"))/100;
    if(frozenT > 0 && fx.shatter){
      const bonus = direct * fx.shatter.pct/100;
      hurt(bonus, "shatter", "Shatter"); shatters++;
      frozenT = 0;
      say("shatter","Frozen target shattered for "+fmt(bonus), shatters>2?"sh":null);
    }
    if(direct > 0) hurt(direct, "direct", a.sp.name);

    if(fx.dot) applyDot(fx.dot, a.basis, fx.spread);
    if(fx.detonate && dots.length){
      let boom = 0;
      for(const e of dots){ boom += e.per*e.stacks*(e.remaining||0)*fx.detonate.pct/100; e.stacks=0; e.remaining=0; }
      if(boom>0){ hurt(boom,"blast","Detonation"); blasts++; say("blast","Detonated every stack for "+fmt(boom)); }
    }
    if(fx.zone){
      const z = fx.zone;
      zones.push({name:z.name||"Ground", elem:z.elem||"neutral",
                  dps:a.basis*z.pct/100, remaining:z.dur||4});
      say("zone", (z.name||"Ground")+" laid down for "+(z.dur||4)+"s", "z"+(z.name||"g"));
    }
    if(fx.summon){
      const s = fx.summon, n = s.count||1;
      if(ctx.flags.symbiosis) hp -= ctx.maxHp*0.11*n;
      for(let i=0;i<n;i++) minions.push({remaining: s.perm? 1e9 : (s.dur||10),
        dps: strikeDps*s.pct/100, explode: s.explode||0});
      minionPeak = Math.max(minionPeak, minions.length);
      say("minion", n+" "+(n>1?"minions":"minion")+" summoned ("+minions.length+" out)", "sum"+minions.length);
    }
    if(fx.mark){ mark = fx.mark.pct; markT = fx.mark.dur;
                 say("mark","Target marked — taking +"+fx.mark.pct+"% damage","mk"); }
    if(fx.weaken){ weaken = fx.weaken.pct; weakenT = fx.weaken.dur;
                   say("debuff","Enemy weakened — dealing −"+fx.weaken.pct+"% damage","wk"); }
    if(fx.freeze){ frozenT = fx.freeze.dur; freezes++;
                   say("freeze","Target frozen for "+fx.freeze.dur+"s", freezes>2?"fz":null); }
    if(fx.root){ rootPct = fx.root.pct||30; rootT = fx.root.dur||3;
                 say("root","Rooted — its damage cut "+rootPct+"% for "+rootT+"s","rt"); }
    if(fx.guard){ blockPct = fx.guard.block||30; blockT = fx.guard.dur||3; counterPct = fx.guard.counter||0;
                  counterAll = !!fx.guard.counterAll; counterDot = fx.guard.counterDot||null;
                  say("guard","Guard up — "+blockPct+"% blocked"+(counterPct?", countering":""),"gd"); }
    if(fx.drain){ mana = Math.min(ctx.maxMana, mana + (fx.drain.mana||0));
                  if(!ctx.flags.noHeal) hp = Math.min(ctx.maxHp, hp + ctx.maxHp*(fx.drain.heal||0)/100);
                  say("drain","Siphoned "+(fx.drain.mana||0)+" mana","dr"); }
  }

  while(t < T){
    /* ---- behaviour ticks ---- */
    for(let i=dots.length-1;i>=0;i--){
      const e = dots[i];
      if(e.stacks>0 && e.remaining>0){
        let v = e.per*e.stacks*dt;
        if(enemy.res && enemy.res[e.elem]) v *= 1;   // already resisted at source
        hurt(v, "bleed", e.name);
      }
      e.remaining -= dt;
      if(e.remaining <= 0){ e.stacks = 0; }
    }
    for(let i=zones.length-1;i>=0;i--){
      const z = zones[i];
      hurt(z.dps*dt, "zone", z.name);
      z.remaining -= dt;
      if(z.remaining <= 0) zones.splice(i,1);
    }
    for(let i=minions.length-1;i>=0;i--){
      const m = minions[i];
      hurt(m.dps*dt, "minion", "Minions");
      m.remaining -= dt;
      if(m.remaining <= 0){
        minions.splice(i,1);
        if(m.explode){ const b = strikeDps*m.explode/100; hurt(b,"blast","Minion blast"); blasts++;
                       say("blast","A minion died and detonated for "+fmt(b), blasts>2?"bl":null); }
      }
    }
    if(markT>0){ markT-=dt; if(markT<=0) mark=0; }
    if(weakenT>0){ weakenT-=dt; if(weakenT<=0) weaken=0; }
    if(rootT>0){ rootT-=dt; if(rootT<=0) rootPct=0; }
    if(frozenT>0) frozenT-=dt;
    if(blockT>0) blockT-=dt;

    /* ---- what the enemy does ---- */
    const softener = (1 - weaken/100) * (1 - rootPct/100);
    if(enemy.dps) takeHit(scaleB(enemy.dps, dt*softener));
    if(enemy.spike && t>0 && Math.abs((t % enemy.spike.every)) < dt*0.999 && t>=enemy.spike.every-1e-9){
      takeHit(scaleB(enemy.spike.dmg, softener));
      say("hit","Its burst lands", "spk");
    }
    if(enemy.drain){ mana = Math.max(0, mana - enemy.drain*dt); drained += enemy.drain*dt; }
    if(enemy.regen && enemyHp>0 && enemyHp<enemy.hp){
      const h = Math.min(enemy.regen*dt, enemy.hp-enemyHp); enemyHp += h; healedBack += h;
    }
    if(enemy.ward){
      if(ward<=0 && t >= (wardEndsAt<0 ? enemy.ward.first : wardEndsAt + enemy.ward.every)){
        ward = enemy.ward.hp; wardDeadline = t + enemy.ward.window; wardNeeded += enemy.ward.hp; wardDealt = 0;
        say("ward","Ward up — "+fmt(enemy.ward.hp)+" in "+enemy.ward.window+"s","wd");
      }
      if(ward>0 && t > wardDeadline){
        wardFails++; wardEndsAt = t; ward = 0;
        bestWardPush = Math.max(bestWardPush, wardDealt);
        failPush = Math.max(failPush, wardDealt);
        const h = Math.min(enemy.ward.healOnFail, enemy.hp-enemyHp); enemyHp += h; healedBack += h;
        takeHit(enemy.ward.failDmg);
        say("ward","Ward resealed — it heals "+fmt(h));
      }
    }
    let mr = regenBase;
    if(ctx.flags.lucid && (t - lastHitAt) > 3) mr *= 2;
    mana = Math.min(ctx.maxMana, mana + mr*dt);
    if(!ctx.flags.noHeal && ctx.hpRegen) hp = Math.min(ctx.maxHp, hp + ctx.hpRegen*dt);
    if(ctx.flags.symbiosis && minions.length && !ctx.flags.noHeal)
      hp = Math.min(ctx.maxHp, hp + minions.length*ctx.maxHp*0.02*dt);
    if(hp <= 0){ deathAt = t; break; }

    /* ---- actions ---- */
    if(acting && t >= actEnds - 1e-9){
      const a = acting; acting = null;
      resolve(a);
      if(a.sp.kind==="strike"){ mana = Math.min(ctx.maxMana, mana + manaSteal);
                                if(!ctx.flags.noHeal) hp = Math.min(ctx.maxHp, hp+lifesteal); }
      else { castCount++; if(!ctx.flags.noHeal) hp = Math.min(ctx.maxHp, hp+spellLeech); }
      if(a.util){
        cds[a.sp.id] = t + (a.util.cd || a.util.dur || 6);
        if(a.util.heal && !ctx.flags.noHeal) hp = Math.min(ctx.maxHp, hp + ctx.maxHp*a.util.heal/100);
        if(a.util.shield) shield += ctx.maxHp*a.util.shield/100;
      }
      if(enemy.thorns){ takeHit({neutral: a.direct*enemy.thorns/100}); }
      if(enemyHp <= 0 && ward<=0){ killAt = t; break; }
    }
    if(!acting){
      const a = pick();
      const affordableSpell = dmgActs.some(x=>x.sp.kind==="spell" && x.cost<=mana);
      if(a.sp.kind==="strike" && !affordableSpell && dmgActs.some(x=>x.sp.kind==="spell")) starvedTime += a.time;
      if(a.sp.kind==="strike") strikeTime += a.time;
      let cost = a.cost;
      if(ctx.flags.tempo && a.sp.kind==="spell" && (castCount % 4)===3) cost = 0;
      if(ctx.flags.thirst && a.sp.kind==="spell"){ hp -= cost*1.5; cost = 0; }
      mana -= cost;
      acting = a; actEnds = t + a.time; totalTime += a.time;
    }

    t += dt; secT += dt;
    if(secT >= 1 - 1e-9){ curve.push(secBucket); manaCurve.push(mana/ctx.maxMana);
      hpSeries.push(Math.max(0,hp)/ctx.maxHp); secBucket = 0; secT = 0; }
    if(hp <= 0){ deathAt = t; break; }
  }
  const dur = killAt>=0 ? killAt : (deathAt>=0 ? deathAt : T);
  return {
    win: killAt>=0, killAt, deathAt, dur:Math.max(0.05,dur), dealt,
    dps: dealt/Math.max(0.05,dur), dealtBy, byKind, takenBy,
    taken: Object.values(takenBy).reduce((a,b)=>a+b,0),
    hpLeft:Math.max(0,hp), hpPct: Math.max(0,hp)/ctx.maxHp,
    enemyHpLeft: Math.max(0, enemyHp), enemyPct: 1 - Math.max(0,enemyHp)/enemy.hp,
    curve, manaCurve, hpSeries, starvedTime, strikeTime, totalTime, healedBack, drained,
    wardBreaks, wardFails, wardNeeded, bestWardPush, failPush, wardAbsorbed,
    log, maxStacks, minionPeak, freezes, shatters, blasts, counters,
    targets: Math.max(...table.map(a=>a.targets)),
    effDps: Math.max(0, dealt - wardAbsorbed)/Math.max(0.05,dur), enemy, ctx
  };
}

/* the headline numbers: a 0-resist dummy with infinite health */
const DUMMY = {id:"dummy", name:"Test Dummy", hp:1e12, res:{}, timeLimit:24, dps:null};
const POLICIES = ["debt","burst","permana","strike","combo"];
/* Which rotation does this build actually want? Rather than assert one
   heuristic and hope, run the plausible ones and keep whichever deals the
   most damage. The UI names the winner so the player can see the choice. */
function pickPolicy(ctx){
  if(ctx.policy) return ctx.policy;
  let best = "debt", bv = -1;
  for(const p of POLICIES){
    const r = simulate(ctx, DUMMY, {policy:p});
    if(r.dealt > bv){ bv = r.dealt; best = p; }
  }
  ctx.policy = best;
  return best;
}
const POLICY_NAME = {debt:"spend only what you regenerate", burst:"cast the biggest thing you can afford",
                     permana:"cast the most damage per point of mana", strike:"basic attacks only",
                     combo:"keep your setup running, then spend"};
function dummyRun(ctx){ pickPolicy(ctx); return simulate(ctx, DUMMY); }

/* burst is the most damage this build can put out in the window, so it is
   the best of every rotation, not the best sustained one */
function burstWindow(ctx, seconds){
  const e = Object.assign({}, DUMMY, {timeLimit:seconds});
  let best = 0;
  for(const p of POLICIES) best = Math.max(best, simulate(ctx, e, {policy:p}).dealt);
  return best;
}

/* the four headline stats */
function headline(ctx){
  if(!ctx.weapon){
    return {dps:0, ehp:Math.round(effectiveHp(ctx,REF_PROFILE)), sustain:0, burst:0, broken:true};
  }
  pickPolicy(ctx);
  const r = dummyRun(ctx);
  const A = ctx.agg;
  const sustain = ctx.hpRegen + g(A,"lifesteal")/Math.max(.2,strikeDef(ctx).time)*0.35 + g(A,"spellLeech")*0.5;
  return {
    dps: r.dps,
    ehp: effectiveHp(ctx, REF_PROFILE),
    sustain: sustain,
    burst: burstWindow(ctx, 4),
    broken: false,
    run: r
  };
}

/* ================================================================
   ATTRIBUTION — marginal contribution by source
   "Remove exactly this one thing, how much DPS disappears?"
   ================================================================ */
function attributeDamage(state, baseDps){
  const ctx0 = buildContext(state);
  if(baseDps == null) baseDps = headline(ctx0).dps;
  const contributors = [];
  const seen = new Set();
  const A = ctx0.agg;
  for(const key in A.src){
    if(key.startsWith("res.")||key==="hp"||key==="hpPct"||key==="dodge"||key==="armor") continue;
    for(const s of A.src[key]){
      const sig = s.kind+"|"+s.id+"|"+key;
      if(seen.has(sig)) continue; seen.add(sig);
      contributors.push({key, src:s});
    }
  }
  const out = [];
  for(const c of contributors){
    const ctx = buildContext(state);
    // subtract exactly this contribution and rebuild the derived layer
    ctx.agg.total[c.key] = (ctx.agg.total[c.key]||0) - c.src.val;
    rederive(ctx);
    const d = ctx.weapon ? dummyRun(ctx).dps : 0;
    const delta = baseDps - d;
    if(Math.abs(delta) < 0.01) continue;
    out.push({label:c.src.name, kind:c.src.kind, id:c.src.id, stat:c.key, value:c.src.val, delta});
  }
  /* the weapon's own base damage is not a "stat", but it is usually the
     single largest contributor in the build — it has to be traceable too. */
  if(ctx0.weapon){
    for(const bucket in ctx0.base){
      if(!ctx0.base[bucket]) continue;
      const ctx = buildContext(state);
      const was = ctx.base[bucket];
      ctx.base[bucket] = 0;
      const delta = baseDps - dummyRun(ctx).dps;
      if(Math.abs(delta) < 0.01) continue;
      out.push({label:ctx0.weapon.name, kind:"item", id:"weapon", stat:"base."+bucket, value:was, delta});
    }
  }
  out.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return {base:baseDps, rows:out};
}
function rederive(ctx){
  ctx.policy = null;
  const A = ctx.agg, cls = ctx.cls;
  ctx.maxHp = Math.max(1, Math.round((cls.hp + g(A,"hp")) * (1 + g(A,"hpPct")/100)));
  ctx.maxMana = Math.max(1, Math.round((cls.mana + g(A,"mana")) * (1 + g(A,"manaPct")/100)));
  ctx.manaRegen = Math.max(0,(cls.manaRegen + g(A,"manaRegen")) * (1 + g(A,"manaRegenPct")/100));
  ctx.hpRegen = g(A,"hpRegen");
  let cc = cls.crit + g(A,"crit"); if(g(A,"critHalve")>0) cc*=0.5;
  ctx.critChance = clamp(cc,0,100);
  ctx.critMult = (cls.critMult*100 + g(A,"critMult"))/100;
  ctx.dodge = g(A,"noDodge")>0?0:clamp(g(A,"dodge"),0,70);
  return ctx;
}

/* group attribution by source object rather than by stat */
function attributeBySource(state, baseDps){
  const raw = attributeDamage(state, baseDps);
  const m = new Map();
  for(const r of raw.rows){
    const k = r.kind+"|"+r.id;
    if(!m.has(k)) m.set(k, {label:r.label, kind:r.kind, id:r.id, delta:0, parts:[]});
    const e = m.get(k); e.delta += r.delta; e.parts.push(r);
  }
  const rows = [...m.values()].sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  for(const r of rows) r.parts.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return {base:raw.base, rows, flat:raw.rows};
}

/* ================================================================
   DIAGNOSIS — one plain sentence, then the numbers underneath
   ================================================================ */
function diagnose(r){
  const e = r.enemy, ctx = r.ctx;
  const need = (e.hp + (e.regen||0)*e.timeLimit) / e.timeLimit;
  const ratio = r.effDps / Math.max(1, need);
  const taken = r.taken || 1;
  const parts = Object.entries(r.takenBy).sort((a,b)=>b[1]-a[1]);
  const top = parts[0] || ["neutral",0];
  const topPct = Math.round(top[1]/taken*100);
  const topName = EL[top[0]] ? EL[top[0]].name : top[0];
  const myRes = Math.round(g(ctx.agg,"res."+top[0]) + g(ctx.agg,"res.all"));
  const starvePct = Math.round(r.starvedTime / Math.max(0.1, r.totalTime) * 100);
  const facts = [];

  facts.push(["Sustained DPS", fmt(r.effDps) + " / " + fmt(need) + " needed", ratio>=1?"pos":"neg"]);
  if(r.wardAbsorbed > 1) facts.push(["Swallowed by wards", fmt(r.wardAbsorbed) + " of your " + fmt(r.dealt) + " damage never reached it"]);
  facts.push(["Damage dealt", fmt(r.dealt) + " of " + fmt(e.hp) + " enemy HP" + (r.healedBack>1?" (+"+fmt(r.healedBack)+" healed back)":"")]);
  facts.push(["Damage taken", fmt(r.taken) + " against " + fmt(ctx.maxHp) + " max HP"]);
  if(taken>1) facts.push(["Biggest threat", topName + " — " + topPct + "% of incoming, your " + topName + " defence " + (myRes>=0?"+":"") + myRes + "%", myRes<0?"neg":""]);
  facts.push(["Time on basic attacks", Math.round(r.strikeTime/Math.max(.1,r.totalTime)*100) + "%" + (starvePct>3?" · "+starvePct+"% out of mana":"")]);
  if(e.ward) facts.push(["Ward windows", r.wardBreaks + " broken of " + (r.wardBreaks+r.wardFails) +
    (r.wardFails? " — best failed push " + fmt(r.failPush) + " of " + fmt(e.ward.hp) : " — all broken"), r.wardFails?"neg":"pos"]);
  if(e.drain) facts.push(["Mana drained", fmt(r.drained) + " over the fight, pool " + fmt(ctx.maxMana)]);

  let line;
  if(r.win){
    line = "Cleared at " + r.killAt.toFixed(1) + "s with " + Math.round(r.hpPct*100) + "% health left — "
         + (ratio>1.6 ? "you beat the damage check by " + ratio.toFixed(1) + "×, so there is headroom to trade damage for defence."
                      : "you cleared it by " + Math.round((ratio-1)*100) + "% on damage, which is thin.");
  } else if(r.deathAt >= 0){
    const dmgClause = ratio >= 1.15
      ? "You out-damaged the check by " + ratio.toFixed(1) + "×"
      : (ratio >= 0.9 ? "Your damage was almost exactly on the check" : "You were " + Math.round((1-ratio)*100) + "% short on damage");
    const causeClause = e.spike && top[1] > 0 && e.spike.dmg
      ? " but died at " + r.deathAt.toFixed(1) + "s to its " + e.spike.every + "s burst — one hit lands for "
        + fmt(playerIncoming(ctx, e.spike.dmg).total) + " against your " + fmt(ctx.maxHp) + " HP"
      : " but died at " + r.deathAt.toFixed(1) + "s to sustained " + topName + " damage — " + topPct
        + "% of everything that hit you was " + topName + " and your " + topName + " defence is " + (myRes>=0?"+":"") + myRes + "%";
    line = dmgClause + causeClause + ".";
  } else if(e.ward && r.wardFails > 0){
    /* report the window that actually failed, and never print a near miss
       as two identical rounded numbers */
    const pushTxt = fmt(r.failPush) === fmt(e.ward.hp)
      ? (r.failPush/e.ward.hp*100).toFixed(1) + "% of the"
      : fmt(r.failPush) + " of the";
    line = "Your " + e.ward.window.toFixed(1) + "s burst window delivered " + pushTxt + " "
         + fmt(e.ward.hp) + " needed to break the ward — it resealed " + r.wardFails + " time" + (r.wardFails>1?"s":"")
         + " and healed back " + fmt(r.healedBack) + ".";
  } else if(starvePct > 25){
    line = "You ran dry and spent " + starvePct + "% of the fight on basic attacks — sustained DPS of "
         + fmt(r.effDps) + " against a " + fmt(need) + " check.";
  } else if(e.regen && r.healedBack > r.dealt*0.25){
    line = "Its regeneration ate " + fmt(r.healedBack) + " of your " + fmt(r.dealt)
         + " damage — you need " + fmt(need) + " sustained DPS and you do " + fmt(r.effDps) + ".";
  } else {
    line = "You survived the full " + e.timeLimit + "s but left it on " + Math.round((1-r.enemyPct)*100)
         + "% health — your " + fmt(r.effDps) + " DPS is " + Math.round(ratio*100) + "% of the " + fmt(need) + " this check wants.";
  }
  return {line, facts, ratio, need};
}
function fmt(n){
  if(n==null||isNaN(n)) return "—";
  const a = Math.abs(n);
  if(a < 0.005) return "0";
  if(a>=1e6) return (n/1e6).toFixed(2)+"M";
  if(a>=1e4) return Math.round(n/100)/10+"k";
  if(a>=100) return Math.round(n).toLocaleString();
  if(a>=10) return n.toFixed(0);
  if(a>=1) return n.toFixed(1);
  return n.toFixed(2);
}

/* ================================================================
   ROLLING
   ================================================================ */
let RNG = mulberry32(0x5eed);
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let UID = 1;
function rollItem(defId){
  const def = ITEMS[defId];
  const rolls = {};
  for(const k in (def.stats||{})){ if(Array.isArray(def.stats[k])) rolls[k] = RNG(); }
  if(def.dmgBase) for(const b in def.dmgBase) rolls["dmgBase."+b] = RNG();
  return {uid:"i"+(UID++), def:defId, rolls};
}
function rolledValues(inst){
  const def = ITEMS[inst.def], out = {};
  for(const k in (def.stats||{})){
    const s = def.stats[k];
    if(Array.isArray(s)){
      const q = inst.rolls[k] != null ? inst.rolls[k] : 0.5;
      let v = s[0] + q*(s[1]-s[0]);
      /* element points are a currency; they are never fractional */
      if(k.startsWith("elem.")) v = Math.round(v);
      else v = (Math.abs(s[1]-s[0])<3 && Math.abs(s[1])<12) ? Math.round(v*10)/10 : Math.round(v);
      out[k] = v;
    } else out[k] = s;
  }
  if(def.dmgBase){
    const bb = {};
    for(const b in def.dmgBase){
      const s = def.dmgBase[b], q = inst.rolls["dmgBase."+b] != null ? inst.rolls["dmgBase."+b] : 0.5;
      bb[b] = Math.round(s[0] + q*(s[1]-s[0]));
    }
    out.dmgBase = bb;
  }
  return out;
}
function statQuality(key, range, value){
  if(!Array.isArray(range) || range[1]===range[0]) return 1;
  let q = (value - range[0])/(range[1]-range[0]);
  if(LOWER_BETTER[key]) q = 1-q;
  return clamp(q,0,1);
}
function itemQuality(inst){
  const def = ITEMS[inst.def]; let n=0, s=0;
  for(const k in (def.stats||{})){
    const r = def.stats[k]; if(!Array.isArray(r)) continue;
    const q = inst.rolls[k] != null ? inst.rolls[k] : 0.5;
    s += LOWER_BETTER[k] ? 1-q : q; n++;
  }
  if(def.dmgBase) for(const b in def.dmgBase){ s += inst.rolls["dmgBase."+b] != null ? inst.rolls["dmgBase."+b] : 0.5; n++; }
  return n ? s/n : 1;
}

/* ================================================================
   SKILL TREES
   A real graph: gated branches, parents that must be taken, and
   keystones that lock each other out. Committing to one archetype
   has to visibly cost you another one.
   ================================================================ */
const TREES = {};
function n(id,name,type,cost,x,y,parents,stats,text,extra){
  const o = {id,name,type,cost,x,y,req:parents?parents.split(" "):[],stats:stats||{},text:text||""};
  if(extra) Object.assign(o,extra);
  return o;
}
function mkTree(cls, title, subtitle, list){
  const byId = {}; for(const nd of list) byId[nd.id]=nd;
  const kids = {}; for(const nd of list) for(const p of nd.req){ (kids[p]||(kids[p]=[])).push(nd.id); }
  const edges = [];
  for(const nd of list) for(const p of nd.req) if(byId[p]) edges.push([p,nd.id]);
  let minX=99,maxX=-99,minY=99,maxY=-99;
  for(const nd of list){ minX=Math.min(minX,nd.x); maxX=Math.max(maxX,nd.x); minY=Math.min(minY,nd.y); maxY=Math.max(maxY,nd.y); }
  TREES[cls] = {cls, title, subtitle, list, byId, kids, edges, bounds:{minX,maxX,minY,maxY},
                keystones:list.filter(x=>x.type==="key").length};
  return TREES[cls];
}

/* ================================================================
   ALLOCATION RULES
   ================================================================ */
function elemBudget(level){ return 10 + 7*(level-1); }
function treeBudget(level){ return 3 + 3*(level-1); }
function elemSpent(state){ let s=0; for(const e of ELEMS) s += state.alloc[e]||0; return s; }
function treeSpent(state){ const t=TREES[state.cls]; let s=0; for(const id of state.tree){ const n=t.byId[id]; if(n) s+=n.cost; } return s; }
function treeLeft(state){ return treeBudget(state.level) - treeSpent(state); }

function isAlloc(state, id){ return state.tree.indexOf(id) >= 0; }
function exclBlocked(state, node){
  if(!node.excl) return null;
  const t = TREES[state.cls];
  for(const id of state.tree){
    const o = t.byId[id];
    if(o && o.excl === node.excl && o.id !== node.id) return o;
  }
  return null;
}
function reachable(state, node){
  if(node.req.length === 0) return true;
  for(const p of node.req) if(isAlloc(state, p)) return true;
  return false;
}
function canAllocate(state, node){
  if(isAlloc(state,node.id)) return {ok:false, why:"Already allocated."};
  const blocked = exclBlocked(state, node);
  if(blocked) return {ok:false, why:"Locked out by "+blocked.name+". Keystones in the same tier exclude each other.", blocker:blocked};
  if(!reachable(state,node)) return {ok:false, why:"No allocated path leads here. Requires "+node.req.map(r=>TREES[state.cls].byId[r].name).join(" or ")+"."};
  if(node.cost > treeLeft(state)) return {ok:false, why:"Costs "+node.cost+" point"+(node.cost>1?"s":"")+", you have "+treeLeft(state)+" left."};
  return {ok:true};
}
function canDeallocate(state, node){
  if(!isAlloc(state,node.id)) return {ok:false, why:"Not allocated."};
  const t = TREES[state.cls];
  const remaining = state.tree.filter(id=>id!==node.id);
  const set = new Set(remaining);
  const seen = new Set();
  const stack = remaining.filter(id=>t.byId[id].req.length===0);
  for(const s of stack) seen.add(s);
  while(stack.length){
    const cur = stack.pop();
    for(const k of (t.kids[cur]||[])){
      if(set.has(k) && !seen.has(k)){ seen.add(k); stack.push(k); }
    }
  }
  if(seen.size !== remaining.length){
    const orphan = remaining.find(id=>!seen.has(id));
    return {ok:false, why:"Removing this would strand "+t.byId[orphan].name+" and "+(remaining.length-seen.size-1)+" other node(s)."};
  }
  return {ok:true};
}
/* a node the tree can never reach again given current exclusions */
function permaLocked(state, node){
  const t = TREES[state.cls];
  if(exclBlocked(state,node)) return true;
  if(node.req.length===0) return false;
  const seen = new Set(), stack=[node.id];
  while(stack.length){
    const cur = stack.pop();
    const nd = t.byId[cur];
    if(isAlloc(state,cur)) return false;
    if(!nd.req.length) return false;
    let anyOpen = false;
    for(const p of nd.req){
      if(seen.has(p)) continue;
      const pn = t.byId[p]; if(!pn) continue;
      if(isAlloc(state,p)) return false;
      if(exclBlocked(state,pn)) continue;
      seen.add(p); stack.push(p); anyOpen = true;
    }
    if(!anyOpen && !stack.length) return true;
  }
  return true;
}

/* ================================================================
   RUN STATE
   ================================================================ */
function newState(cls){
  const s = {cls, level:1, alloc:{}, tree:[], equipped:{}, inv:[], cleared:{}, salvaged:{}, seen:{}, best:{}};
  for(const e of ELEMS) s.alloc[e]=0;
  const start = {warden:"w_wd1", skyward:"w_ac1", ember:"w_tc1", thornbound:"w_sh1"}[cls];
  for(const id of [start,"h_hodmask","c_padded","l_roughspun","b_hobnail","r_tin","a_cord"]){
    const inst = rollItem(id); s.inv.push(inst);
  }
  autoEquipStarters(s);
  return s;
}
function autoEquipStarters(s){
  for(const inst of s.inv){
    const def = ITEMS[inst.def];
    const slot = def.slot==="ring" ? (s.equipped.ring1?"ring2":"ring1") : def.slot;
    if(!s.equipped[slot]) s.equipped[slot] = inst;
  }
}
const DROP_TABLE = Object.values(ITEMS);
function rarityWeight(r, lvl){
  switch(r){
    case "common":    return Math.max(0.5, 9 - lvl*1.1);
    case "uncommon":  return Math.max(1, 8 - lvl*0.45);
    case "rare":      return 3 + lvl*0.55;
    case "legendary": return Math.max(0, (lvl-3))*0.85;
    case "fabled":    return Math.max(0, (lvl-6))*0.75;
    case "mythic":    return Math.max(0, (lvl-9))*0.55;
  }
  return 1;
}
function rollDrops(state, lvl, count){
  const pool = DROP_TABLE.filter(d=>{
    if(d.lvl > lvl+1) return false;
    if(d.cls && d.cls !== state.cls) return false;
    return true;
  });
  const out = [], used = new Set();
  /* Pity rules. A theorycrafting game is only interesting if the inputs
     keep arriving, so the drop table is not allowed to stall a run:
     one drop is always current-tier, and a weapon upgrade cannot be
     more than three trials away. */
  if(count > 1){
    const tier = pool.filter(d=>d.lvl >= lvl-2 && d.slot !== "weapon");
    if(tier.length){
      const pick = tier[Math.floor(RNG()*tier.length)];
      used.add(pick.id); out.push(rollItem(pick.id)); count--;
    }
  }
  const ownedW = new Set(state.inv.filter(i=>ITEMS[i.def].slot==="weapon").map(i=>i.def));
  const wUp = pool.filter(d=>d.slot==="weapon" && !ownedW.has(d.id) && d.lvl >= lvl-3);
  if(count > 0 && wUp.length && (state.wpnPity||0) >= 2){
    const pick = wUp[Math.floor(RNG()*wUp.length)];
    used.add(pick.id); out.push(rollItem(pick.id)); count--; state.wpnPity = 0;
  } else state.wpnPity = (state.wpnPity||0) + 1;
  for(let i=0;i<count;i++){
    let tot = 0; const w = [];
    for(const d of pool){
      if(used.has(d.id)) { w.push(0); continue; }
      let x = rarityWeight(d.rarity, lvl) * (1 + Math.max(0, 1 - Math.abs(d.lvl - lvl)/5));
      if(d.slot==="weapon") x *= 1.35;
      if(d.slot==="ring") x *= 0.8;
      w.push(x); tot += x;
    }
    if(tot<=0) break;
    let r = RNG()*tot, k = 0;
    for(;k<pool.length;k++){ r -= w[k]; if(r<=0) break; }
    const pick = pool[Math.min(k,pool.length-1)];
    used.add(pick.id);
    out.push(rollItem(pick.id));
  }
  return out;
}
/* ==ENGINE-END== */

const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function sign(n, dp){ const v=(dp!=null? n.toFixed(dp) : fmt(n)); return (n>0?"+":(n<0?"−":""))+String(v).replace("-",""); }
function pcls(n){ return n>0.0001?"pos":(n<-0.0001?"neg":"zero"); }

let S = null, CTX = null, HL = null, PREV_HL = null;
const SAVE_KEY = "solver.run.v1";

function cloneState(s){
  return {cls:s.cls, level:s.level, alloc:Object.assign({},s.alloc), tree:s.tree.slice(),
          equipped:Object.assign({},s.equipped), inv:s.inv, cleared:s.cleared, salvaged:s.salvaged,
          best:s.best, wpnPity:s.wpnPity};
}
function save(){
  try{
    const eq = {}; for(const k in S.equipped) if(S.equipped[k]) eq[k]=S.equipped[k].uid;
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      cls:S.cls, level:S.level, alloc:S.alloc, tree:S.tree, inv:S.inv, eq,
      cleared:S.cleared, salvaged:S.salvaged, best:S.best, wpnPity:S.wpnPity, uid:UID
    }));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !CLASSES[d.cls]) return null;
    const s = {cls:d.cls, level:d.level||1, alloc:d.alloc||{}, tree:d.tree||[], inv:d.inv||[],
               equipped:{}, cleared:d.cleared||{}, salvaged:d.salvaged||{}, best:d.best||{}, wpnPity:d.wpnPity||0};
    for(const e of ELEMS) if(s.alloc[e]==null) s.alloc[e]=0;
    const byUid = {}; for(const i of s.inv) byUid[i.uid]=i;
    for(const k in (d.eq||{})) if(byUid[d.eq[k]]) s.equipped[k]=byUid[d.eq[k]];
    UID = Math.max(UID, d.uid||1);
    return s;
  }catch(e){ return null; }
}
