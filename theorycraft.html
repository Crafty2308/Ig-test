const STAT_SIMPLE = {
  hp:["Health",0,1], hpPct:["Health","%",1], hpRegen:["Health regen","/s",1],
  mana:["Mana",0,1], manaPct:["Mana","%",1], manaRegen:["Mana regen","/s",1], manaRegenPct:["Mana regen","%",1],
  manaSteal:["Mana on strike",0,1], lifesteal:["Health on strike",0,1], spellLeech:["Health on cast",0,1],
  crit:["Critical chance","%",1], critMult:["Critical damage","%",1],
  dodge:["Dodge","%",1], thorns:["Thorns","%",1], armor:["Damage reduction","%",1],
  execute:["Execute damage","%",1], shield:["Shield","%",1],
  speed:["Attack speed","%",1], cast:["Cast speed","%",1],
  "cost.all":["Spell cost","%",-1], dmgTaken:["Damage taken","%",-1],
  "dmg.all":["Damage","%",1], "dmg.spell":["Spell damage","%",1], "dmg.strike":["Strike damage","%",1],
  "dmg.aoe":["Area damage","%",1], "dmg.neutral":["Neutral damage","%",1],
  "mult.all":["Damage multiplier","x%",1], "mult.spell":["Spell multiplier","x%",1],
  "mult.strike":["Strike multiplier","x%",1], "mult.aoe":["Area multiplier","x%",1],
  "flat.neutral":["Flat neutral damage",0,1],
  "res.all":["All defences",0,1],
  critHalve:["Critical chance halved",0,-1], noDodge:["Cannot dodge",0,-1], noHeal:["Cannot be healed",0,-1]
};
function statMeta(key){
  if(STAT_SIMPLE[key]) return {label:STAT_SIMPLE[key][0], unit:STAT_SIMPLE[key][1], good:STAT_SIMPLE[key][2], el:null};
  let m;
  if((m=key.match(/^dmg\.(\w+)$/)) && EL[m[1]]) return {label:EL[m[1]].name+" damage", unit:"%", good:1, el:m[1]};
  if((m=key.match(/^mult\.(\w+)$/)) && EL[m[1]]) return {label:EL[m[1]].name+" multiplier", unit:"x%", good:1, el:m[1]};
  if((m=key.match(/^flat\.(\w+)$/)) && EL[m[1]]) return {label:"Flat "+EL[m[1]].name+" damage", unit:0, good:1, el:m[1]};
  if((m=key.match(/^res\.(\w+)$/)) && EL[m[1]]) return {label:EL[m[1]].name+" defence", unit:0, good:1, el:m[1]};
  if((m=key.match(/^elem\.(\w+)$/)) && EL[m[1]]) return {label:EL[m[1]].name+" points", unit:0, good:1, el:m[1]};
  if((m=key.match(/^conv\.(\w+)\.(\w+)$/))) return {label:"Convert "+(EL[m[1]]?EL[m[1]].name:m[1])+" → "+(EL[m[2]]?EL[m[2]].name:m[2]), unit:"%", good:1, el:m[2]};
  if((m=key.match(/^dmg\.s:(\w+)$/))) return {label:spellName(m[1])+" damage", unit:"%", good:1, el:null};
  if((m=key.match(/^mult\.s:(\w+)$/))) return {label:spellName(m[1])+" multiplier", unit:"x%", good:1, el:null};
  if((m=key.match(/^cost\.s:(\w+)$/))) return {label:spellName(m[1])+" cost", unit:"%", good:-1, el:null};
  if((m=key.match(/^base\.(\w+)$/))) return {label:(EL[m[1]]?EL[m[1]].name:m[1])+" weapon damage", unit:0, good:1, el:m[1]};
  if(key.startsWith("major.")) return {label:(MAJORS[key.slice(6)]||{}).name||key.slice(6), unit:0, good:1, el:null};
  return {label:key, unit:0, good:1, el:null};
}
const SPELLNAMES = {};
function spellName(id){
  if(SPELLNAMES[id]) return SPELLNAMES[id];
  if(id==="strike") return "Basic attack";
  for(const c in CLASSES) for(const s of CLASSES[c].spells) if(s.id===id) return s.name;
  for(const c in TREES) for(const n of TREES[c].list){
    if(n.addSpell && n.addSpell.id===id) return n.addSpell.name;
    if(n.replaceSpell && (n.replaceSpell[1].id===id || n.replaceSpell[0]===id)) return n.replaceSpell[1].name;
  }
  return id;
}
function statValue(key, v){
  const m = statMeta(key);
  const r = Math.round(v*10)/10;
  if(m.unit==="%") return (r>0?"+":"")+r+"%";
  if(m.unit==="x%") return "×"+(1+r/100).toFixed(2);
  if(m.unit==="/s") return (r>0?"+":"")+r+"/s";
  return (r>0?"+":"")+r;
}
function statSpan(key, v){
  const m = statMeta(key);
  const good = (m.good>0 ? v>0 : v<0);
  const c = m.el ? "e-"+m.el : (good?"pos":"neg");
  return '<span class="num '+c+'">'+statValue(key,v)+'</span>';
}
function pipHtml(elem, n, kind){
  const c = "e-"+elem;
  return '<span class="pip '+c+' '+(kind||"")+'"><span class="g">'+EL[elem].letter+'</span>'+n+'</span>';
}


/* ---------------- what a spell does, in words ---------------- */
function fxSummary(sp){
  const fx = sp.fx || {}, out = [];
  if(fx.hits > 1) out.push({k:"hits ×"+fx.hits, c:"var(--gold)"});
  if(fx.aoe || fx.pull) out.push({k:fx.pull?"pulls everything in":"hits everything", c:"var(--gold)"});
  else if(fx.pierce) out.push({k:"pierces "+fx.pierce, c:"var(--gold)"});
  if(fx.chain) out.push({k:"chains "+fx.chain, c:"var(--gold)"});
  if(fx.addValue != null && fx.addValue > 0.4) out.push({k:"full damage to extra targets", c:"var(--gold)"});

  if(fx.summon && fx.summon.explode) out.push({k:"they detonate", c:"#ff7a5c"});
  if(fx.freeze) out.push({k:"freezes "+fx.freeze.dur+"s", c:EL.frost.col});

  if(fx.detonate) out.push({k:"detonates stacks", c:EL.cinder.col});
  if(fx.mark) out.push({k:"marks +"+fx.mark.pct+"% · "+fx.mark.dur+"s", c:"#ffd24a"});
  if(fx.weaken) out.push({k:"weakens "+fx.weaken.pct+"%", c:"#9aa4b4"});
  if(fx.root) out.push({k:"roots "+fx.root.dur+"s", c:"#9aa4b4"});
  if(fx.guard) out.push({k:"blocks "+fx.guard.block+"%"+(fx.guard.counter?" · counters "+fx.guard.counter+"%":""), c:"#57b2ff"});

/* ---------------- recompute + render ---------------- */
let statFlash = {};
function recompute(flash){
  PREV_HL = HL;
  CTX = buildContext(S);
  HL = headline(CTX);
  if(flash && PREV_HL){
    statFlash = {dps:HL.dps-PREV_HL.dps, ehp:HL.ehp-PREV_HL.ehp, sus:HL.sustain-PREV_HL.sustain, burst:HL.burst-PREV_HL.burst};
  } else statFlash = {};
  renderHud();
  renderCurrent();
  save();
}
function renderHud(){
  $("#hudClass").textContent = CTX.cls.name;
  $("#hudLvl").textContent = "LVL "+S.level+" · "+CTX.cls.tagline;
  const bad = Object.entries(CTX.meets).filter(([k,v])=>!v.ok);
  const req = $("#hudReq");
  if(!CTX.weapon){ req.textContent="NO WEAPON"; req.className="hudpill alert"; }
  else if(bad.length){ req.textContent = bad.length+" UNMET"; req.className="hudpill alert"; }
  else { req.textContent="REQ OK"; req.className="hudpill"; }
  const tl = treeLeft(S), eb = elemBudget(S.level)-elemSpent(S);
  $("#hudSp").textContent = tl+" SP · "+eb+" EP";
  $("#hudSp").className = "hudpill"+((tl>0||eb>0)?" ":"");
  const vals = {dps:HL.dps, ehp:HL.ehp, sus:HL.sustain, burst:HL.burst};
  for(const t of $$("#hudStats .hs")){
    const k = t.dataset.stat;
    t.querySelector(".v").textContent = HL.broken && k!=="ehp" ? "—" : fmt(vals[k]);
    const d = statFlash[k];
    t.classList.remove("fu","fd");
    if(d && Math.abs(d) > Math.max(0.05, Math.abs(vals[k])*0.002)){
      t.querySelector(".d").textContent = sign(d);
      t.querySelector(".d").className = "d num "+pcls(d);
      void t.offsetWidth; t.classList.add(d>0?"fu":"fd");
    } else t.querySelector(".d").textContent = "";

/* ---------------- diff engine ---------------- */
function diffOf(a, b){
  const ca = buildContext(a), cb = buildContext(b);
  const ha = headline(ca), hb = headline(cb);
  const keys = new Set([...Object.keys(ca.agg.total), ...Object.keys(cb.agg.total)]);
  const rows = [];
  for(const k of keys){
    const va = ca.agg.total[k]||0, vb = cb.agg.total[k]||0;
    if(Math.abs(vb-va) < 1e-9) continue;
    rows.push({key:k, from:va, to:vb, delta:vb-va, meta:statMeta(k)});
  }
  rows.sort((x,y)=> Math.abs(y.delta)*(y.meta.unit?1:0.6) - Math.abs(x.delta)*(x.meta.unit?1:0.6));
  return {rows, a:ha, b:hb, ca, cb,
    head:{dps:hb.dps-ha.dps, ehp:hb.ehp-ha.ehp, sustain:hb.sustain-ha.sustain, burst:hb.burst-ha.burst},
    reqBroke: Object.entries(cb.meets).filter(([k,v])=>!v.ok).map(([k])=>k),
    reqFixed: Object.entries(ca.meets).filter(([k,v])=>!v.ok && cb.meets[k] && cb.meets[k].ok).map(([k])=>k)
  };
}
function diffHeadHtml(d){
  const cell = (k,label,val,cur)=>{
    const c = pcls(val);
    return '<div class="dh"><div class="k">'+label+'</div><div class="v num '+c+'">'+(Math.abs(val)<0.005?"—":sign(val))+
           '</div><div class="s num">'+fmt(cur)+'</div></div>';
  };
  return '<div class="diffhead d4">'+
    cell("dps","Δ DPS", d.head.dps, d.b.dps)+
    cell("ehp","Δ EHP", d.head.ehp, d.b.ehp)+
    cell("sus","Δ Sustain", d.head.sustain, d.b.sustain)+
    cell("burst","Δ Burst", d.head.burst, d.b.burst)+
  '</div>';
}
function diffRowsHtml(d, limit){
  let h = '<div class="stab">';
  const rows = limit? d.rows.slice(0,limit) : d.rows;
  for(const r of rows){
    if(r.key.startsWith("major.")){
      h += '<div class="srow"><div class="k">Major ID</div><div class="v '+(r.delta>0?"pos":"neg")+'">'+
           (r.delta>0?"gain ":"lose ")+esc(r.meta.label)+'</div></div>';
      continue;
    }
    const good = (r.meta.good>0 ? r.delta>0 : r.delta<0);
    h += '<div class="srow"><div class="k">'+esc(r.meta.label)+'</div>'+
         '<div class="v num '+(r.meta.el?("e-"+r.meta.el):"")+'">'+statValue(r.key,r.from)+' → '+statValue(r.key,r.to)+'</div>'+
         '<div class="dlt num '+(good?"pos":"neg")+'">'+statValue(r.key, r.delta)+'</div></div>';
  }
  if(!d.rows.length) h += '<div class="empty">Nothing moves.</div>';
  h += '</div>';
  return h;
}

/* ---------------- sheet ---------------- */
let sheetStack = [];
function openSheet(spec){
  sheetStack.push(spec);
  drawSheet();
}
function drawSheet(){
  const spec = sheetStack[sheetStack.length-1];
  if(!spec){ closeSheet(true); return; }
  $("#sheetHead").innerHTML = spec.head || "";
  $("#sheetBody").innerHTML = spec.body || "";
  $("#sheetBody").scrollTop = 0;
  const f = $("#sheetFoot"); f.innerHTML = "";
  for(const b of (spec.buttons||[])){
    const btn = el("button", "btn "+(b.cls||""), b.label);
    if(b.disabled) btn.classList.add("off");
    btn.onclick = ()=>{ if(!b.disabled) b.action(); };
    f.appendChild(btn);
  }
  if(spec.onDraw) spec.onDraw($("#sheetBody"));
  $("#sheet").classList.add("on");
  $("#scrim").classList.add("on");
  $("#scrim").dataset.locked = spec.locked ? "1" : "";
}
function popSheet(){ sheetStack.pop(); if(sheetStack.length) drawSheet(); else closeSheet(true); }
function closeSheet(force){
  const spec = sheetStack[sheetStack.length-1];
  if(spec && spec.locked && !force) return;
  sheetStack = [];
  $("#sheet").classList.remove("on");
  $("#scrim").classList.remove("on");
}
$("#scrim").addEventListener("click", ()=>closeSheet(false));
/* the sheet can cover most of the screen, so it also closes from its own
   handle, and by being dragged down */
(function(){
  const grab = $("#sheetGrab"), sheet = $("#sheet");
  let y0=null, dy=0;
  grab.addEventListener("click", ()=>{ if(!dragged) closeSheet(false); });
  let dragged=false;
  const down=e=>{ const t=e.touches?e.touches[0]:e; y0=t.clientY; dy=0; dragged=false;
                  sheet.style.transition="none"; };
  const move=e=>{ if(y0==null) return; const t=e.touches?e.touches[0]:e;
                  dy=Math.max(0, t.clientY-y0); if(dy>6) dragged=true;
                  sheet.style.transform="translateY("+dy+"px)";
                  if(window.innerWidth>=720) sheet.style.transform="translate(-50%,"+dy+"px)"; };
  const up=()=>{ if(y0==null) return; y0=null;
                 sheet.style.transition=""; sheet.style.transform="";
                 if(dy>90) closeSheet(false);
                 setTimeout(()=>{dragged=false;},0); };
  grab.addEventListener("touchstart", down, {passive:true});
  grab.addEventListener("touchmove", move, {passive:true});
  grab.addEventListener("touchend", up);
  grab.addEventListener("mousedown", down);
  window.addEventListener("mousemove", e=>{ if(y0!=null) move(e); });
  window.addEventListener("mouseup", up);
})();

function ownedFor(slotId){
  const type = slotId.startsWith("ring") ? "ring" : slotId;
  return S.inv.filter(i=>{
    const d = ITEMS[i.def];
    if(d.slot !== type) return false;
    if(d.cls && d.cls !== S.cls) return false;

  });

/* press-and-hold repeat, accelerating — 108 points is too many to tap one at a time */
function bindRepeat(btn, fn){
  let t1=null, t2=null, n=0;
  const stop = ()=>{ clearTimeout(t1); clearInterval(t2); t1=t2=null; n=0; };
  const start = (ev)=>{
    ev.preventDefault();
    if(fn()===false) return;
    t1 = setTimeout(()=>{
      t2 = setInterval(()=>{ n++; const step = n>24?5:(n>10?2:1);
        for(let i=0;i<step;i++) if(fn()===false){ stop(); return; } }, 70);
    }, 380);
  };
  btn.addEventListener("touchstart", start, {passive:false});
  btn.addEventListener("mousedown", start);
  for(const e of ["touchend","touchcancel","mouseup","mouseleave"]) btn.addEventListener(e, stop);
}

function openItem(inst, slotId){
  const def = ITEMS[inst.def];
  const targetSlot = slotId || (def.slot==="ring" ? (S.equipped.ring1 && S.equipped.ring1.uid===inst.uid ? "ring1" : (S.equipped.ring2 && S.equipped.ring2.uid===inst.uid ? "ring2" : "ring1")) : def.slot);
  const equippedHere = S.equipped[targetSlot] && S.equipped[targetSlot].uid === inst.uid;
  let body = "";
  if(!equippedHere){
    const s2 = cloneState(S); s2.equipped = Object.assign({}, S.equipped); s2.equipped[targetSlot] = inst;
    const d = diffOf(S, s2);
    body += diffHeadHtml(d);
    if(d.reqBroke.length) body += '<div class="note"><b class="neg">Equipping this makes '+d.reqBroke.length+
      ' item(s) inactive</b> — '+d.reqBroke.map(x=>esc(ITEMS[s2.equipped[x].def].name)).join(", ")+'. Spend element points or change something else.</div>';
    body += '<div class="sgrp">What moves if you equip this</div>' + diffRowsHtml(d);
  } else {
    const s2 = cloneState(S); s2.equipped = Object.assign({}, S.equipped); delete s2.equipped[targetSlot];
    const d = diffOf(S, s2);
    body += '<div class="note">Equipped. The numbers below are what you would <b>lose</b> by taking it off.</div>';
    body += diffHeadHtml(d);
  }
  body += itemStatsHtml(def, inst);
  const buttons = [{label:"Back", cls:"gho", action:popSheet}];
  if(!equippedHere){
    const slots = def.slot==="ring" ? ["ring1","ring2"] : [def.slot];
    for(const sl of slots) buttons.push({label:"Equip"+(slots.length>1?" "+SLOTS.find(x=>x.id===sl).name:""), cls:"pri", action:()=>{
      S.equipped[sl] = inst; closeSheet(true); recompute(true);
    }});
  } else {
    buttons.push({label:"Unequip", cls:"dan", action:()=>{ delete S.equipped[targetSlot]; closeSheet(true); recompute(true); }});
  }
  openSheet({head:itemHead(def,inst), body, buttons});
}
function openSlot(slotId){
  const slot = SLOTS.find(s=>s.id===slotId);
  const owned = ownedFor(slotId);
  const cur = S.equipped[slotId];
  const otherRing = slotId==="ring1"?"ring2":(slotId==="ring2"?"ring1":null);
  let body = "";
  if(!owned.length) body = '<div class="empty">You own nothing for this slot yet.</div>';
  else {
    const rows = [];
    for(const inst of owned){
      const def = ITEMS[inst.def];
      const isCur = cur && cur.uid===inst.uid;
      const inOther = otherRing && S.equipped[otherRing] && S.equipped[otherRing].uid===inst.uid;
      const s2 = cloneState(S); s2.equipped = Object.assign({}, S.equipped); s2.equipped[slotId] = inst;
      if(inOther) delete s2.equipped[otherRing];
      const cb = buildContext(s2), hb = headline(cb);
      rows.push({inst, def, isCur, inOther, dps:hb.dps-HL.dps, ehp:hb.ehp-HL.ehp,
                 broken:Object.values(cb.meets).filter(m=>!m.ok).length});
    }
    rows.sort((a,b)=> (b.isCur?1e9:0)-(a.isCur?1e9:0) || b.dps-a.dps);
    body = '<div class="stab">';
    for(const r of rows){
      const q = itemQuality(r.inst);
      body += '<button class="slot" data-uid="'+r.inst.uid+'" style="width:100%;text-align:left;grid-template-columns:1fr auto auto">'+
        '<span class="body"><div class="iname '+RARITY[r.def.rarity].cls+'">'+esc(r.def.name)+
          (r.isCur?' <span class="tag">equipped</span>':'')+(r.inOther?' <span class="tag">in '+SLOTS.find(x=>x.id===otherRing).name+'</span>':'')+'</div>'+
        '<div class="line2"><span class="rollchip '+(q>=0.75?"hi":(q<=0.35?"lo":""))+'">'+Math.round(q*100)+'%</span>'+
        Object.keys(r.def.req||{}).map(e=>pipHtml(e, r.def.req[e], (CTX.pool[e]||0)-(rolledValues(r.inst)["elem."+e]||0) < r.def.req[e] ? "unmet":"")).join("")+
        (r.def.major?'<span class="tag ab">'+esc(MAJORS[r.def.major].name)+'</span>':'')+
        (r.broken?'<span class="tag" style="border-color:#6d2a23;color:#ff8d82">breaks '+r.broken+'</span>':'')+'</div></span>'+
        '<span style="padding:0 8px;text-align:right">'+
          '<div class="num '+pcls(r.isCur?0:r.dps)+'" style="font-size:13px;font-weight:700">'+(r.isCur?"—":sign(r.dps))+'</div>'+
          '<div class="num" style="font-size:9px;color:var(--tx3)">DPS</div></span>'+
        '<span style="padding:0 10px 0 4px;text-align:right">'+
          '<div class="num '+pcls(r.isCur?0:r.ehp)+'" style="font-size:13px;font-weight:700">'+(r.isCur?"—":sign(r.ehp))+'</div>'+
          '<div class="num" style="font-size:9px;color:var(--tx3)">EHP</div></span>'+
      '</button>';
    }
    body += '</div>';
  }
  const buttons = [{label:"Close", cls:"gho", action:()=>closeSheet(true)}];
  if(cur) buttons.push({label:"Unequip", cls:"dan", action:()=>{ delete S.equipped[slotId]; closeSheet(true); recompute(true); }});
  openSheet({
    head:'<div class="sh-title">'+slot.name+'</div><div class="sh-sub">'+owned.length+' owned · sorted by damage change</div>',
    body, buttons,
    onDraw:(root)=>{ root.querySelectorAll("[data-uid]").forEach(b=>b.onclick=()=>{
      const inst = S.inv.find(i=>i.uid===b.dataset.uid); if(inst) openItem(inst, slotId);
    }); }
  });
}
function openStash(){
  const groups = {};
  for(const i of S.inv){
    const d = ITEMS[i.def];
    if(d.cls && d.cls!==S.cls) continue;
    (groups[d.slot] || (groups[d.slot]=[])).push(i);
  }
  let body = "";
  const order = ["weapon","helm","chest","legs","boots","ring","amulet"];
  for(const g of order){
    if(!groups[g]) continue;
    groups[g].sort((a,b)=>ITEMS[b.def].lvl-ITEMS[a.def].lvl || RARITY[ITEMS[b.def].rarity].rank-RARITY[ITEMS[a.def].rarity].rank);
    body += '<div class="sgrp">'+(g==="ring"?"Rings":(SLOTS.find(s=>s.id===g)||{name:g}).name)+' · '+groups[g].length+'</div><div class="stab">';
    for(const i of groups[g]){
      const d = ITEMS[i.def], q = itemQuality(i);
      const eq = Object.keys(S.equipped).find(k=>S.equipped[k] && S.equipped[k].uid===i.uid);
      body += '<button class="srow" data-uid="'+i.uid+'" style="width:100%;text-align:left">'+
        '<span class="k '+RARITY[d.rarity].cls+'" style="font-weight:600;font-size:13px">'+esc(d.name)+
        (eq?' <span class="tag">'+SLOTS.find(s=>s.id===eq).name+'</span>':'')+'</span>'+
        '<span class="rollchip '+(q>=0.75?"hi":(q<=0.35?"lo":""))+'">'+Math.round(q*100)+'%</span>'+
        '<span class="trace">›</span></button>';
    }
    body += '</div>';
  }
  openSheet({head:'<div class="sh-title">Stash</div><div class="sh-sub">'+S.inv.length+' items held</div>',
    body: body||'<div class="empty">Nothing yet.</div>',
    buttons:[{label:"Close", cls:"gho", action:()=>closeSheet(true)}],
    onDraw:(root)=>{ root.querySelectorAll("[data-uid]").forEach(b=>b.onclick=()=>{
      const inst = S.inv.find(x=>x.uid===b.dataset.uid); if(inst) openItem(inst);
    }); }});
}

/* ================================================================
   ATTRIBUTION — "where did this number come from?"
   ================================================================ */
function barRow(label, sub, amount, pct, col){
  return '<div class="abar"><div class="top"><span class="n">'+esc(label)+'</span>'+
    '<span class="p num">'+(pct!=null? Math.round(pct*100)+"%" : "")+'</span>'+
    '<span class="a num '+pcls(amount)+'">'+sign(amount)+'</span></div>'+
    '<div class="bar"><i style="width:'+Math.min(100,Math.abs(pct||0)*100).toFixed(1)+'%;background:'+(col||(amount>=0?"#54d391":"#ff6257"))+'"></i></div>'+
    (sub?'<div class="src">'+esc(sub)+'</div>':'')+'</div>';
}
const KIND_COL = {item:"#57b2ff", node:"#c88bff", elem:"#e8bd63", class:"#6b7486", major:"#ff7a5c"};
function openStat(which){
  if(which==="dps") return openDpsAttribution();
  if(which==="ehp") return openEhpBreakdown();
  if(which==="sus") return openSustain();
  if(which==="burst") return openBurst();
}
function openDpsAttribution(){
  if(HL.broken) return openSheet({head:'<div class="sh-title">DPS</div>',
    body:'<div class="note">No damage can be computed: '+(CTX.equipped.some(i=>i.slot==="weapon")
      ? 'your weapon is inactive because its element requirements are unmet. Everything it provides, including its base damage, is switched off.'
      : 'you have no weapon equipped.')+'</div>',
    buttons:[{label:"Close",cls:"gho",action:()=>closeSheet(true)}]});
  const at = attributeBySource(S, HL.dps);
  const maxAbs = Math.max(...at.rows.map(r=>Math.abs(r.delta)), 1);
  let body = '<div class="note">Each bar is a <b>marginal contribution</b>: remove exactly that one thing and rebuild the whole pipeline, and this is how much sustained DPS disappears. They do not sum to the total, because damage is multiplicative — that is the point.</div>';
  body += '<div class="sgrp">Sources · '+fmt(HL.dps)+' DPS total</div>';
  for(const r of at.rows.slice(0,26)){
    body += '<button style="display:block;width:100%;text-align:left" data-src="'+r.kind+"|"+r.id+'">'+
      barRow(r.label, r.parts.length+" stat"+(r.parts.length>1?"s":"")+" · "+r.kind, r.delta, Math.abs(r.delta)/maxAbs, KIND_COL[r.kind])+'</button>';
  }
  if(!at.rows.length) body += '<div class="empty">Nothing in this build is contributing damage.</div>';
  openSheet({
    head:'<div class="sh-title">Damage attribution</div><div class="sh-sub">'+fmt(HL.dps)+' sustained DPS · ranked by marginal loss</div>',
    body,
    buttons:[{label:"All stats", cls:"gho", action:openAllStats},{label:"Close", cls:"gho", action:()=>closeSheet(true)}],
    onDraw:(root)=>{ root.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{
      const [kind,id] = b.dataset.src.split("|");
      const row = at.rows.find(r=>r.kind===kind && r.id===id);
      if(row) openSourceDetail(row);
    }); }
  });
}
function openSourceDetail(row){
  const maxAbs = Math.max(...row.parts.map(p=>Math.abs(p.delta)), 1);
  let body = '<div class="note">Every stat on this source, and what each one is individually worth to your sustained DPS.</div>';
  for(const p of row.parts){
    const m = statMeta(p.stat);
    body += barRow(m.label+"  "+statValue(p.stat, p.value), p.stat, p.delta, Math.abs(p.delta)/maxAbs, m.el? EL[m.el].col : KIND_COL[row.kind]);
  }
  openSheet({head:'<div class="sh-title">'+esc(row.label)+'</div><div class="sh-sub">'+sign(row.delta)+' DPS in total</div>',
    body, buttons:[{label:"Back", cls:"gho", action:popSheet}]});
}
function openEhpBreakdown(){
  const A = CTX.agg;
  let body = '<div class="note">Effective health is your health pool divided by how much of an even five-element attack actually reaches you. Tap a defence to see where it comes from.</div>';
  body += '<div class="kv"><span class="k">Health pool</span><span class="v num">'+fmt(CTX.maxHp)+'</span></div>';
  body += '<div class="kv"><span class="k">Dodge</span><span class="v num '+(CTX.dodge?"pos":"zero")+'">'+CTX.dodge.toFixed(1)+'%'+(g(A,"noDodge")>0?" (disabled)":"")+'</span></div>';
  body += '<div class="kv"><span class="k">Flat damage reduction</span><span class="v num '+pcls(g(A,"armor"))+'">'+g(A,"armor").toFixed(0)+'%</span></div>';
  if(g(A,"dmgTaken")) body += '<div class="kv"><span class="k">Damage taken modifier</span><span class="v num '+pcls(-g(A,"dmgTaken"))+'">'+sign(g(A,"dmgTaken"),0)+'%</span></div>';
  body += '<div class="sgrp">Per element · how much of 100 damage lands</div><div class="stab">';
  for(const b of ALLBUCKETS){
    const inc = playerIncoming(CTX, {[b]:100});
    const r = g(A,"res."+b)+g(A,"res.all");
    body += '<button class="srow" data-res="res.'+b+'" style="width:100%;text-align:left"><span class="k e-'+b+'">'+EL[b].name+'</span>'+
      '<span class="v num '+(r>0?"pos":(r<0?"neg":"zero"))+'">'+(r>0?"+":"")+r.toFixed(0)+'%</span>'+
      '<span class="dlt num">'+inc.total.toFixed(0)+' lands</span><span class="trace">›</span></button>';
  }
  body += '</div>';
  body += '<div class="sgrp">Effective health against a single element</div><div class="stab">';
  for(const b of ALLBUCKETS){
    const e = effectiveHp(CTX, {[b]:100});
    body += '<div class="srow"><span class="k e-'+b+'">'+EL[b].name+' only</span><span class="v num">'+fmt(e)+'</span></div>';
  }
  body += '</div>';
  openSheet({head:'<div class="sh-title">Effective health</div><div class="sh-sub">'+fmt(HL.ehp)+' against an even spread</div>',
    body, buttons:[{label:"All stats", cls:"gho", action:openAllStats},{label:"Close", cls:"gho", action:()=>closeSheet(true)}],
    onDraw:(root)=>{ root.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>openStatSources(b.dataset.res)); }});
}
function openSustain(){
  const A = CTX.agg;
  const st = strikeDef(CTX);
  let body = '<div class="note">Sustain is health you get back while fighting. It competes directly with damage for the same gear slots.</div><div class="stab">';
  const rows = [["hpRegen","Health regeneration", g(A,"hpRegen")+"/s"],
                ["lifesteal","Health per basic attack", g(A,"lifesteal")+" ("+(g(A,"lifesteal")/st.time).toFixed(1)+"/s at full uptime)"],
                ["spellLeech","Health per spell cast", g(A,"spellLeech")]];
  for(const [k,label,v] of rows)
    body += '<button class="srow" data-k="'+k+'" style="width:100%;text-align:left"><span class="k">'+label+'</span><span class="v num '+pcls(g(A,k))+'">'+v+'</span><span class="trace">›</span></button>';
  body += '</div>';
  const heal = CTX.spells.filter(s=>s.util && s.util.heal);
  if(heal.length){
    body += '<div class="sgrp">From spells</div><div class="stab">';
    for(const s of heal) body += '<div class="srow"><span class="k">'+esc(s.name)+'</span><span class="v num pos">'+s.util.heal+'% max HP every '+(s.util.cd||s.util.dur)+'s</span></div>';
    body += '</div>';
  }
  if(CTX.flags.noHeal) body += '<div class="note"><b class="neg">Cauterize is active: none of this does anything.</b> You cannot be healed.</div>';
  if(CTX.flags.thirst) body += '<div class="note"><b>Thirst is active.</b> Spells are paid for in health at 1.5 per mana, so sustain is now your mana pool.</div>';
  openSheet({head:'<div class="sh-title">Sustain</div><div class="sh-sub">'+fmt(HL.sustain)+' effective health per second</div>',
    body, buttons:[{label:"Close", cls:"gho", action:()=>closeSheet(true)}],
    onDraw:(root)=>{ root.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>openStatSources(b.dataset.k)); }});
}
function openBurst(){
  const four = burstWindow(CTX, 4), ten = burstWindow(CTX, 10);
  let body = '<div class="note">Burst is what you can put out from a full mana bar in a fixed window. Ward trials check this number and nothing else.</div><div class="stab">';
  for(const w of [2,3,4,6,10]){
    const v = burstWindow(CTX, w);
    body += '<div class="srow"><span class="k">'+w+' second window</span><span class="v num">'+fmt(v)+'</span>'+
            '<span class="dlt num" style="color:var(--tx3)">'+fmt(v/w)+'/s</span></div>';
  }
  body += '</div>';
  body += '<div class="note">Sustained DPS is <b>'+fmt(HL.dps)+'</b>. Your 4-second burst runs at <b>'+fmt(four/4)+'/s</b>, '+
    (four/4 > HL.dps*1.12 ? 'which is '+((four/4)/HL.dps).toFixed(2)+'× your sustained rate — this build front-loads.'
     : 'which is roughly your sustained rate — this build has no burst window to speak of.')+'</div>';
  openSheet({head:'<div class="sh-title">Burst</div><div class="sh-sub">'+fmt(four)+' damage in four seconds</div>',
    body, buttons:[{label:"Close", cls:"gho", action:()=>closeSheet(true)}]});
}
function openAllStats(){
  const A = CTX.agg;
  const groups = [
    ["Offence", k=>k.startsWith("dmg.")||k.startsWith("mult.")||k.startsWith("flat.")||k==="crit"||k==="critMult"||k==="execute"],
    ["Conversion", k=>k.startsWith("conv.")],
    ["Defence", k=>k.startsWith("res.")||k==="hp"||k==="hpPct"||k==="dodge"||k==="armor"||k==="thorns"||k==="dmgTaken"||k==="shield"],
    ["Resource", k=>k.startsWith("mana")||k.startsWith("cost.")||k==="hpRegen"||k==="lifesteal"||k==="spellLeech"],
    ["Speed", k=>k==="cast"||k==="speed"],
    ["Element points", k=>k.startsWith("elem.")]
  ];
  const used = new Set();
  let body = '<div class="note">Every number in your build, and nothing that is not traceable to a source. Tap any row.</div>';
  for(const [name, test] of groups){
    const keys = Object.keys(A.total).filter(k=>!used.has(k) && test(k) && Math.abs(A.total[k])>1e-9);
    if(!keys.length) continue;
    keys.forEach(k=>used.add(k));
    keys.sort();
    body += '<div class="sgrp">'+name+'</div><div class="stab">';
    for(const k of keys){
      const m = statMeta(k), v = A.total[k];
      const good = m.good>0 ? v>0 : v<0;
      body += '<button class="srow" data-k="'+esc(k)+'" style="width:100%;text-align:left">'+
        '<span class="k">'+esc(m.label)+'</span>'+
        '<span class="v num '+(m.el?("e-"+m.el):(good?"pos":"neg"))+'">'+statValue(k,v)+'</span>'+
        '<span class="dlt num" style="color:var(--tx3)">'+(A.src[k]||[]).length+' src</span><span class="trace">›</span></button>';
    }
    body += '</div>';
  }
  openSheet({head:'<div class="sh-title">Every stat</div><div class="sh-sub">derived pools below are computed, not stored</div>',
    body: body + '<div class="sgrp">Derived</div><div class="stab">'+
      ['<div class="srow"><span class="k">Maximum health</span><span class="v num">'+fmt(CTX.maxHp)+'</span></div>',
       '<div class="srow"><span class="k">Maximum mana</span><span class="v num">'+fmt(CTX.maxMana)+'</span></div>',
       '<div class="srow"><span class="k">Mana regeneration</span><span class="v num">'+CTX.manaRegen.toFixed(1)+'/s</span></div>',
       '<div class="srow"><span class="k">Critical chance</span><span class="v num">'+CTX.critChance.toFixed(1)+'%</span></div>',
       '<div class="srow"><span class="k">Critical damage</span><span class="v num">×'+CTX.critMult.toFixed(2)+'</span></div>',
       '<div class="srow"><span class="k">Dodge</span><span class="v num">'+CTX.dodge.toFixed(1)+'%</span></div>'].join("")+'</div>',
    buttons:[{label:"Close", cls:"gho", action:()=>closeSheet(true)}],
    onDraw:(root)=>{ root.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>openStatSources(b.dataset.k)); }});
}
function openStatSources(key){
  const A = CTX.agg, m = statMeta(key);
  const src = (A.src[key]||[]).slice().sort((a,b)=>Math.abs(b.val)-Math.abs(a.val));
  const tot = A.total[key]||0;
  let body = '<div class="stab">';
  for(const s of src){
    body += '<div class="srow"><span class="k">'+esc(s.name)+' <span class="tag st">'+s.kind+'</span></span>'+
      '<span class="v num '+(m.el?("e-"+m.el):((m.good>0? s.val>0 : s.val<0)?"pos":"neg"))+'">'+statValue(key,s.val)+'</span></div>';
  }
  if(!src.length) body += '<div class="empty">Nothing contributes to this.</div>';
  body += '</div>';
  openSheet({head:'<div class="sh-title">'+esc(m.label)+'</div><div class="sh-sub">'+statValue(key,tot)+' from '+src.length+' source'+(src.length===1?"":"s")+'</div>',
    body, buttons:[{label:"Back", cls:"gho", action:popSheet}]});
}

/* ================================================================
   PIPELINE — showing that the order is what makes the number
   ================================================================ */
function openPipeline(spellId){
  const table = attackTable(CTX);
  const a = table.find(x=>x.sp.id===spellId);
  if(!a) return;
  const r = a.res;
  let body = '<div class="note">'+esc(a.sp.text||"")+'</div>';
  const fxs = fxSummary(a.sp);
  if(fxs.length) body += '<div class="combatbox"><div class="mt">What it does besides damage</div><div class="cb">'+
    fxs.map(x=>esc(x.k)).join(" · ")+'</div></div>';
  body += '<div class="diffhead">'+
    '<div class="dh"><div class="k">Per cast</div><div class="v num">'+fmt(r.effective)+'</div><div class="s num">average</div></div>'+
    '<div class="dh"><div class="k">Cost</div><div class="v num">'+Math.round(a.cost)+'</div><div class="s num">'+a.time.toFixed(2)+'s</div></div>'+
    '<div class="dh"><div class="k">Per second</div><div class="v num">'+fmt(r.effective/a.time)+'</div><div class="s num">if spammable</div></div></div>';
  body += '<div class="sgrp">The pipeline, in order</div>';
  for(let i=0;i<r.steps.length;i++){
    const st = r.steps[i];
    const tot = sumB(st.buckets);
    const prev = i>0 ? sumB(r.steps[i-1].buckets) : 0;
    const mult = i>0 && prev>0 ? tot/prev : null;
    body += '<div class="abar" style="border-bottom:1px solid var(--line2)">'+
      '<div class="top"><span class="n">'+(i+1)+'. '+esc(st.name)+(st.skip?' <span class="tag st">no effect</span>':'')+'</span>'+
      '<span class="p num">'+(mult!=null? "×"+mult.toFixed(3) : "")+'</span>'+
      '<span class="a num">'+fmt(tot)+'</span></div>';
    const mx = Math.max(...Object.values(st.buckets), 1);
    body += '<div style="display:flex;gap:2px;margin-top:5px;height:8px">';
    for(const b of ALLBUCKETS){
      const v = st.buckets[b]||0;
      body += '<div style="flex:'+Math.max(0.001,v)+';background:'+EL[b].col+';opacity:'+(v>0?1:0)+'"></div>';
    }
    body += '</div><div class="src">'+esc(st.note)+'</div>';
    if(st.conv) for(const c of st.conv)
      body += '<div class="src" style="color:var(--tx2)">'+Math.round(c.pct)+'% of '+(EL[c.from]?EL[c.from].name:c.from)+' → '+EL[c.to].name+' ('+fmt(c.amt)+')</div>';
    if(st.mults && st.mults.length) body += '<div class="src" style="color:var(--tx2)">'+st.mults.map(m=>m.label+" ×"+(1+m.v/100).toFixed(2)).join(" · ")+'</div>';
    body += '</div>';
  }
  body += '<div class="sgrp">Final damage by element</div><div class="stab">';
  const tot = sumB(r.buckets)||1;
  for(const b of ALLBUCKETS){
    const v = r.buckets[b]||0; if(v<=0.01) continue;
    body += '<div class="srow"><span class="k e-'+b+'">'+EL[b].name+'</span><span class="v num e-'+b+'">'+fmt(v)+'</span>'+
      '<span class="dlt num" style="color:var(--tx3)">'+Math.round(v/tot*100)+'%</span></div>';
  }
  body += '</div>';
  body += '<div class="note">Additive bonuses were summed to <b>'+Object.keys(r.addPct).filter(k=>r.addPct[k]).map(k=>EL[k].name+" +"+Math.round(r.addPct[k])+"%").join(", ")+
    '</b> and applied once. Multiplicative bonuses were applied one at a time, which is why two ×1.25 multipliers give ×1.5625 and not ×1.50.</div>';
  openSheet({head:'<div class="sh-title">'+esc(a.sp.name)+'</div><div class="sh-sub">'+(a.sp.kind==="strike"?"basic attack":"spell")+
    ' · '+Math.round((a.sp.mult||1)*100)+'% weapon multiplier · '+(a.sp.flatScale||0).toFixed(2)+'× flat scaling</div>',
    body, buttons:[{label:"Close", cls:"gho", action:()=>closeSheet(true)}]});
}

/* ================================================================
   TREE SCREEN
   Pans, pinch-zooms, and never asks for a precise tap: hit testing
   is done in screen space against the nearest node.
   ================================================================ */
const U = 64;                       // grid unit in px at scale 1
const VIEW = {tx:0, ty:0, k:0.55};
let treeBuiltFor = null, selectedNode = null;
const nodeEls = {}, edgeEls = [];

function nodeElement(nd){
  const s = document.createElementNS("http://www.w3.org/2000/svg","g");
  s.setAttribute("class","tnode");
  let shape;
  if(nd.type==="key"){
    shape = document.createElementNS("http://www.w3.org/2000/svg","rect");
    shape.setAttribute("x",-15); shape.setAttribute("y",-15);
    shape.setAttribute("width",30); shape.setAttribute("height",30);
    shape.setAttribute("transform","rotate(45)");
  } else if(nd.type==="mod"){
    shape = document.createElementNS("http://www.w3.org/2000/svg","rect");
    shape.setAttribute("x",-11); shape.setAttribute("y",-11);
    shape.setAttribute("width",22); shape.setAttribute("height",22);
  } else if(nd.type==="ability"){
    shape = document.createElementNS("http://www.w3.org/2000/svg","circle");
    shape.setAttribute("r",15);
  } else {
    shape = document.createElementNS("http://www.w3.org/2000/svg","circle");
    shape.setAttribute("r",10);
  }
  shape.setAttribute("class","tn");
  s.appendChild(shape);
  if(nd.type==="ability"){
    const inner = document.createElementNS("http://www.w3.org/2000/svg","circle");
    inner.setAttribute("r",6); inner.setAttribute("class","tn-inner");
    inner.setAttribute("fill","none"); inner.setAttribute("stroke-width",2);
    s.appendChild(inner);
  }
  const lab = document.createElementNS("http://www.w3.org/2000/svg","text");
  lab.setAttribute("class","tnlabel");
  lab.setAttribute("y", nd.type==="key"?32:(nd.type==="ability"?28:23));
  lab.textContent = nd.name;
  s.appendChild(lab);
  s.setAttribute("transform","translate("+(nd.x*U)+","+(nd.y*U)+")");
  return {g:s, shape, lab, inner:s.querySelector(".tn-inner")};
}
/* a node's colour is its dominant element — the same coding as everywhere
   else. Modifier nodes carry their meaning in fx, not in stats, so the
   element of a bleed, a zone or a conversion counts too. */
function nodeElem(nd){
  const tally = {};
  for(const k in nd.stats){
    const m = statMeta(k);
    if(m.el) tally[m.el] = (tally[m.el]||0) + Math.abs(nd.stats[k]);
  }
  const scanFx = fx=>{
    for(const key in fx){
      const v = fx[key];
      if(v && typeof v === "object" && v.elem && EL[v.elem]) tally[v.elem] = (tally[v.elem]||0) + 20;
    }
  };
  for(const sid in (nd.fxMod||{})) scanFx(nd.fxMod[sid]);
  if(nd.replaceSpell && nd.replaceSpell[1].fx) scanFx(nd.replaceSpell[1].fx);
  if(nd.addSpell && nd.addSpell.fx) scanFx(nd.addSpell.fx);
  let best=null, bv=0;
  for(const e in tally) if(tally[e]>bv){bv=tally[e]; best=e;}
  return best;
}
function buildTree(){
  const t = TREES[S.cls];
  const g = $("#treeG");
  g.innerHTML = ""; edgeEls.length = 0;
  for(const k in nodeEls) delete nodeEls[k];
  const eg = document.createElementNS("http://www.w3.org/2000/svg","g");
  g.appendChild(eg);
  for(const [a,b] of t.edges){
    const na = t.byId[a], nb = t.byId[b];
    const line = document.createElementNS("http://www.w3.org/2000/svg","path");
    const x1=na.x*U, y1=na.y*U, x2=nb.x*U, y2=nb.y*U;
    const my = (y1+y2)/2;
    line.setAttribute("d", "M"+x1+","+y1+" C"+x1+","+my+" "+x2+","+my+" "+x2+","+y2);
    line.setAttribute("class","tl");
    eg.appendChild(line);
    edgeEls.push({a, b, el:line});
  }
  for(const nd of t.list){
    const o = nodeElement(nd);
    g.appendChild(o.g);
    nodeEls[nd.id] = o;
  }
  treeBuiltFor = S.cls;
  fitTree();
}
function updateTree(){
  const t = TREES[S.cls];
  for(const nd of t.list){
    const o = nodeEls[nd.id]; if(!o) continue;
    const on = isAlloc(S, nd.id);
    const reach = !on && reachable(S, nd) && !exclBlocked(S, nd);
    const dead = !on && permaLocked(S, nd);
    const e = nodeElem(nd);
    const col = e ? EL[e].col : (nd.type==="key" ? "#e8bd63" : (nd.type==="stat" ? "#8894a8" : "#d6bd7e"));
    o.shape.setAttribute("class","tn"+(on?"":(dead?" locked":(reach?" reachable":" unreach"))));
    o.shape.setAttribute("stroke", col);
    o.shape.setAttribute("fill", on ? col : (reach ? "#141a24" : "#0c1016"));
    o.shape.setAttribute("fill-opacity", on ? 1 : 1);
    o.shape.setAttribute("stroke", on ? "#f2f6ff" : col);
    if(o.inner){ o.inner.setAttribute("stroke", on ? "#07090d" : col); }
    o.lab.setAttribute("class","tnlabel"+(on?" on":""));
    const showLabel = VIEW.k > 0.78 || nd.type==="key" || nd.type==="ability" || on;
    o.lab.setAttribute("opacity", showLabel ? (dead?0.25:1) : 0);
    o.g.setAttribute("opacity", dead ? 0.3 : 1);
    if(selectedNode===nd.id) o.shape.setAttribute("stroke-width", 5);
    else o.shape.setAttribute("stroke-width", nd.type==="key"?3:2.5);
  }
  for(const e of edgeEls){
    const both = isAlloc(S,e.a) && isAlloc(S,e.b);
    const half = isAlloc(S,e.a);
    const dead = permaLocked(S, t.byId[e.b]) && !isAlloc(S,e.b);
    e.el.setAttribute("class","tl"+(both?" on":(half?" reach":(dead?" dead":""))));
    if(both){
      const el2 = nodeElem(t.byId[e.b]) || nodeElem(t.byId[e.a]);
      e.el.setAttribute("stroke", el2 ? EL[el2].col : "#8b98ad");
      e.el.setAttribute("stroke-opacity", 0.85);
    } else { e.el.removeAttribute("stroke"); e.el.removeAttribute("stroke-opacity"); }
  }
  $("#thPts").textContent = treeLeft(S)+" / "+treeBudget(S.level);
  $("#thNodes").textContent = S.tree.length+" / "+t.list.length;
  $("#thKey").textContent = S.tree.filter(id=>t.byId[id] && t.byId[id].type==="key").length+" / "+t.keystones;
  applyView();
}
function applyView(){ $("#treeG").setAttribute("transform","translate("+VIEW.tx+","+VIEW.ty+") scale("+VIEW.k+")"); }
function fitTree(){
  const t = TREES[S.cls], w = $("#treeWrap").clientWidth, h = $("#treeWrap").clientHeight;
  const bw = (t.bounds.maxX-t.bounds.minX)*U + 120, bh = (t.bounds.maxY-t.bounds.minY)*U + 140;
  VIEW.k = Math.max(0.2, Math.min(1.3, Math.min(w/bw, h/bh)));
  VIEW.tx = w/2 - ((t.bounds.minX+t.bounds.maxX)/2)*U*VIEW.k;
  VIEW.ty = 44 - (t.bounds.minY*U)*VIEW.k + 10;
  applyView();
}
/* ---- gestures ---- */
(function(){
  const wrap = $("#treeWrap");
  let pts = new Map(), start = null, moved = 0, t0 = 0;
  function mid(){ const a=[...pts.values()]; return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2}; }
  function dist(){ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
  wrap.addEventListener("pointerdown", e=>{
    wrap.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size===1){ start={x:e.clientX, y:e.clientY, tx:VIEW.tx, ty:VIEW.ty}; moved=0; t0=Date.now(); }
    else if(pts.size===2){ start={d:dist(), k:VIEW.k, m:mid(), tx:VIEW.tx, ty:VIEW.ty}; }
  });
  wrap.addEventListener("pointermove", e=>{
    if(!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size===1 && start){
      const dx = e.clientX-start.x, dy = e.clientY-start.y;
      moved = Math.max(moved, Math.hypot(dx,dy));
      VIEW.tx = start.tx+dx; VIEW.ty = start.ty+dy;
      applyView();
    } else if(pts.size===2 && start && start.d){
      const d = dist(), m = mid();
      const k = Math.max(0.2, Math.min(2.4, start.k * d/start.d));
      // keep the pinch midpoint anchored
      VIEW.tx = m.x - (start.m.x - start.tx) * (k/start.k) + (m.x-start.m.x)*0;
      VIEW.ty = m.y - (start.m.y - start.ty) * (k/start.k);
      VIEW.tx = m.x - ((start.m.x - start.tx)/start.k)*k;
      VIEW.ty = m.y - ((start.m.y - start.ty)/start.k)*k;
      const wasLabels = VIEW.k>0.78; VIEW.k = k;
      applyView();
      if(wasLabels !== (k>0.78)) updateTree();
      moved = 99;
    }
  });
  function up(e){
    if(!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId);
    pts.delete(e.pointerId);
    if(pts.size===0 && start && moved < 10 && Date.now()-t0 < 600) tapAt(p.x, p.y);
    if(pts.size<2) start = pts.size===1 ? {x:[...pts.values()][0].x, y:[...pts.values()][0].y, tx:VIEW.tx, ty:VIEW.ty} : null;
  }
  wrap.addEventListener("pointerup", up);
  wrap.addEventListener("pointercancel", up);
  wrap.addEventListener("wheel", e=>{
    e.preventDefault();
    const r = wrap.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
    const k = Math.max(0.2, Math.min(2.4, VIEW.k * (e.deltaY<0?1.12:0.89)));
    VIEW.tx = mx - ((mx-VIEW.tx)/VIEW.k)*k; VIEW.ty = my - ((my-VIEW.ty)/VIEW.k)*k;
    VIEW.k = k; updateTree();
  }, {passive:false});
})();
function tapAt(cx, cy){
  const r = $("#treeWrap").getBoundingClientRect();
  const x = cx - r.left, y = cy - r.top;
  const t = TREES[S.cls];
  let best = null, bd = 34;                 // generous: never a precision tap
  for(const nd of t.list){
    const sx = nd.x*U*VIEW.k + VIEW.tx, sy = nd.y*U*VIEW.k + VIEW.ty;
    const d = Math.hypot(sx-x, sy-y);
    if(d < bd){ bd = d; best = nd; }
  }
  if(!best){ selectedNode=null; updateTree(); closeSheet(false); return; }
  if(selectedNode === best.id && sheetStack.length){
    // second tap on an already-open node commits it
    const can = canAllocate(S, best);
    if(can.ok){ doAllocate(best); return; }
    const dec = canDeallocate(S, best);
    if(dec.ok){ doDeallocate(best); return; }
  }
  selectedNode = best.id;
  updateTree();
  openNode(best);
}
function doAllocate(nd){
  S.tree.push(nd.id);
  const o = nodeEls[nd.id];
  if(o){ o.shape.classList.remove("popping"); void o.shape.offsetWidth; o.shape.classList.add("popping"); }
  closeSheet(true);
  recompute(true);
  updateTree();
}
function doDeallocate(nd){
  S.tree = S.tree.filter(x=>x!==nd.id);
  closeSheet(true);
  recompute(true);
  updateTree();
}
const TYPE_TAG = {stat:'<span class="tag st">Stat</span>', mod:'<span class="tag mo">Modifier</span>',
                  ability:'<span class="tag ab">Ability</span>', key:'<span class="tag ky">Keystone</span>'};
function openNode(nd){
  const t = TREES[S.cls];
  const on = isAlloc(S, nd.id);
  const can = canAllocate(S, nd), dec = canDeallocate(S, nd);
  const path = on ? null : cheapestPath(nd);
  let body = "";

  if(!on && can.ok){
    const s2 = cloneState(S); s2.tree = S.tree.concat([nd.id]);
    body += diffHeadHtml(diffOf(S, s2));
  } else if(on){
    const s2 = cloneState(S); s2.tree = S.tree.filter(x=>x!==nd.id);
    if(dec.ok) body += diffHeadHtml(diffOf(S, s2));
  }
  body += '<div class="note">'+TYPE_TAG[nd.type]+' <b>'+nd.cost+'</b> point'+(nd.cost>1?"s":"")+
          ' · '+treeLeft(S)+' unspent'+(nd.text? '<br><br>'+esc(nd.text) : '')+'</div>';
  if(nd.combat) body += '<div class="combatbox"><div class="mt">In combat</div><div class="cb">'+esc(nd.combat)+'</div></div>';
  else if(nd.type==="stat") body += '<div class="note" style="color:var(--tx3)">A stat node. Nothing about this one is visible in a fight — it is the glue between the nodes that are.</div>';

  const keys = Object.keys(nd.stats||{});
  if(keys.length){
    body += '<div class="sgrp">What it does</div><div class="idstats">';
    for(const k of keys){
      const m = statMeta(k), v = nd.stats[k];
      const good = m.good>0 ? v>0 : v<0;
      body += '<div class="idrow"><div class="k">'+esc(m.label)+'</div>'+
        '<div class="v '+(m.el?("e-"+m.el):(good?"pos":"neg"))+'">'+statValue(k,v)+'</div><div class="rl"></div></div>';
    }
    body += '</div>';
  }
  if(nd.addSpell) body += '<div class="major"><div class="mt">Adds a spell</div><div class="mn">'+esc(nd.addSpell.name)+'</div>'+
    '<div class="md">'+esc(nd.addSpell.text)+'</div><div class="md" style="opacity:.75">'+nd.addSpell.cost+' mana · '+
    nd.addSpell.time.toFixed(2)+'s · '+Math.round(nd.addSpell.mult*100)+'% weapon multiplier'+(nd.addSpell.aoe?" · area":"")+'</div></div>';
  if(nd.replaceSpell){
    const [tid, repl] = nd.replaceSpell;
    body += '<div class="major"><div class="mt">Replaces '+esc(spellName(tid))+'</div><div class="mn">'+esc(repl.name)+'</div>'+
      '<div class="md">'+esc(repl.text)+'</div><div class="md" style="opacity:.75">'+repl.cost+' mana · '+
      repl.time.toFixed(2)+'s · '+Math.round(repl.mult*100)+'% weapon multiplier'+(repl.aoe?" · area":"")+'</div></div>';
  }
  if(nd.major) body += '<div class="major"><div class="mt">Major ID</div><div class="mn">'+esc(MAJORS[nd.major].name)+
    '</div><div class="md">'+esc(MAJORS[nd.major].text)+'</div></div>';

  if(nd.excl){
    const siblings = t.list.filter(x=>x.excl===nd.excl && x.id!==nd.id);
    const taken = siblings.find(x=>isAlloc(S,x.id));
    body += '<div class="note" style="background:#1a1008;border-top:1px solid #4a3a12">'+
      '<b class="'+(taken?"neg":"")+'">Exclusive.</b> Taking this permanently locks out '+
      siblings.map(x=>esc(x.name)).join(", ")+' for this run'+(taken? ' — and '+esc(taken.name)+' is already taken.':'.')+'</div>';
  }
  if(!on && !can.ok) body += '<div class="note"><b class="neg">Cannot allocate.</b> '+esc(can.why)+'</div>';
  if(!on && can.ok===false && path && path.cost<=treeLeft(S) && path.set.length>1)
    body += '<div class="note">Reaching it from here costs <b>'+path.cost+'</b> points through '+
      path.set.map(id=>esc(t.byId[id].name)).join(" → ")+'.</div>';
  if(on && !dec.ok) body += '<div class="note"><b class="neg">Cannot remove.</b> '+esc(dec.why)+'</div>';

  const buttons = [{label:"Close", cls:"gho", action:()=>{ selectedNode=null; closeSheet(true); updateTree(); }}];
  if(!on && can.ok) buttons.push({label:"Allocate · "+nd.cost, cls:"pri", action:()=>doAllocate(nd)});
  else if(!on && path && path.cost<=treeLeft(S) && path.set.length>1)
    buttons.push({label:"Take path · "+path.cost, cls:"pri", action:()=>{
      for(const id of path.set) if(!isAlloc(S,id)) S.tree.push(id);
      closeSheet(true); recompute(true); updateTree();
    }});
  if(on && dec.ok) buttons.push({label:"Refund", cls:"dan", action:()=>doDeallocate(nd)});

  openSheet({head:'<div class="sh-title">'+esc(nd.name)+'</div><div class="sh-sub">'+TREES[S.cls].title+' · '+nd.type+'</div>',
             body, buttons});
}
function cheapestPath(node){
  const t = TREES[S.cls], memo = new Map();
  function walk(id, stack){
    if(memo.has(id)) return memo.get(id);
    if(isAlloc(S,id)) return {cost:0, set:[]};
    const nd = t.byId[id];
    if(exclBlocked(S,nd) || stack.has(id)) return null;
    stack.add(id);
    let best = null;
    if(nd.req.length===0) best = {cost:nd.cost, set:[id]};
    else for(const p of nd.req){
      const r = walk(p, stack); if(!r) continue;
      const c = {cost:r.cost+nd.cost, set:r.set.concat([id])};
      if(!best || c.cost<best.cost) best = c;
    }
    stack.delete(id); memo.set(id, best); return best;
  }
  return walk(node.id, new Set());
}
$("#tcFit").onclick = ()=>{ fitTree(); updateTree(); };
$("#tcReset").onclick = ()=>{
  openSheet({head:'<div class="sh-title">Wipe the tree?</div><div class="sh-sub">respec is free and instant</div>',
    body:'<div class="note">All '+S.tree.length+' allocated nodes come back as '+treeSpent(S)+' points. Keystone lockouts are lifted. Nothing is lost.</div>',
    buttons:[{label:"Cancel", cls:"gho", action:()=>closeSheet(true)},
             {label:"Wipe", cls:"dan", action:()=>{ S.tree=[]; selectedNode=null; closeSheet(true); recompute(true); updateTree(); }}]});
};
function renderTree(){
  if(treeBuiltFor !== S.cls) buildTree();
  updateTree();
}

    '<span class="dlt num" style="color:var(--tx3)">'+fmt(playerIncoming(CTX,{[k]:t.dps[k]}).total)+' after your defences</span></div>'; }
  if(t.spike){
    const inc = playerIncoming(CTX, t.spike.dmg).total;
    h += '<div class="srow"><span class="k">Burst every '+t.spike.every+'s</span><span class="v num">'+fmt(sumB(t.spike.dmg))+'</span>'+
      '<span class="dlt num '+(inc>=CTX.maxHp?"neg":"")+'">'+fmt(inc)+' lands vs '+fmt(CTX.maxHp)+' HP</span></div>';
  }
  if(t.ward) h += '<div class="srow"><span class="k">Ward every '+t.ward.every+'s</span><span class="v num">'+fmt(t.ward.hp)+'</span>'+
    '<span class="dlt num '+(burstWindow(CTX,t.ward.window)>=t.ward.hp?"pos":"neg")+'">your '+t.ward.window+'s burst: '+fmt(burstWindow(CTX,t.ward.window))+'</span></div>';
  if(t.regen) h += '<div class="srow"><span class="k">Regenerates</span><span class="v num">'+fmt(t.regen)+'/s</span>'+
    '<span class="dlt num" style="color:var(--tx3)">'+fmt(t.regen*t.timeLimit)+' over the fight</span></div>';
  if(t.drain) h += '<div class="srow"><span class="k">Drains mana</span><span class="v num">'+t.drain+'/s</span>'+
    '<span class="dlt num '+(CTX.manaRegen<=t.drain?"neg":"")+'">your regen is '+CTX.manaRegen.toFixed(1)+'/s</span></div>';
  if(t.thorns) h += '<div class="srow"><span class="k">Reflects</span><span class="v num">'+t.thorns+'%</span>'+
    '<span class="dlt num" style="color:var(--tx3)">of the damage you deal</span></div>';
  if(t.adds) h += '<div class="srow"><span class="k">Additional targets</span><span class="v num">'+t.adds+'</span>'+
    '<span class="dlt num" style="color:var(--tx3)">area damage is worth more here</span></div>';
  h += '</div>';
  return h;
}
function openTrial(t){
  openSheet({head:'<div class="sh-title">'+esc(t.name)+'</div><div class="sh-sub">Trial '+t.n+' · '+ARCH[t.arch].name+' · tier '+t.lvl+'</div>',
    body: enemyBody(t),
    buttons:[{label:"Back", cls:"gho", action:()=>closeSheet(true)},
             {label:S.cleared[t.id]?"Run again":"Run trial", cls:"pri", action:()=>{ closeSheet(true); runTrial(t); }}]});
}
function runTrial(t){
  const r = simulate(CTX, t);
  const d = diagnose(r);
  LAST = {t, r, d};
  const prev = S.best[t.id];
  if(!prev || r.enemyPct > prev.pct) S.best[t.id] = {pct:r.enemyPct, win:r.win};
  let rewards = [], levelled = false;
  if(r.win && !S.cleared[t.id]){
    S.cleared[t.id] = true;
    if(S.level < t.lvl+1 && t.n < 15){ S.level = t.lvl+1; levelled = true; }
    rewards = rollDrops(S, t.lvl, 3);
  } else if(!r.win){
    /* Losing is a readout, not a wall. Every failed attempt still hands
       you an input, so a run can never dead-end with nothing left to try. */
    S.salvaged[t.id] = (S.salvaged[t.id]||0) + 1;
    rewards = rollDrops(S, Math.max(1, t.lvl - (S.salvaged[t.id]>3?0:1)), 1);
  }
  for(const it of rewards) S.inv.push(it);
  showTab("Trial");
  recompute(false);
  if(rewards.length || levelled) setTimeout(()=>openRewards(t, r, rewards, levelled), 260);
}
function openRewards(t, r, rewards, levelled){
  let body = '<div class="verdict '+(r.win?"win":"loss")+'" style="border:none"><div class="vt">'+(r.win?"Trial cleared":"Salvage")+'</div>'+
    '<div class="vs">'+(r.win? esc(t.name)+' is down.' : 'You lost, but nothing is lost. Take this and try again — respec is free.')+'</div></div>';
  if(levelled) body += '<div class="note"><b>Level '+S.level+'.</b> +7 element points (now '+elemBudget(S.level)+
    ') and +3 skill points (now '+treeBudget(S.level)+').</div>';
  body += '<div class="sgrp">'+rewards.length+' item'+(rewards.length===1?"":"s")+' recovered</div><div class="stab">';
  for(const inst of rewards){
    const def = ITEMS[inst.def], q = itemQuality(inst);
    const sl = def.slot==="ring" ? "ring1" : def.slot;
    const s2 = cloneState(S); s2.equipped = Object.assign({}, S.equipped); s2.equipped[sl] = inst;
    const cb = buildContext(s2), hb = headline(cb);
    const dd = hb.dps - HL.dps;
    body += '<button class="slot" data-uid="'+inst.uid+'" style="width:100%;text-align:left;grid-template-columns:1fr auto auto">'+
      '<span class="body"><div class="iname '+RARITY[def.rarity].cls+'">'+esc(def.name)+'</div>'+
      '<div class="line2"><span class="rollchip '+(q>=0.75?"hi":(q<=0.35?"lo":""))+'">'+Math.round(q*100)+'%</span>'+
      '<span class="tag">'+RARITY[def.rarity].name+'</span>'+
      Object.keys(def.req||{}).map(e=>pipHtml(e, def.req[e], (CTX.pool[e]||0)<def.req[e]?"unmet":"")).join("")+
      (def.major?'<span class="tag ab">'+esc(MAJORS[def.major].name)+'</span>':'')+'</div></span>'+
      '<span style="padding:0 10px;text-align:right"><div class="num '+pcls(dd)+'" style="font-size:13px;font-weight:700">'+sign(dd)+
      '</div><div class="num" style="font-size:9px;color:var(--tx3)">DPS if worn</div></span><span class="chev">›</span></button>';
  }
  body += '</div>';
  openSheet({head:'<div class="sh-title">'+(r.win?"Cleared":"Salvaged")+'</div><div class="sh-sub">'+esc(t.name)+'</div>',
    body, buttons:[{label:"Continue", cls:"pri", action:()=>closeSheet(true)}],
    onDraw:(root)=>{ root.querySelectorAll("[data-uid]").forEach(b=>b.onclick=()=>{
      const inst = S.inv.find(x=>x.uid===b.dataset.uid); if(inst) openItem(inst); }); }});
}
function verdictHtml(L){
  const {t, r, d} = L;
  let h = '<div class="verdict '+(r.win?"win":"loss")+'">'+
    '<div class="vt">'+(r.win?"Cleared":"Failed")+' · '+esc(t.name)+'</div>'+
    '<div class="vs">'+esc(d.line)+'</div></div>';
  h += '<div class="timeline"><canvas id="tlCanvas"></canvas></div>';
  h += '<div class="note" style="display:flex;justify-content:space-between;gap:8px">'+
    '<span><b style="color:var(--gold)">▮</b> damage dealt</span><span><b style="color:#ff6257">▬</b> your health</span>'+
    '<span><b style="color:#4fb9ff">▬</b> your mana</span><span class="num">0–'+Math.ceil(r.dur)+'s</span></div>';
  for(const f of d.facts)
    h += '<div class="kv"><span class="k">'+esc(f[0])+'</span><span class="v '+(f[2]||"")+'">'+esc(f[1])+'</span></div>';
  /* damage taken mix */
  const taken = Object.entries(r.takenBy).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const tt = taken.reduce((a,b)=>a+b[1],0);
  if(tt>0){
    h += '<div class="sect-h">What hit you</div><div class="mixbar">';
    for(const [k,v] of taken) h += '<i class="bg-'+k+'" style="flex:'+v+'"></i>';
    h += '</div><div class="mixleg">';
    for(const [k,v] of taken) h += '<span class="e-'+k+'">'+EL[k].name+' <b>'+Math.round(v/tt*100)+'%</b> · '+fmt(v)+'</span>';
    h += '</div>';
  }
  /* damage by mechanism — the node you took should show up as its own bar */
  const kinds = Object.entries(r.byKind||{}).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const kt = kinds.reduce((a,b)=>a+b[1],0);
  if(kt>0 && kinds.length>1){
    h += '<div class="sect-h">How that damage was produced</div><div class="mixbar">';
    for(const [k,v] of kinds) h += '<i style="flex:'+v+';background:'+(KIND_COLOUR[k]||"#8894a8")+'"></i>';
    h += '</div><div class="mixleg">';
    for(const [k,v] of kinds) h += '<span style="color:'+(KIND_COLOUR[k]||"#8894a8")+'">'+esc(KIND_LABEL[k]||k)+
      ' <b>'+Math.round(v/kt*100)+'%</b> · '+fmt(v)+'</span>';
    h += '</div>';
  }
  /* the fight itself, in order */
  if(r.log && r.log.length){
    h += '<div class="sect-h">What happened</div><div class="stab">';
    for(const e of r.log.slice(0,16))
      h += '<div class="srow" style="min-height:32px;padding:5px 12px"><span class="k num" style="flex:0 0 42px;color:var(--tx3);font-size:11px">'+
        e.t.toFixed(1)+'s</span><span class="k" style="font-size:12px">'+esc(e.text)+'</span></div>';
    h += '</div>';
  }
  if(r.maxStacks>1 || r.minionPeak>0 || r.freezes>0 || r.counters>0){
    const bits = [];
    if(r.maxStacks>1) bits.push(r.maxStacks+" stacks at the peak");
    if(r.minionPeak>0) bits.push(r.minionPeak+" minions at once");
    if(r.freezes>0) bits.push(r.freezes+" freezes, "+r.shatters+" shattered");
    if(r.counters>0) bits.push(r.counters+" counters");
    if(r.blasts>0) bits.push(r.blasts+" detonations");
    h += '<div class="note">'+esc(bits.join(" · "))+'</div>';
  }
  /* damage dealt mix */
  const dealt = Object.entries(r.dealtBy).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const dt = dealt.reduce((a,b)=>a+b[1],0);
  if(dt>0){
    h += '<div class="sect-h">Which spell did it</div><div class="mixbar">';
    const cols = ["#e8bd63","#57b2ff","#c88bff","#54d391","#ff7a5c","#9aa4b4"];
    dealt.forEach(([k,v],i)=>{ h += '<i style="flex:'+v+';background:'+cols[i%cols.length]+'"></i>'; });
    h += '</div><div class="mixleg">';
    dealt.forEach(([k,v],i)=>{ h += '<span style="color:'+cols[i%cols.length]+'">'+esc(k)+' <b>'+Math.round(v/dt*100)+'%</b></span>'; });
    h += '</div>';
  }
  h += '<div style="display:flex;gap:1px"><button class="btn sm gho" id="btnRerun">Run it again</button></div>';
  return h;
}
function drawTimeline(cv, r, animate){
  if(!cv) return;
  const dpr = window.devicePixelRatio||1;
  const w = cv.parentElement.clientWidth, h = 44;
  cv.width = w*dpr; cv.height = h*dpr; cv.style.width=w+"px"; cv.style.height=h+"px";
  const c = cv.getContext("2d"); c.scale(dpr,dpr);
  const n = Math.max(1, r.curve.length);
  const mx = Math.max(1, ...r.curve);
  let frame = 0;
  const totalFrames = animate ? 22 : 1;
  function paint(){
    const upto = Math.ceil(n * Math.min(1, (frame+1)/totalFrames));
    c.clearRect(0,0,w,h);
    c.fillStyle = "#0a0d13"; c.fillRect(0,0,w,h);
    const bw = w/n;
    for(let i=0;i<upto;i++){
      const bh = (r.curve[i]/mx)*(h-8);
      c.fillStyle = "rgba(232,189,99,.85)";
      c.fillRect(i*bw+0.5, h-bh, Math.max(1,bw-1), bh);
    }
    c.strokeStyle="#ff6257"; c.lineWidth=1.5; c.beginPath();
    for(let i=0;i<upto && i<r.hpSeries.length;i++){
      const y = h - 3 - r.hpSeries[i]*(h-8);
      i?c.lineTo(i*bw+bw/2,y):c.moveTo(i*bw+bw/2,y);
    }
    c.stroke();
    c.strokeStyle="#4fb9ff"; c.lineWidth=1.2; c.beginPath();
    for(let i=0;i<upto && i<r.manaCurve.length;i++){
      const y = h - 3 - r.manaCurve[i]*(h-8);
      i?c.lineTo(i*bw+bw/2,y):c.moveTo(i*bw+bw/2,y);
    }
    c.stroke();
    if(frame < totalFrames-1){ frame++; requestAnimationFrame(paint); }
  }
  paint();
}

let curScreen = "Gear";
function showTab(name){
  curScreen = name;
  for(const t of $$(".tab")) t.classList.toggle("on", t.dataset.scr===name);
  for(const s of $$(".screen")) s.classList.toggle("on", s.id==="scr"+name);
  renderCurrent();
}
function renderCurrent(){
  if(curScreen==="Gear") renderGear();
  else if(curScreen==="Tree") renderTree();
  else if(curScreen==="Trial") renderTrial();
}
$$(".tab").forEach(t=>t.onclick=()=>showTab(t.dataset.scr));
$$("#hudStats .hs").forEach(b=>b.onclick=()=>openStat(b.dataset.stat));
window.addEventListener("resize", ()=>{ if(curScreen==="Tree"){ fitTree(); updateTree(); } });

function chooseClass(){
  let body = '<div class="note">Four classes, four different sets of levers. A class is not a stat package — it is a different argument about how damage should be produced. You can start a new run with a different one at any time; nothing here is precious.</div>';
  for(const c in CLASSES){
    const cl = CLASSES[c], t = TREES[c];
    body += '<button class="slot" data-cls="'+c+'" style="width:100%;text-align:left;grid-template-columns:1fr auto">'+
      '<span class="body" style="padding:10px 12px"><div class="iname" style="font-size:16px;color:var(--gold)">'+cl.name+'</div>'+
      '<div class="ts" style="font-size:11px;color:var(--tx3);margin-top:2px">'+cl.tagline+'</div>'+
      '<div style="font-size:12px;color:var(--tx2);margin-top:6px;line-height:1.45">'+esc(cl.blurb)+'</div>'+
      '<div class="line2" style="margin-top:7px">'+cl.spells.map(s=>'<span class="tag"><span class="slotno num">'+s.slot+'</span>'+esc(s.name)+'</span>').join("")+'</div>'+
      '<div class="ts" style="font-size:10.5px;color:var(--gold);margin-top:6px;letter-spacing:.04em">'+esc(cl.themes)+'</div></span>'+
      '<span class="chev">›</span></button>';
  }
  openSheet({head:'<div class="sh-title">SOLVER</div><div class="sh-sub">a game about assembling a build, not about pressing buttons</div>',
    body, locked:true, buttons:[],
    onDraw:(root)=>{ root.querySelectorAll("[data-cls]").forEach(b=>b.onclick=()=>{
      RNG = mulberry32((Date.now()^0x9e3779b9)>>>0);
      S = newState(b.dataset.cls);
      closeSheet(true);
      treeBuiltFor = null; LAST = null;
      recompute(false);
      showTab("Gear");
    }); }});
}
function measureChrome(){
  const r = document.documentElement.style;
  r.setProperty("--chrome-top", $("#hud").offsetHeight+"px");
  r.setProperty("--chrome-bot", $("#tabs").offsetHeight+"px");
}
function boot(){
  measureChrome();
  if(window.ResizeObserver){
    const ro = new ResizeObserver(()=>{ measureChrome(); if(curScreen==="Tree"){ fitTree(); updateTree(); } });
    ro.observe($("#hud")); ro.observe($("#tabs"));
  }
  S = load();
  if(S){ recompute(false); showTab("Gear"); }
  else { S = newState("warden"); recompute(false); showTab("Gear"); chooseClass(); }
}
/* long-press the class name in the HUD to start over */
bindHold($("#hudClass"), ()=>{
  openSheet({head:'<div class="sh-title">New run?</div><div class="sh-sub">this discards the current one</div>',
    body:'<div class="note">Level '+S.level+', '+S.inv.length+' items, '+S.tree.length+' nodes allocated, '+
      Object.keys(S.cleared).length+' trials cleared. All of it goes.</div>',
    buttons:[{label:"Keep playing", cls:"gho", action:()=>closeSheet(true)},
             {label:"New run", cls:"dan", action:()=>{ localStorage.removeItem(SAVE_KEY); closeSheet(true); chooseClass(); }}]});
});
function bindHold(node, fn){
  let t=null;
  const dn=()=>{ t=setTimeout(fn, 550); };
  const up=()=>{ clearTimeout(t); };
  node.addEventListener("touchstart", dn, {passive:true});
  node.addEventListener("mousedown", dn);
  for(const e of ["touchend","touchcancel","mouseup","mouseleave"]) node.addEventListener(e, up);
}
boot();
