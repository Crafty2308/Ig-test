<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REDLINE">
<meta name="application-name" content="REDLINE">
<meta name="theme-color" content="#08060c">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="First-person arena combat where speed is damage.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>REDLINE</title>
<style>
:root{
  --red:#ff2a3d; --red-dim:#7a1320; --ink:#f4eef2; --muted:#9b8f99; --bg:#08060c; --panel:rgba(16,10,18,.86);
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box}
html,body{
  margin:0; padding:0; position:fixed; inset:0; overflow:hidden; background:var(--bg); color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
canvas#c{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none}
#safeProbe{position:fixed; top:var(--sat); right:var(--sar); bottom:var(--sab); left:var(--sal); pointer-events:none; visibility:hidden}
.hidden{display:none !important}

/* ---------- screens ---------- */
.screen{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 12px) calc(var(--sal) + 16px);
  background:radial-gradient(ellipse at center, rgba(20,6,14,.55), rgba(4,2,6,.88)); z-index:20; touch-action:manipulation}
.screen h1{margin:0; font-size:clamp(44px,11vh,104px); letter-spacing:.14em; font-weight:900; font-style:italic; line-height:1;
  color:var(--ink); text-shadow:0 0 24px rgba(255,42,61,.55), 4px 0 0 var(--red)}
.screen h2{margin:0; font-size:clamp(24px,6vh,44px); letter-spacing:.12em; font-weight:900; font-style:italic}
.tag{margin:0; color:var(--muted); letter-spacing:.3em; text-transform:uppercase; font-size:12px}
.row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
button.b{appearance:none; border:2px solid var(--red); background:rgba(255,42,61,.08); color:var(--ink); font:inherit; font-weight:800;
  letter-spacing:.18em; padding:12px 26px; min-width:150px; border-radius:4px; text-transform:uppercase; cursor:pointer;
  touch-action:manipulation; transform:skewX(-8deg)}
button.b:active,button.b.primary{background:var(--red); color:#140306}
button.b.ghost{border-color:#4a3a44; background:transparent}
.stats{display:grid; grid-template-columns:auto auto; gap:4px 22px; font-size:15px; letter-spacing:.08em}
.stats b{color:var(--red); text-align:right; font-variant-numeric:tabular-nums}
.hint{color:var(--muted); font-size:12px; letter-spacing:.06em; text-align:center; max-width:640px; line-height:1.5}

/* settings */
#settings{justify-content:flex-start}
.panel{background:var(--panel); border:1px solid #3a2733; border-radius:8px; padding:14px 18px; width:min(560px,100%);
  max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y}
.set{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid #2a1c25; font-size:14px; letter-spacing:.06em}
.set:last-child{border-bottom:0}
.set input[type=range]{width:52%; accent-color:var(--red); touch-action:pan-x}
.set .val{min-width:40px; text-align:right; color:var(--red); font-variant-numeric:tabular-nums}
.tog{width:54px; height:28px; border-radius:14px; background:#3a2733; position:relative; flex:none; cursor:pointer}
.tog::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#bbb; transition:left .15s}
.tog.on{background:var(--red)} .tog.on::after{left:29px; background:#fff}

/* rotate */
#rotate{position:fixed; inset:0; z-index:100; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px}
#rotate .phone{width:46px; height:80px; border:3px solid var(--ink); border-radius:9px; animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){ #rotate{display:flex} }

/* ---------- HUD ---------- */
#hud{position:fixed; inset:0; pointer-events:none; z-index:5}
#crosshair{position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px}
#crosshair::before,#crosshair::after{content:""; position:absolute; background:rgba(255,255,255,.85); box-shadow:0 0 3px #000}
#crosshair::before{left:10px; top:3px; width:2px; height:16px}
#crosshair::after{top:10px; left:3px; height:2px; width:16px}
#speedo{position:absolute; left:50%; bottom:calc(var(--sab) + 8px); transform:translateX(-50%); text-align:center; --c:#5ee1ff}
#speedo .num{font-size:clamp(34px,9vh,64px); font-weight:900; font-style:italic; line-height:.9; color:var(--c);
  text-shadow:0 0 14px var(--c), 0 2px 0 #000; font-variant-numeric:tabular-nums; letter-spacing:.02em}
#speedo .unit{font-size:10px; letter-spacing:.35em; color:var(--muted); margin-top:2px}
#speedo .bar{width:clamp(160px,30vw,300px); height:6px; background:rgba(255,255,255,.12); margin:5px auto 0; border-radius:3px; overflow:hidden; transform:skewX(-20deg)}
#speedo .fill{height:100%; width:0; background:var(--c); box-shadow:0 0 10px var(--c)}
#speedo.hot .num{animation:pulse .35s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.09)}}
#dashPips{position:absolute; left:50%; bottom:calc(var(--sab) + 12px); transform:translateX(calc(-50% - clamp(110px,18vw,190px))); display:flex; gap:5px}
.pip{width:16px; height:8px; border:1.5px solid #5ee1ff; transform:skewX(-20deg); position:relative; overflow:hidden}
.pip i{position:absolute; left:0; top:0; bottom:0; background:#5ee1ff}
#vignette{position:absolute; inset:0; opacity:0; background:radial-gradient(ellipse at center, transparent 45%, rgba(255,20,40,.75) 100%)}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="safeProbe"></div>

<div id="hud" class="hidden">
  <div id="vignette"></div>
  <div id="crosshair"></div>
  <div id="dashPips"></div>
  <div id="speedo"><div class="num">0</div><div class="unit">M/S</div><div class="bar"><div class="fill"></div></div></div>
</div>

<div id="title" class="screen">
  <h1>REDLINE</h1>
  <p class="tag">speed is damage</p>
  <div class="row">
    <button class="b primary" data-act="play">Play</button>
    <button class="b ghost" data-act="settings">Settings</button>
  </div>
  <div class="hint" id="titleHint"></div>
</div>

<div id="pause" class="screen hidden">
  <h2>PAUSED</h2>
  <div class="row">
    <button class="b primary" data-act="resume">Resume</button>
    <button class="b ghost" data-act="settings">Settings</button>
    <button class="b ghost" data-act="quit">Quit</button>
  </div>
</div>

<div id="settings" class="screen hidden">
  <h2>SETTINGS</h2>
  <div class="panel" id="setPanel"></div>
  <div class="row">
    <button class="b ghost" data-act="layout">Edit Buttons</button>
    <button class="b primary" data-act="settingsBack">Back</button>
  </div>
</div>

<div id="rotate"><div class="phone"></div><div style="letter-spacing:.2em;font-weight:800">ROTATE YOUR DEVICE</div><div class="hint">REDLINE plays in landscape.</div></div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   Utilities & persistence
   ===================================================================== */
const V3 = THREE.Vector3;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const wrapAngle = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

const store = {
  get(k, d) { try { const v = localStorage.getItem('redline.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('redline.' + k, JSON.stringify(v)); } catch (e) { /* private mode / quota */ } },
};
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

const SETTINGS_DEFAULT = { sens: 1, aimAssist: true, fovFx: true, volume: 0.7, haptics: true };
const settings = Object.assign({}, SETTINGS_DEFAULT, store.get('settings', {}));
const saveSettings = () => store.set('settings', settings);

function haptic(ms) {
  if (!settings.haptics) return;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* iOS has no vibrate: ignore */ }
}

/* =====================================================================
   Tuning — movement feel lives here
   ===================================================================== */
const T = {
  G: 24,              // gravity m/s²
  RUN: 9,             // top speed from plain running
  ACCEL: 55,          // ground accel below RUN
  TURN: 3.4,          // ground carve rate (rad/s) at RUN; falls off with speed
  AIR_TURN: 1.6,      // air carve rate
  AIR_ACCEL: 16,
  BRAKE: 16,          // pulling against velocity above RUN
  FRICTION_LOW: 20,   // no input, below RUN
  FRICTION_HIGH: 2.2, // no input, above RUN — momentum carries
  JUMP: 8.6, COYOTE: .12, JUMP_BUF: .14,
  SLIDE_MIN: 3, SLIDE_BOOST: 3.5, SLIDE_BOOST_CD: 1.0, SLIDE_BUILD: 1.3, SLIDE_TURN: 1.5, SLIDE_SLOPE: 1.0, RUN_SLOPE: .35,
  DASH_BURST: 18, DASH_TIME: .16, DASH_KEEP: 3, DASH_RECHARGE: 1.7,
  WALL_MIN: 5, WALL_BUILD: 2.4, WALL_TIME: 2.2, WJ_OUT: 7, WJ_UP: 8.6, WJ_BOOST: 2.5, WJ_MUL: 1.06,
  SLAM_V: 42, SLAM_RADIUS: 5,
  DECAY_START: 20, DECAY: .12,
  EYE: 1.6, EYE_SLIDE: .85, RADIUS: .45, HEIGHT: 1.8, STEP: .55, SNAP: .5, LAUNCH_REL: 3,
};
// run modifiers (upgrades write into this)
const mods = {};
function resetMods() {
  Object.assign(mods, { wallBuild: 1, dashMax: 2, dashRecharge: 1, slamRadius: 1, decayBonus: 0, wjBoost: 1 });
}
resetMods();

/* =====================================================================
   Renderer / scene
   ===================================================================== */
const canvas = $('#c');
const DPR = window.devicePixelRatio || 1;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: DPR < 2, powerPreference: 'high-performance', stencil: false });
const MAX_PR = Math.min(DPR, 2);
let pixelRatio = MAX_PR;
renderer.setPixelRatio(pixelRatio);
renderer.autoClear = false;

const scene = new THREE.Scene();
const FOG = 0x12070f;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 45, 170);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 500);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.HemisphereLight(0x9fb0e0, 0x3a1822, 1.9));
const sun = new THREE.DirectionalLight(0xffd8c8, 2.2);
sun.position.set(40, 70, 25);
scene.add(sun);

function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const floorTex = canvasTex(128, 128, (g, w) => {
  g.fillStyle = '#2a2230'; g.fillRect(0, 0, w, w);
  g.fillStyle = '#322838'; g.fillRect(0, 0, w / 2, w / 2); g.fillRect(w / 2, w / 2, w / 2, w / 2);
  g.strokeStyle = '#5a4660'; g.lineWidth = 3; g.strokeRect(0, 0, w, w);
});
const hillTex = canvasTex(128, 128, (g, w) => {
  g.fillStyle = '#3b2632'; g.fillRect(0, 0, w, w);
  g.strokeStyle = '#ff4a5a'; g.globalAlpha = .55; g.lineWidth = 3;
  for (let i = -w; i < w * 2; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + w, w); g.stroke(); }
});
const wallTex = canvasTex(64, 256, (g, w, h) => {
  g.fillStyle = '#231b28'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#2c2232'; for (let y = 0; y < h; y += 32) g.fillRect(0, y, w, 16);
}, true);
const wallGlow = canvasTex(64, 256, (g, w, h) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ff2a3d'; g.fillRect(0, h * .30, w, 6); g.fillRect(0, h * .70, w, 3);
}, true);
const blobTex = canvasTex(64, 64, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, 'rgba(0,0,0,.6)'); gr.addColorStop(.6, 'rgba(0,0,0,.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
}, false);

/* =====================================================================
   Arena: analytic heightfield (bowl + hills) and solids (walls, pillars, blocks)
   ===================================================================== */
const ARENA = { R: 64, BOWL_START: 44, BOWL_H: 8, BOWL_W: 18, EDGE0: 60, EDGE_MIN: 30, SHRINK: 6 };
let edgeR = ARENA.EDGE0, edgeTarget = ARENA.EDGE0;

// radial "kicker" hills: rise → plateau → fall
const hills = [];
for (let i = 0; i < 4; i++) {
  const a = Math.PI / 4 + i * Math.PI / 2, r = 21;
  hills.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, ca: Math.cos(a), sa: Math.sin(a), rise: 8, top: 4, w: 10, taper: 3.5, h: 3 });
}
function hillH(hl, x, z) {
  const dx = x - hl.x, dz = z - hl.z;
  const al = Math.abs(dx * hl.ca + dz * hl.sa), ac = Math.abs(-dx * hl.sa + dz * hl.ca);
  const half = hl.top / 2 + hl.rise;
  if (al >= half || ac >= hl.w / 2) return 0;
  const pa = al <= hl.top / 2 ? 1 : 1 - (al - hl.top / 2) / hl.rise;
  let pc = (hl.w / 2 - ac) / hl.taper; pc = pc >= 1 ? 1 : pc * pc * (3 - 2 * pc);
  return hl.h * pa * pc;
}
function bowlH(r) { if (r <= ARENA.BOWL_START) return 0; const t = (r - ARENA.BOWL_START) / ARENA.BOWL_W; return t * t * ARENA.BOWL_H; }
function terrainH(x, z) {
  let h = bowlH(Math.hypot(x, z));
  for (let i = 0; i < hills.length; i++) { const v = hillH(hills[i], x, z); if (v > h) h = v; }
  return h;
}
function terrainN(x, z, out) {
  const e = .12;
  return out.set(terrainH(x - e, z) - terrainH(x + e, z), 2 * e, terrainH(x, z - e) - terrainH(x, z + e)).normalize();
}

// solids: boxes (oriented in XZ) and cylinders. y0..y1 vertical extent.
const solids = [];
function addBox(x, z, ang, hx, hz, height, kind) {
  const base = Math.min(terrainH(x, z), 0);
  solids.push({ type: 'box', id: solids.length, x, z, c: Math.cos(ang), s: Math.sin(ang), ang, hx, hz, y0: base - 1, y1: base + height, kind });
}
function addCyl(x, z, r, height, kind) {
  solids.push({ type: 'cyl', id: solids.length, x, z, r, y0: -1, y1: height, kind });
}
// center podium
addCyl(0, 0, 4, 1.1, 'block');
// inner pillars
for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; addCyl(Math.cos(a) * 11, Math.sin(a) * 11, 1.4, 9, 'pillar'); }
// tangential run-walls between the hills
for (let i = 0; i < 4; i++) {
  const a = i * Math.PI / 2, r = 33;
  addBox(Math.cos(a) * r, Math.sin(a) * r, a + Math.PI / 2, 8.5, .6, 7, 'wall');
}
// radial fins out on the bowl lip
for (let i = 0; i < 4; i++) {
  const a = Math.PI / 4 + i * Math.PI / 2 + .32, r = 40;
  addBox(Math.cos(a) * r, Math.sin(a) * r, a, 6, .6, 6, 'wall');
}
// outer pillars and low blocks
for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8; addCyl(Math.cos(a) * 27, Math.sin(a) * 27, 1.2, 10, 'pillar'); }
for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4 + .55, r = 16; addBox(Math.cos(a) * r, Math.sin(a) * r, a, 1.6, 1.6, 1.2, 'block'); }

// ---------- arena meshes
const arenaGroup = new THREE.Group(); scene.add(arenaGroup);
{
  const g = new THREE.RingGeometry(0, ARENA.R + 16, 80, 40);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, bowlH(Math.hypot(x, z)));
    uv.setXY(i, x / 4, z / 4);
  }
  g.computeVertexNormals();
  arenaGroup.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ map: floorTex })));
}
{
  const mat = new THREE.MeshLambertMaterial({ map: hillTex });
  for (const hl of hills) {
    const L = hl.top + hl.rise * 2;
    const g = new THREE.PlaneGeometry(L, hl.w, 24, 10);
    g.rotateX(-Math.PI / 2);
    const p = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) {
      const lx = p.getX(i), lz = p.getZ(i);
      const x = hl.x + lx * hl.ca - lz * hl.sa, z = hl.z + lx * hl.sa + lz * hl.ca;
      p.setXYZ(i, x, hillH(hl, x, z) + .03, z);
      uv.setXY(i, x / 4, z / 4);
    }
    g.computeVertexNormals();
    arenaGroup.add(new THREE.Mesh(g, mat));
  }
}
{
  const wallMat = new THREE.MeshLambertMaterial({ map: wallTex, emissiveMap: wallGlow, emissive: 0xffffff, emissiveIntensity: 1 });
  const blockMat = new THREE.MeshLambertMaterial({ color: 0x4a3a52 });
  const topMat = new THREE.MeshLambertMaterial({ color: 0x5c4966 });
  for (const s of solids) {
    let m;
    const h = s.y1 - s.y0;
    if (s.type === 'box') {
      m = new THREE.Mesh(new THREE.BoxGeometry(s.hx * 2, h, s.hz * 2), s.kind === 'wall' ? wallMat : blockMat);
      m.rotation.y = -s.ang;
    } else {
      m = new THREE.Mesh(new THREE.CylinderGeometry(s.r, s.r, h, s.kind === 'pillar' ? 10 : 24), s.kind === 'pillar' ? wallMat : topMat);
    }
    m.position.set(s.x, (s.y0 + s.y1) / 2, s.z);
    arenaGroup.add(m);
  }
}
// distant skyline (instanced) for parallax — helps you feel speed
{
  const N = 44, g = new THREE.BoxGeometry(1, 1, 1); g.translate(0, .5, 0);
  const im = new THREE.InstancedMesh(g, new THREE.MeshLambertMaterial({ color: 0x1c1422 }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new V3(), ps = new V3();
  for (let i = 0; i < N; i++) {
    const a = i / N * TAU + rand(-.05, .05), r = rand(95, 150);
    ps.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    q.setFromAxisAngle(new V3(0, 1, 0), rand(0, TAU));
    sc.set(rand(6, 16), rand(18, 70), rand(6, 16));
    im.setMatrixAt(i, m.compose(ps, q, sc));
  }
  scene.add(im);
}
// energy edge (shrinks every 5 waves)
const edgeTex = canvasTex(256, 64, (g, w, h) => {
  const gr = g.createLinearGradient(0, h, 0, 0);
  gr.addColorStop(0, 'rgba(255,42,61,.9)'); gr.addColorStop(.35, 'rgba(255,42,61,.25)'); gr.addColorStop(1, 'rgba(255,42,61,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,120,130,.6)'; for (let x = 0; x < w; x += 16) g.fillRect(x, 0, 2, h);
});
edgeTex.repeat.set(24, 1);
const edgeMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(1, 1, 22, 96, 1, true),
  new THREE.MeshBasicMaterial({ map: edgeTex, transparent: true, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })
);
edgeMesh.position.y = 8;
scene.add(edgeMesh);

// ---------- blob shadows (one instanced mesh for everything)
const SHADOW_MAX = 96;
const shadowMesh = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }),
  SHADOW_MAX
);
shadowMesh.frustumCulled = false;
scene.add(shadowMesh);
let shadowCount = 0;

document.body.appendChild(touchUI);
touchUI.classList.add('hidden');
const btnEls = {}; touchUI.querySelectorAll('.tb').forEach(el => btnEls[el.dataset.id] = el);
const joyBase = $('#joyBase'), joyKnob = $('#joyKnob'), pauseBtnEl = $('#pauseBtn');
let W = innerWidth, H = innerHeight, safe = { l: 0, t: 0, r: 0, b: 0, w: 1, h: 1 };
const btnRects = {};
function readSafe() {

}
function btnPx(id) {
  const L = layout[id], def = BTN_DEFS.find(b => b.id === id);
  const size = def.size * L.s * clamp(Math.min(W, H) / 390, .85, 1.35);
  return { x: safe.l + L.x * safe.w, y: safe.t + L.y * safe.h, r: size / 2 };
}
function placeButtons(container = touchUI) {

    const p = btnPx(b.id);
    btnRects[b.id] = p;
    Object.assign(el.style, { left: p.x + 'px', top: p.y + 'px', width: p.r * 2 + 'px', height: p.r * 2 + 'px' });
  }
  const pb = { x: safe.l + 30, y: safe.t + 28, r: 26 };
  btnRects.pause = pb;
  Object.assign(pauseBtnEl.style, { left: pb.x - 20 + 'px', top: pb.y - 20 + 'px' });
  joyIdlePos();
}
function joyIdlePos() {
  if (joy) return;
  const x = safe.l + safe.w * .16, y = safe.t + safe.h * .72;
  joyBase.style.left = joyKnob.style.left = x + 'px'; joyBase.style.top = joyKnob.style.top = y + 'px';
}
function hitButton(x, y) {
  let best = null, bd = Infinity;
  for (const id in btnRects) {
    const b = btnRects[id], d = Math.hypot(x - b.x, y - b.y);
    if (d < b.r * 1.18 + 6 && d < bd) { bd = d; best = id; }
  }

}

const touches = new Map();
let joy = null;
const JOY_R = 58;
function pressButton(id, down) {
  const el = btnEls[id]; if (el) el.classList.toggle('down', down);
  if (id === 'attack') { input.attackHeld = down; if (down) input.attackPressed = true; }
  else if (id === 'jump') { if (down) input.jumpPressed = true; }
  else if (id === 'slide') { input.slideHeld = down; if (down) input.slidePressed = true; }
  else if (id === 'dash') { if (down) input.dashPressed = true; }
  else if (id === 'swap') { if (down) input.swapPressed = true; }

function onTouchStart(e) {
  e.preventDefault();
  unlockAudio();
  if (state !== 'playing') return;
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    const b = hitButton(x, y);
    if (b) { touches.set(t.identifier, { role: 'btn', id: b, x, y }); pressButton(b, true); input.touchAttack = true; }
    else if (x < W * .5 && !joy) {
      joy = { id: t.identifier, ox: x, oy: y };
      touches.set(t.identifier, { role: 'joy' });
      joyBase.classList.remove('idle'); joyKnob.classList.remove('idle');
      joyBase.style.left = joyKnob.style.left = x + 'px'; joyBase.style.top = joyKnob.style.top = y + 'px';
    } else touches.set(t.identifier, { role: 'look', x, y });

function onTouchMove(e) {

    const x = t.clientX, y = t.clientY;

        joyBase.style.left = joy.ox + 'px'; joyBase.style.top = joy.oy + 'px'; }

      input.mx = d > 0 ? dx / d * m : 0; input.my = d > 0 ? -dy / d * m : 0;
    } else if (rec.role === 'look' || (rec.role === 'btn' && rec.id === 'attack')) {

function onTouchEnd(e) {

}
function releaseJoy() {
  joy = null; input.mx = input.my = 0;

}

/* ---------- global gesture suppression (scroll, pinch, double-tap, callouts) */
const allowNative = t => t && t.closest && t.closest('input,.panel');

for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('selectstart', e => { if (!allowNative(e.target)) e.preventDefault(); });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = performance.now();
  if (now - lastTouchEnd < 300 && !allowNative(e.target) && !(e.target.closest && e.target.closest('button,.tog')) && e.cancelable) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

/* =====================================================================
   Keyboard & mouse fallback
   ===================================================================== */
const keys = new Set();
const KEYMAP = { KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
function keyMove() {
  const x = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  const y = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  const l = Math.hypot(x, y) || 1;

}
addEventListener('keydown', e => {
  unlockAudio();
  if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'playing') pauseGame(); else if (state === 'paused' && e.code === 'KeyP') resumeGame(); return; }
  if (state !== 'playing') return;
  if (e.repeat) { if (KEYMAP[e.code]) e.preventDefault(); return; }
  keys.add(e.code);
  if (KEYMAP[e.code]) { keyMove(); e.preventDefault(); }
  if (e.code === 'Space') { input.jumpPressed = true; e.preventDefault(); }
  if (e.code === 'ControlLeft' || e.code === 'ControlRight' || e.code === 'KeyC') { input.slideHeld = true; input.slidePressed = true; e.preventDefault(); }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { input.dashPressed = true; e.preventDefault(); }
  if (e.code === 'KeyQ') input.swapPressed = true;
  input.touchAttack = false;
});
addEventListener('keyup', e => {
  keys.delete(e.code);
  if (KEYMAP[e.code]) keyMove();
  if (e.code === 'ControlLeft' || e.code === 'ControlRight' || e.code === 'KeyC') input.slideHeld = keys.has('ControlLeft') || keys.has('ControlRight') || keys.has('KeyC');
});
addEventListener('blur', () => { keys.clear(); keyMove(); input.slideHeld = input.attackHeld = false; if (state === 'playing') pauseGame(); });
const pointerLocked = () => document.pointerLockElement === canvas;
canvas.addEventListener('mousedown', e => {
  unlockAudio();
  if (state !== 'playing' || IS_TOUCH_ACTIVE) return;
  if (!pointerLocked()) { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (err) {} return; }
  if (e.button === 0) { input.attackHeld = true; input.attackPressed = true; input.touchAttack = false; }
});

addEventListener('mousemove', e => {
  if (state !== 'playing' || !pointerLocked()) return;
  const k = .0022 * settings.sens;
  input.lookX -= e.movementX * k; input.lookY -= e.movementY * k;
});

let IS_TOUCH_ACTIVE = IS_TOUCH;
addEventListener('touchstart', () => { if (!IS_TOUCH_ACTIVE) { IS_TOUCH_ACTIVE = true; if (state === 'playing') touchUI.classList.remove('hidden'); } }, { passive: true });

/* =====================================================================
   Audio (unlock only for now)
   ===================================================================== */
let actx = null;
function unlockAudio() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { /* no audio */ }
}

/* =====================================================================
   HUD
   ===================================================================== */
const speedo = $('#speedo'), speedNum = speedo.querySelector('.num'), speedFill = speedo.querySelector('.fill');
const dashPips = $('#dashPips');
let lastSpeedShown = -1, lastPipKey = '';
function speedColor(s) {
  const t = clamp(s / 40, 0, 1);
  const hue = lerp(190, -10, t), light = lerp(62, 58, t);
  return `hsl(${(hue + 360) % 360} 100% ${light}%)`;
}
function updateHUD() {
  const s = Math.round(hspeed());
  if (s !== lastSpeedShown) {
    lastSpeedShown = s;
    speedNum.textContent = s;
    speedo.style.setProperty('--c', speedColor(s));
    speedFill.style.width = clamp(s / 45 * 100, 0, 100) + '%';
    speedo.classList.toggle('hot', s >= 28);
  }
  const key = P.dash + '|' + mods.dashMax + '|' + Math.round(P.dashT / T.DASH_RECHARGE * 10);
  if (key !== lastPipKey) {
    lastPipKey = key;
    let h = '';
    for (let i = 0; i < mods.dashMax; i++) {
      const f = i < P.dash ? 1 : i === P.dash ? P.dashT / T.DASH_RECHARGE : 0;
      h += `<div class="pip"><i style="width:${Math.round(f * 100)}%"></i></div>`;
    }
    dashPips.innerHTML = h;
  }
}

/* =====================================================================
   Game state, screens
   ===================================================================== */
let state = 'title', settingsReturn = 'title';
const screens = { title: $('#title'), pause: $('#pause'), settings: $('#settings') };
function show(name) {
  for (const k in screens) screens[k].classList.toggle('hidden', k !== name);
}
function setPlayingUI(on) {
  $('#hud').classList.toggle('hidden', !on);
  touchUI.classList.toggle('hidden', !(on && IS_TOUCH_ACTIVE));
}
function startGame() {
  resetMods(); resetPlayer();
  edgeR = edgeTarget = ARENA.EDGE0;
  state = 'playing'; show(null); setPlayingUI(true);
  releaseAllTouches(); clearEdges();
  goFullscreen();
  if (!IS_TOUCH_ACTIVE) { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
}
function pauseGame() {
  if (state !== 'playing') return;
  state = 'paused'; releaseAllTouches(); show('pause'); setPlayingUI(false);
  if (pointerLocked()) document.exitPointerLock();
}
function resumeGame() {
  state = 'playing'; show(null); setPlayingUI(true); clearEdges(); last = performance.now();
  if (!IS_TOUCH_ACTIVE) { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
}
function goFullscreen() {
  if (!IS_TOUCH_ACTIVE) return;
  const el = document.documentElement;
  try {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
      const p = req.call(el, { navigationUI: 'hide' });
      if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
    }
  } catch (e) { /* iPhone Safari: no element fullscreen; home-screen install covers it */ }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') pauseGame(); });

document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-act]'); if (!b) return;
  unlockAudio();
  const act = b.dataset.act;
  if (act === 'play') startGame();
  else if (act === 'resume') resumeGame();
  else if (act === 'quit') { state = 'title'; show('title'); setPlayingUI(false); }
  else if (act === 'settings') { settingsReturn = state === 'paused' ? 'pause' : 'title'; buildSettings(); show('settings'); }
  else if (act === 'settingsBack') show(settingsReturn);
  else if (act === 'layout') openLayoutEditor();
});

/* ---------- settings screen */
function buildSettings() {
  const p = $('#setPanel');
  const range = (key, label, min, max, step, fmt) => `<div class="set"><span>${label}</span><input type="range" data-k="${key}" min="${min}" max="${max}" step="${step}" value="${settings[key]}"><span class="val" data-v="${key}">${fmt(settings[key])}</span></div>`;
  const tog = (key, label) => `<div class="set"><span>${label}</span><div class="tog ${settings[key] ? 'on' : ''}" data-t="${key}"></div></div>`;
  const pct = v => Math.round(v * 100) + '%';
  p.innerHTML =
    range('sens', 'Look sensitivity', .2, 3, .05, v => (+v).toFixed(2)) +
    tog('aimAssist', 'Aim assist (touch)') +
    tog('fovFx', 'Speed FOV + speed lines') +
    tog('haptics', 'Haptics') +
    range('volume', 'Volume', 0, 1, .05, pct);
  const fmts = { sens: v => (+v).toFixed(2), volume: pct };
  p.querySelectorAll('input[type=range]').forEach(inp => inp.addEventListener('input', () => {
    settings[inp.dataset.k] = +inp.value;
    p.querySelector(`[data-v=${inp.dataset.k}]`).textContent = fmts[inp.dataset.k](inp.value);
    saveSettings(); onSettingsChanged();
  }));
  p.querySelectorAll('.tog').forEach(t => t.addEventListener('click', () => {
    settings[t.dataset.t] = !settings[t.dataset.t]; t.classList.toggle('on', settings[t.dataset.t]); saveSettings(); onSettingsChanged();
  }));
}
function onSettingsChanged() { /* volume etc. hook */ }

/* ---------- button layout editor */
const editor = document.createElement('div');
editor.id = 'layoutEd';
editor.className = 'screen hidden';
editor.style.cssText = 'background:rgba(6,3,8,.7); justify-content:flex-start; touch-action:none';
editor.innerHTML = `
<div style="text-align:center; font-weight:800; letter-spacing:.16em">DRAG BUTTONS TO MOVE · TAP ONE THEN − / + TO RESIZE</div>

  #layoutEd .tb.sel{border-color:#ff2a3d; box-shadow:0 0 0 3px rgba(255,42,61,.4)}`;
document.head.appendChild(edStyle);

/* =====================================================================
   Resize / orientation
   ===================================================================== */
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; computeBaseFov(); camera.fov = baseFov; camera.updateProjectionMatrix();
  readSafe(); placeButtons();
  if (!editor.classList.contains('hidden')) placeButtons(editor);
  if (state === 'playing' && H > W && IS_TOUCH_ACTIVE) pauseGame();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

$('#titleHint').innerHTML = IS_TOUCH
  ? 'Left thumb: move · Right thumb: look · Hold SLIDE on the ground to slide, tap it in the air to SLAM'
  : 'WASD move · Mouse look · Space jump · Ctrl/C slide (slam in air) · Shift dash · LMB attack · Q swap · Esc pause';

/* =====================================================================
   Main loop
   ===================================================================== */
const debug = { manual: false };
let last = performance.now(), frameAcc = 0, frameN = 0, qualityHold = 0;
function simulate(dt) {
  P.yaw = wrapAngle(P.yaw + input.lookX);
  P.pitch = clamp(P.pitch + input.lookY, -1.45, 1.45);
  stepPlayer(dt);
  edgeR = damp(edgeR, edgeTarget, 1.2, dt);
}
function adaptQuality(dt) {
  frameAcc += dt; frameN++;
  if (frameAcc < 2) return;
  const avg = frameAcc / frameN; frameAcc = 0; frameN = 0;
  if (avg > 1 / 48 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - .25); renderer.setPixelRatio(pixelRatio); qualityHold = 3; }
  else if (avg < 1 / 58 && pixelRatio < MAX_PR && --qualityHold < 0) { pixelRatio = Math.min(MAX_PR, pixelRatio + .25); renderer.setPixelRatio(pixelRatio); qualityHold = 3; }
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 1 / 60;
  dt = Math.min(dt, 1 / 20);
  shadowCount = 0;
  if (state === 'playing') {
    if (!debug.manual) simulate(dt);
    updateCamera(dt);
    updateHUD();
    pushShadow(P.pos.x, P.pos.z, P.pos.y, 1.1);
  } else if (state === 'title') {
    const t = now / 1000 * .08;
    camera.position.set(Math.cos(t) * 19, 11, Math.sin(t) * 19);
    camera.lookAt(0, 2, 0);
    camera.rotation.z = 0;
    speedLines.visible = false;
  }
  edgeMesh.scale.set(edgeR, 1, edgeR);
  edgeTex.offset.x = (now / 1000 * .02) % 1;
  shadowMesh.count = shadowCount; shadowMesh.instanceMatrix.needsUpdate = true;
  renderer.clear();
  renderer.render(scene, camera);
  if (!debug.manual) clearEdges();
  adaptQuality(dt);
}
resize();
resetPlayer();
requestAnimationFrame(frame);

// test / debug handle: tick() runs the sim deterministically at 60 Hz
function tick(seconds) {
  const n = Math.round(seconds * 60);
  for (let i = 0; i < n; i++) { simulate(1 / 60); updateCamera(1 / 60); clearEdges(); }
}
window.__redline = { debug, tick, hooks, P, input, T, mods, get state() { return state; }, startGame, pauseGame, resumeGame, groundAt, terrainH, solids, settings, layout: () => layout };
