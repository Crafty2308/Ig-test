<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ability Tree Demo</title>
<style>
  html,body{margin:0;height:100%;background:#050810;color:#cfe6ff;
    font:14px/1.5 "Segoe UI",Roboto,-apple-system,Helvetica,Arial,sans-serif;}
  body{display:flex; gap:12px; padding:12px; box-sizing:border-box;}
  #tree{flex:1 1 auto; min-width:0; height:100%;}
  aside{flex:0 0 260px; overflow:auto; background:#0a1220; border:1px solid rgba(120,150,190,.25);
    border-radius:12px; padding:14px;}
  h2{margin:0 0 4px; font-size:15px; color:#eaf6ff; letter-spacing:.06em; text-transform:uppercase;}
  p.hint{margin:0 0 12px; font-size:11.5px; color:#7e9bc4;}
  button{padding:7px 12px; margin:0 6px 6px 0; border-radius:7px; cursor:pointer;
    border:1px solid rgba(64,224,255,.4); background:transparent; color:#8fd8ff; font:600 12px/1 inherit;}
  button:hover{background:rgba(64,224,255,.12);}
  table{width:100%; border-collapse:collapse; font-size:12px; margin-top:6px;}
  td{padding:2px 0; border-bottom:1px solid rgba(120,150,190,.12);}
  td:last-child{text-align:right; color:#eaf6ff; font-weight:600;}
  td.chg{color:#9dff5c;}
  .flags{margin-top:8px; font-size:11.5px; color:#9dff5c; line-height:1.7; word-break:break-word;}
  .dom{margin-top:10px; font-size:12px; color:#ffc857;}
  @media (max-width:820px){ body{flex-direction:column;} aside{flex:0 0 auto; max-height:36vh;} #tree{height:60vh;} }
</style>
</head>
<body>
<div id="tree"></div>
<aside>
  <h2>Simulated level</h2>
  <p class="hint">grantPoints(level) is the only points hook. Replaying a level you already reached grants nothing.</p>
  <div>
    <button data-lvl="1">+1</button>
    <button data-lvl="5">+5</button>
    <button data-lvl="10">+10</button>
    <button id="wipe">Wipe save</button>
  </div>
  <div id="lvl" class="dom"></div>

  <h2 style="margin-top:16px">Compiled stats</h2>
  <p class="hint">What the game reads. Recomputed on unlock/reset, never per frame.</p>
  <table id="stats"></table>
  <div class="flags" id="flags"></div>
  <div class="dom" id="dominant"></div>
</aside>

<script src="tree.data.js"></script>
<script src="tree.logic.js"></script>
<script src="tree.ui.js"></script>
<script>
  const state = AbilityTree.load();
  const ui = AbilityTreeUI.mount(document.getElementById('tree'), { state, onChange: render });

  function render() {
    const c = state.compiled;
    document.getElementById('lvl').textContent =
      'Level ' + state.level + ' → ' + c.pointsTotal + ' points total';

    const base = AbilityTree.STAT_BASE;
    let rows = '';
    for (const k of Object.keys(c.stats).sort()) {
      const v = c.stats[k];
      const b = base[k] === undefined ? 0 : base[k];
      const changed = Math.abs(v - b) > 1e-9;
      const shown = Number.isInteger(v) ? v : v.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
      rows += '<tr><td>' + k + '</td><td class="' + (changed ? 'chg' : '') + '">' + shown + '</td></tr>';
    }
    document.getElementById('stats').innerHTML = rows;
    document.getElementById('flags').textContent = c.flags.size ? '⚑ ' + [...c.flags].join(', ') : 'no flags set';
    document.getElementById('dominant').textContent = 'dominant: ' + (c.dominant || 'none (spread too thin)');
  }

  for (const b of document.querySelectorAll('button[data-lvl]')) {
    b.addEventListener('click', () => {
      AbilityTree.grantPoints(state, state.level + Number(b.dataset.lvl));
      AbilityTree.save(state);
      ui.refresh(state);
      render();
    });
  }
  document.getElementById('wipe').addEventListener('click', () => {
    localStorage.removeItem(AbilityTree.SAVE_KEY);
    location.reload();
  });
  render();
</script>
<script src="tree.test.js"></script>
</body>
</html>
